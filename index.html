// ══════════════════════════════════════════════════════════
//  INDICATOR MATH
// ══════════════════════════════════════════════════════════
function ema(data,period){const k=2/(period+1);let prev=null;return data.map(d=>{if(prev===null){prev=d.close;return{time:d.time,value:d.close};}const val=d.close*k+prev*(1-k);prev=val;return{time:d.time,value:val};});}
// Suma corrida (sliding window) en vez de slice()+reduce() por cada vela
// — esto era O(n×period) con una asignación de array nueva en cada paso;
// con miles de velas cargadas (desde que Watchtower trae más historial)
// se notaba cada vez que se recalculaban los overlays.
function sma(data,period){
  const out=[]; let sum=0;
  for (let i=0;i<data.length;i++){
    sum+=data[i].close;
    if (i>=period) sum-=data[i-period].close;
    if (i>=period-1) out.push({time:data[i].time, value:sum/period});
  }
  return out;
}
function vwap(data){let cumPV=0,cumV=0;return data.map(d=>{const tp=(d.high+d.low+d.close)/3;cumPV+=tp*(d.volume||1);cumV+=(d.volume||1);return{time:d.time,value:cumPV/cumV};});}

// ══════════════════════════════════════════════════════════
//  WATCHTOWER — puerto de "ICT Zentinel Watchtower" (Pine)
//  Killzones, PDH/PDL/PWH/PWL, MNO, ORG (opening range gap) y bias diario.
//  Los tiempos en window._lastCandles ya vienen en hora NY "disfrazada" de
//  UTC (el bridge MT5 resta 7h), así que usamos getUTC*() directo, igual
//  que el resto del chart (ver TF_SECONDS / nextCloseTime más abajo).
// ══════════════════════════════════════════════════════════
const KZ_SESSIONS = [
  { key:'asia',  label:'ASIA',     color:'#f7525f' },
  { key:'london',label:'LONDON',   color:'#5b9cf6' },
  { key:'nyam',  label:'NY AM',    color:'#e0e0e0' },
  { key:'nylu',  label:'NY LUNCH', color:'#ffa726' },
  { key:'nypm',  label:'NY PM',    color:'#e0e0e0' },
];
const ORG_SESSION = { start:[9,30], end:[16,15] };
const WT_SVG_NS = 'http://www.w3.org/2000/svg';

function wtNyParts(t){
  const d=new Date(t*1000);
  return { h:d.getUTCHours(), mi:d.getUTCMinutes(), dow:d.getUTCDay(),
    dateKey: d.getUTCFullYear()*10000 + (d.getUTCMonth()+1)*100 + d.getUTCDate() };
}
function wtInWindow(t, start, end){
  const p=wtNyParts(t), m=p.h*60+p.mi;
  const s=start[0]*60+start[1], e=end[0]*60+end[1];
  return s<=e ? (m>=s && m<e) : (m>=s || m<e);
}
// Para timeframes donde una vela dura más que la killzone (p.ej. una vela de
// 2H/4H puede no tener su horario de apertura cayendo dentro de una ventana
// de 1H), wtInWindow(open) puede no matchear ninguna vela y la zona
// desaparece. Acá en cambio se chequea solapamiento de intervalos: la vela
// cubre [t, t+barStep) y la killzone cubre [inicio,fin) de ese mismo día —
// si se tocan, la vela entra.
function wtOverlapsWindow(t, barStep, start, end){
  const sStart = wtTimestampSameCalDay(t, start[0], start[1]);
  let sEnd = wtTimestampSameCalDay(t, end[0], end[1]);
  if ((end[0]*60+end[1]) <= (start[0]*60+start[1])) sEnd += 86400; // ventana cruza medianoche
  return t < sEnd && (t + barStep) > sStart;
}
// La vela diaria del broker (MT5 D1) abre a las 18:00 NY, no a medianoche.
// wtDayKey devuelve el epoch de ese límite de 18:00 que arranca el "día"
// que contiene t — así PDH/PDL/PDM/ORG/bias usan el mismo día que ve MT5,
// en vez de nacer a las 00:00 (que es un concepto aparte: MNO).
function wtDayKey(t){
  const d=new Date(t*1000);
  let base=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),18,0,0));
  if(t*1000 < base.getTime()) base.setUTCDate(base.getUTCDate()-1);
  return Math.floor(base.getTime()/1000);
}
function wtTimestampSameCalDay(refTime, hh, mm){
  const d=new Date(refTime*1000);
  return Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),hh,mm,0)/1000);
}
function wtWeekKey(t){
  const d=new Date(t*1000);
  let base=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),18,0,0));
  base.setUTCDate(base.getUTCDate()-d.getUTCDay());
  if(t*1000 < base.getTime()) base.setUTCDate(base.getUTCDate()-7);
  return Math.floor(base.getTime()/1000);
}

// ══════════════════════════════════════════════════════════
//  Convención general: doble click sobre cualquier dibujo de un
//  indicador custom (no serie de línea, como Watchtower) abre su
//  panel de config. Cualquier indicador futuro que dibuje su propio
//  SVG solo necesita llamar tagIndicatorEl(el, 'Nombre del indicador
//  tal como figura en INDICATOR_DEFS') antes de insertarlo — el
//  listener global ya está armado una sola vez, más abajo.
// ══════════════════════════════════════════════════════════
function tagIndicatorEl(el, name){
  el.dataset.indicatorName = name;
  // El doble-click para abrir la config NO depende de esto — lo resuelve
  // hitTestIndicatorRegions() por coordenadas contra #chart-container (ver
  // más abajo), sin tocar pointer-events para nada. Dejar el elemento con
  // pointer-events habilitado acá solo lograba que, al pasar la rueda del
  // mouse justo encima de una línea/caja de un indicador, el navegador le
  // mandara el evento 'wheel' al SVG en vez de dejarlo pasar al canvas del
  // chart de abajo — el zoom se "trababa" sobre cualquier dibujo.
  el.style.pointerEvents = 'none';
}

// Segunda vía, más robusta que depender de pointer-events/stacking de SVG
// (que puede fallar según navegador/zoom/escala): guardamos manualmente la
// región clickeable en coordenadas de #chart-container, igual que ya se usa
// para arrastrar los dibujos (isClickOnDrawing/hitTestHandle). Cualquier
// indicador futuro puede llamar registerIndicatorHit(nombre, region) con
// {kind:'line', x1,x2,y, tol} o {kind:'rect', x1,y1,x2,y2, tol} y el doble
// click ya lo va a enrutar solo, sin tocar el listener de abajo.
function registerIndicatorHit(name, region){
  if(!window._indicatorHitRegions) window._indicatorHitRegions=[];
  window._indicatorHitRegions.push(Object.assign({name}, region));
}
function hitTestIndicatorRegions(mx,my){
  const regions = window._indicatorHitRegions || [];
  for (let i=regions.length-1; i>=0; i--){
    const r=regions[i];
    if (r.kind==='line'){
      const tol=r.tol||8;
      const xmin=Math.min(r.x1,r.x2)-tol, xmax=Math.max(r.x1,r.x2)+tol;
      if (mx>=xmin && mx<=xmax && Math.abs(my-r.y)<=tol) return r.name;
    } else if (r.kind==='rect'){
      const tol=r.tol||3;
      if (mx>=Math.min(r.x1,r.x2)-tol && mx<=Math.max(r.x1,r.x2)+tol && my>=Math.min(r.y1,r.y2)-tol && my<=Math.max(r.y1,r.y2)+tol) return r.name;
    }
  }
  return null;
}

// Todo nivel/línea de un indicador que todavía está "vigente" (no fue
// invalidado) tiene que seguir proyectándose un poco más allá de la última
// vela en curso, no cortar justo ahí — si no, visualmente parece que el
// nivel "ya terminó" apenas toca el borde derecho del chart.
const LEVEL_EXTEND_BARS = 8;

function wtRect(svg,t1,t2,top,bottom,fill,opacity,stroke,indName){
  indName = indName || 'Watchtower';
  const x1=chart.timeScale().timeToCoordinate(t1), x2=chart.timeScale().timeToCoordinate(t2);
  const y1=candleSeries.priceToCoordinate(top), y2=candleSeries.priceToCoordinate(bottom);
  if(x1===null||x2===null||y1===null||y2===null) return;
  const el=document.createElementNS(WT_SVG_NS,'rect');
  el.setAttribute('x',Math.min(x1,x2)); el.setAttribute('y',Math.min(y1,y2));
  el.setAttribute('width',Math.max(1,Math.abs(x2-x1))); el.setAttribute('height',Math.max(1,Math.abs(y2-y1)));
  el.setAttribute('fill',fill); el.setAttribute('fill-opacity',opacity);
  if(stroke==='none'){ el.setAttribute('stroke','none'); }
  else { el.setAttribute('stroke',stroke||fill); el.setAttribute('stroke-opacity','0.5'); el.setAttribute('stroke-width','1'); }
  tagIndicatorEl(el,indName);
  svg.appendChild(el);
  registerIndicatorHit(indName, {kind:'rect', x1:Math.min(x1,x2), y1:Math.min(y1,y2), x2:Math.max(x1,x2), y2:Math.max(y1,y2), tol:3});
}
function wtLine(svg,t1,t2,y,color,width,dash,indName){
  indName = indName || 'Watchtower';
  const x1=chart.timeScale().timeToCoordinate(t1), x2=chart.timeScale().timeToCoordinate(t2);
  const yy=candleSeries.priceToCoordinate(y);
  if(x1===null||x2===null||yy===null) return;
  const el=document.createElementNS(WT_SVG_NS,'line');
  el.setAttribute('x1',x1); el.setAttribute('x2',x2); el.setAttribute('y1',yy); el.setAttribute('y2',yy);
  el.setAttribute('stroke',color); el.setAttribute('stroke-width',width||1);
  if(dash) el.setAttribute('stroke-dasharray',dash);
  tagIndicatorEl(el,indName);
  svg.appendChild(el);
  // Trazo invisible mucho más ancho superpuesto: una línea de 1-2px es
  // casi imposible de acertar con el mouse real — esto amplía el área de
  // click/doble-click sin cambiar lo que se ve.
  const hit=document.createElementNS(WT_SVG_NS,'line');
  hit.setAttribute('x1',x1); hit.setAttribute('x2',x2); hit.setAttribute('y1',yy); hit.setAttribute('y2',yy);
  hit.setAttribute('stroke','transparent'); hit.setAttribute('stroke-width','12');
  tagIndicatorEl(hit,indName);
  svg.appendChild(hit);
  registerIndicatorHit(indName, {kind:'line', x1, x2, y:yy, tol:8});
}
function wtLabel(svg,t,y,text,color,indName){
  indName = indName || 'Watchtower';
  const x=chart.timeScale().timeToCoordinate(t), yy=candleSeries.priceToCoordinate(y);
  if(x===null||yy===null) return;
  // Caja invisible detrás del texto: amplía el área de click más allá del
  // trazo fino de las letras.
  const hit=document.createElementNS(WT_SVG_NS,'rect');
  hit.setAttribute('x',x); hit.setAttribute('y',yy-13);
  hit.setAttribute('width',Math.max(40,text.length*6)); hit.setAttribute('height','18');
  hit.setAttribute('fill','transparent');
  tagIndicatorEl(hit,indName);
  svg.appendChild(hit);
  const el=document.createElementNS(WT_SVG_NS,'text');
  el.setAttribute('x',x+4); el.setAttribute('y',yy-3);
  el.setAttribute('fill',color); el.setAttribute('font-size','10'); el.setAttribute('font-family',"'DM Mono',monospace");
  el.textContent=text;
  tagIndicatorEl(el,indName);
  svg.appendChild(el);
  registerIndicatorHit(indName, {kind:'rect', x1:x, y1:yy-13, x2:x+Math.max(40,text.length*6), y2:yy+5, tol:0});
}

function wtGroupByDay(candles){
  const byDate=new Map();
  candles.forEach(c=>{ const dk=wtDayKey(c.time); if(!byDate.has(dk))byDate.set(dk,[]); byDate.get(dk).push(c); });
  return byDate;
}

function renderWtKillzones(svg, byDate, dateKeys, barStep){
  if (barStep >= 86400) return; // D/W/M: una killzone intradía no tiene sentido acá
  const histDays=Math.max(1, STATE.watchtower.histDays||3);
  dateKeys.slice(-histDays).forEach(dk=>{
    const dayCandles=byDate.get(dk);
    KZ_SESSIONS.forEach(sess=>{
      const cfg=STATE.watchtower.kz[sess.key];
      if(!cfg || !cfg.enabled) return;
      const inSess=dayCandles.filter(c=>wtOverlapsWindow(c.time,barStep,cfg.start,cfg.end));
      if(!inSess.length) return;
      const color=cfg.color||sess.color;
      let top=-Infinity,bottom=Infinity,tHigh=inSess[0].time,tLow=inSess[0].time;
      inSess.forEach(c=>{ if(c.high>top){top=c.high;tHigh=c.time;} if(c.low<bottom){bottom=c.low;tLow=c.time;} });
      const boxRight=inSess[inSess.length-1].time+barStep;
      wtRect(svg, inSess[0].time, boxRight, top, bottom, color, (STATE.watchtower.boxOpacity??10)/100, 'none');

      // Un pivote de killzone sin tocar se extiende como MÁXIMO hasta el
      // final de SU día — no cruza a días siguientes aunque nunca se haya
      // invalidado (eso lo pidió el usuario explícitamente: un nivel de un
      // día viejo no tiene por qué seguir "corriendo" para siempre). La
      // única excepción es el día de HOY (el último cargado), que todavía
      // está en curso: ahí sí se proyecta un poco más allá de la última
      // vela, igual que el resto de los niveles "todavía vigentes" de la
      // app — y es seguro hacerlo porque esa extensión cae sobre el
      // whitespace de HOY, no en el hueco nocturno de un día ya cerrado
      // (eso fue lo que en un primer intento hacía desaparecer las líneas
      // de días viejos: timeToCoordinate no podía resolver un horario sin
      // vela real ni fantasma ahí).
      const isCurrentDay = dk === dateKeys[dateKeys.length-1];
      const lastIdx=dayCandles.indexOf(inSess[inSess.length-1]);
      const after=dayCandles.slice(lastIdx+1);
      let hActive=true, lActive=true, hEnd=boxRight, lEnd=boxRight;
      for(const c of after){
        if(hActive){ hEnd=c.time; if(c.high>=top) hActive=false; }
        if(lActive){ lEnd=c.time; if(c.low<=bottom) lActive=false; }
        if(!hActive && !lActive) break;
      }
      if (isCurrentDay) {
        if (hActive) hEnd = dayCandles[dayCandles.length-1].time + LEVEL_EXTEND_BARS*barStep;
        if (lActive) lEnd = dayCandles[dayCandles.length-1].time + LEVEL_EXTEND_BARS*barStep;
      }
      // (día ya cerrado y todavía "activo": hEnd/lEnd ya quedaron en
      // dayCandles[last].time vía el loop de arriba — el fin del día, sin
      // extensión extra.)
      wtLine(svg, tHigh, Math.max(hEnd,boxRight), top, color, 1);
      wtLine(svg, tLow, Math.max(lEnd,boxRight), bottom, color, 1);
    });
  });
}

function renderWtPrevDay(svg, byDate, dateKeys, lastTime, barStep){
  const todayKey=wtDayKey(lastTime);
  const idx=dateKeys.indexOf(todayKey);
  if(idx<=0) return;
  const prevCandles=byDate.get(dateKeys[idx-1]);
  const high=Math.max(...prevCandles.map(c=>c.high)), low=Math.min(...prevCandles.map(c=>c.low)), mid=(high+low)/2;
  const x1=byDate.get(todayKey)[0].time;
  const x2=lastTime+LEVEL_EXTEND_BARS*barStep;
  wtLine(svg, x1, x2, high, '#ffffff', 1);
  wtLine(svg, x1, x2, low,  '#ffffff', 1);
  wtLine(svg, x1, x2, mid,  '#ffffff', 1, '4,3');
  wtLabel(svg, x2, high, 'PDH', '#ffffff');
  wtLabel(svg, x2, low,  'PDL', '#ffffff');
  wtLabel(svg, x2, mid,  'PDM', '#ffffff');
}

function renderWtPrevWeek(svg, candles, lastTime, barStep){
  const byWeek=new Map();
  candles.forEach(c=>{ const wk=wtWeekKey(c.time); if(!byWeek.has(wk))byWeek.set(wk,[]); byWeek.get(wk).push(c); });
  const weekKeys=[...byWeek.keys()].sort((a,b)=>a-b);
  const curWeek=wtWeekKey(lastTime);
  const idx=weekKeys.indexOf(curWeek);
  if(idx<=0) return;
  const prevCandles=byWeek.get(weekKeys[idx-1]);
  const high=Math.max(...prevCandles.map(c=>c.high)), low=Math.min(...prevCandles.map(c=>c.low)), mid=(high+low)/2;
  const x1=byWeek.get(curWeek)[0].time;
  const x2=lastTime+LEVEL_EXTEND_BARS*barStep;
  wtLine(svg, x1, x2, high, '#c99cd0', 1);
  wtLine(svg, x1, x2, low,  '#c99cd0', 1);
  wtLine(svg, x1, x2, mid,  '#c99cd0', 1, '4,3');
  wtLabel(svg, x2, high, 'PWH', '#c99cd0');
  wtLabel(svg, x2, low,  'PWL', '#c99cd0');
  wtLabel(svg, x2, mid,  'PWM', '#c99cd0');
}

function renderWtMNO(svg, byDate, lastTime, barStep){
  const todayKey=wtDayKey(lastTime);
  const dayCandles=byDate.get(todayKey);
  if(!dayCandles || !dayCandles.length) return;
  // El día-broker (18:00->18:00) contiene la medianoche NY 6h después de su
  // apertura; buscamos la primera vela a partir de ese punto exacto.
  const midnightTs=todayKey+6*3600;
  const mnoCandle=dayCandles.find(c=>c.time>=midnightTs);
  if(!mnoCandle) return;
  const x2=lastTime+LEVEL_EXTEND_BARS*barStep;
  wtLine(svg, mnoCandle.time, x2, mnoCandle.open, '#80deea', 1, '2,2');
  wtLabel(svg, x2, mnoCandle.open, 'MNO', '#80deea');
}

// lightweight-charts se niega a ubicar una coordenada X para un horario que
// no corresponde a ninguna vela real (timeToCoordinate devuelve null) — y
// los horarios "calculados" (9:30, 16:15 exactos) casi nunca calzan con el
// borde de una vela salvo en TF chicos. Por eso toda vez que se vaya a
// DIBUJAR algo en uno de esos horarios, hay que engancharlo a la vela real
// más cercana (el precio ya se resolvió aparte, con precisión real, en
// wtPriceAtBoundary / el fetch de 1min — esto es solo "dónde" plotearlo).
function wtNearestCandleTime(dayCandles, targetTime){
  if (!dayCandles.length) return targetTime;
  let nearest = dayCandles[0].time, bestDiff = Math.abs(nearest - targetTime);
  for (const c of dayCandles){
    const diff = Math.abs(c.time - targetTime);
    if (diff < bestDiff){ bestDiff = diff; nearest = c.time; }
  }
  return nearest;
}

// Devuelve una estimación del precio exacto a `boundaryTime` interpolando
// dentro de la vela que contiene ese instante (open→close, lineal). Hace
// falta porque en timeframes grandes (1H, 4H...) puede no existir ninguna
// vela que abra justo a las 9:30 — sin esto, "todayOpen"/"prevClose" saltaban
// a la vela más cercana disponible (p.ej. la de las 10:00), desplazando el
// ORG varios cientos de puntos según el timeframe que estuvieras mirando.
function wtPriceAtBoundary(dayCandles, boundaryTime, barStep){
  for (const c of dayCandles){
    if (boundaryTime >= c.time && boundaryTime < c.time + barStep){
      const frac = (boundaryTime - c.time) / barStep;
      return c.open + (c.close - c.open) * frac;
    }
  }
  // Si el límite cae fuera de toda vela cargada (p.ej. todavía no abrió
  // la sesión), usamos la vela más cercana como aproximación razonable.
  if (!dayCandles.length) return null;
  const before = dayCandles.filter(c=>c.time<=boundaryTime);
  return before.length ? before[before.length-1].close : dayCandles[0].open;
}

// Con velas de 15-20min+ la interpolación lineal de wtPriceAtBoundary puede
// errarle feo si justo esa vela tuvo un movimiento grande y no lineal (p.ej.
// el spike típico de la apertura de NY a las 9:30). Para el precio EXACTO
// de los límites del ORG se le pide al puente la vela de 1 minuto puntual
// — esa sí siempre cae justo en el horario, sin adivinar nada — y se
// cachea por símbolo+día para no repetir el pedido en cada redibujo.
const _wtOrgCache = {};
async function wtFetchBoundaryPrice(symbol, boundaryTime){
  try {
    const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=1min&bars=3&before=${boundaryTime+120}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.error || !Array.isArray(json.bars) || !json.bars.length) return null;
    const exact = json.bars.find(b => b.time === boundaryTime);
    if (exact) return exact.open;
    const before = json.bars.filter(b=>b.time<=boundaryTime);
    return before.length ? before[before.length-1].close : null;
  } catch(e) { return null; }
}
async function wtEnsureOrgBoundaries(cacheKey, symbol, prevEndTime, todayStartTime){
  const [prevClose, todayOpen] = await Promise.all([
    wtFetchBoundaryPrice(symbol, prevEndTime),
    wtFetchBoundaryPrice(symbol, todayStartTime),
  ]);
  _wtOrgCache[cacheKey] = (prevClose!=null && todayOpen!=null) ? {prevClose, todayOpen} : null;
  renderWatchtower(); // ya tenemos el dato preciso — redibuja con eso en vez de la aproximación
}

function renderWtORG(svg, byDate, dateKeys, lastTime, barStep){
  const todayKey=wtDayKey(lastTime);
  const idx=dateKeys.indexOf(todayKey);
  if(idx<=0) return;
  const prevDayCandles=byDate.get(dateKeys[idx-1])||[];
  const todayDayCandles=byDate.get(todayKey)||[];
  if(!prevDayCandles.length || !todayDayCandles.length) return;
  // OJO: la primera vela de cada "día del bróker" (dateKeys) cae a las
  // 18:00 del día de calendario ANTERIOR (así arranca el D1 de MT5) — usarla
  // directo como referencia de fecha para "hoy a las 9:30" tomaba el día de
  // calendario equivocado. +20h desde el límite del día (18:00) cae bien
  // adentro del día de trading correcto, sin depender de qué vela haya.
  const prevEndTime=wtTimestampSameCalDay(dateKeys[idx-1]+20*3600, ORG_SESSION.end[0], ORG_SESSION.end[1]);
  const todayStartTime=wtTimestampSameCalDay(todayKey+20*3600, ORG_SESSION.start[0], ORG_SESSION.start[1]);
  // En TF grandes (8H, 12H...) la última vela puede abrir ANTES de las
  // 9:30 pero seguir cubriendo ese horario (p.ej. una vela de 8H que
  // arranca a las 9:00 llega hasta las 17:00) — comparar solo contra el
  // horario de apertura de esa vela decía "todavía no abrió" por error.
  if (todayStartTime > lastTime + barStep) return; // la sesión de hoy todavía no abrió

  const cacheKey = `${STATE.symbol}|${todayKey}`;
  let cached = _wtOrgCache[cacheKey];
  if (cached === undefined) {
    _wtOrgCache[cacheKey] = null; // evita disparar el mismo fetch de nuevo mientras llega
    wtEnsureOrgBoundaries(cacheKey, STATE.symbol, prevEndTime, todayStartTime);
  }
  // Mientras no llegó (o si falló) la vela de 1min exacta, se aproxima por
  // interpolación para no dejar el indicador sin dibujar ni un segundo.
  const prevClose = cached ? cached.prevClose : wtPriceAtBoundary(prevDayCandles, prevEndTime, barStep);
  const todayOpen  = cached ? cached.todayOpen  : wtPriceAtBoundary(todayDayCandles, todayStartTime, barStep);
  if(prevClose==null || todayOpen==null) return;
  const top=Math.max(prevClose,todayOpen), bottom=Math.min(prevClose,todayOpen), ce=(prevClose+todayOpen)/2;
  const gap=todayOpen-prevClose;
  // Proyectar hasta el cierre de la sesión (16:15) se cae del rango de
  // coordenadas mientras esa hora sigue en el futuro (el chart solo tiene
  // "whitespace" acotado para el eje). Mientras la sesión sigue abierta, la
  // caja crece hasta "ahora"; al cerrar, se fija en el horario real.
  const sessionEnd=wtTimestampSameCalDay(todayKey+20*3600, ORG_SESSION.end[0], ORG_SESSION.end[1]);
  const endTime=Math.min(sessionEnd, lastTime);
  // "Dónde" dibujar (enganchado a velas reales) — el precio (top/bottom/ce)
  // ya quedó resuelto arriba con precisión real, esto no lo toca. Mientras la
  // sesión sigue abierta (endTime===lastTime) la caja tiene que seguir
  // proyectándose un poco más allá de la última vela, no cortar justo ahí.
  const plotStart = wtNearestCandleTime(todayDayCandles, todayStartTime);
  const plotEnd = endTime===lastTime ? (lastTime+LEVEL_EXTEND_BARS*barStep) : wtNearestCandleTime(todayDayCandles, endTime);
  const col=STATE.watchtower.orgColor||'#ffeb3b';
  const fillOpacity=(STATE.watchtower.boxOpacity??10)/100;
  // Como en Pine: solo 2 líneas horizontales (H/L, sin bordes verticales) +
  // relleno entre ellas (linefill, intensidad = transparencia global de cajas)
  // + línea CE punteada al 50%.
  if(fillOpacity>0) wtRect(svg, plotStart, plotEnd, top, bottom, col, fillOpacity, 'none');
  wtLine(svg, plotStart, plotEnd, top, col, 1);
  wtLine(svg, plotStart, plotEnd, bottom, col, 1);
  wtLine(svg, plotStart, plotEnd, ce, '#ffb74d', 1, '4,3');
  wtLabel(svg, plotEnd, top, 'ORG H', col);
  wtLabel(svg, plotEnd, bottom, 'ORG L', col);
  wtLabel(svg, plotEnd, ce, `ORG CE  ${gap>=0?'+':''}${gap.toFixed(1)} pts`, '#ffb74d');
}

function renderWtBias(byDate, dateKeys, lastTime){
  const el=document.getElementById('watchtower-bias-badge');
  if(!el) return;
  if(dateKeys.length<2){ el.style.display='none'; return; }
  const closesByDay=dateKeys.map(dk=>{ const arr=byDate.get(dk); return arr[arr.length-1].close; });
  const todayClose=closesByDay[closesByDay.length-1];
  const avgPrev=closesByDay[closesByDay.length-2];
  const diff=(todayClose-avgPrev)/avgPrev;
  const thr=0.003;
  const bias=diff>thr?'Bullish':diff<-thr?'Bearish':'Neutral';
  const color=bias==='Bullish'?'#26a69a':bias==='Bearish'?'#ef5350':'#cccccc';
  const d=new Date(lastTime*1000);
  const dateStr=`${String(d.getUTCDate()).padStart(2,'0')}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${d.getUTCFullYear()}`;
  el.innerHTML = `<div class="wt-row">${dateStr}</div><div class="wt-row">${STATE.symbol}, ${STATE.timeframe}</div><div class="wt-row" style="color:${color}">${bias}</div>`;
  el.style.display='flex';
  el.style.pointerEvents='auto';
  el.style.cursor='pointer';
  el.dataset.indicatorName='Watchtower';
  // Despegarlo de la escala de precio (derecha) y el eje de tiempo (abajo)
  // para que no los tape — ambos cambian de ancho/alto según el chart.
  const priceScaleW = chart.priceScale('right').width() || 0;
  const timeScaleH = chart.timeScale().height() || 0;
  el.style.right = (priceScaleW + 8) + 'px';
  el.style.bottom = (timeScaleH + 8) + 'px';
}

function renderWatchtower(){
  if(!window._watchtowerSvg) return;
  const svg=window._watchtowerSvg;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  window._indicatorHitRegions = (window._indicatorHitRegions||[]).filter(r=>r.name!=='Watchtower');
  document.getElementById('watchtower-bias-badge').style.display='none';
  if(!STATE.watchtower.enabled) return;
  const candles=window._lastCandles||[];
  if(candles.length<2) return;
  const wt=STATE.watchtower;
  const barStep=candles[1].time-candles[0].time;
  const lastTime=candles[candles.length-1].time;
  const byDate=wtGroupByDay(candles);
  const dateKeys=[...byDate.keys()].sort((a,b)=>a-b);

  if(wt.killzones) renderWtKillzones(svg, byDate, dateKeys, barStep);
  if(wt.pdLevels)  renderWtPrevDay(svg, byDate, dateKeys, lastTime, barStep);
  if(wt.pwLevels)  renderWtPrevWeek(svg, candles, lastTime, barStep);
  if(wt.mno)       renderWtMNO(svg, byDate, lastTime, barStep);
  if(wt.org)       renderWtORG(svg, byDate, dateKeys, lastTime, barStep);
  if(wt.bias)      renderWtBias(byDate, dateKeys, lastTime);
}

// ══════════════════════════════════════════════════════════
//  SNIPER — port de "ICT Zentinel Sniper 2.0 SD FIX" (Pine v6)
//  Paso 1: Sweep HTF + CISD únicamente. Sin FVG, sin cajas de trading,
//  sin proyecciones SD, sin sweeps intra-HTF — eso son pasos siguientes.
//
//  Pine corre bar-a-bar en streaming con estado `var` persistente;acá no
//  tenemos ese motor, así que en cada render se hace un "replay" completo
//  determinístico de TODO el historial cargado (vela por vela, en el mismo
//  orden exacto en que aparecen los bloques en el Pine: disparo bull,
//  disparo bear, validación HTF, expiración, re-anclaje+confirmación,
//  fakeout, pruning). El resultado final es el mismo que el streaming de
//  TradingView, solo cambia CÓMO se llega a él.
// ══════════════════════════════════════════════════════════
function initSniperLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:16;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._sniperSvg = svg;
  function syncSize(){ svg.setAttribute('width',container.clientWidth); svg.setAttribute('height',container.clientHeight); }
  new ResizeObserver(syncSize).observe(container);
  syncSize();
}

// Pine expone "color + transparencia" como un solo picker (input.color);
// en HTML no existe ese control, así que lo separamos en dos inputs (hex +
// % transparencia) y los componemos a un rgba() para pasarle a wtLine/wtRect.
function snRgba(hex, transparencyPct){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  const alpha = Math.max(0, Math.min(100, 100-transparencyPct))/100;
  return `rgba(${r},${g},${b},${alpha})`;
}
function snParseRgba(rgba){
  const m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\)/.exec(rgba||'');
  if (!m) return { hex:'#ffffff', transparency:0 };
  const toHex = n => Number(n).toString(16).padStart(2,'0');
  const alpha = m[4]===undefined ? 1 : Number(m[4]);
  return { hex:`#${toHex(m[1])}${toHex(m[2])}${toHex(m[3])}`, transparency: Math.round((1-alpha)*100) };
}

// Tabla EXACTA del switch del Pine (tf_actual -> tf_htf). Los timeframes de
// ChartZentinel que no están en esta tabla (6m,10m,12m,20m,2H,3H,6H,8H,12H,
// D,W,M) no tienen HTF asociado en el indicador original — en esos TF el
// Pine simplemente no corre su lógica de HTF, así que acá tampoco.
const SNIPER_HTF_MAP = {
  '1min':  { kind:'fixed', sec:15*60   }, // "1" -> "15"
  '2min':  { kind:'fixed', sec:16*60   }, // "2" -> "16" (TF no estándar; puede no haber datos de 16min)
  '3min':  { kind:'fixed', sec:30*60   }, // "3" -> "30"
  '4min':  { kind:'fixed', sec:30*60   }, // "4" -> "30"
  '5min':  { kind:'fixed', sec:3600    }, // "5" -> "60"
  '15min': { kind:'fixed', sec:4*3600  }, // "15" -> "240"
  '30min': { kind:'day'   },              // "30" -> "D"
  '1h':    { kind:'day'   },              // "60" -> "D"
  '4h':    { kind:'week'  },              // "240" -> "W"
};

// Misma convención que ya usa Watchtower para "D"/"W": el día del bróker
// arranca 18:00 NY, no medianoche — reutilizamos wtDayKey/wtWeekKey en vez
// de inventar una alineación nueva.
function snHtfBucketKey(t, cfg){
  if (cfg.kind==='fixed') return Math.floor(t/cfg.sec)*cfg.sec;
  if (cfg.kind==='day') return wtDayKey(t);
  return wtWeekKey(t);
}

// Agrupa las velas cargadas en períodos HTF y devuelve, para cada vela i,
// el estado que tendría el Pine en ese momento: el high/low/open "corridos"
// del período HTF que se está formando, y los del período HTF anterior YA
// cerrado (equivalente a htf_high_run/htf_high_prev, etc, y new_htf_bar).
function snBuildHtfRunning(candles, cfg){
  const n = candles.length;
  const curHigh=new Array(n), curLow=new Array(n), curOpen=new Array(n), curKey=new Array(n);
  const prevHigh=new Array(n), prevLow=new Array(n), prevOpen=new Array(n), prevClose=new Array(n), prevKey=new Array(n);
  const newHtfBar=new Array(n);
  let curH=null,curL=null,curO=null,curK=null;
  let pH=null,pL=null,pO=null,pC=null,pK=null;
  for (let i=0;i<n;i++){
    const c=candles[i];
    const key=snHtfBucketKey(c.time, cfg);
    if (curK===null || key!==curK){
      newHtfBar[i]=true;
      if (curK!==null){ pH=curH; pL=curL; pO=curO; pC=candles[i-1].close; pK=curK; }
      curH=c.high; curL=c.low; curO=c.open; curK=key;
    } else {
      newHtfBar[i]=false;
      curH=Math.max(curH,c.high); curL=Math.min(curL,c.low);
    }
    curHigh[i]=curH; curLow[i]=curL; curOpen[i]=curO; curKey[i]=curK;
    prevHigh[i]=pH; prevLow[i]=pL; prevOpen[i]=pO; prevClose[i]=pC; prevKey[i]=pK;
    newHtfBar[i]=newHtfBar[i];
  }
  return {curHigh,curLow,curOpen,curKey,prevHigh,prevLow,prevOpen,prevClose,prevKey,newHtfBar};
}

// f_run del Pine: busca la racha de velas de color contrario (hasta 20
// velas) empezando `fromK` velas atrás de la vela i. Devuelve el offset de
// la vela más vieja de la racha (cnt), el de la más nueva (foundK) y el
// low/high extremo de toda la racha.
function snRun(candles, i, wantBearishRun, fromK){
  let foundK=-1;
  for (let k=fromK; k<=fromK+20; k++){
    const idx=i-k;
    if (idx<0) break;
    const c=candles[idx];
    const isC = wantBearishRun ? (c.close<c.open) : (c.close>c.open);
    if (isC){ foundK=k; break; }
  }
  let cnt=foundK, extreme=null;
  if (foundK>=0){
    extreme = wantBearishRun ? candles[i-foundK].low : candles[i-foundK].high;
    for (let k=foundK+1; k<=foundK+20; k++){
      const idx=i-k;
      if (idx<0) break;
      const c=candles[idx];
      const isC2 = wantBearishRun ? (c.close<c.open) : (c.close>c.open);
      if (isC2){
        cnt=k;
        extreme = wantBearishRun ? Math.min(extreme,c.low) : Math.max(extreme,c.high);
      } else break;
    }
  }
  return {cnt, foundK, extreme};
}

// Recorre el order block (de foundK a cnt) y devuelve: el extremo contrario
// del run (obhigh para bull / oblow para bear) y el body (min u max de
// open/close) de la vela con el wick más profundo — usados por el filtro
// FVG en el paso siguiente, no se dibujan en el Paso 1.
function snComputeOB(candles, i, foundK, cnt, isBull){
  let obExtreme = isBull ? candles[i-foundK].high : candles[i-foundK].low;
  let deepExtreme = isBull ? candles[i-foundK].low : candles[i-foundK].high;
  let bodyext = isBull ? Math.min(candles[i-foundK].open,candles[i-foundK].close) : Math.max(candles[i-foundK].open,candles[i-foundK].close);
  for (let k=foundK; k<=cnt; k++){
    const idx=i-k;
    const c=candles[idx];
    if (isBull){
      obExtreme = Math.max(obExtreme, c.high);
      if (c.low < deepExtreme){ deepExtreme=c.low; bodyext=Math.min(c.open,c.close); }
    } else {
      obExtreme = Math.min(obExtreme, c.low);
      if (c.high > deepExtreme){ deepExtreme=c.high; bodyext=Math.max(c.open,c.close); }
    }
  }
  return {obExtreme, bodyext};
}

// snReplay recorre TODAS las velas cargadas (pueden ser miles, sobre todo
// ahora que Watchtower trae más historial para la semana anterior) armando
// desde cero toda la máquina de estados de sweep+CISD. renderSniper() se
// llama en el mismo loop de 60fps que usa Watchtower durante pan/zoom/drag
// (_wtDragLoop) — sin este cache, paneabas o hacías zoom con Sniper
// prendido y se recalculaba el replay completo en cada frame sin que las
// velas ni la configuración hubiesen cambiado un poco, lo cual se sentía
// muy pesado/entrecortado. Cachea por una huella barata (largo + primer y
// último timestamp de las velas + símbolo/TF + los parámetros que de verdad
// afectan el resultado + cuándo se actualizaron los FVG de M15/H4) y solo
// vuelve a correr el replay cuando esa huella cambia.
let _snReplayCache = null; // {key, result}
function snReplayCached(candles, cfg, p, fvgFetchedAt){
  const key = candles.length + '|' + (candles.length?candles[0].time:0) + '|' + (candles.length?candles[candles.length-1].time:0)
    + '|' + STATE.symbol + '|' + STATE.timeframe + '|' + fvgFetchedAt
    + '|' + p.mostrarAlcista + p.mostrarBajista + p.margenReclamo + p.maxSetupAge + p.maxHtfVisibles
    + p.requireHtfFvg + p.reqFvgM15 + p.reqFvgH4 + p.fvgMinPenetration;
  if (_snReplayCache && _snReplayCache.key === key) return _snReplayCache.result;
  const result = snReplay(candles, cfg, p);
  _snReplayCache = { key, result };
  return result;
}

// Replay completo: reproduce, en el mismo orden que el Pine ejecuta sus
// bloques en cada vela, toda la máquina de estados de sweep+CISD.
function snReplay(candles, cfg, p){
  const n = candles.length;
  const barStep = n>1 ? (candles[1].time-candles[0].time) : 60;
  const htfSeconds = cfg.kind==='fixed' ? cfg.sec : (cfg.kind==='day'?86400:604800);
  const velasPorHtf = Math.max(1, Math.round(htfSeconds/barStep));
  const R = snBuildHtfRunning(candles, cfg);

  const sweepUpNow=new Array(n), sweepDownNow=new Array(n);
  for (let i=0;i<n;i++){
    const c=candles[i];
    sweepUpNow[i]   = R.prevHigh[i]!=null && R.curHigh[i]>R.prevHigh[i] && c.close<R.prevHigh[i]+p.margenReclamo && R.curOpen[i]<R.prevHigh[i];
    sweepDownNow[i]  = R.prevLow[i]!=null  && R.curLow[i]<R.prevLow[i]   && c.close>R.prevLow[i]-p.margenReclamo  && R.curOpen[i]>R.prevLow[i];
  }

  const bullSetups=[], bearSetups=[];
  function removeBySameLevel(arr, nivel){ for (let j=arr.length-1;j>=0;j--) if (arr[j].setNivel===nivel) arr.splice(j,1); }

  // Paso 3: ¿el rango del order block toca un FVG de M15/H4 que ya existía
  // (y seguía activo) en el momento `atTime` de la propia historia que se
  // está reproduciendo? — no "está activo ahora", sino "estaba activo en
  // esa barra pasada", porque estamos reconstruyendo todo el historial.
  function fvgOkAt(extreme, obExtreme2, bodyExt, isBull, atTime){
    if (!p.requireHtfFvg) return true;
    const sources = [];
    if (p.reqFvgM15 && p.m15Fvgs && p.fvgM15?.length){
      sources.push(snActiveFvgsAtTime(isBull?p.m15Fvgs.bull:p.m15Fvgs.bear, p.fvgM15, atTime));
    }
    if (p.reqFvgH4 && p.h4Fvgs && p.fvgH4?.length){
      sources.push(snActiveFvgsAtTime(isBull?p.h4Fvgs.bull:p.h4Fvgs.bear, p.fvgH4, atTime));
    }
    if (!sources.length) return false; // pidió filtro pero no hay ningún TF habilitado/con datos -> no confirma, igual que el Pine sin FVGs activos
    const lo = isBull ? extreme : obExtreme2;
    const hi = isBull ? obExtreme2 : extreme;
    return snRangeTouchesHtfFvg(lo, hi, bodyExt, isBull, sources, p.fvgMinPenetration);
  }

  function findSweepLine(i, nivel, isBull){
    const pk=R.prevKey[i], ck=R.curKey[i];
    if (pk!=null) for (let k=0;k<=500;k++){
      const idx=i-k;
      if (idx<0) break;
      const c=candles[idx];
      if (c.time<pk) break;
      if (c.time>=pk && c.time<ck){
        const touched = isBull ? (c.low<=nivel) : (c.high>=nivel);
        if (touched) return { start:idx, end:idx+velasPorHtf };
      }
    }
    return { start:i, end:i+velasPorHtf };
  }

  function pruneConfirmed(){
    for (let guard=0; guard<200; guard++){
      const all = bullSetups.map(s=>({s,arr:bullSetups})).concat(bearSetups.map(s=>({s,arr:bearSetups})))
        .filter(x=>x.s.cisdLevel!=null);
      if (all.length <= p.maxHtfVisibles) break;
      all.sort((a,b)=>a.s.confirmBar-b.s.confirmBar);
      const oldest = all[0];
      const idx = oldest.arr.indexOf(oldest.s);
      if (idx<0) break;
      oldest.arr.splice(idx,1);
    }
  }

  for (let i=0;i<n;i++){
    const c=candles[i];

    // DISPARO BULL
    if (p.mostrarAlcista && sweepDownNow[i] && !(i>0 && sweepDownNow[i-1]) && !R.newHtfBar[i]){
      const nivel = R.prevLow[i];
      removeBySameLevel(bullSetups, nivel);
      const r = snRun(candles, i, true, 1);
      if (r.cnt>=0 && (i-r.cnt)>=0){
        const ob = snComputeOB(candles, i, r.foundK, r.cnt, true);
        const sweepLn = findSweepLine(i, nivel, true);
        bullSetups.push({
          trig:i, sweepStart:sweepLn.start, sweepEnd:sweepLn.end, setNivel:nivel,
          level:candles[i-r.cnt].open, extreme:r.extreme, anchor:i-r.cnt,
          obClose:candles[i-r.foundK].close, obWidth:r.cnt-r.foundK+1,
          obExtreme2:ob.obExtreme, bodyExt:ob.bodyext,
          pendingHtf:true, confirmBar:-1, cisdLevel:null,
        });
      }
    }
    // DISPARO BEAR
    if (p.mostrarBajista && sweepUpNow[i] && !(i>0 && sweepUpNow[i-1]) && !R.newHtfBar[i]){
      const nivel2 = R.prevHigh[i];
      removeBySameLevel(bearSetups, nivel2);
      const r = snRun(candles, i, false, 1);
      if (r.cnt>=0 && (i-r.cnt)>=0){
        const ob = snComputeOB(candles, i, r.foundK, r.cnt, false);
        const sweepLn = findSweepLine(i, nivel2, false);
        bearSetups.push({
          trig:i, sweepStart:sweepLn.start, sweepEnd:sweepLn.end, setNivel:nivel2,
          level:candles[i-r.cnt].open, extreme:r.extreme, anchor:i-r.cnt,
          obClose:candles[i-r.foundK].close, obWidth:r.cnt-r.foundK+1,
          obExtreme2:ob.obExtreme, bodyExt:ob.bodyext,
          pendingHtf:true, confirmBar:-1, cisdLevel:null,
        });
      }
    }

    // VALIDACION HTF (bull y bear)
    if (R.newHtfBar[i]){
      for (let j=bullSetups.length-1;j>=0;j--){
        const s=bullSetups[j]; if (!s.pendingHtf) continue;
        const ok = R.prevLow[i]<s.setNivel && R.prevClose[i]>s.setNivel-p.margenReclamo && R.prevOpen[i]>s.setNivel;
        if (ok) s.pendingHtf=false;
        else if (s.cisdLevel==null) bullSetups.splice(j,1);
        else s.pendingHtf=false;
      }
      for (let j=bearSetups.length-1;j>=0;j--){
        const s=bearSetups[j]; if (!s.pendingHtf) continue;
        const ok = R.prevHigh[i]>s.setNivel && R.prevClose[i]<s.setNivel+p.margenReclamo && R.prevOpen[i]<s.setNivel;
        if (ok) s.pendingHtf=false;
        else if (s.cisdLevel==null) bearSetups.splice(j,1);
        else s.pendingHtf=false;
      }
    }

    // EXPIRACION
    for (let j=bullSetups.length-1;j>=0;j--){ const s=bullSetups[j]; if (s.cisdLevel==null && (i-s.trig)>p.maxSetupAge) bullSetups.splice(j,1); }
    for (let j=bearSetups.length-1;j>=0;j--){ const s=bearSetups[j]; if (s.cisdLevel==null && (i-s.trig)>p.maxSetupAge) bearSetups.splice(j,1); }

    // RE-ANCLAJE + CONFIRMACION BULL
    for (let j=bullSetups.length-1;j>=0;j--){
      const s=bullSetups[j];
      if (s.cisdLevel!=null || i<=s.trig) continue;
      if (i-1>=0 && candles[i-1].close<candles[i-1].open && candles[i-1].low<=s.extreme){
        const r = snRun(candles, i, true, 1);
        if (r.cnt>=0 && (i-r.cnt)>=0){
          const ob = snComputeOB(candles, i, r.foundK, r.cnt, true);
          s.level=candles[i-r.cnt].open; s.extreme=r.extreme; s.anchor=i-r.cnt;
          s.obClose=candles[i-r.foundK].close; s.obWidth=r.cnt-r.foundK+1;
          s.obExtreme2=ob.obExtreme; s.bodyExt=ob.bodyext;
        }
      }
      const fvgOk = fvgOkAt(s.extreme, s.obExtreme2, s.bodyExt, true, c.time);
      if (c.close>c.open && c.close>s.level && fvgOk){ s.cisdLevel=s.level; s.confirmBar=i; }
    }
    // RE-ANCLAJE + CONFIRMACION BEAR
    for (let j=bearSetups.length-1;j>=0;j--){
      const s=bearSetups[j];
      if (s.cisdLevel!=null || i<=s.trig) continue;
      if (i-1>=0 && candles[i-1].close>candles[i-1].open && candles[i-1].high>=s.extreme){
        const r = snRun(candles, i, false, 1);
        if (r.cnt>=0 && (i-r.cnt)>=0){
          const ob = snComputeOB(candles, i, r.foundK, r.cnt, false);
          s.level=candles[i-r.cnt].open; s.extreme=r.extreme; s.anchor=i-r.cnt;
          s.obClose=candles[i-r.foundK].close; s.obWidth=r.cnt-r.foundK+1;
          s.obExtreme2=ob.obExtreme; s.bodyExt=ob.bodyext;
        }
      }
      const fvgOk2 = fvgOkAt(s.extreme, s.obExtreme2, s.bodyExt, false, c.time);
      if (c.close<c.open && c.close<s.level && fvgOk2){ s.cisdLevel=s.level; s.confirmBar=i; }
    }

    // FAKEOUT
    for (let j=bullSetups.length-1;j>=0;j--){ const s=bullSetups[j]; if (s.confirmBar>=0 && (i-s.confirmBar)<=p.largoCisd && c.close<s.extreme-p.margenReclamo) bullSetups.splice(j,1); }
    for (let j=bearSetups.length-1;j>=0;j--){ const s=bearSetups[j]; if (s.confirmBar>=0 && (i-s.confirmBar)<=p.largoCisd && c.close>s.extreme+p.margenReclamo) bearSetups.splice(j,1); }

    pruneConfirmed();
  }

  return { bullSetups, bearSetups, barStep };
}

// ══════════════════════════════════════════════════════════
//  SNIPER — FVG (Paso 2): M15 y H4 únicamente, independientes del TF
//  que esté mirando el chart (igual que el request.security del Pine).
//  Se piden aparte al puente, se cachean por símbolo, y se refrescan solos
//  cada 5 minutos — no en cada redibujo (eso sería un pedido de red por
//  cada frame de drag/scroll, carísimo).
// ══════════════════════════════════════════════════════════
const _snFvgCache = {};
const SN_FVG_REFRESH_MS = 5*60*1000;

async function snFetchTf(symbol, interval, bars){
  try {
    const res = await fetch(`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${interval}&bars=${bars}`);
    const json = await res.json();
    if (json.error || !Array.isArray(json.bars)) return null;
    return json.bars;
  } catch(e){ return null; }
}

async function snEnsureFvgData(symbol){
  const entry = _snFvgCache[symbol];
  const [m15, h4] = await Promise.all([
    snFetchTf(symbol, '15min', 1000),
    snFetchTf(symbol, '4h', 1000),
  ]);
  if (m15) entry.m15 = m15;
  if (h4) entry.h4 = h4;
  // Detectar los FVG acá (una vez cada vez que llega data nueva) en vez de
  // en renderSniper — ese corre en el loop de 60fps durante pan/zoom/drag,
  // y recorrer de nuevo 1000 velas de M15/H4 en cada frame sin que la data
  // haya cambiado era puro desperdicio.
  entry.m15Fvgs = entry.m15.length ? snDetectFvgs(entry.m15) : {bull:[],bear:[]};
  entry.h4Fvgs  = entry.h4.length  ? snDetectFvgs(entry.h4)  : {bull:[],bear:[]};
  entry.fetchedAt = Date.now();
  entry.pending = false;
  renderSniper();
}
function snGetFvgData(symbol){
  let entry = _snFvgCache[symbol];
  if (!entry){
    entry = _snFvgCache[symbol] = { m15:[], h4:[], m15Fvgs:{bull:[],bear:[]}, h4Fvgs:{bull:[],bear:[]}, fetchedAt:0, pending:true };
    snEnsureFvgData(symbol);
  } else if (!entry.pending && Date.now()-entry.fetchedAt > SN_FVG_REFRESH_MS){
    entry.pending = true;
    snEnsureFvgData(symbol);
  }
  return entry;
}

// Patrón clásico de 3 velas ICT sobre la serie M15/H4 propia (no la del
// chart principal): gap entre el high de hace 2 velas y el low actual
// (bull), o al revés (bear). Invalidación por CIERRE (no mecha) más allá
// del borde — así es como el Pine trata M15/H4 específicamente
// (use_close_based=true), a diferencia de otros TF del indicador original
// que no portamos.
function snDetectFvgs(candles){
  const bull=[], bear=[];
  for (let i=2;i<candles.length;i++){
    const c0=candles[i-2], c2=candles[i];
    if (c0.high < c2.low)  bull.push({ startIdx:i-2, createIdx:i, top:c2.low, bottom:c0.high, filledIdx:null });
    if (c0.low  > c2.high) bear.push({ startIdx:i-2, createIdx:i, top:c0.low, bottom:c2.high, filledIdx:null });
  }
  function markFilled(list, isBull){
    list.forEach(f=>{
      for (let k=f.createIdx+1; k<candles.length; k++){
        const c=candles[k];
        const invalid = isBull ? (c.close<f.bottom) : (c.close>f.top);
        if (invalid){ f.filledIdx=k; break; }
      }
    });
  }
  markFilled(bull,true); markFilled(bear,false);
  return {bull,bear};
}

// ══════════════════════════════════════════════════════════
//  SNIPER — Paso 3: filtro de confluencia FVG (conecta el FVG del Paso 2
//  con la confirmación del CISD del Paso 1)
// ══════════════════════════════════════════════════════════

// Qué FVGs de una lista (M15 o H4, bull o bear) estaban activos en el
// instante `t` — ya habían nacido y todavía no se habían invalidado. Se usa
// durante el replay histórico: en la barra i, "activo" significa activo
// EN ESE MOMENTO del pasado, no activo ahora.
function snActiveFvgsAtTime(fvgList, mtfCandles, t){
  const out=[];
  for (const f of fvgList){
    const createTime = mtfCandles[f.createIdx].time;
    if (createTime > t) continue;
    if (f.filledIdx!=null && mtfCandles[f.filledIdx].time <= t) continue;
    out.push(f);
  }
  return out;
}

// classify_pen del Pine: qué tan adentro del FVG cerró la vela con el wick
// más profundo del order block.
function snClassifyPen(bodyExtreme, top, bottom, wantBullFvg){
  const frange = top-bottom;
  if (frange<=0) return 'NONE';
  if (wantBullFvg){
    if (bodyExtreme > top) return 'ONLY_WICK';
    if (bodyExtreme < bottom) return 'THROUGH';
    return (top-bodyExtreme)/frange < 0.5 ? 'SHALLOW' : 'DEEP';
  } else {
    if (bodyExtreme < bottom) return 'ONLY_WICK';
    if (bodyExtreme > top) return 'THROUGH';
    return (bodyExtreme-bottom)/frange < 0.5 ? 'SHALLOW' : 'DEEP';
  }
}
function snBucketMeets(bucket, minPenetration){
  if (minPenetration==='any') return bucket!=='NONE';
  if (minPenetration==='deep_or_more') return bucket==='DEEP' || bucket==='THROUGH';
  if (minPenetration==='through_only') return bucket==='THROUGH';
  return false;
}
// range_touches_htf_fvg del Pine: el rango del OB [lo,hi] tiene que TOCAR
// (overlap) un FVG activo del mismo lado, Y la penetración del candle más
// profundo del OB tiene que cumplir el mínimo configurado.
function snRangeTouchesHtfFvg(lo, hi, bodyExtreme, wantBullFvg, fvgSources, minPenetration){
  for (const list of fvgSources){
    for (const f of list){
      if (lo<=f.top && hi>=f.bottom && snBucketMeets(snClassifyPen(bodyExtreme,f.top,f.bottom,wantBullFvg), minPenetration)){
        return true;
      }
    }
  }
  return false;
}

// Los horarios de M15/H4 casi nunca calzan con la grilla de velas del
// chart principal (si estás mirando en 1H, por ejemplo) — timeToCoordinate
// devuelve null para un horario que no es una vela real de ESA serie (el
// mismo bug que ya resolvimos en Watchtower/ORG). Hay que enganchar al
// candle real más cercano del chart antes de pasarle el tiempo a wtRect.
function snDrawFvgBoxes(svg, chartCandles, mtfCandles, list, color, showToggle, maxCount, hideFilled, lastTime, barStepMtf){
  if (!showToggle || !mtfCandles.length) return;
  // El viejo +10*barStepMtf estaba en la escala del TF del FVG (M15/H4), no
  // en la del chart principal: en un TF chico (M1/M5) con FVGs de H4, esas
  // 10 velas de H4 (40hs) caen bien afuera de las ~15 velas "fantasma" que
  // tiene cargadas el eje de tiempo, timeToCoordinate devuelve null y la
  // caja no se dibuja NADA (antes, al enganchar siempre a la última vela
  // real, por lo menos se veía, aunque quedara corta). Medimos la extensión
  // en velas del chart que se está mirando, que es lo que de verdad importa
  // y además entra siempre dentro del whitespace ya cargado.
  const chartBarStep = chartCandles.length>1 ? (chartCandles[1].time-chartCandles[0].time) : barStepMtf;
  let shown = hideFilled ? list.filter(f=>f.filledIdx==null) : list;
  shown = shown.slice().sort((a,b)=>b.createIdx-a.createIdx).slice(0, maxCount);
  shown.forEach(f=>{
    const rawT1 = mtfCandles[f.startIdx].time;
    const t1 = wtNearestCandleTime(chartCandles, rawT1);
    // Si está rellenado, el final SÍ es un horario real pasado -> hay que
    // enganchar al candle real más cercano del chart (igual que t1). Si
    // sigue abierto, el final ya está calculado en la grilla del propio
    // chart (lastTime + N velas del chart) -> usarlo directo, sin buscarle
    // "la vela más cercana" porque esas velas futuras todavía no existen
    // como datos reales (son el whitespace que ya engancha timeToCoordinate).
    const t2 = f.filledIdx!=null
      ? wtNearestCandleTime(chartCandles, mtfCandles[f.filledIdx].time)
      : lastTime + LEVEL_EXTEND_BARS*chartBarStep;
    wtRect(svg, t1, t2, f.top, f.bottom, color, 1, 'none', 'Sniper');
  });
}

function renderSniper(){
  if (!window._sniperSvg) return;
  const svg = window._sniperSvg;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  window._indicatorHitRegions = (window._indicatorHitRegions||[]).filter(r=>r.name!=='Sniper');
  if (!STATE.sniper.enabled) return;
  const candles = window._lastCandles||[];
  if (candles.length<5) return;
  const sn = STATE.sniper;
  const lastTime = candles[candles.length-1].time;

  // FVG (M15/H4) primero, para que las cajas queden DEBAJO de las líneas
  // de sweep/CISD en el orden de dibujo del SVG (z-order natural). Ya
  // vienen detectados desde snEnsureFvgData — no tiene sentido re-escanear
  // 1000 velas de M15/H4 en cada render (este corre en el loop de 60fps
  // durante pan/zoom/drag) si la data no cambió.
  const fvgData = snGetFvgData(STATE.symbol);
  const m15Fvgs = fvgData.m15Fvgs || {bull:[],bear:[]};
  const h4Fvgs  = fvgData.h4Fvgs  || {bull:[],bear:[]};
  if (fvgData.m15.length){
    const m15Step = fvgData.m15[1].time - fvgData.m15[0].time;
    snDrawFvgBoxes(svg, candles, fvgData.m15, m15Fvgs.bull, sn.m15BullColor, sn.showM15Bull, sn.m15Count, sn.hideFilledBull, lastTime, m15Step);
    snDrawFvgBoxes(svg, candles, fvgData.m15, m15Fvgs.bear, sn.m15BearColor, sn.showM15Bear, sn.m15Count, sn.hideFilledBear, lastTime, m15Step);
  }
  if (fvgData.h4.length){
    const h4Step = fvgData.h4[1].time - fvgData.h4[0].time;
    snDrawFvgBoxes(svg, candles, fvgData.h4, h4Fvgs.bull, sn.h4BullColor, sn.showH4Bull, sn.h4Count, sn.hideFilledBull, lastTime, h4Step);
    snDrawFvgBoxes(svg, candles, fvgData.h4, h4Fvgs.bear, sn.h4BearColor, sn.showH4Bear, sn.h4Count, sn.hideFilledBear, lastTime, h4Step);
  }

  const cfg = SNIPER_HTF_MAP[STATE.timeframe];
  if (!cfg) return; // TF sin HTF en el Pine original -> el sweep/CISD no corre, igual que en TV (el FVG arriba sí queda)
  const { bullSetups, bearSetups, barStep } = snReplayCached(candles, cfg, {
    mostrarAlcista: sn.mostrarAlcista, mostrarBajista: sn.mostrarBajista,
    margenReclamo: sn.margenReclamo, maxSetupAge: sn.maxSetupAge,
    maxHtfVisibles: sn.maxHtfVisibles, largoCisd: sn.largoCisd,
    requireHtfFvg: sn.requireHtfFvg, reqFvgM15: sn.reqFvgM15, reqFvgH4: sn.reqFvgH4,
    fvgMinPenetration: sn.fvgMinPenetration,
    fvgM15: fvgData.m15, fvgH4: fvgData.h4, m15Fvgs, h4Fvgs,
  }, fvgData.fetchedAt);

  function draw(setups, isBull){
    const sweepColor = isBull ? sn.colorSweepLow : sn.colorSweepHigh;
    const cisdColor  = isBull ? sn.colorCisdBull : sn.colorCisdBear;
    setups.forEach(s=>{
      if (s.sweepStart!=null && s.sweepStart < candles.length){
        const t1 = candles[s.sweepStart].time;
        const t2 = t1 + (s.sweepEnd - s.sweepStart) * barStep;
        wtLine(svg, t1, t2, s.setNivel, sweepColor, sn.anchoLineaSweep, s.pendingHtf?'2,2':null, 'Sniper');
      }
      if (sn.showCisdLine && s.anchor>=0 && s.anchor<candles.length){
        const t1 = candles[s.anchor].time;
        const t2 = t1 + sn.largoCisd*barStep;
        const confirmed = s.cisdLevel!=null;
        wtLine(svg, t1, t2, s.level, cisdColor, sn.anchoCisd, confirmed?null:'2,2', 'Sniper');
        wtLabel(svg, t2, s.level, confirmed?'CISD':'CISD?', cisdColor, 'Sniper');
      }
    });
  }
  draw(bullSetups, true);
  draw(bearSetups, false);
}

function renderPresetSelect(){

  if (!sel) return;

  try { STATE.presets = JSON.parse(lsGet('td_presets') || '{}'); } catch(e){}

  sel.innerHTML = '<option value="">— elegir preset —</option>'
    + names.map(n => `<option value="${n}">${n}</option>`).join('');

function saveCurrentAsPreset(){
  commitChartSettingsForm();
  const existing = Object.keys(STATE.presets).sort();
  const name = prompt('Nombre del preset:' + (existing.length ? '\n(ya existen: ' + existing.join(', ') + ')' : ''));
  if (!name) return;
  STATE.presets[name] = JSON.parse(JSON.stringify(captureCurrentDesign()));
  savePresetsState();
  renderPresetSelect();
  document.getElementById('cs-preset-select').value = name;
}

function applySelectedPreset(){
  const name = document.getElementById('cs-preset-select').value;
  if (!name) return;
  applyPreset(name);
}

function applyPreset(name){
  // Relee del storage en vez de confiar en STATE.presets: ese objeto se
  // cargó una sola vez al arrancar este panel, así que si el preset se
  // guardó después (desde este mismo panel más tarde, o desde otro panel
  // en el modo multi-chart) no estaría todavía en memoria.
  try { STATE.presets = JSON.parse(lsGet('td_presets') || '{}'); } catch(e){}
  const p = STATE.presets[name];
  if (!p) return;
  STATE.chartSettings = Object.assign({}, CHART_SETTINGS_DEFAULTS, JSON.parse(JSON.stringify(p.chartSettings || {})));
  STATE.indicatorStyles = JSON.parse(JSON.stringify(p.indicatorStyles || {}));
  STATE.watchtower = JSON.parse(JSON.stringify(p.watchtower || STATE.watchtower));
  STATE.sniper = Object.assign({}, SNIPER_DEFAULTS, JSON.parse(JSON.stringify(p.sniper || {})));
  STATE.indicators = [...(p.indicators || [])];
  STATE.watchtower.enabled = STATE.indicators.includes('Watchtower');
  STATE.sniper.enabled = STATE.indicators.includes('Sniper');

  saveChartSettingsState();
  saveIndicatorStylesState();
  saveWatchtowerState();
  saveSniperState();
  saveState();

  Object.keys(overlays).forEach(n => { try { chart.removeSeries(overlays[n]); } catch(e){} delete overlays[n]; });
  STATE.indicators.forEach(n => addIndicatorSeries(n));

  applyChartSettings();
  renderTfBar();
  setActiveTF(STATE.timeframe);
  renderIndList();
  renderWatchtower();
  renderSniper();
  fillChartSettingsForm(STATE.chartSettings);
}

function deleteSelectedPreset(){
  const sel = document.getElementById('cs-preset-select');
  const name = sel.value;
  if (!name) return;
  if (!confirm(`¿Borrar el preset "${name}"?`)) return;
  delete STATE.presets[name];
  savePresetsState();
  renderPresetSelect();
}

// ══════════════════════════════════════════════════════════
//  loadChart  (vía mt5_bridge/bridge_server.py -> MT5/Axi)
// ══════════════════════════════════════════════════════════
const BRIDGE_URL = 'http://localhost:8787';

// Redibuja toda la serie (velas reales + puntos fantasma a futuro para el
// eje de horas). series.update() no sirve acá: exige que cada actualización
// vaya hacia adelante en el tiempo, y los fantasmas quedan después de la
// vela en formación, así que "actualizar in place" la vela actual rompía
// silenciosamente. setData() no tiene ese problema y no mueve el zoom.
function renderSeries(timeframe){
  const candles=window._lastCandles;
  const last=candles[candles.length-1];
  candleSeries.setData(candles.concat(futureWhitespace(last.time, timeframe, 15)));
  volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,.25)':'rgba(239,83,80,.2)'})));
  refreshOverlays(candles);
  renderWatchtower();
  renderSniper();
}

// Recalcula EMA/SMA/VWAP sobre el set completo de velas cargadas — si no,
// al pedir más historial hacia atrás (loadMoreHistory) la línea se queda
// corta en el tramo inicial de 500 barras y "desaparece" más allá de eso.
function refreshOverlays(candles){
  Object.keys(overlays).forEach(name=>{
    const def=INDICATOR_DEFS.find(d=>d.name===name);
    if(!def||!def.calc)return;
    overlays[name].setData(def.calc(candles));
  });
}

// Scroll infinito hacia atrás: cuando te acercás al borde izquierdo de lo
// ya cargado, pide más velas viejas al puente (que a su vez le pide a MT5
// el tramo anterior) y las pega adelante sin mover la vista de un salto.
let _loadingMoreHistory = false;
async function loadMoreHistory(){
  if (_loadingMoreHistory) return;
  const candles = window._lastCandles;
  if (!candles || !candles.length || candles.length > 8000) return;
  _loadingMoreHistory = true;
  try {
    const oldest = candles[0].time;
    const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(STATE.symbol)}&interval=${STATE.timeframe}&bars=300&before=${oldest}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.error || !Array.isArray(json.bars) || json.bars.length===0) return;
    const older = json.bars.filter(b => b.time < oldest);
    if (older.length===0) return;

    const addedCount = older.length;
    window._lastCandles = older.concat(candles);
    renderSeries(STATE.timeframe);

    // mismo bar en la misma posición de pantalla, aunque el array creció a la izquierda
    const range = chart.timeScale().getVisibleLogicalRange();
    if (range) chart.timeScale().setVisibleLogicalRange({ from: range.from+addedCount, to: range.to+addedCount });
  } catch(e) {
    // sin red/MT5 un instante: se reintenta solo la próxima vez que se scrollee
  } finally {
    _loadingMoreHistory = false;
  }
}

// El batch inicial de 500 velas, en timeframes chicos (M5 y similares), no
// llega a cubrir una semana completa hacia atrás — así que al abrir el
// chart, PWH/PWL/PWM (que necesitan ver la semana ANTERIOR completa) no
// tienen con qué calcularse y quedan sin dibujar hasta que el usuario hace
// zoom out y loadMoreHistory trae más historial "por las dudas". Si el
// toggle de niveles semanales está prendido, completamos ese historial en
// segundo plano, en vez de esperar a que el usuario scrollee para notarlo.
//
// Un solo pedido grande, NO una cadena de pedidos de a 300: el puente habla
// con MT5 por archivo (escribe un pedido, sondea cada 100ms la respuesta, y
// el lado MT5 reintenta hasta 15 veces con su propio delay si todavía no
// tiene esas velas descargadas) — cada ida y vuelta ya es lenta de por sí,
// y encadenar varias en secuencia (como hacía antes, pidiendo de a 300) se
// sentía lento Y a los tirones, con el chart re-renderizando en varios
// pasos visibles. Acá se calcula de una sola vez cuánto falta y se pide
// todo junto — un solo re-render, prolijo, al final.
//
// Tampoco reusa loadMoreHistory(): esa función además corrige la posición
// de scroll asumiendo que la llamó un scroll manual del usuario cerca del
// borde izquierdo. Disparada sola, apenas se abre el chart, ese ajuste se
// aplica sobre una vista que en realidad nunca se movió.
async function ensureWeeklyHistoryForWatchtower(){
  if (!STATE.watchtower.enabled || !STATE.watchtower.pwLevels) return;
  if (!window._lastCandles || !window._lastCandles.length) return;
  const step = TF_SECONDS[STATE.timeframe];
  let fetchedMore = false;

  // La estimación de cuántas velas hacen falta (extraBars) puede quedarse
  // corta en la práctica — fines de semana, feriados, o historial que MT5
  // todavía no tenía descargado y devolvió incompleto pese al margen del
  // 50%. Un solo pedido que se conforma con lo que llegó reproduce el bug
  // original (nivel calculado con semana incompleta, se "acomoda" recién
  // cuando el usuario hace zoom). Por eso se vuelve a verificar después de
  // cada pedido y, si todavía falta, se pide de nuevo — acotado a pocas
  // vueltas, no las ~20 de a 300 de antes, porque la estimación ya debería
  // acertarle casi siempre de una.
  for (let guard=0; guard<5; guard++){
    const candles = window._lastCandles;
    if (candles.length>8000) break;
    // No alcanza con que haya UNA vela de la semana anterior metida en el
    // batch (eso daba un high/low de PW calculado con una semana incompleta,
    // que después "saltaba" a la posición correcta apenas el zoom traía el
    // resto) — hace falta que el historial cargado llegue hasta el ARRANQUE
    // real de esa semana anterior.
    const prevWeekStart = wtWeekKey(candles[candles.length-1].time) - 7*86400;
    if (candles[0].time <= prevWeekStart) break; // ya está completo

    const missingSeconds = candles[0].time - prevWeekStart;
    // +50% de margen por los huecos de mercado cerrado (fines de semana).
    const extraBars = step ? Math.min(6000, Math.ceil(missingSeconds/step*1.5) + 50) : 300;

    try {
      const oldest = candles[0].time;
      const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(STATE.symbol)}&interval=${STATE.timeframe}&bars=${extraBars}&before=${oldest}`;
      const res = await fetch(url);
      const json = await res.json();
      if (json.error || !Array.isArray(json.bars) || json.bars.length===0) break;
      const older = json.bars.filter(b => b.time < oldest);
      if (older.length===0) break; // el bridge no tiene más historial — no insistir
      window._lastCandles = older.concat(candles);
      fetchedMore = true;
    } catch(e) { break; }
  }

  if (fetchedMore) {
    renderSeries(STATE.timeframe);
    chart.timeScale().scrollToRealTime();
    const updated = window._lastCandles;
    updateStatusBar(STATE.symbol, STATE.timeframe, updated.length, updated[0], updated[updated.length-1]);
  }
}

// Cierre de vela: pega solo la(s) vela(s) nueva(s) sin recargar todo el chart
// (sin overlay, sin refit de zoom — eso es lo que se "notaba").
async function appendNewBar(symbol, timeframe){
  // Igual que refreshFormingCandle: no lo pisamos en medio de un arrastre.
  // Acá sí hay que esperar (no saltear sin más) — el countdown ya se paró
  // para llamar a esto, así que si nos vamos sin hacer nada el reloj queda
  // trabado para siempre. Esperamos a que termine el arrastre y recién ahí
  // seguimos.
  while (window._dragSession) { await new Promise(r=>setTimeout(r,200)); }
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=3`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)throw new Error(json.error||'sin datos');

    const prevLastTime=window._lastCandles[window._lastCandles.length-1].time;
    json.bars.forEach(bar=>{
      if(bar.time<prevLastTime)return; // vela vieja, ya la tenemos
      if(bar.time===window._lastCandles[window._lastCandles.length-1].time){
        window._lastCandles[window._lastCandles.length-1]=bar;
      } else {
        window._lastCandles.push(bar);
      }
    });
    renderSeries(timeframe);

    const last=window._lastCandles[window._lastCandles.length-1];
    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,window._lastCandles.length,window._lastCandles[0],last);
    updateWLPrice(symbol,last.close);

    startCountdown(timeframe, last.time, json.serverTime);
  } catch(err){
    // si falla, reintentamos en el próximo tick del countdown (recarga completa como respaldo)
    loadChart(symbol, timeframe);
  }
}

function refreshChart(){
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  loadChart(STATE.symbol, STATE.timeframe).finally(()=>btn.classList.remove('spinning'));
}

async function loadChart(symbol, timeframe, _isUppercaseRetry) {
  setLoaderMsg(`Loading ${symbol} ${timeframe}…`);showOverlay(true);setStatus('loading','● loading…');

  // Siempre 500 acá — es lo que ya suele tener MT5 cacheado, responde rápido
  // (chart visible al toque). El historial extra para los niveles semanales
  // de Watchtower (que suele requerir que MT5 vaya a buscar velas que
  // todavía no tiene, mucho más lento) se completa aparte, en segundo
  // plano, después de este primer pintado — ver ensureWeeklyHistoryForWatchtower.
  const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=500`;

  try {
    const res=await fetch(url);
    const json=await res.json();
    if(json.error)throw new Error(json.error);
    const candles=json.bars;
    if(!Array.isArray(candles)||candles.length===0)throw new Error('sin datos para '+symbol);

    window._lastCandles=candles;
    // Resincroniza el tamaño del chart con el contenedor real antes de
    // acomodar la vista — si el ResizeObserver no llegó a correr a tiempo
    // (p.ej. justo después de un refresh/reload), el chart queda con una
    // resolución interna vieja y las velas se ven apretadas en una esquina.
    const _cc = document.getElementById('chart-container');
    chart.applyOptions({ width:_cc.clientWidth, height:_cc.clientHeight });
    renderSeries(timeframe);
    chart.timeScale().applyOptions({ rightOffset: 15, barSpacing: 8 });
    chart.timeScale().scrollToRealTime();
    ensureWeeklyHistoryForWatchtower(); // no se espera: completa el historial semanal en segundo plano

    Object.keys(overlays).forEach(name=>{chart.removeSeries(overlays[name]);delete overlays[name];});
    STATE.indicators.forEach(name=>addIndicatorSeries(name));

    drawings.forEach(d => {
      d.series.forEach(s=>{try{chart.removeSeries(s);}catch(e){}});
      d.series=[];
      buildDrawingOnChart(d);
    });
    if(selectedDrawingId)highlightSelectedSvg(selectedDrawingId);

    const last=candles[candles.length-1];
    const prev=candles[candles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,candles.length,candles[0],last);
    updateWLPrice(symbol,last.close);

    document.getElementById('symbol-input').value=symbol;
    updateTfBarSymbol(symbol);
    document.title=`${symbol} · Zentinel`;
    setStatus('ok','● live');
    showOverlay(false);

    startCountdown(timeframe, last.time, json.serverTime);

  } catch(err) {
    // El input de símbolo se muestra todo en mayúsculas por CSS
    // (text-transform), pero eso es solo cosmético — lo que viaja al
    // puente es lo que el usuario tipeó literalmente, y los nombres de
    // símbolo en MT5 distinguen mayúsculas de minúsculas ("US30" existe,
    // "us30" no). No podemos simplemente forzar mayúsculas en todos los
    // casos (hay símbolos reales con sufijo en minúscula, como
    // "NAS100.fs" — forzar ahí rompería el símbolo que sí funciona). Por
    // eso: si falló, reintentamos UNA sola vez con el símbolo tal cual lo
    // tipeó pero en mayúsculas, antes de darnos por vencidos — cubre el
    // caso común (escribir en minúscula) sin arriesgar nada si el símbolo
    // ya estaba bien escrito.
    //
    // OJO: esto solo tiene sentido si el error es realmente "símbolo no
    // encontrado" — cualquier OTRO error (el puente ocupado con otro
    // panel, timeout esperando a MT5, etc.) no tiene nada que ver con
    // mayúsculas/minúsculas. Reintentar igual convertía un error
    // TRANSITORIO (que se resolvía solo con un refresh) en uno PERMANENTE
    // y confuso: el símbolo en mayúsculas de verdad no existe, así que el
    // reintento fallaba también y mostraba "symbol not found: NAS100.FS"
    // para un símbolo que en realidad sí estaba bien escrito y ya andaba
    // en otro panel — eso es lo que pasaba al abrir 2 gráficos a la vez.
    const isUnknownSymbol = /symbol not found/i.test(err.message || '');
    const upper = symbol.toUpperCase();
    if (isUnknownSymbol && !_isUppercaseRetry && upper !== symbol) {
      STATE.symbol = upper;
      loadChart(upper, timeframe, true);
      return;
    }
    setLoaderMsg('⚠ '+err.message);
    setStatus('err','● error');
  }
}

// ══════════════════════════════════════════════════════════
//  COUNTDOWN — tiempo restante hasta el cierre de la vela actual
//  (usa json.serverTime, el reloj de MT5/broker, no el del navegador)
// ══════════════════════════════════════════════════════════
const TF_SECONDS = {
  '1min':60,'2min':120,'3min':180,'4min':240,'5min':300,'6min':360,'10min':600,'12min':720,'15min':900,'20min':1200,'30min':1800,
  '1h':3600,'2h':7200,'3h':10800,'4h':14400,'6h':21600,'8h':28800,'12h':43200,
};
let _countdownTimer=null;

// Puntos "fantasma" (sin OHLC) después de la última vela, solo para que el
// eje de tiempo sepa qué hora va en el margen vacío de la derecha y la dibuje.
function futureWhitespace(lastTime, timeframe, count){
  const pts=[]; let t=lastTime;
  for(let i=0;i<count;i++){
    const nt=nextCloseTime(timeframe, t);
    if(nt===null)break;
    pts.push({time:nt});
    t=nt;
  }
  return pts;
}

function nextCloseTime(timeframe, lastBarTime){
  if(TF_SECONDS[timeframe]) return lastBarTime + TF_SECONDS[timeframe];
  const d=new Date(lastBarTime*1000);
  if(timeframe==='1day'){ d.setUTCHours(24,0,0,0); return Math.floor(d.getTime()/1000); }
  if(timeframe==='1week'){
    d.setUTCHours(0,0,0,0);
    const addDays=((8-d.getUTCDay())%7)||7;
    d.setUTCDate(d.getUTCDate()+addDays);
    return Math.floor(d.getTime()/1000);
  }
  if(timeframe==='1month'){
    const nd=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1, 0,0,0));
    return Math.floor(nd.getTime()/1000);
  }
  return null;
}

function positionCountdownBadge(lastClose, lastOpen){
  const badge=document.getElementById('price-countdown-badge');
  if(!candleSeries||lastClose==null){ badge.style.display='none'; return; }
  const y=candleSeries.priceToCoordinate(lastClose);
  if(y==null){ badge.style.display='none'; return; }
  const container=document.getElementById('chart-container');
  const priceScaleW=chart.priceScale('right').width();
  // Medido pixel a pixel contra el tag de precio nativo: no ocupa todo el
  // ancho de la escala de precio, deja ~6px de margen del lado derecho, y
  // mide 17px de alto centrado en la línea del precio.
  const RIGHT_GAP=6, TAG_H=17;
  badge.style.display='flex';
  badge.style.left=(container.clientWidth-priceScaleW)+'px';
  badge.style.width=(priceScaleW-RIGHT_GAP)+'px';
  badge.style.height=TAG_H+'px';
  // El tag nativo no está centrado en "y": mide pixel a pixel de y-5 a
  // y+11 (17px) — su borde inferior real es y+11, no y+altura/2.
  badge.style.top=(y+11)+'px';
  badge.classList.toggle('up', lastClose>=lastOpen);
  badge.classList.toggle('dn', lastClose<lastOpen);
}

let _formingFetchInFlight=false;
async function refreshFormingCandle(symbol, timeframe){
  if(_formingFetchInFlight || !window._lastCandles) return;
  // Si el usuario está en medio de arrastrar un dibujo (mover el cuerpo o
  // estirar una manija), no lo interrumpimos con un refresh de precio acá
  // — eso de abajo reconstruye TODO el chart (velas, volumen, overlays,
  // Watchtower, Sniper) cada vez que entra, y como el precio real se mueve
  // casi todos los segundos, es muy probable que ese refresh caiga justo
  // en medio de un arrastre: se sentía como que "todo tiembla" (las velas,
  // los ejes, Watchtower) mientras intentás mover algo, aunque el dibujo
  // en sí no tenga nada que ver. El próximo tick, ya sin drag activo,
  // atrapa el precio más reciente igual.
  if (window._dragSession) return;
  _formingFetchInFlight=true;
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=1`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)return;
    const bar=json.bars[0];
    const last=window._lastCandles[window._lastCandles.length-1];
    if(bar.time!==last.time)return; // ya cerró — eso lo maneja appendNewBar
    // Este tick corre cada 1s todo el tiempo que la vela sigue en formación
    // — la mayoría de esos segundos el precio no se movió un tick siquiera.
    // renderSeries() de acá abajo es caro: reconstruye TODAS las velas
    // cargadas (miles, desde que Watchtower trae más historial), el
    // volumen, los overlays y Watchtower/Sniper desde cero. Sin este
    // chequeo se pagaba ese costo cada segundo aunque no hubiera nada
    // nuevo que mostrar.
    if (bar.open===last.open && bar.high===last.high && bar.low===last.low && bar.close===last.close && bar.volume===last.volume) return;

    window._lastCandles[window._lastCandles.length-1]=bar;
    renderSeries(timeframe);

    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(bar,prev);
    updateTopbarOHLCV(bar);
    updateWLPrice(symbol,bar.close);
    positionCountdownBadge(bar.close,bar.open);
  } catch(e){
    // red caída un segundo: el próximo tick reintenta solo
  } finally {
    _formingFetchInFlight=false;
  }
}

function startCountdown(timeframe, lastBarTime, serverTimeAtLoad){
  clearInterval(_countdownTimer);
  const badge=document.getElementById('price-countdown-badge');
  const close=nextCloseTime(timeframe, lastBarTime);
  const loadedAtMs=performance.now();

  function tick(){
    const elapsed=(performance.now()-loadedAtMs)/1000;
    const nowServer=serverTimeAtLoad+elapsed;
    if(close!==null){
      let remain=Math.max(0, Math.round(close-nowServer));
      if(remain<=0){ clearInterval(_countdownTimer); appendNewBar(STATE.symbol, STATE.timeframe); return; }
      const h=Math.floor(remain/3600), m=Math.floor((remain%3600)/60), s=remain%60;
      badge.textContent = h>0
        ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
      badge.classList.toggle('soon', remain<=10);
    }
    refreshFormingCandle(STATE.symbol, timeframe);
  }
  tick();
  _countdownTimer=setInterval(tick,1000);
}

// ══════════════════════════════════════════════════════════
//  CONTROLES GLOBALES (postMessage desde la grilla multi-chart)
//  La barra de afuera (renderLayoutGrid) no toca el DOM de cada panel
//  directamente — cada panel es un iframe con su propio STATE. Le manda
//  mensajes y cada panel decide qué hacer con lo suyo.
// ══════════════════════════════════════════════════════════
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object' || !String(msg.type||'').startsWith('zentinel:')) return;
  if (msg.type === 'zentinel:setSymbol' && msg.symbol) {
    selectSymbol(msg.symbol);
  } else if (msg.type === 'zentinel:setTimeframe' && msg.tf) {
    STATE.timeframe = msg.tf;
    saveState();
    setActiveTF(STATE.timeframe);
    loadChart(STATE.symbol, STATE.timeframe);
  } else if (msg.type === 'zentinel:applyPreset' && msg.name) {
    applyPreset(msg.name);
  } else if (msg.type === 'zentinel:refresh') {
    refreshChart();
  } else if (msg.type === 'zentinel:openSettings') {
    openChartSettingsModal();
  }
});

// Le avisa al shell (si estamos embebidos dentro de la grilla multi-chart)
// que este panel se acaba de clickear, para que lo marque como activo. Es
// más confiable que depender del 'blur' de la ventana principal, que solo
// detecta bien el primer salto de foco hacia un iframe — no cuando se pasa
// directo de un panel a otro.
if (EMBED_MODE && PANE_ID) {
  document.addEventListener('mousedown', () => {
    window.parent.postMessage({ type:'zentinel:paneFocused', pane:PANE_ID }, '*');
  }, true);
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
(function boot(){
  if (LAYOUT_N > 1 && !EMBED_MODE) return; // grid shell: no chart here, just the iframes
  initChart();
  initDrawingLayer();
  renderWatchlist();
  renderIndList();
  renderTfBar();
  setActiveTF(STATE.timeframe);
  document.getElementById('symbol-input').value=STATE.symbol;
  updateTfBarSymbol(STATE.symbol);

  const badge=document.getElementById('api-badge');
  fetch(`${BRIDGE_URL}/health`).then(r=>r.ok?r.json():Promise.reject()).then(()=>{
    badge.textContent='MT5 BRIDGE ✓';badge.classList.add('connected');
    loadChart(STATE.symbol,STATE.timeframe);
  }).catch(()=>{
    badge.textContent='BRIDGE OFF';badge.classList.remove('connected');
    showLoader('No conecta con el puente MT5 — corré bridge_server.py y abrí MT5 con el Service ZentinelBridge');
    setStatus('err','● sin puente');
  });
})();
</script>
