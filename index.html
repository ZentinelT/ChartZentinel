<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentinel Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary:   #0a0a0c;
    --bg-secondary: #111116;
    --bg-panel:     #13131a;
    --bg-hover:     #1a1a24;
    --bg-active:    #1e1e2a;
    --border:       #222230;
    --border-light: #2a2a3a;
    --gold:         #c9a84c;
    --gold-bright:  #f0c060;
    --gold-dim:     #7a6030;
    --gold-glow:    rgba(201,168,76,0.15);
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-dim:     #55556a;
    --green:        #26a69a;
    --red:          #ef5350;
    --green-dim:    rgba(38,166,154,0.15);
    --red-dim:      rgba(239,83,80,0.15);
    --font-ui:      'DM Sans', sans-serif;
    --font-mono:    'DM Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --sidebar-w:    220px;
    --toolbar-h:    44px;
    --topbar-h:     52px;
    --tf-bar-h:     36px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-h);
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0;
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .logo-sep { width: 1px; height: 24px; background: var(--border-light); margin: 0 4px; }

  #symbol-search-wrap { position: relative; display: flex; align-items: center; }
  #symbol-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    width: 130px;
    outline: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: border-color .2s, box-shadow .2s;
  }
  #symbol-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px var(--gold-glow); }

  #price-display { display: flex; align-items: baseline; gap: 8px; }
  #price-last { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text-primary); }
  #price-change { font-family: var(--font-mono); font-size: 12px; }
  #price-change.up { color: var(--green); }
  #price-change.dn { color: var(--red); }

  #ohlcv-bar { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  #ohlcv-bar span b { color: var(--text-dim); font-weight: 400; margin-right: 3px; }

  .topbar-spacer { flex: 1; }

  .topbar-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
  .topbar-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }
  .topbar-btn svg { width: 14px; height: 14px; }

  #api-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  #api-badge.connected { color: var(--green); border-color: rgba(38,166,154,.4); }
  #api-badge:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ─── TIMEFRAME BAR ───────────────────────────────────── */
  #tf-bar {
    height: var(--tf-bar-h);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px 0 268px;
    gap: 2px;
    flex-shrink: 0;
  }

  .tf-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .15s, color .15s;
  }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tf-sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; }

  /* ─── MAIN AREA ───────────────────────────────────────── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ─── TOOLBAR (left) ─────────────────────────────────── */
  #toolbar {
    width: 38px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
    z-index: 50;
  }

  .tool-btn {
    width: 30px; height: 30px;
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tool-btn svg { width: 15px; height: 15px; }
  .tool-sep { width: 20px; height: 1px; background: var(--border); margin: 4px 0; }

  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-active);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 999;
  }
  .tool-btn:hover::after { opacity: 1; }

  /* ─── SIDEBAR ─────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-add-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    font-size: 16px;
    transition: color .15s;
    padding: 0 2px;
  }
  .sidebar-add-btn:hover { color: var(--gold); }

  #watchlist { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }

  .wl-item {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    gap: 8px;
    position: relative;
  }
  .wl-item:hover { background: var(--bg-hover); }
  .wl-item.active { background: var(--bg-active); border-left: 2px solid var(--gold); }
  .wl-item.active .wl-sym { color: var(--gold); }

  .wl-sym { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-primary); letter-spacing: .5px; flex: 1; }
  .wl-price { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .wl-chg { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; min-width: 46px; text-align: right; }
  .wl-chg.up { color: var(--green); background: var(--green-dim); }
  .wl-chg.dn { color: var(--red); background: var(--red-dim); }

  .wl-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 13px; line-height: 1; transition: color .15s; padding: 0 2px; }
  .wl-item:hover .wl-remove { color: var(--text-dim); }
  .wl-item:hover .wl-remove:hover { color: var(--red); }

  .sidebar-indicators { border-top: 1px solid var(--border); }
  .sidebar-indicators .sidebar-header { border-bottom: none; }
  #ind-list { padding: 4px 0; max-height: 140px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
  .ind-item { padding: 5px 12px; font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ind-item span { flex: 1; }
  .ind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 12px; line-height: 1; transition: color .15s; }
  .ind-item:hover .ind-remove { color: var(--red); }

  /* ─── CHART AREA ──────────────────────────────────────── */
  #chart-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chart-container { flex: 1; position: relative; }

  #loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 10; transition: opacity .4s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .loader-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; animation: loaderAnim 1.5s ease-in-out infinite; }
  @keyframes loaderAnim { 0%{width:0%;margin-left:0} 50%{width:70%;margin-left:15%} 100%{width:0%;margin-left:100%} }
  .loader-msg { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

  #crosshair-info {
    position: absolute; top: 10px; left: 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
    pointer-events: none; line-height: 1.7; z-index: 5; display: none;
  }
  #crosshair-info span { color: var(--text-primary); }

  /* ─── STATUS BAR ──────────────────────────────────────── */
  #statusbar {
    height: 22px; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 20px;
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); flex-shrink: 0;
  }
  #statusbar .sb-item { display: flex; gap: 5px; }
  #statusbar .sb-item b { color: var(--text-secondary); font-weight: 400; }
  #status-conn { margin-left: auto; }
  #status-conn.ok { color: var(--green); }
  #status-conn.err { color: var(--red); }
  #status-conn.loading { color: var(--gold); }

  /* ─── MODALS ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(8px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-family: var(--font-display); font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-bottom: 16px; text-transform: uppercase; }
  .modal label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .5px; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); font-size: 12px;
    padding: 8px 12px; outline: none; margin-bottom: 14px; transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .btn-primary {
    background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold-bright);
    font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 7px 18px;
    border-radius: 5px; cursor: pointer; letter-spacing: .5px; transition: background .15s;
  }
  .btn-primary:hover { background: rgba(201,168,76,.3); }

  .btn-ghost {
    background: none; border: 1px solid var(--border-light); color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 12px; padding: 7px 14px; border-radius: 5px;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .ind-picker-list { max-height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; margin-bottom: 14px; }
  .ind-pick-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 5px; cursor: pointer; gap: 10px; transition: background .12s; }
  .ind-pick-row:hover { background: var(--bg-hover); }
  .ind-pick-row.selected { background: var(--gold-glow); }
  .ind-pick-name { font-size: 12px; color: var(--text-primary); flex: 1; }
  .ind-pick-desc { font-size: 10px; color: var(--text-dim); }
  .ind-pick-check { width: 14px; height: 14px; border: 1px solid var(--border-light); border-radius: 3px; background: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ind-pick-row.selected .ind-pick-check { background: var(--gold); border-color: var(--gold); color: #000; font-size: 10px; }

  #add-sym-form { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 6px; align-items: center; }
  #add-sym-form.open { display: flex; }
  #add-sym-inp { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; outline: none; text-transform: uppercase; letter-spacing: 1px; }
  #add-sym-inp:focus { border-color: var(--gold-dim); }
  #add-sym-ok { background: var(--gold-dim); border: none; border-radius: 4px; color: var(--gold-bright); font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer; }

  /* ══════════════════════════════════════════════════════
     DRAWING TOOLBAR (floating, contextual)
  ══════════════════════════════════════════════════════ */
  #draw-toolbar {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 6px 8px;
    display: none;
    align-items: center;
    gap: 4px;
    z-index: 300;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    user-select: none;
  }
  #draw-toolbar.visible { display: flex; }

  .dtb-sep { width: 1px; height: 20px; background: var(--border-light); margin: 0 2px; }

  .dtb-btn {
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .dtb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .dtb-btn.danger:hover { background: rgba(239,83,80,.15); color: var(--red); }
  .dtb-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .dtb-color-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dtb-color-swatch {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1px solid var(--border-light);
    cursor: pointer; overflow: hidden; position: relative;
  }
  .dtb-color-swatch input[type=color] {
    position: absolute; inset: -4px; width: 28px; height: 28px;
    opacity: 0; cursor: pointer;
  }

  .dtb-select {
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono);
    font-size: 11px; padding: 3px 6px; outline: none; cursor: pointer;
  }
  .dtb-select option { background: var(--bg-panel); }

  .dtb-btn.active { background: var(--gold-glow); color: var(--gold); }
  .dtb-label { font-size: 10px; color: var(--text-dim); padding: 0 4px; }

  .drawing-handle {
    fill: var(--gold);
    stroke: var(--bg-panel);
    stroke-width: 1.5;
    cursor: move;
    transition: r .1s;
  }
  .drawing-handle:hover { r: 7; }
  .selected-drawing { filter: drop-shadow(0 0 4px rgba(201,168,76,.7)); }
</style>
</head>
<body>

<!-- ══ TOP BAR ══════════════════════════════════════════ -->
<div id="topbar">
  <div class="logo">ZENTINEL</div>
  <div class="logo-sep"></div>

  <div id="symbol-search-wrap">
    <input id="symbol-input" type="text" value="NQ1!" placeholder="Symbol" autocomplete="off" title="Enter symbol and press Enter">
  </div>

  <div id="price-display">
    <span id="price-last">—</span>
    <span id="price-change" class="">—</span>
  </div>

  <div id="ohlcv-bar">
    <span><b>O</b><span id="ohlc-o">—</span></span>
    <span><b>H</b><span id="ohlc-h">—</span></span>
    <span><b>L</b><span id="ohlc-l">—</span></span>
    <span><b>C</b><span id="ohlc-c">—</span></span>
    <span><b>V</b><span id="ohlc-v">—</span></span>
  </div>

  <div class="topbar-spacer"></div>

  <button class="topbar-btn" id="btn-indicators" onclick="openIndicatorModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Indicators
  </button>

  <button class="topbar-btn" id="btn-settings" onclick="openApiModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>

  <div id="api-badge" onclick="openApiModal()">NO API KEY</div>
</div>

<!-- ══ TIMEFRAME BAR ═════════════════════════════════════ -->
<div id="tf-bar">
  <button class="tf-btn" data-tf="1min">1m</button>
  <button class="tf-btn" data-tf="3min">3m</button>
  <button class="tf-btn" data-tf="5min">5m</button>
  <button class="tf-btn" data-tf="15min">15m</button>
  <button class="tf-btn" data-tf="30min">30m</button>
  <div class="tf-sep"></div>
  <button class="tf-btn" data-tf="1h">1H</button>
  <button class="tf-btn" data-tf="2h">2H</button>
  <button class="tf-btn" data-tf="4h">4H</button>
  <div class="tf-sep"></div>

<script>
// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const STATE = {
  apiKey:     localStorage.getItem('td_apikey') || '',
  symbol:     localStorage.getItem('td_symbol') || 'QQQ',
  timeframe:  localStorage.getItem('td_tf')     || '1h',
  watchlist:  JSON.parse(localStorage.getItem('td_watchlist') || '["QQQ","SPY","IWM","GLD","USO","AAPL"]'),
  indicators: JSON.parse(localStorage.getItem('td_indicators') || '[]'),
  activeTool: 'cursor',
};

let chart, candleSeries, volumeSeries;
const overlays = {};

// ══════════════════════════════════════════════════════════
//  DRAWING SYSTEM
// ══════════════════════════════════════════════════════════
const drawings = [];
let selectedDrawingId = null;

const toolDefaults = {
  color: '#c9a84c',
  width: 1,
  style: 0,
  extLeft: false,
  extRight: false,
};

function genId() { return 'drw_' + Math.random().toString(36).slice(2,9); }

function lwStyle(s) {
  return s == 0 ? 0 : s == 1 ? 1 : 2;
}

function selectDrawing(id) {
  selectedDrawingId = id;
  const d = drawings.find(x => x.id === id);
  if (!d) { hideDrawToolbar(); return; }
  document.getElementById('dtb-color').value = d.color;
  document.getElementById('dtb-color-swatch').style.background = d.color;
  document.getElementById('dtb-width').value = d.width;
  document.getElementById('dtb-style').value = d.style;
  document.getElementById('dtb-ext-left').classList.toggle('active', !!d.extLeft);
  document.getElementById('dtb-ext-right').classList.toggle('active', !!d.extRight);
  document.getElementById('dtb-lock').classList.toggle('active', !!d.locked);
  showDrawToolbar();
  highlightSelectedSvg(id);
}

function deselectDrawing() {
  selectedDrawingId = null;
  hideDrawToolbar();
  clearSvgHighlights();
}

function showDrawToolbar() { document.getElementById('draw-toolbar').classList.add('visible'); }
function hideDrawToolbar() { document.getElementById('draw-toolbar').classList.remove('visible'); }

function onDtbColorChange(val) {
  document.getElementById('dtb-color-swatch').style.background = val;
  toolDefaults.color = val;
  applyStyleToSelected({ color: val });
}
function onDtbWidthChange(val) {
  toolDefaults.width = parseInt(val);
  applyStyleToSelected({ width: parseInt(val) });
}
function onDtbStyleChange(val) {
  toolDefaults.style = parseInt(val);
  applyStyleToSelected({ style: parseInt(val) });
}
function onDtbExtend(dir) {
  const d = getSelected(); if (!d) return;
  if (dir === 'left')  { d.extLeft  = !d.extLeft;  document.getElementById('dtb-ext-left').classList.toggle('active',  d.extLeft); }
  if (dir === 'right') { d.extRight = !d.extRight; document.getElementById('dtb-ext-right').classList.toggle('active', d.extRight); }
  redrawDrawing(d);
}
function onDtbLock() {
  const d = getSelected(); if (!d) return;
  d.locked = !d.locked;
  document.getElementById('dtb-lock').classList.toggle('active', d.locked);
}
function onDtbClone() {
  const d = getSelected(); if (!d) return;
  const clone = JSON.parse(JSON.stringify({ ...d, id: genId(), series:[], svgEls:[], label:null }));
  clone.p1.price += (d.p2?.price ?? d.p1.price) * 0.001;
  if (clone.p2) clone.p2.price += clone.p1.price * 0.001;
  drawings.push(clone);
  buildDrawingOnChart(clone);
  selectDrawing(clone.id);
}
function onDtbDelete() {
  const d = getSelected(); if (!d) return;
  removeDrawingById(d.id);
  deselectDrawing();
}

function getSelected() { return drawings.find(x => x.id === selectedDrawingId) || null; }

function applyStyleToSelected(patch) {
  const d = getSelected(); if (!d) return;
  Object.assign(d, patch);
  redrawDrawing(d);
}

function redrawDrawing(d) {
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.series = [];
  d.svgEls.forEach(el => el.remove());
  d.svgEls = [];
  buildDrawingOnChart(d);
  highlightSelectedSvg(d.id);
}

function removeDrawingById(id) {
  const idx = drawings.findIndex(x => x.id === id);
  if (idx === -1) return;
  const d = drawings[idx];
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.svgEls.forEach(el => el.remove());
  if (d.label) d.label.remove();
  drawings.splice(idx,1);
}

function clearDrawings() {
  [...drawings].forEach(d => removeDrawingById(d.id));
  deselectDrawing();
}

function buildDrawingOnChart(d) {
  const candles = window._lastCandles || [];
  if (!candles.length) return;

  const C  = d.color;
  const lw = d.width;
  const ls = lwStyle(d.style);

  const barInterval = candles.length > 1 ? (candles[candles.length-1].time - candles[candles.length-2].time) : 3600;
  const FUTURE_BARS = 50;

  const tFirst  = candles[0].time;
  const tLast   = candles[candles.length-1].time;
  const tFuture = tLast + barInterval * FUTURE_BARS;
  const tPast   = Math.max(0, tFirst - barInterval * FUTURE_BARS);

  function mkLine(pts, opts={}) {
    const s = chart.addLineSeries({
      color: opts.color || C,
      lineWidth: opts.width || lw,
      lineStyle: opts.style !== undefined ? opts.style : ls,
      priceLineVisible: false,
      lastValueVisible: opts.lastValue !== undefined ? opts.lastValue : true,
      crosshairMarkerVisible: false,
    });
    s.setData(pts);
    d.series.push(s);
    return s;
  }

  if (d.type === 'hline') {
    const t1 = d.extLeft  ? tPast  : tFirst;
    const t2 = d.extRight ? tFuture : tLast;
    mkLine([{time:t1, value:d.p1.price},{time:t2, value:d.p1.price}]);

  } else if (d.type === 'trendline') {
    const rawT1  = d.p1.time;
    const rawT2  = d.p2.time;
    const rawP1  = d.p1.price;
    const rawP2  = d.p2.price;
    const slope  = (rawT2 !== rawT1) ? (rawP2 - rawP1) / (rawT2 - rawT1) : 0;

    let t1 = rawT1, t2 = rawT2, p1 = rawP1, p2 = rawP2;

    if (d.extLeft)  { t1 = tPast;   p1 = rawP1 + slope * (tPast - rawT1);   }
    if (d.extRight) { t2 = tFuture; p2 = rawP2 + slope * (tFuture - rawT2); }

    mkLine([{time:t1,value:p1},{time:t2,value:p2}]);

  } else if (d.type === 'rect') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    const t1 = Math.min(d.p1.time, d.p2.time);
    const t2_raw = Math.max(d.p1.time, d.p2.time);
    const t2 = d.extRight ? tFuture : t2_raw;

    const mkR = (pts) => {
      const s = chart.addLineSeries({ color: C+'aa', lineWidth:lw, lineStyle:ls, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
      s.setData(pts); d.series.push(s); return s;
    };
    mkR([{time:t1,value:hi},{time:t2,value:hi}]);
    mkR([{time:t1,value:lo},{time:t2,value:lo}]);
    mkR([{time:t1,value:lo},{time:t1,value:hi}]);
    mkR([{time:t2,value:lo},{time:t2,value:hi}]);

  } else if (d.type === 'fib') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    const levels  = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
    const colors  = ['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
    const t1 = d.extLeft  ? tPast   : tFirst;
    const t2 = d.extRight ? tFuture : tLast;
    levels.forEach((lvl, i) => {
      const val = hi - (hi - lo) * lvl;
      mkLine([{time:t1,value:val},{time:t2,value:val}], { color: colors[i]+'cc', style: 1, lastValue: true });
    });
  }

  d.series.forEach(s => { s._drawingId = d.id; });
}

function highlightSelectedSvg(id) {
  clearSvgHighlights();
  requestAnimationFrame(() => {
    const d = drawings.find(x => x.id === id);
    if (!d || !window._drawingLayerSvg) return;
    const svg = window._drawingLayerSvg;
    const container = document.getElementById('chart-container');

    function priceToY(price) { return candleSeries.priceToCoordinate(price); }
    function timeToX(time)  { return chart.timeScale().timeToCoordinate(time); }

    function addHandle(x, y, dId) {
      if (x === null || y === null) return;
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5);
      c.classList.add('drawing-handle');
      c.dataset.drawingId = dId;
      svg.appendChild(c);
      d.svgEls.push(c);
    }

    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      const w = container.clientWidth;
      addHandle(w * 0.2, y, id);
      addHandle(w * 0.5, y, id);
      addHandle(w * 0.8, y, id);
    } else if (d.type === 'trendline') {
      addHandle(timeToX(d.p1.time), priceToY(d.p1.price), id);
      addHandle(timeToX(d.p2.time), priceToY(d.p2.price), id);
    } else if (d.type === 'rect') {
      const hi = Math.max(d.p1.price, d.p2.price);
      const lo = Math.min(d.p1.price, d.p2.price);
      const t1 = Math.min(d.p1.time, d.p2.time);
      const t2 = Math.max(d.p1.time, d.p2.time);
      addHandle(timeToX(t1), priceToY(hi), id);
      addHandle(timeToX(t2), priceToY(lo), id);
      addHandle(timeToX(t1), priceToY(lo), id);
      addHandle(timeToX(t2), priceToY(hi), id);
    } else if (d.type === 'fib') {
      const hi = Math.max(d.p1.price, d.p2.price);
      const lo = Math.min(d.p1.price, d.p2.price);
      addHandle(timeToX(d.p1.time), priceToY(hi), id);
      addHandle(timeToX(d.p2.time), priceToY(lo), id);
    }
  });
}

function clearSvgHighlights() {
  if (!window._drawingLayerSvg) return;
  window._drawingLayerSvg.querySelectorAll('.drawing-handle').forEach(el => el.remove());
}

// ══════════════════════════════════════════════════════════
//  CHART INIT
// ══════════════════════════════════════════════════════════
function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: { background:{ color:'#0a0a0c' }, textColor:'#8888a8', fontFamily:"'DM Mono', monospace", fontSize:11 },
    grid:   { vertLines:{color:'#18182a',style:1}, horzLines:{color:'#18182a',style:1} },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color:'#c9a84c55', labelBackgroundColor:'#1e1e2a' },
      horzLine: { color:'#c9a84c55', labelBackgroundColor:'#1e1e2a' },
    },
    rightPriceScale: { borderColor:'#222230', scaleMargins:{top:0.08,bottom:0.18} },
    timeScale: { borderColor:'#222230', timeVisible:true, secondsVisible:false, rightOffset:8, barSpacing:10 },
    watermark: { visible:true, fontSize:52, horzAlign:'center', vertAlign:'center', color:'rgba(201,168,76,0.03)', text:'ZENTINEL' },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#777777',
    borderUpColor:'#8a8a8a', borderDownColor:'#8a8a8a',
    wickUpColor:'#8a8a8a', wickDownColor:'#8a8a8a',
  });

  volumeSeries = chart.addHistogramSeries({
    color:'#c9a84c22', priceFormat:{type:'volume'}, priceScaleId:'vol',
  });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82,bottom:0} });

  chart.subscribeCrosshairMove(param => {
    const info = document.getElementById('crosshair-info');
    if (!param.time || !param.seriesData) { info.style.display='none'; return; }
    const d = param.seriesData.get(candleSeries);
    if (!d) { info.style.display='none'; return; }
    info.style.display='block';
    info.innerHTML = `O <span>${fmt(d.open)}</span>  H <span>${fmt(d.high)}</span>  L <span>${fmt(d.low)}</span>  C <span>${fmt(d.close)}</span>`;
    updateTopbarOHLCV(d);
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    clearSvgHighlights();
    if (selectedDrawingId) highlightSelectedSvg(selectedDrawingId);
  }).observe(container);
}

// ══════════════════════════════════════════════════════════
//  DRAWING LAYER
// ══════════════════════════════════════════════════════════
function initDrawingLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._drawingLayerSvg = svg;

  let previewEl = null;
  let drawStart = null;

  function syncSvgSize() {
    svg.setAttribute('width',  container.clientWidth);
    svg.setAttribute('height', container.clientHeight);
  }
  new ResizeObserver(syncSvgSize).observe(container);
  syncSvgSize();

  function clearPreview() { if (previewEl) { previewEl.remove(); previewEl=null; } }

  function getCoords(e) {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const price = candleSeries.coordinateToPrice(y);
    let time = chart.timeScale().coordinateToTime(x);
    const candles = window._lastCandles || [];
    if (time === null && candles.length) {
      const bi = candles.length>1 ? candles[candles.length-1].time - candles[candles.length-2].time : 3600;
      const lastX = chart.timeScale().timeToCoordinate(candles[candles.length-1].time);
      const firstX = chart.timeScale().timeToCoordinate(candles[0].time);
      if (lastX !== null && x > lastX) {
        const barsOut = Math.round((x - lastX) / (chart.timeScale().options().barSpacing || 10));
        time = candles[candles.length-1].time + bi * Math.max(1, barsOut);
      } else {
        time = (x <= (firstX||0)) ? candles[0].time : candles[candles.length-1].time;
      }
    }
    return { x, y, price, time };
  }

  function updateSvgCapture() {
    const tool = STATE.activeTool;
    const isDrawTool = !['cursor','cross'].includes(tool);
    svg.style.pointerEvents = isDrawTool ? 'all' : 'none';
    svg.style.cursor = isDrawTool ? (tool==='text'?'text':'crosshair') : '';
  }

  const _origSetTool = window.setTool;
  window.setTool = function(btn, name) {
    _origSetTool(btn, name);
    updateSvgCapture();
  };

  container.addEventListener('click', e => {
    if (STATE.activeTool !== 'cursor') return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let hit = null;
    for (const d of drawings) {
      if (d.locked) continue;
      if (isClickOnDrawing(d, mx, my)) { hit = d.id; break; }
    }
    if (hit) { selectDrawing(hit); }
    else { deselectDrawing(); }
  });

  function isClickOnDrawing(d, mx, my) {
    const THRESH = 8;
    function priceToY(p) { return candleSeries.priceToCoordinate(p); }
    function timeToX(t)  { return chart.timeScale().timeToCoordinate(t); }
    function distToSegment(x1,y1,x2,y2,px,py) {
      const dx=x2-x1, dy=y2-y1;
      const len2 = dx*dx+dy*dy;
      if (len2===0) return Math.hypot(px-x1,py-y1);
      let t = ((px-x1)*dx+(py-y1)*dy)/len2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
    }

    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      if (y===null) return false;
      return Math.abs(my-y) < THRESH;
    }
    if (d.type === 'trendline') {
      const x1=timeToX(d.p1.time), y1=priceToY(d.p1.price);
      const x2=timeToX(d.p2.time), y2=priceToY(d.p2.price);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return distToSegment(x1,y1,x2,y2,mx,my) < THRESH;
    }
    if (d.type === 'rect' || d.type === 'fib') {
      const hi=Math.max(d.p1.price,d.p2.price), lo=Math.min(d.p1.price,d.p2.price);
      const t1=Math.min(d.p1.time,d.p2.time),   t2=Math.max(d.p1.time,d.p2.time);
      const x1=timeToX(t1), x2=timeToX(t2);
      const y1=priceToY(hi), y2=priceToY(lo);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return (
        distToSegment(x1,y1,x2,y1,mx,my)<THRESH||
        distToSegment(x1,y2,x2,y2,mx,my)<THRESH||
        distToSegment(x1,y1,x1,y2,mx,my)<THRESH||
        distToSegment(x2,y1,x2,y2,mx,my)<THRESH
      );
    }
    return false;
  }

  svg.addEventListener('mousedown', e => {
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x, y, price, time } = getCoords(e);
    if (price === null || time === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;

    if (tool === 'text') {
      const text = prompt('Label:');
      if (!text) return;
      const label = document.createElement('div');
      label.textContent = text;
      label.style.cssText = `position:absolute;left:${x+6}px;top:${y-10}px;color:${toolDefaults.color};font-family:var(--font-mono);font-size:${11+toolDefaults.width}px;pointer-events:none;z-index:5;white-space:nowrap;background:rgba(10,10,12,.7);padding:1px 4px;border-radius:3px;`;
      container.appendChild(label);
      const d = { id:genId(), type:'text', series:[], svgEls:[], label, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price,time}, p2:{price,time} };
      drawings.push(d);
      selectDrawing(d.id);
      return;
    }

    drawStart = { x, y, price, time };
  });

  svg.addEventListener('mousemove', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x: x2, y: y2 } = getCoords(e);
    clearPreview();

    const GOLDA = toolDefaults.color + '88';

    if (tool === 'hline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', 0); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', container.clientWidth); line.setAttribute('y2', drawStart.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'trendline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'rect') {
      const rx=Math.min(drawStart.x,x2), ry=Math.min(drawStart.y,y2);
      const rw=Math.abs(x2-drawStart.x), rh=Math.abs(y2-drawStart.y);
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',rx); rect.setAttribute('y',ry); rect.setAttribute('width',rw); rect.setAttribute('height',rh);
      rect.setAttribute('stroke', GOLDA); rect.setAttribute('stroke-width', toolDefaults.width);
      rect.setAttribute('stroke-dasharray','4,3'); rect.setAttribute('fill','rgba(201,168,76,0.06)');
      svg.appendChild(rect); previewEl = rect;
    } else if (tool === 'fib') {
      const ry=Math.min(drawStart.y,y2), rh=Math.abs(y2-drawStart.y);
      const group = document.createElementNS('http://www.w3.org/2000/svg','g');
      const fibColors=['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
      [0,0.236,0.382,0.5,0.618,0.786,1].forEach((lvl,i) => {
        const ly = ry + rh * lvl;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',0); line.setAttribute('y1',ly); line.setAttribute('x2',container.clientWidth); line.setAttribute('y2',ly);
        line.setAttribute('stroke',fibColors[i]+'bb'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','3,3');
        group.appendChild(line);
      });
      svg.appendChild(group); previewEl = group;
    }
  });

  svg.addEventListener('mouseup', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    clearPreview();

    const { price: price2, time: time2 } = getCoords(e);
    if (price2===null||time2===null) { drawStart=null; return; }
    const candles = window._lastCandles||[];
    if (!candles.length) { drawStart=null; return; }

    let d = null;

    if (tool === 'hline') {
      d = { id:genId(), type:'hline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawStart.price,time:drawStart.time} };
    } else if (tool === 'trendline') {
      const t1 = Math.min(drawStart.time, time2);
      const t2 = Math.max(drawStart.time, time2);
      if (t1 === t2) { drawStart=null; return; }
      const p1 = drawStart.time <= time2 ? drawStart.price : price2;
      const p2 = drawStart.time <= time2 ? price2 : drawStart.price;
      d = { id:genId(), type:'trendline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:p1,time:t1}, p2:{price:p2,time:t2} };
    } else if (tool === 'rect') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      const t1=Math.min(drawStart.time,time2),   t2=Math.max(drawStart.time,time2);
      if (t1===t2||Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'rect', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:t1}, p2:{price:price2,time:t2} };
    } else if (tool === 'fib') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      if (Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'fib', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:hi,time:drawStart.time}, p2:{price:lo,time:time2} };
    }

    if (d) {
      drawings.push(d);
      buildDrawingOnChart(d);
      selectDrawing(d.id);
    }

    drawStart = null;
  });

  window.addEventListener('mouseup', () => {
    if (drawStart) { clearPreview(); drawStart=null; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { deselectDrawing(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawingId) {
      if (document.activeElement.tagName === 'INPUT') return;
      onDtbDelete();
    }
  });
}

  { name:'EMA 9',   desc:'Exponential MA 9',    color:'#f0c060', calc:d=>ema(d,9)   },
  { name:'EMA 20',  desc:'Exponential MA 20',   color:'#60c0f0', calc:d=>ema(d,20)  },
  { name:'EMA 50',  desc:'Exponential MA 50',   color:'#a060f0', calc:d=>ema(d,50)  },

  { name:'SMA 20',  desc:'Simple MA 20',        color:'#60f0a0', calc:d=>sma(d,20)  },
  { name:'SMA 50',  desc:'Simple MA 50',        color:'#f0a060', calc:d=>sma(d,50)  },
  { name:'VWAP',    desc:'Volume Weighted Avg', color:'#c9a84c', calc:d=>vwap(d)    },
];

  STATE.indicators.forEach(name=>{ if(!selected.includes(name)&&overlays[name]){chart.removeSeries(overlays[name]);delete overlays[name];} });

function addIndicatorSeries(name) {
  if(overlays[name])return;
  const def=INDICATOR_DEFS.find(d=>d.name===name); if(!def)return;
  const rawData=window._lastCandles||[]; if(!rawData.length)return;
  const calcData=def.calc(rawData);
  const series=chart.addLineSeries({color:def.color,lineWidth:1,priceLineVisible:false,lastValueVisible:true});
  series.setData(calcData); overlays[name]=series;
}

function renderIndList() {
  const el=document.getElementById('ind-list'); el.innerHTML='';
  if(!STATE.indicators.length){el.innerHTML='<div class="ind-item" style="color:var(--text-dim);font-size:10px">None active</div>';return;}

    const def=INDICATOR_DEFS.find(d=>d.name===name);
    const item=document.createElement('div'); item.className='ind-item';
    item.innerHTML=`<div class="ind-dot" style="background:${def?.color||'#888'}"></div><span>${name}</span><button class="ind-remove" onclick="removeIndicator('${name}')">×</button>`;
    el.appendChild(item);
  });
}

function removeIndicator(name){if(overlays[name]){chart.removeSeries(overlays[name]);delete overlays[name];}STATE.indicators=STATE.indicators.filter(n=>n!==name);saveState();renderIndList();}

// ══════════════════════════════════════════════════════════
//  INDICATOR MATH
// ══════════════════════════════════════════════════════════
function ema(data,period){const k=2/(period+1);let prev=null;return data.map(d=>{if(prev===null){prev=d.close;return{time:d.time,value:d.close};}const val=d.close*k+prev*(1-k);prev=val;return{time:d.time,value:val};});}
function sma(data,period){return data.map((d,i)=>{if(i<period-1)return{time:d.time,value:null};const sum=data.slice(i-period+1,i+1).reduce((a,v)=>a+v.close,0);return{time:d.time,value:sum/period};}).filter(d=>d.value!==null);}
function vwap(data){let cumPV=0,cumV=0;return data.map(d=>{const tp=(d.high+d.low+d.close)/3;cumPV+=tp*(d.volume||1);cumV+=(d.volume||1);return{time:d.time,value:cumPV/cumV};});}

// ══════════════════════════════════════════════════════════
//  loadChart
// ══════════════════════════════════════════════════════════
async function loadChart(symbol, timeframe) {
  if(!STATE.apiKey){showLoader('No API key — open Settings ↑');setStatus('err','● no key');return;}
  setLoaderMsg(`Loading ${symbol} ${timeframe}…`);showOverlay(true);setStatus('loading','● loading…');

  const url=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&outputsize=500&order=ASC&apikey=${STATE.apiKey}`;

  try {
    const res=await fetch(url);
    const json=await res.json();
    if(json.status==='error'||!json.values)throw new Error(json.message||'API error');

    const candles=json.values.map(v=>({
      time:  Math.floor(new Date(v.datetime).getTime()/1000),
      open:  parseFloat(v.open),
      high:  parseFloat(v.high),
      low:   parseFloat(v.low),
      close: parseFloat(v.close),
      volume:parseFloat(v.volume||0),
    }));

    window._lastCandles=candles;

    const vols=candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,.25)':'rgba(239,83,80,.2)'}));
    candleSeries.setData(candles);
    volumeSeries.setData(vols);
    chart.timeScale().fitContent();
    chart.timeScale().applyOptions({ rightOffset: 50 });

    Object.keys(overlays).forEach(name=>{chart.removeSeries(overlays[name]);delete overlays[name];});
    STATE.indicators.forEach(name=>addIndicatorSeries(name));

    drawings.forEach(d => {
      d.series.forEach(s=>{try{chart.removeSeries(s);}catch(e){}});
      d.series=[];
      buildDrawingOnChart(d);
    });
    if(selectedDrawingId)highlightSelectedSvg(selectedDrawingId);

    const last=candles[candles.length-1];
    const prev=candles[candles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,candles.length,candles[0],last);
    updateWLPrice(symbol,last.close);

    document.getElementById('symbol-input').value=symbol;
    document.title=`${symbol} · Zentinel`;
    setStatus('ok','● live');
    showOverlay(false);

  } catch(err) {
    setLoaderMsg('⚠ '+err.message);
    setStatus('err','● error');
  }
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
(function boot(){
  initChart();
  initDrawingLayer();
  renderWatchlist();
  renderIndList();
  setActiveTF(STATE.timeframe);
  document.getElementById('symbol-input').value=STATE.symbol;

  if(STATE.apiKey){
    document.getElementById('api-badge').textContent='API ✓';
    document.getElementById('api-badge').classList.add('connected');
    loadChart(STATE.symbol,STATE.timeframe);
  } else {
    showLoader('Enter your Twelve Data API key in Settings');
    setStatus('err','● no key');
  }
})();
</script>
