// ══════════════════════════════════════════════════════════
//  loadChart  (vía mt5_bridge/bridge_server.py -> MT5/Axi)
// ══════════════════════════════════════════════════════════
const BRIDGE_URL = 'http://localhost:8787';

// Redibuja toda la serie (velas reales + puntos fantasma a futuro para el
// eje de horas). series.update() no sirve acá: exige que cada actualización
// vaya hacia adelante en el tiempo, y los fantasmas quedan después de la
// vela en formación, así que "actualizar in place" la vela actual rompía
// silenciosamente. setData() no tiene ese problema y no mueve el zoom.
function renderSeries(timeframe){
  const candles=window._lastCandles;
  const last=candles[candles.length-1];
  candleSeries.setData(candles.concat(futureWhitespace(last.time, timeframe, 15)));
  volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,.25)':'rgba(239,83,80,.2)'})));
  refreshOverlays(candles);
  renderWatchtower();
  renderSniper();
  renderSweeps();
}

// Recalcula EMA/SMA/VWAP sobre el set completo de velas cargadas — si no,
// al pedir más historial hacia atrás (loadMoreHistory) la línea se queda
// corta en el tramo inicial de 500 barras y "desaparece" más allá de eso.
function refreshOverlays(candles){
  Object.keys(overlays).forEach(name=>{
    const def=INDICATOR_DEFS.find(d=>d.name===name);
    if(!def||!def.calc)return;
    overlays[name].setData(def.calc(candles));
  });
}

// Scroll infinito hacia atrás: cuando te acercás al borde izquierdo de lo
// ya cargado, pide más velas viejas al puente (que a su vez le pide a MT5
// el tramo anterior) y las pega adelante sin mover la vista de un salto.
let _loadingMoreHistory = false;
async function loadMoreHistory(){
  if (_loadingMoreHistory || window._replay) return;
  const candles = window._lastCandles;
  if (!candles || !candles.length || candles.length > 8000) return;
  _loadingMoreHistory = true;
  try {
    const oldest = candles[0].time;
    const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(STATE.symbol)}&interval=${STATE.timeframe}&bars=300&before=${oldest}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.error || !Array.isArray(json.bars) || json.bars.length===0) return;
    const older = json.bars.filter(b => b.time < oldest);
    if (older.length===0) return;

    const addedCount = older.length;
    window._lastCandles = older.concat(candles);
    renderSeries(STATE.timeframe);

    // mismo bar en la misma posición de pantalla, aunque el array creció a la izquierda
    const range = chart.timeScale().getVisibleLogicalRange();
    if (range) chart.timeScale().setVisibleLogicalRange({ from: range.from+addedCount, to: range.to+addedCount });
  } catch(e) {
    // sin red/MT5 un instante: se reintenta solo la próxima vez que se scrollee
  } finally {
    _loadingMoreHistory = false;
  }
}

// El batch inicial de 500 velas, en timeframes chicos (M5 y similares), no
// llega a cubrir una semana completa hacia atrás — así que al abrir el
// chart, PWH/PWL/PWM (que necesitan ver la semana ANTERIOR completa) no
// tienen con qué calcularse y quedan sin dibujar hasta que el usuario hace
// zoom out y loadMoreHistory trae más historial "por las dudas". Si el
// toggle de niveles semanales está prendido, completamos ese historial en
// segundo plano, en vez de esperar a que el usuario scrollee para notarlo.
//
// Un solo pedido grande, NO una cadena de pedidos de a 300: el puente habla
// con MT5 por archivo (escribe un pedido, sondea cada 100ms la respuesta, y
// el lado MT5 reintenta hasta 15 veces con su propio delay si todavía no
// tiene esas velas descargadas) — cada ida y vuelta ya es lenta de por sí,
// y encadenar varias en secuencia (como hacía antes, pidiendo de a 300) se
// sentía lento Y a los tirones, con el chart re-renderizando en varios
// pasos visibles. Acá se calcula de una sola vez cuánto falta y se pide
// todo junto — un solo re-render, prolijo, al final.
//
// Tampoco reusa loadMoreHistory(): esa función además corrige la posición
// de scroll asumiendo que la llamó un scroll manual del usuario cerca del
// borde izquierdo. Disparada sola, apenas se abre el chart, ese ajuste se
// aplica sobre una vista que en realidad nunca se movió.
async function ensureWeeklyHistoryForWatchtower(){
  if (!STATE.watchtower.enabled || !STATE.watchtower.pwLevels) return;
  if (!window._lastCandles || !window._lastCandles.length) return;
  const step = TF_SECONDS[STATE.timeframe];
  let fetchedMore = false;

  // La estimación de cuántas velas hacen falta (extraBars) puede quedarse
  // corta en la práctica — fines de semana, feriados, o historial que MT5
  // todavía no tenía descargado y devolvió incompleto pese al margen del
  // 50%. Un solo pedido que se conforma con lo que llegó reproduce el bug
  // original (nivel calculado con semana incompleta, se "acomoda" recién
  // cuando el usuario hace zoom). Por eso se vuelve a verificar después de
  // cada pedido y, si todavía falta, se pide de nuevo — acotado a pocas
  // vueltas, no las ~20 de a 300 de antes, porque la estimación ya debería
  // acertarle casi siempre de una.
  for (let guard=0; guard<5; guard++){
    const candles = window._lastCandles;
    if (candles.length>8000) break;
    // No alcanza con que haya UNA vela de la semana anterior metida en el
    // batch (eso daba un high/low de PW calculado con una semana incompleta,
    // que después "saltaba" a la posición correcta apenas el zoom traía el
    // resto) — hace falta que el historial cargado llegue hasta el ARRANQUE
    // real de esa semana anterior.
    const prevWeekStart = wtWeekKey(candles[candles.length-1].time) - 7*86400;
    if (candles[0].time <= prevWeekStart) break; // ya está completo

    const missingSeconds = candles[0].time - prevWeekStart;
    // +50% de margen por los huecos de mercado cerrado (fines de semana).
    const extraBars = step ? Math.min(6000, Math.ceil(missingSeconds/step*1.5) + 50) : 300;

    try {
      const oldest = candles[0].time;
      const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(STATE.symbol)}&interval=${STATE.timeframe}&bars=${extraBars}&before=${oldest}`;
      const res = await fetch(url);
      const json = await res.json();
      if (json.error || !Array.isArray(json.bars) || json.bars.length===0) break;
      const older = json.bars.filter(b => b.time < oldest);
      if (older.length===0) break; // el bridge no tiene más historial — no insistir
      window._lastCandles = older.concat(candles);
      fetchedMore = true;
    } catch(e) { break; }
  }

  if (fetchedMore) {
    renderSeries(STATE.timeframe);
    chart.timeScale().scrollToRealTime();
    const updated = window._lastCandles;
    updateStatusBar(STATE.symbol, STATE.timeframe, updated.length, updated[0], updated[updated.length-1]);
  }
}

// Cierre de vela: pega solo la(s) vela(s) nueva(s) sin recargar todo el chart
// (sin overlay, sin refit de zoom — eso es lo que se "notaba").
async function appendNewBar(symbol, timeframe){
  // Igual que refreshFormingCandle: no lo pisamos en medio de un arrastre.
  // Acá sí hay que esperar (no saltear sin más) — el countdown ya se paró
  // para llamar a esto, así que si nos vamos sin hacer nada el reloj queda
  // trabado para siempre. Esperamos a que termine el arrastre y recién ahí
  // seguimos.
  while (window._dragSession) { await new Promise(r=>setTimeout(r,200)); }
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=3`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)throw new Error(json.error||'sin datos');

    const prevLastTime=window._lastCandles[window._lastCandles.length-1].time;
    json.bars.forEach(bar=>{
      if(bar.time<prevLastTime)return; // vela vieja, ya la tenemos
      if(bar.time===window._lastCandles[window._lastCandles.length-1].time){
        window._lastCandles[window._lastCandles.length-1]=bar;
      } else {
        window._lastCandles.push(bar);
      }
    });
    renderSeries(timeframe);
    if (window._syncOverlayPositions) window._syncOverlayPositions(); // ver refreshFormingCandle — mismo motivo

    const last=window._lastCandles[window._lastCandles.length-1];
    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,window._lastCandles.length,window._lastCandles[0],last);
    updateWLPrice(symbol,last.close);

    startCountdown(timeframe, last.time, json.serverTime);
  } catch(err){
    // si falla, reintentamos en el próximo tick del countdown (recarga completa como respaldo)
    loadChart(symbol, timeframe);
  }
}

function refreshChart(){
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  loadChart(STATE.symbol, STATE.timeframe).finally(()=>btn.classList.remove('spinning'));
}

async function loadChart(symbol, timeframe, _isUppercaseRetry) {
  // Cambiar de símbolo/TF o refrescar en medio de un replay no tiene forma
  // sensata de "seguir" el replay (los datos de abajo cambian por completo),
  // así que directamente lo cerramos acá — cualquier camino que termine
  // llamando a loadChart (buscador, watchlist, TF bar, Refresh, exitReplay)
  // deja todo limpio sin tener que acordarse de hacerlo en cada uno.
  if (window._replay) {
    const wasMaster = window._replay.isMaster;
    replayPause();
    window._replay = null;
    document.getElementById('replay-bar')?.classList.add('hidden');
    document.getElementById('btn-replay')?.classList.remove('active');
    const badge = document.getElementById('price-countdown-badge');
    if (badge) badge.style.display = '';
    if (wasMaster && EMBED_MODE && PANE_ID) {
      window.parent.postMessage({ type:'zentinel:replayExited', pane:PANE_ID, symbol }, '*');
    }
  }
  _exitFollowReplay();
  setLoaderMsg(`Loading ${symbol} ${timeframe}…`);showOverlay(true);setStatus('loading','● loading…');

  // Siempre 500 acá — es lo que ya suele tener MT5 cacheado, responde rápido
  // (chart visible al toque). El historial extra para los niveles semanales
  // de Watchtower (que suele requerir que MT5 vaya a buscar velas que
  // todavía no tiene, mucho más lento) se completa aparte, en segundo
  // plano, después de este primer pintado — ver ensureWeeklyHistoryForWatchtower.
  const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=500`;

  try {
    const res=await fetch(url);
    const json=await res.json();
    if(json.error)throw new Error(json.error);
    const candles=json.bars;
    if(!Array.isArray(candles)||candles.length===0)throw new Error('sin datos para '+symbol);

    window._lastCandles=candles;
    // Números enteros en el eje de precio (sin decimales) para símbolos
    // tipo índice (NAS100, US30, US500...) donde el centavo no aporta nada
    // y solo ensucia la lectura — pero sin forzarlo en pares con precio
    // chico (forex), donde si hace falta el decimal. Se decide por el
    // precio real de la última vela, no por el símbolo (no hay forma
    // confiable de adivinar el instrumento por el nombre solo).
    const _lastClose = candles[candles.length-1].close;
    candleSeries.applyOptions({ priceFormat: _lastClose>=1000
      ? { type:'price', precision:0, minMove:1 }
      : { type:'price', precision:2, minMove:0.01 } });
    // Resincroniza el tamaño del chart con el contenedor real antes de
    // acomodar la vista — si el ResizeObserver no llegó a correr a tiempo
    // (p.ej. justo después de un refresh/reload), el chart queda con una
    // resolución interna vieja y las velas se ven apretadas en una esquina.
    const _cc = document.getElementById('chart-container');
    chart.applyOptions({ width:_cc.clientWidth, height:_cc.clientHeight });
    // Arrastrar el eje de precio (zoom vertical manual) apaga el autoScale
    // de ese priceScale — comportamiento propio de la librería, no algo que
    // seteemos nosotros. Como refreshChart() reutiliza el mismo chart (no
    // lo recrea), esa desactivación quedaba pegada para siempre: sin esto
    // un refresh después de tocar el zoom vertical dejaba el rango de
    // precio viejo en vez de reacomodarse a los datos nuevos.
    chart.priceScale('right').applyOptions({ autoScale: true });
    renderSeries(timeframe);
    chart.timeScale().applyOptions({ rightOffset: 15, barSpacing: 8 });
    chart.timeScale().scrollToRealTime();
    ensureWeeklyHistoryForWatchtower(); // no se espera: completa el historial semanal en segundo plano

    Object.keys(overlays).forEach(name=>{chart.removeSeries(overlays[name]);delete overlays[name];});
    STATE.indicators.forEach(name=>addIndicatorSeries(name));

    drawings.forEach(d => {
      d.series.forEach(s=>{try{chart.removeSeries(s);}catch(e){}});
      d.series=[];
      buildDrawingOnChart(d);
    });
    if(selectedDrawingId)highlightSelectedSvg(selectedDrawingId);

    const last=candles[candles.length-1];
    const prev=candles[candles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,candles.length,candles[0],last);
    updateWLPrice(symbol,last.close);

    document.getElementById('symbol-input').value=symbol;
    updateTfBarSymbol(symbol);
    document.title=`${symbol} · Zentinel`;
    setStatus('ok','● live');
    showOverlay(false);

    startCountdown(timeframe, last.time, json.serverTime);

  } catch(err) {
    // El input de símbolo se muestra todo en mayúsculas por CSS
    // (text-transform), pero eso es solo cosmético — lo que viaja al
    // puente es lo que el usuario tipeó literalmente, y los nombres de
    // símbolo en MT5 distinguen mayúsculas de minúsculas ("US30" existe,
    // "us30" no). No podemos simplemente forzar mayúsculas en todos los
    // casos (hay símbolos reales con sufijo en minúscula, como
    // "NAS100.fs" — forzar ahí rompería el símbolo que sí funciona). Por
    // eso: si falló, reintentamos UNA sola vez con el símbolo tal cual lo
    // tipeó pero en mayúsculas, antes de darnos por vencidos — cubre el
    // caso común (escribir en minúscula) sin arriesgar nada si el símbolo
    // ya estaba bien escrito.
    //
    // OJO: esto solo tiene sentido si el error es realmente "símbolo no
    // encontrado" — cualquier OTRO error (el puente ocupado con otro
    // panel, timeout esperando a MT5, etc.) no tiene nada que ver con
    // mayúsculas/minúsculas. Reintentar igual convertía un error
    // TRANSITORIO (que se resolvía solo con un refresh) en uno PERMANENTE
    // y confuso: el símbolo en mayúsculas de verdad no existe, así que el
    // reintento fallaba también y mostraba "symbol not found: NAS100.FS"
    // para un símbolo que en realidad sí estaba bien escrito y ya andaba
    // en otro panel — eso es lo que pasaba al abrir 2 gráficos a la vez.
    const isUnknownSymbol = /symbol not found/i.test(err.message || '');
    const upper = symbol.toUpperCase();
    if (isUnknownSymbol && !_isUppercaseRetry && upper !== symbol) {
      STATE.symbol = upper;
      loadChart(upper, timeframe, true);
      return;
    }
    setLoaderMsg('⚠ '+err.message);
    setStatus('err','● error');
  }
}

// ══════════════════════════════════════════════════════════
//  COUNTDOWN — tiempo restante hasta el cierre de la vela actual
//  (usa json.serverTime, el reloj de MT5/broker, no el del navegador)
// ══════════════════════════════════════════════════════════
const TF_SECONDS = {
  '1min':60,'2min':120,'3min':180,'4min':240,'5min':300,'6min':360,'10min':600,'12min':720,'15min':900,'20min':1200,'30min':1800,
  '1h':3600,'2h':7200,'3h':10800,'4h':14400,'6h':21600,'8h':28800,'12h':43200,
  // 1day: NO es medianoche UTC — las velas D1 de este bróker abren siempre
  // a las 17:00 NY (verificado contra datos reales: 6 velas D1 seguidas,
  // todas con open en :17:00:00Z), así que el próximo cierre es, como en
  // cualquier TF de intervalo fijo, simplemente +24h desde la apertura.
  // La cuenta regresiva usaba antes setUTCHours(24,0,0,0) (próxima
  // medianoche UTC), que para una vela abierta a las 17:00 caía ANTES de
  // que la vela realmente cerrara — contador mostrando un resto ya
  // negativo (pisado a 0) la mayor parte del día.
  '1day': 86400,
};
let _countdownTimer=null;

// Puntos "fantasma" (sin OHLC) después de la última vela, solo para que el
// eje de tiempo sepa qué hora va en el margen vacío de la derecha y la dibuje.
function futureWhitespace(lastTime, timeframe, count){
  const pts=[]; let t=lastTime;
  for(let i=0;i<count;i++){
    const nt=nextCloseTime(timeframe, t);
    if(nt===null)break;
    pts.push({time:nt});
    t=nt;
  }
  return pts;
}

function nextCloseTime(timeframe, lastBarTime){
  if(TF_SECONDS[timeframe]) return lastBarTime + TF_SECONDS[timeframe];
  const d=new Date(lastBarTime*1000);
  if(timeframe==='1week'){
    d.setUTCHours(0,0,0,0);
    const addDays=((8-d.getUTCDay())%7)||7;
    d.setUTCDate(d.getUTCDate()+addDays);
    return Math.floor(d.getTime()/1000);
  }
  if(timeframe==='1month'){
    const nd=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1, 0,0,0));
    return Math.floor(nd.getTime()/1000);
  }
  return null;
}

function positionCountdownBadge(lastClose, lastOpen){
  const badge=document.getElementById('price-countdown-badge');
  if(!candleSeries||lastClose==null){ badge.style.display='none'; return; }
  const y=candleSeries.priceToCoordinate(lastClose);
  if(y==null){ badge.style.display='none'; return; }
  const container=document.getElementById('chart-container');
  const priceScaleW=chart.priceScale('right').width();
  // Medido pixel a pixel contra el tag de precio nativo: no ocupa todo el
  // ancho de la escala de precio, deja ~6px de margen del lado derecho, y
  // mide 17px de alto centrado en la línea del precio.
  const RIGHT_GAP=6, TAG_H=17;
  badge.style.display='flex';
  badge.style.left=(container.clientWidth-priceScaleW)+'px';
  badge.style.width=(priceScaleW-RIGHT_GAP)+'px';
  badge.style.height=TAG_H+'px';
  // El tag nativo no está centrado en "y": mide pixel a pixel de y-5 a
  // y+11 (17px) — su borde inferior real es y+11, no y+altura/2.
  badge.style.top=(y+11)+'px';
  badge.classList.toggle('up', lastClose>=lastOpen);
  badge.classList.toggle('dn', lastClose<lastOpen);
}

let _formingFetchInFlight=false;
async function refreshFormingCandle(symbol, timeframe){
  if(_formingFetchInFlight || !window._lastCandles) return;
  // Si el usuario está en medio de arrastrar un dibujo (mover el cuerpo o
  // estirar una manija), no lo interrumpimos con un refresh de precio acá
  // — eso de abajo reconstruye TODO el chart (velas, volumen, overlays,
  // Watchtower, Sniper) cada vez que entra, y como el precio real se mueve
  // casi todos los segundos, es muy probable que ese refresh caiga justo
  // en medio de un arrastre: se sentía como que "todo tiembla" (las velas,
  // los ejes, Watchtower) mientras intentás mover algo, aunque el dibujo
  // en sí no tenga nada que ver. El próximo tick, ya sin drag activo,
  // atrapa el precio más reciente igual.
  if (window._dragSession) return;
  _formingFetchInFlight=true;
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=1`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)return;
    const bar=json.bars[0];
    const last=window._lastCandles[window._lastCandles.length-1];
    if(bar.time!==last.time)return; // ya cerró — eso lo maneja appendNewBar
    // Este tick corre cada 1s todo el tiempo que la vela sigue en formación
    // — la mayoría de esos segundos el precio no se movió un tick siquiera.
    // renderSeries() de acá abajo es caro: reconstruye TODAS las velas
    // cargadas (miles, desde que Watchtower trae más historial), el
    // volumen, los overlays y Watchtower/Sniper desde cero. Sin este
    // chequeo se pagaba ese costo cada segundo aunque no hubiera nada
    // nuevo que mostrar.
    if (bar.open===last.open && bar.high===last.high && bar.low===last.low && bar.close===last.close && bar.volume===last.volume) return;

    window._lastCandles[window._lastCandles.length-1]=bar;
    renderSeries(timeframe);
    // Si esta vela en formación hizo un máximo/mínimo nuevo, el autoescalado
    // de precio se mueve — las velas y las LÍNEAS del dibujo (series reales
    // del chart) se reacomodan solas con el repintado de arriba, pero el
    // relleno de color y las etiquetas de la herramienta de posición/rect
    // (capa SVG aparte, se posicionan a mano) no tienen quién les avise:
    // sin esto se quedaban pegados en su pixel viejo, uno o dos frames
    // "atrasados" de las velas reales — se veía como si la vela empujara
    // el dibujo, o como si una vela quedara tapada por un relleno que ya
    // no correspondía a esa altura de precio. Mismo syncOverlayPositions()
    // que ya se llama en cada pan/zoom/resize.
    if (window._syncOverlayPositions) window._syncOverlayPositions();

    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(bar,prev);
    updateTopbarOHLCV(bar);
    updateWLPrice(symbol,bar.close);
    positionCountdownBadge(bar.close,bar.open);
  } catch(e){
    // red caída un segundo: el próximo tick reintenta solo
  } finally {
    _formingFetchInFlight=false;
  }
}

// Reloj aproximado del servidor/bróker (hora NY real, no la del candle que
// está en formación) — lo guarda cada vez que arranca el countdown, para que
// renderWtORG pueda saber si la sesión YA abrió de verdad (9:30) en vez de
// adivinarlo solo por los bordes de las velas (ver uso más abajo).
let _wtNowAnchorServerTime = null, _wtNowAnchorPerfMs = null;
function wtApproxNow(){
  if (_wtNowAnchorServerTime == null) return null;
  return _wtNowAnchorServerTime + (performance.now() - _wtNowAnchorPerfMs) / 1000;
}

function startCountdown(timeframe, lastBarTime, serverTimeAtLoad){
  clearInterval(_countdownTimer);
  const badge=document.getElementById('price-countdown-badge');
  const close=nextCloseTime(timeframe, lastBarTime);
  const loadedAtMs=performance.now();
  _wtNowAnchorServerTime = serverTimeAtLoad;
  _wtNowAnchorPerfMs = loadedAtMs;

  function tick(){
    const elapsed=(performance.now()-loadedAtMs)/1000;
    const nowServer=serverTimeAtLoad+elapsed;
    if(close!==null){
      let remain=Math.max(0, Math.round(close-nowServer));
      if(remain<=0){ clearInterval(_countdownTimer); appendNewBar(STATE.symbol, STATE.timeframe); return; }
      const h=Math.floor(remain/3600), m=Math.floor((remain%3600)/60), s=remain%60;
      // Con horas de por medio (TF grandes: D/W/M) se corta el segundero —
      // mostrar hh:mm:ss ahí desbordaba el cartel (pensado para el ancho
      // angosto de mm:ss) y los dígitos de las puntas quedaban recortados.
      // A esa escala el segundo exacto tampoco aporta nada.
      badge.textContent = h>0
        ? `${h}:${String(m).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
      badge.classList.toggle('soon', remain<=10);
    }
    refreshFormingCandle(STATE.symbol, timeframe);
  }
  tick();
  _countdownTimer=setInterval(tick,1000);
}

// ══════════════════════════════════════════════════════════
//  CONTROLES GLOBALES (postMessage desde la grilla multi-chart)
//  La barra de afuera (renderLayoutGrid) no toca el DOM de cada panel
//  directamente — cada panel es un iframe con su propio STATE. Le manda
//  mensajes y cada panel decide qué hacer con lo suyo.
// ══════════════════════════════════════════════════════════
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object' || !String(msg.type||'').startsWith('zentinel:')) return;
  if (msg.type === 'zentinel:setSymbol' && msg.symbol) {
    selectSymbol(msg.symbol);
  } else if (msg.type === 'zentinel:setTimeframe' && msg.tf) {
    STATE.timeframe = msg.tf;
    saveState();
    setActiveTF(STATE.timeframe);
    loadChart(STATE.symbol, STATE.timeframe);
  } else if (msg.type === 'zentinel:applyPreset' && msg.name) {
    applyPreset(msg.name);
  } else if (msg.type === 'zentinel:refresh') {
    refreshChart();
  } else if (msg.type === 'zentinel:openSettings') {
    openChartSettingsModal();
  } else if (msg.type === 'zentinel:startReplayPick') {
    // El botón "Replay" de la grilla vive en el shell (acá adentro no se
    // ve: #topbar está oculto en modo embed) — esto es lo que hace que
    // clickearlo arranque la selección de vela en el panel ACTIVO.
    if (!window._replay && !_replayClickHandler) startReplayPicking();
  } else if (msg.type === 'zentinel:replayControl' && window._replay && window._replay.isMaster) {
    // Controles (play/pause/step/velocidad/salir) del replay sincronizado,
    // reenviados por el shell desde su mini-barra hacia el panel que es
    // el maestro de este replay — los demás paneles ignoran esto, ellos
    // solo reciben 'zentinel:replaySync' más abajo.
    if (msg.action === 'step') replayStep();
    else if (msg.action === 'play') replayPlay();
    else if (msg.action === 'pause') replayPause();
    else if (msg.action === 'speed') setReplaySpeed(msg.speedMs);
    else if (msg.action === 'exit') exitReplay();
  } else if (msg.type === 'zentinel:replaySync' && msg.symbol === STATE.symbol) {
    // El reloj del panel maestro, reenviado por el shell a TODOS los
    // paneles del mismo símbolo. Si este panel ES el maestro, es el eco
    // de su propio broadcast — _applyFollowSync lo filtra solo.
    if (msg.exited) {
      if (window._replayFollow) loadChart(STATE.symbol, STATE.timeframe);
    } else {
      _applyFollowSync(msg.masterTF, msg.time);
    }
  }
});

// Le avisa al shell (si estamos embebidos dentro de la grilla multi-chart)
// que este panel se acaba de clickear, para que lo marque como activo. Es
// más confiable que depender del 'blur' de la ventana principal, que solo
// detecta bien el primer salto de foco hacia un iframe — no cuando se pasa
// directo de un panel a otro.
if (EMBED_MODE && PANE_ID) {
  document.addEventListener('mousedown', () => {
    window.parent.postMessage({ type:'zentinel:paneFocused', pane:PANE_ID }, '*');
  }, true);
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
(function boot(){
  if (LAYOUT_N > 1 && !EMBED_MODE) return; // grid shell: no chart here, just the iframes
  initChart();
  initDrawingLayer();
  renderWatchlist();
  renderIndList();
  renderTfBar();
  setActiveTF(STATE.timeframe);
  document.getElementById('symbol-input').value=STATE.symbol;
  updateTfBarSymbol(STATE.symbol);

  const badge=document.getElementById('api-badge');
  fetch(`${BRIDGE_URL}/health`).then(r=>r.ok?r.json():Promise.reject()).then(()=>{
    badge.textContent='MT5 BRIDGE ✓';badge.classList.add('connected');
    // Los dibujos recién se pueden reconstruir con el chart ya armado y
    // las velas cargadas (buildDrawingOnChart las necesita) — por eso se
    // espera a que termine este primer loadChart() antes de restaurarlos,
    // en vez de precargar `drawings` de entrada. applyExternalDrawings ya
    // sabe reconstruir TODO desde una lista plana (lo reusa el sync entre
    // paneles y el undo/redo) — texto incluido, que buildDrawingOnChart
    // solo no sabe armar.
    loadChart(STATE.symbol,STATE.timeframe).then(() => {
      try {
        const saved = JSON.parse(lsGet(lsKey('td_drawings')) || '[]');
        if (Array.isArray(saved) && saved.length) applyExternalDrawings(saved);
      } catch(e){}
    });
  }).catch(()=>{
    badge.textContent='BRIDGE OFF';badge.classList.remove('connected');
    showLoader('No conecta con el puente MT5 — corré bridge_server.py y abrí MT5 con el Service ZentinelBridge');
    setStatus('err','● sin puente');
  });
})();
</script>
