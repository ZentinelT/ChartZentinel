<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentinel Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary:   #0a0a0c;
    --bg-secondary: #111116;
    --bg-panel:     #13131a;
    --bg-hover:     #1a1a24;
    --bg-active:    #1e1e2a;
    --border:       #222230;
    --border-light: #2a2a3a;
    --gold:         #c9a84c;
    --gold-bright:  #f0c060;
    --gold-dim:     #7a6030;
    --gold-glow:    rgba(201,168,76,0.15);
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-dim:     #55556a;
    --green:        #26a69a;
    --red:          #ef5350;
    --green-dim:    rgba(38,166,154,0.15);
    --red-dim:      rgba(239,83,80,0.15);
    --font-ui:      'DM Sans', sans-serif;
    --font-mono:    'DM Mono', monospace;
    --font-display: 'Cinzel', serif;
    --sidebar-w:    220px;
    --toolbar-h:    44px;
    --topbar-h:     52px;
    --tf-bar-h:     36px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-h);
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo svg { width: 20px; height: 20px; }

  .logo-sep {
    width: 1px; height: 24px;
    background: var(--border-light);
    margin: 0 4px;
  }

  /* Symbol search */
  #symbol-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  #symbol-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    width: 130px;
    outline: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: border-color .2s, box-shadow .2s;
  }
  #symbol-input:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 2px var(--gold-glow);
  }

  /* Price display */
  #price-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  #price-last {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
  }
  #price-change {
    font-family: var(--font-mono);
    font-size: 12px;
  }
  #price-change.up  { color: var(--green); }
  #price-change.dn  { color: var(--red); }

  #ohlcv-bar {
    display: flex;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
  }
  #ohlcv-bar span b { color: var(--text-dim); font-weight: 400; margin-right: 3px; }

  .topbar-spacer { flex: 1; }

  .topbar-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .topbar-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-color: var(--border-light);
  }
  .topbar-btn.active {
    background: var(--gold-glow);
    color: var(--gold);
    border-color: var(--gold-dim);
  }
  .topbar-btn svg { width: 14px; height: 14px; }

  /* api key badge */
  #api-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  #api-badge.connected { color: var(--green); border-color: rgba(38,166,154,.4); }
  #api-badge:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ─── TIMEFRAME BAR ───────────────────────────────────── */
  #tf-bar {
    height: var(--tf-bar-h);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px 0 230px; /* indent past sidebar */
    gap: 2px;
    flex-shrink: 0;
  }

  .tf-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .15s, color .15s;
  }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active {
    background: var(--gold-glow);
    color: var(--gold);
  }

  .tf-sep {
    width: 1px; height: 14px;
    background: var(--border);
    margin: 0 4px;
  }

  /* ─── MAIN AREA ───────────────────────────────────────── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ─── TOOLBAR (left) ─────────────────────────────────── */
  #toolbar {
    width: 38px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
    z-index: 50;
  }

  .tool-btn {
    width: 30px; height: 30px;
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tool-btn svg { width: 15px; height: 15px; }

  .tool-sep {
    width: 20px; height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* tooltip */
  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-active);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 999;
  }
  .tool-btn:hover::after { opacity: 1; }

  /* ─── SIDEBAR (favorites) ─────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-add-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    font-size: 16px;
    transition: color .15s;
    padding: 0 2px;
  }
  .sidebar-add-btn:hover { color: var(--gold); }

  #watchlist {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
  }

  .wl-item {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    gap: 8px;
    position: relative;
  }
  .wl-item:hover { background: var(--bg-hover); }
  .wl-item.active {
    background: var(--bg-active);
    border-left: 2px solid var(--gold);
  }
  .wl-item.active .wl-sym { color: var(--gold); }

  .wl-sym {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: .5px;
    flex: 1;
  }
  .wl-price {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
  }
  .wl-chg {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    min-width: 46px;
    text-align: right;
  }
  .wl-chg.up { color: var(--green); background: var(--green-dim); }
  .wl-chg.dn { color: var(--red);   background: var(--red-dim); }

  .wl-remove {
    background: none; border: none;
    color: transparent;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    transition: color .15s;
    padding: 0 2px;
  }
  .wl-item:hover .wl-remove { color: var(--text-dim); }
  .wl-item:hover .wl-remove:hover { color: var(--red); }

  /* sidebar bottom: indicator list */
  .sidebar-indicators {
    border-top: 1px solid var(--border);
  }
  .sidebar-indicators .sidebar-header { border-bottom: none; }
  #ind-list {
    padding: 4px 0;
    max-height: 140px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
  }
  .ind-item {
    padding: 5px 12px;
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .ind-item span { flex: 1; }
  .ind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-remove {
    background: none; border: none;
    color: transparent; cursor: pointer;
    font-size: 12px; line-height: 1;
    transition: color .15s;
  }
  .ind-item:hover .ind-remove { color: var(--red); }

  /* ─── CHART AREA ──────────────────────────────────────── */
  #chart-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #chart-container {
    flex: 1;
    position: relative;
  }

  /* loading overlay */
  #loading-overlay {
    position: absolute;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity .4s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--gold);
  }
  .loader-bar {
    width: 120px; height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 2px;
    animation: loaderAnim 1.5s ease-in-out infinite;
  }
  @keyframes loaderAnim {
    0%   { width: 0%; margin-left: 0; }
    50%  { width: 70%; margin-left: 15%; }
    100% { width: 0%; margin-left: 100%; }
  }
  .loader-msg {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* crosshair info */
  #crosshair-info {
    position: absolute;
    top: 10px; left: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    pointer-events: none;
    line-height: 1.7;
    z-index: 5;
    display: none;
  }
  #crosshair-info span { color: var(--text-primary); }

  /* ─── STATUS BAR ──────────────────────────────────────── */
  #statusbar {
    height: 22px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 20px;
    font-size: 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  #statusbar .sb-item { display: flex; gap: 5px; }
  #statusbar .sb-item b { color: var(--text-secondary); font-weight: 400; }
  #status-conn { margin-left: auto; }
  #status-conn.ok { color: var(--green); }
  #status-conn.err { color: var(--red); }
  #status-conn.loading { color: var(--gold); }

  /* ─── MODALS ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(8px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .modal label {
    display: block;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: .5px;
  }

  .modal input[type=text], .modal input[type=password] {
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    margin-bottom: 14px;
    transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--gold-dim); }

  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .btn-primary {
    background: var(--gold-dim);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 18px;
    border-radius: 5px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .15s;
  }
  .btn-primary:hover { background: rgba(201,168,76,.3); }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border-light);
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* indicator modal list */
  .ind-picker-list {
    max-height: 260px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border-light) transparent;
    margin-bottom: 14px;
  }
  .ind-pick-row {
    display: flex; align-items: center;
    padding: 8px 10px;
    border-radius: 5px;
    cursor: pointer;
    gap: 10px;
    transition: background .12s;
  }
  .ind-pick-row:hover { background: var(--bg-hover); }
  .ind-pick-row.selected { background: var(--gold-glow); }
  .ind-pick-name { font-size: 12px; color: var(--text-primary); flex: 1; }
  .ind-pick-desc { font-size: 10px; color: var(--text-dim); }
  .ind-pick-check {
    width: 14px; height: 14px;
    border: 1px solid var(--border-light);
    border-radius: 3px;
    background: none;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ind-pick-row.selected .ind-pick-check {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    font-size: 10px;
  }

  /* ─── Add symbol form inside watchlist ─── */
  #add-sym-form {
    display: none;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    gap: 6px;
    align-items: center;
  }
  #add-sym-form.open { display: flex; }
  #add-sym-inp {
    flex: 1;
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    outline: none;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #add-sym-inp:focus { border-color: var(--gold-dim); }
  #add-sym-ok {
    background: var(--gold-dim); border: none; border-radius: 4px;
    color: var(--gold-bright); font-size: 12px; font-weight: 700;
    padding: 3px 10px; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ══ TOP BAR ══════════════════════════════════════════ -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polygon points="12,2 22,20 2,20" stroke-linejoin="round"/>
      <line x1="12" y1="8" x2="12" y2="14"/>
      <circle cx="12" cy="17" r=".8" fill="currentColor"/>
    </svg>
    ZENTINEL
  </div>
  <div class="logo-sep"></div>

  <div id="symbol-search-wrap">
    <input id="symbol-input" type="text" value="NQ1!" placeholder="Symbol" autocomplete="off"
           title="Enter symbol and press Enter">
  </div>

  <div id="price-display">
    <span id="price-last">—</span>
    <span id="price-change" class="">—</span>
  </div>

  <div id="ohlcv-bar">
    <span><b>O</b><span id="ohlc-o">—</span></span>
    <span><b>H</b><span id="ohlc-h">—</span></span>
    <span><b>L</b><span id="ohlc-l">—</span></span>
    <span><b>C</b><span id="ohlc-c">—</span></span>
    <span><b>V</b><span id="ohlc-v">—</span></span>
  </div>

  <div class="topbar-spacer"></div>

  <button class="topbar-btn" id="btn-indicators" onclick="openIndicatorModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Indicators
  </button>

  <button class="topbar-btn" id="btn-settings" onclick="openApiModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>

  <div id="api-badge" onclick="openApiModal()">NO API KEY</div>
</div>

<!-- ══ TIMEFRAME BAR ═════════════════════════════════════ -->
<div id="tf-bar">
  <button class="tf-btn" data-tf="1min">1m</button>
  <button class="tf-btn" data-tf="3min">3m</button>
  <button class="tf-btn" data-tf="5min" >5m</button>
  <button class="tf-btn" data-tf="15min">15m</button>
  <button class="tf-btn" data-tf="30min">30m</button>
  <div class="tf-sep"></div>
  <button class="tf-btn" data-tf="1h">1H</button>
  <button class="tf-btn" data-tf="2h">2H</button>
  <button class="tf-btn" data-tf="4h">4H</button>
  <div class="tf-sep"></div>
  <button class="tf-btn" data-tf="1day" >D</button>
  <button class="tf-btn" data-tf="1week">W</button>
  <button class="tf-btn" data-tf="1month">M</button>
</div>

<!-- ══ MAIN ══════════════════════════════════════════════ -->
<div id="main">

  <!-- ── TOOLBAR ───────────────────────────────────────── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tip="Cursor" onclick="setTool(this,'cursor')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 3l14 9-7 1-3 7z"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Crosshair" onclick="setTool(this,'cross')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Trend Line" onclick="setTool(this,'trendline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="20" x2="20" y2="4"/>
        <circle cx="4" cy="20" r="2" fill="currentColor"/>
        <circle cx="20" cy="4" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Horizontal Line" onclick="setTool(this,'hline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="2" cy="12" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Rectangle" onclick="setTool(this,'rect')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="6" width="18" height="12" rx="1"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Fibonacci" onclick="setTool(this,'fib')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <text x="3" y="16" font-size="11" fill="currentColor" stroke="none" font-family="serif">φ</text>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Text Label" onclick="setTool(this,'text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="4 7 4 4 20 4 20 7"/>
        <line x1="9" y1="20" x2="15" y2="20"/>
        <line x1="12" y1="4" x2="12" y2="20"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Clear All" onclick="clearDrawings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4h6v2"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn active" id="btn-volume" data-tip="Toggle Volume" onclick="toggleVolume()" style="margin-top:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2"  y="14" width="4" height="7" rx="1"/>
        <rect x="9"  y="9"  width="4" height="12" rx="1"/>
        <rect x="16" y="4"  width="4" height="17" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- ── SIDEBAR ───────────────────────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-header">
      Watchlist
      <button class="sidebar-add-btn" onclick="toggleAddSym()" title="Add symbol">+</button>
    </div>

    <div id="add-sym-form">
      <input id="add-sym-inp" type="text" placeholder="AAPL, BTC/USD…" maxlength="20">
      <button id="add-sym-ok" onclick="addSymbol()">→</button>
    </div>

    <div id="watchlist"></div>

    <div class="sidebar-indicators">
      <div class="sidebar-header">
        Active Indicators
        <button class="sidebar-add-btn" onclick="openIndicatorModal()" title="Add indicator">+</button>
      </div>
      <div id="ind-list"></div>
    </div>
  </div>

  <!-- ── CHART ─────────────────────────────────────────── -->
  <div id="chart-wrap">
    <div id="chart-container">
      <div id="loading-overlay">
        <div class="loader-logo">ZENTINEL</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
        <div class="loader-msg" id="loader-msg">Initializing…</div>
      </div>
      <div id="crosshair-info"></div>
    </div>
  </div>

</div>

<!-- ── STATUS BAR ─────────────────────────────────────── -->
<div id="statusbar">
  <div class="sb-item"><b>Symbol:</b><span id="sb-sym">—</span></div>
  <div class="sb-item"><b>TF:</b><span id="sb-tf">—</span></div>
  <div class="sb-item"><b>Bars:</b><span id="sb-bars">—</span></div>
  <div class="sb-item"><b>Range:</b><span id="sb-range">—</span></div>
  <span id="status-conn" class="loading">● connecting…</span>
</div>

<!-- ══ MODAL: API KEY ════════════════════════════════════ -->
<div class="modal-overlay" id="modal-api">
  <div class="modal">
    <h2>Settings</h2>
    <label>Twelve Data API Key</label>
    <input type="password" id="inp-apikey" placeholder="Enter your API key…">
    <label>Default Symbol</label>
    <input type="text" id="inp-defsym" placeholder="NQ1!" value="NQ1!">
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal('modal-api')">Cancel</button>
      <button class="btn-primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: INDICATORS ════════════════════════════════ -->
<div class="modal-overlay" id="modal-indicators">
  <div class="modal">
    <h2>Indicators</h2>
    <div class="ind-picker-list" id="ind-picker"></div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal('modal-indicators')">Cancel</button>
      <button class="btn-primary" onclick="applyIndicators()">Apply</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const STATE = {
  apiKey:     localStorage.getItem('td_apikey') || '',
  symbol:     localStorage.getItem('td_symbol') || 'QQQ',
  timeframe:  localStorage.getItem('td_tf')     || '1h',
  watchlist:  JSON.parse(localStorage.getItem('td_watchlist') || '["QQQ","SPY","IWM","GLD","USO","AAPL"]'),
  indicators: JSON.parse(localStorage.getItem('td_indicators') || '[]'),
  activeTool: 'cursor',
};

// LW Chart instances & series
let chart, candleSeries, volumeSeries;
const overlays = {}; // name → series

// ══════════════════════════════════════════════════════════
//  CHART INIT
// ══════════════════════════════════════════════════════════
function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: '#0a0a0c' },
      textColor:  '#8888a8',
      fontFamily: "'DM Mono', monospace",
      fontSize:   11,
    },
    grid: {
      vertLines:  { color: '#18182a', style: 1 },
      horzLines:  { color: '#18182a', style: 1 },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#c9a84c55', labelBackgroundColor: '#1e1e2a' },
      horzLine: { color: '#c9a84c55', labelBackgroundColor: '#1e1e2a' },
    },
    rightPriceScale: {
      borderColor:   '#222230',
      scaleMargins:  { top: 0.08, bottom: 0.18 },
    },
    timeScale: {
      borderColor:         '#222230',
      timeVisible:         true,
      secondsVisible:      false,
      rightOffset:         8,
      barSpacing:          10,
    },
    watermark: {
      visible:  true,
      fontSize: 52,
      horzAlign: 'center',
      vertAlign: 'center',
      color:    'rgba(201,168,76,0.03)',
      text:     'ZENTINEL',
    },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:          '#26a69a',
    downColor:        '#ef5350',
    borderUpColor:    '#26a69a',
    borderDownColor:  '#ef5350',
    wickUpColor:      '#26a69a',
    wickDownColor:    '#ef5350',
  });

  // Volume pane
  volumeSeries = chart.addHistogramSeries({
    color:      '#c9a84c22',
    priceFormat:{ type: 'volume' },
    priceScaleId: 'vol',
    scaleMargins: { top: 0.82, bottom: 0 },
  });
  chart.priceScale('vol').applyOptions({
    scaleMargins: { top: 0.82, bottom: 0 },
  });

  // Crosshair → OHLCV display
  chart.subscribeCrosshairMove(param => {
    const info = document.getElementById('crosshair-info');
    if (!param.time || !param.seriesData) {
      info.style.display = 'none'; return;
    }
    const d = param.seriesData.get(candleSeries);
    if (!d) { info.style.display = 'none'; return; }
    info.style.display = 'block';
    info.innerHTML =
      `O <span>${fmt(d.open)}</span>  H <span>${fmt(d.high)}</span>  ` +
      `L <span>${fmt(d.low)}</span>  C <span>${fmt(d.close)}</span>`;
    updateTopbarOHLCV(d);
  });

  // Resize observer
  new ResizeObserver(() => {
    chart.applyOptions({
      width:  container.clientWidth,
      height: container.clientHeight,
    });
  }).observe(container);
}

// ══════════════════════════════════════════════════════════
//  DATA FETCH (Twelve Data)
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
//  WATCHLIST
// ══════════════════════════════════════════════════════════
function renderWatchlist() {
  const el = document.getElementById('watchlist');
  el.innerHTML = '';
  STATE.watchlist.forEach(sym => {
    const row = document.createElement('div');
    row.className = 'wl-item' + (sym === STATE.symbol ? ' active' : '');
    row.dataset.sym = sym;
    row.innerHTML = `
      <div class="wl-sym">${sym}</div>
      <div class="wl-price" id="wlp-${sym.replace(/[^a-z0-9]/gi,'_')}">—</div>
      <div class="wl-chg" id="wlc-${sym.replace(/[^a-z0-9]/gi,'_')}">—</div>
      <button class="wl-remove" onclick="removeSymbol('${sym}',event)">×</button>`;
    row.addEventListener('click', () => selectSymbol(sym));
    el.appendChild(row);
  });
  saveState();
}

function selectSymbol(sym) {
  STATE.symbol = sym;
  document.getElementById('symbol-input').value = sym;
  renderWatchlist();
  loadChart(sym, STATE.timeframe);
}

function addSymbol() {
  const inp = document.getElementById('add-sym-inp');
  const sym = inp.value.trim().toUpperCase();
  if (!sym || STATE.watchlist.includes(sym)) { inp.value=''; return; }
  STATE.watchlist.push(sym);
  inp.value = '';
  document.getElementById('add-sym-form').classList.remove('open');
  renderWatchlist();
}

function removeSymbol(sym, e) {
  e.stopPropagation();
  STATE.watchlist = STATE.watchlist.filter(s => s !== sym);
  if (STATE.symbol === sym && STATE.watchlist.length) selectSymbol(STATE.watchlist[0]);
  else renderWatchlist();
}

function toggleAddSym() {
  const f = document.getElementById('add-sym-form');
  f.classList.toggle('open');
  if (f.classList.contains('open')) {
    document.getElementById('add-sym-inp').focus();
  }
}

function updateWLPrice(sym, price) {
  const key = sym.replace(/[^a-z0-9]/gi,'_');
  const el = document.getElementById('wlp-'+key);
  if (el) el.textContent = fmt(price);
}

document.getElementById('add-sym-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') addSymbol();
  if (e.key === 'Escape') document.getElementById('add-sym-form').classList.remove('open');
});

// ══════════════════════════════════════════════════════════
//  TIMEFRAME
// ══════════════════════════════════════════════════════════
document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.timeframe = btn.dataset.tf;
    saveState();
    loadChart(STATE.symbol, STATE.timeframe);
  });
});

function setActiveTF(tf) {
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tf === tf);
  });
}

// ══════════════════════════════════════════════════════════
//  TOOLS
// ══════════════════════════════════════════════════════════
let volumeVisible = true;
function toggleVolume() {
  volumeVisible = !volumeVisible;
  volumeSeries.applyOptions({ visible: volumeVisible });
  document.getElementById('btn-volume').classList.toggle('active', volumeVisible);
}

function setTool(btn, name) {
  document.querySelectorAll('.tool-btn').forEach(b => {
    if (b.id !== 'btn-volume') b.classList.remove('active');
  });
  btn.classList.add('active');
  STATE.activeTool = name;
}

const drawings = [];

function clearDrawings() {
  drawings.forEach(d => d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} }));
  drawings.length = 0;
  document.querySelectorAll('.chart-label').forEach(el => el.remove());
}

function initDrawingLayer() {
  const container = document.getElementById('chart-container');
  let drawStart = null;
  let previewSeries = null;

  function removePreview() {
    if (previewSeries) { try { chart.removeSeries(previewSeries); } catch(e){} previewSeries = null; }
  }

  function getCoords(e) {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const price = candleSeries.coordinateToPrice(y);
    const time  = chart.timeScale().coordinateToTime(x);
    return { x, y, price, time };
  }

  container.addEventListener('mousedown', e => {
    const tool = STATE.activeTool;
    if (tool === 'cursor' || tool === 'cross') return;
    const { x, y, price, time } = getCoords(e);
    if (price === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;

    if (tool === 'text') {
      const text = prompt('Etiqueta:');
      if (!text) return;
      const rect = container.getBoundingClientRect();
      const label = document.createElement('div');
      label.className = 'chart-label';
      label.textContent = text;
      label.style.cssText = `position:absolute;left:${x+6}px;top:${y-10}px;color:var(--gold);font-family:var(--font-mono);font-size:11px;pointer-events:none;z-index:5;white-space:nowrap;background:rgba(10,10,12,.7);padding:1px 4px;border-radius:3px;`;
      container.appendChild(label);
      drawings.push({ type:'text', series:[], label });
      return;
    }
    drawStart = { price, time: time || candles[0].time };
  });

  container.addEventListener('mousemove', e => {
    if (!drawStart) return;
    const tool = STATE.activeTool;
    const { price: price2, time: time2 } = getCoords(e);
    if (price2 === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;
    const t2 = time2 || candles[candles.length-1].time;

    removePreview();

    const opts = { color:'#c9a84c88', lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false };

    if (tool === 'hline') {
      previewSeries = chart.addLineSeries(opts);
      previewSeries.setData([{time:candles[0].time, value:drawStart.price},{time:candles[candles.length-1].time, value:drawStart.price}]);
    } else if (tool === 'trendline') {
      const t1 = Math.min(drawStart.time, t2);
      const t2e = Math.max(drawStart.time, t2);
      if (t1 !== t2e) {
        previewSeries = chart.addLineSeries(opts);
        const p1 = drawStart.time <= t2 ? drawStart.price : price2;
        const p2 = drawStart.time <= t2 ? price2 : drawStart.price;
        previewSeries.setData([{time:t1,value:p1},{time:t2e,value:p2}]);
      }
    } else if (tool === 'rect' || tool === 'fib') {
      previewSeries = chart.addLineSeries(opts);
      const hi = Math.max(drawStart.price, price2);
      const t1 = candles[0].time;
      const tend = candles[candles.length-1].time;
      previewSeries.setData([{time:t1,value:hi},{time:tend,value:hi}]);
    }
  });

  container.addEventListener('mouseup', e => {
    if (!drawStart) return;
    const tool = STATE.activeTool;
    removePreview();
    const { price: price2, time: time2 } = getCoords(e);
    if (price2 === null) { drawStart = null; return; }
    const candles = window._lastCandles || [];
    if (!candles.length) { drawStart = null; return; }
    const t2 = time2 || candles[candles.length-1].time;
    const C = '#c9a84c';

    if (tool === 'hline') {
      const s = chart.addLineSeries({ color:C, lineWidth:1, lineStyle:1, priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:false });
      s.setData([{time:candles[0].time,value:drawStart.price},{time:candles[candles.length-1].time,value:drawStart.price}]);
      drawings.push({ type:'hline', series:[s] });

    } else if (tool === 'trendline') {
      const t1 = Math.min(drawStart.time, t2);
      const tend = Math.max(drawStart.time, t2);
      if (t1 !== tend) {
        const p1 = drawStart.time <= t2 ? drawStart.price : price2;
        const p2 = drawStart.time <= t2 ? price2 : drawStart.price;
        const s = chart.addLineSeries({ color:C, lineWidth:1, lineStyle:0, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
        s.setData([{time:t1,value:p1},{time:tend,value:p2}]);
        drawings.push({ type:'trendline', series:[s] });
      }

    } else if (tool === 'rect') {
      const hi = Math.max(drawStart.price, price2);
      const lo = Math.min(drawStart.price, price2);
      const t1 = Math.min(drawStart.time, t2);
      const tend = Math.max(drawStart.time, t2);
      if (t1 !== tend) {
        const mkLine = (pts) => {
          const s = chart.addLineSeries({ color:C+'99', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
          s.setData(pts); return s;
        };
        const top = mkLine([{time:t1,value:hi},{time:tend,value:hi}]);
        const bot = mkLine([{time:t1,value:lo},{time:tend,value:lo}]);
        const lft = mkLine([{time:t1,value:lo},{time:t1,value:hi}]);
        const rgt = mkLine([{time:tend,value:lo},{time:tend,value:hi}]);
        drawings.push({ type:'rect', series:[top,bot,lft,rgt] });
      }

    } else if (tool === 'fib') {
      const hi = Math.max(drawStart.price, price2);
      const lo = Math.min(drawStart.price, price2);
      const t1 = candles[0].time;
      const tend = candles[candles.length-1].time;
      const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
      const colors = ['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
      const seriesList = levels.map((lvl, i) => {
        const val = hi - (hi - lo) * lvl;
        const s = chart.addLineSeries({ color:colors[i]+'bb', lineWidth:1, lineStyle:1, priceLineVisible:false, lastValueVisible:true, crosshairMarkerVisible:false });
        s.setData([{time:t1,value:val},{time:tend,value:val}]);
        return s;
      });
      drawings.push({ type:'fib', series:seriesList });
    }

    drawStart = null;
  });
}

// ══════════════════════════════════════════════════════════
//  INDICATORS
// ══════════════════════════════════════════════════════════
const INDICATOR_DEFS = [
  { name:'EMA 9',   desc:'Exponential MA 9',     color:'#f0c060', calc: d => ema(d,9)  },
  { name:'EMA 20',  desc:'Exponential MA 20',    color:'#60c0f0', calc: d => ema(d,20) },
  { name:'EMA 50',  desc:'Exponential MA 50',    color:'#a060f0', calc: d => ema(d,50) },
  { name:'EMA 200', desc:'Exponential MA 200',   color:'#f06060', calc: d => ema(d,200)},
  { name:'SMA 20',  desc:'Simple MA 20',         color:'#60f0a0', calc: d => sma(d,20) },
  { name:'SMA 50',  desc:'Simple MA 50',         color:'#f0a060', calc: d => sma(d,50) },
  { name:'VWAP',    desc:'Volume Weighted Avg',  color:'#c9a84c', calc: d => vwap(d)   },
];

function openIndicatorModal() {
  const picker = document.getElementById('ind-picker');
  picker.innerHTML = '';
  INDICATOR_DEFS.forEach(def => {
    const row = document.createElement('div');
    const sel = STATE.indicators.includes(def.name);
    row.className = 'ind-pick-row' + (sel ? ' selected' : '');
    row.innerHTML = `
      <div class="ind-dot" style="background:${def.color}"></div>
      <div class="ind-pick-name">${def.name}</div>
      <div class="ind-pick-desc">${def.desc}</div>
      <div class="ind-pick-check">${sel ? '✓' : ''}</div>`;
    row.addEventListener('click', () => {
      row.classList.toggle('selected');
      const chk = row.querySelector('.ind-pick-check');
      chk.textContent = row.classList.contains('selected') ? '✓' : '';
    });
    picker.appendChild(row);
  });
  openModal('modal-indicators');
}

function applyIndicators() {
  const selected = [...document.querySelectorAll('.ind-pick-row.selected')]
    .map(r => r.querySelector('.ind-pick-name').textContent);

  // remove deselected
  STATE.indicators.forEach(name => {
    if (!selected.includes(name) && overlays[name]) {
      chart.removeSeries(overlays[name]);
      delete overlays[name];
    }
  });

  STATE.indicators = selected;
  saveState();
  selected.forEach(name => addIndicatorSeries(name));
  renderIndList();
  closeModal('modal-indicators');
}

function addIndicatorSeries(name) {
  if (overlays[name]) return; // already added
  const def = INDICATOR_DEFS.find(d => d.name === name);
  if (!def) return;

  // get current candle data
  const rawData = candleSeries ? getSeriesData() : [];
  if (!rawData.length) return;

  const calcData = def.calc(rawData);
  const series = chart.addLineSeries({
    color:       def.color,
    lineWidth:   1,
    priceLineVisible: false,
    lastValueVisible: true,
  });
  series.setData(calcData);
  overlays[name] = series;
}

function getSeriesData() {
  // Lightweight Charts doesn't expose data directly — we cache it
  return window._lastCandles || [];
}

function renderIndList() {
  const el = document.getElementById('ind-list');
  el.innerHTML = '';
  if (!STATE.indicators.length) {
    el.innerHTML = '<div class="ind-item" style="color:var(--text-dim);font-size:10px">None active</div>';
    return;
  }
  STATE.indicators.forEach(name => {
    const def = INDICATOR_DEFS.find(d => d.name === name);
    const item = document.createElement('div');
    item.className = 'ind-item';
    item.innerHTML = `
      <div class="ind-dot" style="background:${def?.color||'#888'}"></div>
      <span>${name}</span>
      <button class="ind-remove" onclick="removeIndicator('${name}')">×</button>`;
    el.appendChild(item);
  });
}

function removeIndicator(name) {
  if (overlays[name]) { chart.removeSeries(overlays[name]); delete overlays[name]; }
  STATE.indicators = STATE.indicators.filter(n => n !== name);
  saveState();
  renderIndList();
}

// ══════════════════════════════════════════════════════════
//  INDICATOR MATH
// ══════════════════════════════════════════════════════════
function ema(data, period) {
  const k = 2 / (period + 1);
  let prev = null;
  return data.map(d => {
    if (prev === null) { prev = d.close; return { time: d.time, value: d.close }; }
    const val = d.close * k + prev * (1 - k);
    prev = val;
    return { time: d.time, value: val };
  });
}

function sma(data, period) {
  return data.map((d, i) => {
    if (i < period - 1) return { time: d.time, value: null };
    const sum = data.slice(i - period + 1, i + 1).reduce((a, v) => a + v.close, 0);
    return { time: d.time, value: sum / period };
  }).filter(d => d.value !== null);
}

function vwap(data) {
  let cumPV = 0, cumV = 0;
  return data.map(d => {
    const tp = (d.high + d.low + d.close) / 3;
    cumPV += tp * (d.volume || 1);
    cumV  += (d.volume || 1);
    return { time: d.time, value: cumPV / cumV };
  });
}

// ══════════════════════════════════════════════════════════
//  MODALS
// ══════════════════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeModal(el.id); });
});

function openApiModal() {
  document.getElementById('inp-apikey').value = STATE.apiKey;
  document.getElementById('inp-defsym').value = STATE.symbol;
  openModal('modal-api');
}

function saveSettings() {
  const key = document.getElementById('inp-apikey').value.trim();
  const sym = document.getElementById('inp-defsym').value.trim().toUpperCase() || 'QQQ';
  STATE.apiKey = key;
  localStorage.setItem('td_apikey', key);
  const badge = document.getElementById('api-badge');
  if (key) {
    badge.textContent = 'API ✓';
    badge.classList.add('connected');
  } else {
    badge.textContent = 'NO API KEY';
    badge.classList.remove('connected');
  }
  closeModal('modal-api');
  if (key) { STATE.symbol = sym; selectSymbol(sym); }
}

// ══════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return n >= 1000 ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
                   : n.toFixed(n < 10 ? 4 : 2);
}

function updateTopbarPrice(last, prev) {
  document.getElementById('price-last').textContent = fmt(last.close);
  const chg = last.close - (prev?.close ?? last.close);
  const pct  = prev?.close ? (chg / prev.close * 100) : 0;
  const el   = document.getElementById('price-change');
  el.textContent = `${chg >= 0 ? '+' : ''}${fmt(chg)}  (${pct.toFixed(2)}%)`;
  el.className   = chg >= 0 ? 'up' : 'dn';
}

function updateTopbarOHLCV(d) {
  document.getElementById('ohlc-o').textContent = fmt(d.open);
  document.getElementById('ohlc-h').textContent = fmt(d.high);
  document.getElementById('ohlc-l').textContent = fmt(d.low);
  document.getElementById('ohlc-c').textContent = fmt(d.close);
  document.getElementById('ohlc-v').textContent =
    d.volume ? (d.volume >= 1e6 ? (d.volume/1e6).toFixed(1)+'M' : Math.round(d.volume).toLocaleString()) : '—';
}

function updateStatusBar(sym, tf, bars, first, last) {
  document.getElementById('sb-sym').textContent   = sym;
  document.getElementById('sb-tf').textContent    = tf;
  document.getElementById('sb-bars').textContent  = bars;
  const d1 = new Date(first.time*1000).toLocaleDateString();
  const d2 = new Date(last.time*1000).toLocaleDateString();
  document.getElementById('sb-range').textContent = `${d1} – ${d2}`;
}

function setStatus(cls, txt) {
  const el = document.getElementById('status-conn');
  el.className = cls;
  el.textContent = txt;
}

function showOverlay(show) {
  document.getElementById('loading-overlay').classList.toggle('hidden', !show);
}

function setLoaderMsg(msg) {
  document.getElementById('loader-msg').textContent = msg;
}

function showLoader(msg) {
  setLoaderMsg(msg);
  showOverlay(true);
}

function saveState() {
  localStorage.setItem('td_symbol',     STATE.symbol);
  localStorage.setItem('td_tf',         STATE.timeframe);
  localStorage.setItem('td_watchlist',  JSON.stringify(STATE.watchlist));
  localStorage.setItem('td_indicators', JSON.stringify(STATE.indicators));
}

// ══════════════════════════════════════════════════════════
//  SYMBOL INPUT
// ══════════════════════════════════════════════════════════
document.getElementById('symbol-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const sym = e.target.value.trim().toUpperCase();
  if (!sym) return;
  if (!STATE.watchlist.includes(sym)) STATE.watchlist.push(sym);
  STATE.symbol = sym;
  renderWatchlist();
  loadChart(sym, STATE.timeframe);
});

// ══════════════════════════════════════════════════════════
//  REAL loadChart (overrides placeholder above)
// ══════════════════════════════════════════════════════════
async function loadChart(symbol, timeframe) {
  if (!STATE.apiKey) {
    showLoader('No API key — open Settings ↑');
    setStatus('err', '● no key');
    return;
  }
  setLoaderMsg(`Loading ${symbol} ${timeframe}…`);
  showOverlay(true);
  setStatus('loading', '● loading…');

  const url =
    `https://api.twelvedata.com/time_series?` +
    `symbol=${encodeURIComponent(symbol)}` +
    `&interval=${timeframe}` +
    `&outputsize=500` +
    `&order=ASC` +
    `&apikey=${STATE.apiKey}`;

  try {
    const res  = await fetch(url);
    const json = await res.json();

    if (json.status === 'error' || !json.values) {
      throw new Error(json.message || 'API error');
    }

    const candles = json.values.map(v => ({
      time:   Math.floor(new Date(v.datetime).getTime() / 1000),
      open:   parseFloat(v.open),
      high:   parseFloat(v.high),
      low:    parseFloat(v.low),
      close:  parseFloat(v.close),
      volume: parseFloat(v.volume || 0),
    }));

    window._lastCandles = candles; // cache for indicators

    const vols = candles.map(c => ({
      time:  c.time,
      value: c.volume,
      color: c.close >= c.open ? 'rgba(38,166,154,.25)' : 'rgba(239,83,80,.2)',
    }));

    candleSeries.setData(candles);
    volumeSeries.setData(vols);
    chart.timeScale().fitContent();

    // re-apply indicators with new data
    Object.keys(overlays).forEach(name => {
      chart.removeSeries(overlays[name]);
      delete overlays[name];
    });
    STATE.indicators.forEach(name => addIndicatorSeries(name));

    const last = candles[candles.length - 1];
    const prev = candles[candles.length - 2];
    updateTopbarPrice(last, prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol, timeframe, candles.length, candles[0], last);
    updateWLPrice(symbol, last.close);

    document.getElementById('symbol-input').value = symbol;
    document.title = `${symbol} · Zentinel`;

    setStatus('ok', '● live');
    showOverlay(false);

  } catch (err) {
    setLoaderMsg('⚠ ' + err.message);
    setStatus('err', '● error');
  }
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
(function boot() {
  initChart();
  initDrawingLayer();
  renderWatchlist();
  renderIndList();
  setActiveTF(STATE.timeframe);
  document.getElementById('symbol-input').value = STATE.symbol;

  if (STATE.apiKey) {
    document.getElementById('api-badge').textContent = 'API ✓';
    document.getElementById('api-badge').classList.add('connected');
    loadChart(STATE.symbol, STATE.timeframe);
  } else {
    showLoader('Enter your Twelve Data API key in Settings');
    setStatus('err', '● no key');
  }
})();
</script>
