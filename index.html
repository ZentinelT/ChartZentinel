<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentinel Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary:   #0a0a0c;
    --bg-secondary: #111116;
    --bg-panel:     #13131a;
    --bg-hover:     #1a1a24;
    --bg-active:    #1e1e2a;
    --border:       #222230;
    --border-light: #2a2a3a;
    --gold:         #c9a84c;
    --gold-bright:  #f0c060;
    --gold-dim:     #7a6030;
    --gold-glow:    rgba(201,168,76,0.15);
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-dim:     #55556a;
    --green:        #26a69a;
    --red:          #ef5350;
    --green-dim:    rgba(38,166,154,0.15);
    --red-dim:      rgba(239,83,80,0.15);
    --font-ui:      'DM Sans', sans-serif;
    --font-mono:    'DM Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --sidebar-w:    220px;
    --toolbar-h:    44px;
    --topbar-h:     52px;
    --tf-bar-h:     36px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-h);
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0;
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .logo-sep { width: 1px; height: 24px; background: var(--border-light); margin: 0 4px; }

  #symbol-search-wrap { position: relative; display: flex; align-items: center; }
  #symbol-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    width: 130px;
    outline: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: border-color .2s, box-shadow .2s;
  }
  #symbol-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px var(--gold-glow); }

  #price-display { display: flex; align-items: baseline; gap: 8px; }
  #price-last { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text-primary); }
  #price-change { font-family: var(--font-mono); font-size: 12px; }
  #price-change.up { color: var(--green); }
  #price-change.dn { color: var(--red); }

  #ohlcv-bar { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  #ohlcv-bar span b { color: var(--text-dim); font-weight: 400; margin-right: 3px; }

  /* ─── COUNTDOWN BADGE (pegado al precio actual, como TV) ──── */
  #price-countdown-badge {
    position: absolute;
    right: 0;
    transform: translateY(2px);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: #0a0a0c;
    padding: 2px 6px;
    border-radius: 0 0 3px 3px;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
    display: none;
  }
  #price-countdown-badge.up { background: var(--green); }
  #price-countdown-badge.dn { background: var(--red); }
  #price-countdown-badge.soon { background: var(--gold-bright); }

  .topbar-spacer { flex: 1; }

  .topbar-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
  .topbar-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }
  .topbar-btn svg { width: 14px; height: 14px; }
  @keyframes zentinel-spin { to { transform: rotate(360deg); } }
  #btn-refresh.spinning svg { animation: zentinel-spin .6s linear infinite; }

  #api-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  #api-badge.connected { color: var(--green); border-color: rgba(38,166,154,.4); }
  #api-badge:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ─── TIMEFRAME BAR ───────────────────────────────────── */
  #tf-bar {
    height: var(--tf-bar-h);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px 0 268px;
    gap: 2px;
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }

  .tf-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .15s, color .15s;
  }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tf-sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; }

  /* ─── MAIN AREA ───────────────────────────────────────── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ─── TOOLBAR (left) ─────────────────────────────────── */
  #toolbar {
    width: 38px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
    z-index: 50;
  }

  .tool-btn {
    width: 30px; height: 30px;
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tool-btn svg { width: 15px; height: 15px; }
  .tool-sep { width: 20px; height: 1px; background: var(--border); margin: 4px 0; }

  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-active);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 999;
  }
  .tool-btn:hover::after { opacity: 1; }

  /* ─── SIDEBAR ─────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-add-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    font-size: 16px;
    transition: color .15s;
    padding: 0 2px;
  }
  .sidebar-add-btn:hover { color: var(--gold); }

  #watchlist { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }

  .wl-item {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    gap: 8px;
    position: relative;
  }
  .wl-item:hover { background: var(--bg-hover); }
  .wl-item.active { background: var(--bg-active); border-left: 2px solid var(--gold); }
  .wl-item.active .wl-sym { color: var(--gold); }

  .wl-sym { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-primary); letter-spacing: .5px; flex: 1; }
  .wl-price { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .wl-chg { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; min-width: 46px; text-align: right; }
  .wl-chg.up { color: var(--green); background: var(--green-dim); }
  .wl-chg.dn { color: var(--red); background: var(--red-dim); }

  .wl-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 13px; line-height: 1; transition: color .15s; padding: 0 2px; }
  .wl-item:hover .wl-remove { color: var(--text-dim); }
  .wl-item:hover .wl-remove:hover { color: var(--red); }

  .sidebar-indicators { border-top: 1px solid var(--border); }
  .sidebar-indicators .sidebar-header { border-bottom: none; }
  #ind-list { padding: 4px 0; max-height: 140px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
  .ind-item { padding: 5px 12px; font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ind-item span { flex: 1; }
  .ind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 12px; line-height: 1; transition: color .15s; }
  .ind-item:hover .ind-remove { color: var(--red); }

  /* ─── CHART AREA ──────────────────────────────────────── */
  #chart-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chart-container { flex: 1; position: relative; }

  #loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 10; transition: opacity .4s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .loader-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; animation: loaderAnim 1.5s ease-in-out infinite; }
  @keyframes loaderAnim { 0%{width:0%;margin-left:0} 50%{width:70%;margin-left:15%} 100%{width:0%;margin-left:100%} }
  .loader-msg { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

  #crosshair-info {
    position: absolute; top: 10px; left: 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
    pointer-events: none; line-height: 1.7; z-index: 5; display: none;
  }
  #crosshair-info span { color: var(--text-primary); }

  /* ─── STATUS BAR ──────────────────────────────────────── */
  #statusbar {
    height: 22px; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 20px;
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); flex-shrink: 0;
  }
  #statusbar .sb-item { display: flex; gap: 5px; }
  #statusbar .sb-item b { color: var(--text-secondary); font-weight: 400; }
  #status-conn { margin-left: auto; }
  #status-conn.ok { color: var(--green); }
  #status-conn.err { color: var(--red); }
  #status-conn.loading { color: var(--gold); }

  /* ─── MODALS ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(8px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-family: var(--font-display); font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-bottom: 16px; text-transform: uppercase; }
  .modal label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .5px; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); font-size: 12px;
    padding: 8px 12px; outline: none; margin-bottom: 14px; transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .btn-primary {
    background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold-bright);
    font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 7px 18px;
    border-radius: 5px; cursor: pointer; letter-spacing: .5px; transition: background .15s;
  }
  .btn-primary:hover { background: rgba(201,168,76,.3); }

  .btn-ghost {
    background: none; border: 1px solid var(--border-light); color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 12px; padding: 7px 14px; border-radius: 5px;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .ind-picker-list { max-height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; margin-bottom: 14px; }
  .ind-pick-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 5px; cursor: pointer; gap: 10px; transition: background .12s; }
  .ind-pick-row:hover { background: var(--bg-hover); }
  .ind-pick-row.selected { background: var(--gold-glow); }
  .ind-pick-name { font-size: 12px; color: var(--text-primary); flex: 1; }
  .ind-pick-desc { font-size: 10px; color: var(--text-dim); }
  .ind-pick-check { width: 14px; height: 14px; border: 1px solid var(--border-light); border-radius: 3px; background: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ind-pick-row.selected .ind-pick-check { background: var(--gold); border-color: var(--gold); color: #000; font-size: 10px; }

  #add-sym-form { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 6px; align-items: center; }
  #add-sym-form.open { display: flex; }
  #add-sym-inp { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; outline: none; text-transform: uppercase; letter-spacing: 1px; }
  #add-sym-inp:focus { border-color: var(--gold-dim); }
  #add-sym-ok { background: var(--gold-dim); border: none; border-radius: 4px; color: var(--gold-bright); font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer; }

  /* ══════════════════════════════════════════════════════
     DRAWING TOOLBAR (floating, contextual)
  ══════════════════════════════════════════════════════ */
  #draw-toolbar {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 6px 8px;
    display: none;
    align-items: center;
    gap: 4px;
    z-index: 300;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    user-select: none;
  }
  #draw-toolbar.visible { display: flex; }

  .dtb-sep { width: 1px; height: 20px; background: var(--border-light); margin: 0 2px; }

  .dtb-btn {
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .dtb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .dtb-btn.danger:hover { background: rgba(239,83,80,.15); color: var(--red); }
  .dtb-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .dtb-color-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dtb-color-swatch {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1px solid var(--border-light);
    cursor: pointer; overflow: hidden; position: relative;
  }
  .dtb-color-swatch input[type=color] {
    position: absolute; inset: -4px; width: 28px; height: 28px;
    opacity: 0; cursor: pointer;
  }

  .dtb-select {
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono);
    font-size: 11px; padding: 3px 6px; outline: none; cursor: pointer;
  }
  .dtb-select option { background: var(--bg-panel); }

  .dtb-btn.active { background: var(--gold-glow); color: var(--gold); }
  .dtb-label { font-size: 10px; color: var(--text-dim); padding: 0 4px; }

  .drawing-handle {
    fill: var(--gold);
    stroke: var(--bg-panel);
    stroke-width: 1.5;
    cursor: move;
    transition: r .1s;
  }
  .drawing-handle:hover { r: 7; }
  [contenteditable]:empty:before { content: attr(data-placeholder); opacity: .5; }
  .selected-drawing { filter: drop-shadow(0 0 4px rgba(201,168,76,.7)); }
</style>
</head>
<body>

<!-- ══ TOP BAR ══════════════════════════════════════════ -->
<div id="topbar">
  <div class="logo">ZENTINEL</div>
  <div class="logo-sep"></div>

  <div id="symbol-search-wrap">
    <input id="symbol-input" type="text" value="NAS100.fs" placeholder="Symbol" autocomplete="off" title="Enter symbol and press Enter">
  </div>

  <div id="price-display">
    <span id="price-last">—</span>
    <span id="price-change" class="">—</span>
  </div>

  <div id="ohlcv-bar">
    <span><b>O</b><span id="ohlc-o">—</span></span>
    <span><b>H</b><span id="ohlc-h">—</span></span>
    <span><b>L</b><span id="ohlc-l">—</span></span>
    <span><b>C</b><span id="ohlc-c">—</span></span>
    <span><b>V</b><span id="ohlc-v">—</span></span>
  </div>

  <div class="topbar-spacer"></div>

  <button class="topbar-btn" id="btn-refresh" title="Refresh chart" onclick="refreshChart()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>

  <button class="topbar-btn" id="btn-indicators" onclick="openIndicatorModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Indicators
  </button>

  <button class="topbar-btn" id="btn-settings" onclick="openApiModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>

<script>
// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const STATE = {
  apiKey:     localStorage.getItem('td_apikey') || '',
  symbol:     localStorage.getItem('td_symbol') || 'NAS100.fs',
  timeframe:  localStorage.getItem('td_tf')     || '1h',
  watchlist:  JSON.parse(localStorage.getItem('td_watchlist') || '["NAS100.fs","US500","US30","XAUUSD","EURUSD"]'),
  indicators: JSON.parse(localStorage.getItem('td_indicators') || '[]'),
  activeTool: 'cursor',
};

let chart, candleSeries, volumeSeries;
const overlays = {};

// ══════════════════════════════════════════════════════════
//  DRAWING SYSTEM
// ══════════════════════════════════════════════════════════
const drawings = [];
let selectedDrawingId = null;

const toolDefaults = {
  color: '#c9a84c',
  width: 1,
  style: 0,
  extLeft: false,
  extRight: false,
};

function genId() { return 'drw_' + Math.random().toString(36).slice(2,9); }

// Niveles de Fibonacci por defecto para cada retroceso nuevo — editables
// por dibujo (se pueden agregar, sacar o cambiar) desde el botón "Levels".
const DEFAULT_FIB_LEVELS = [
  { value:0,     color:'#ef5350', on:true },
  { value:0.236, color:'#f0c060', on:true },
  { value:0.382, color:'#26a69a', on:true },
  { value:0.5,   color:'#60c0f0', on:true },
  { value:0.618, color:'#a060f0', on:true },
  { value:0.786, color:'#f06060', on:true },
  { value:1,     color:'#60f0a0', on:true },
];
function cloneFibLevels() { return JSON.parse(JSON.stringify(DEFAULT_FIB_LEVELS)); }

function lwStyle(s) {
  return s == 0 ? 0 : s == 1 ? 1 : 2;
}

function selectDrawing(id) {
  selectedDrawingId = id;
  const d = drawings.find(x => x.id === id);
  if (!d) { hideDrawToolbar(); return; }
  document.getElementById('dtb-color').value = d.color;
  document.getElementById('dtb-color-swatch').style.background = d.color;
  document.getElementById('dtb-width').value = d.width;
  document.getElementById('dtb-style').value = d.style;
  document.getElementById('dtb-levels').style.display = d.type==='fib' ? '' : 'none';
  const extendApplies = (d.type === 'trendline' || d.type === 'fib' || d.type === 'rect');
  document.getElementById('dtb-ext-left').style.display  = (extendApplies && d.type!=='rect') ? '' : 'none';
  document.getElementById('dtb-ext-right').style.display = extendApplies ? '' : 'none';
  document.getElementById('dtb-ext-left').classList.toggle('active', !!d.extLeft);
  document.getElementById('dtb-ext-right').classList.toggle('active', !!d.extRight);
  document.getElementById('dtb-lock').classList.toggle('active', !!d.locked);
  showDrawToolbar();
  highlightSelectedSvg(id);
}

function deselectDrawing() {
  selectedDrawingId = null;
  hideDrawToolbar();
  clearSvgHighlights();
}

function showDrawToolbar() { document.getElementById('draw-toolbar').classList.add('visible'); }
function hideDrawToolbar() { document.getElementById('draw-toolbar').classList.remove('visible'); }

function onDtbColorChange(val) {
  document.getElementById('dtb-color-swatch').style.background = val;
  toolDefaults.color = val;
  const d = getSelected();
  if (d && d.type === 'fib') {
    // El fibo no tiene "un" color — son los colores por nivel. Este control
    // pinta todos los niveles del mismo color de una (hay que destildar/
    // editar los que se quieran distintos desde "Levels").
    d.levels.forEach(lv => { lv.color = val; });
    redrawDrawing(d);
    if (document.getElementById('modal-fib-levels').classList.contains('open')) renderFibLevelsRows();
    return;
  }
  applyStyleToSelected({ color: val });
}
function onDtbWidthChange(val) {
  toolDefaults.width = parseInt(val);
  applyStyleToSelected({ width: parseInt(val) });
}
function onDtbStyleChange(val) {
  toolDefaults.style = parseInt(val);
  applyStyleToSelected({ style: parseInt(val) });
}
function onDtbExtend(dir) {
  const d = getSelected(); if (!d) return;
  if (dir === 'left')  { d.extLeft  = !d.extLeft;  document.getElementById('dtb-ext-left').classList.toggle('active',  d.extLeft); }
  if (dir === 'right') { d.extRight = !d.extRight; document.getElementById('dtb-ext-right').classList.toggle('active', d.extRight); }
  redrawDrawing(d);
}
function onDtbLock() {
  const d = getSelected(); if (!d) return;
  d.locked = !d.locked;
  document.getElementById('dtb-lock').classList.toggle('active', d.locked);
}
// ══════════════════════════════════════════════════════════
//  NIVELES DE FIBONACCI (editable por dibujo: agregar/sacar/editar)
// ══════════════════════════════════════════════════════════
function renderFibLevelsRows() {
  const d = getSelected(); if (!d || d.type!=='fib') return;
  if (!d.levels) d.levels = cloneFibLevels();
  const list = document.getElementById('fib-levels-list');
  list.innerHTML = '';
  d.levels.forEach((lv, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--border);';
    row.innerHTML = `
      <input type="checkbox" ${lv.on?'checked':''} onchange="updateFibLevel(${i},'on',this.checked)">
      <input type="color" value="${lv.color}" style="width:28px;height:24px;border:none;background:none;padding:0;cursor:pointer;" onchange="updateFibLevel(${i},'color',this.value)">
      <input type="number" step="0.001" value="${lv.value}" style="flex:1;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:4px;color:var(--text-primary);padding:4px 6px;font-family:var(--font-mono);font-size:12px;" onchange="updateFibLevel(${i},'value',parseFloat(this.value))">
      <span style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;width:48px;text-align:right;">${(lv.value*100).toFixed(1)}%</span>
      <button onclick="removeFibLevel(${i})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;" title="Remove">×</button>
    `;
    list.appendChild(row);
  });
}
function openFibLevelsModal() {
  const d = getSelected(); if (!d || d.type!=='fib') return;
  renderFibLevelsRows();
  openModal('modal-fib-levels');
}
function updateFibLevel(i, field, val) {
  const d = getSelected(); if (!d || !d.levels[i]) return;
  d.levels[i][field] = val;
  renderFibLevelsRows();
  redrawDrawing(d);
}
function addFibLevel() {
  const d = getSelected(); if (!d) return;
  d.levels.push({ value:0.5, color:'#c9a84c', on:true });
  renderFibLevelsRows();
  redrawDrawing(d);
}
function removeFibLevel(i) {
  const d = getSelected(); if (!d) return;
  d.levels.splice(i,1);
  renderFibLevelsRows();
  redrawDrawing(d);
}
function resetFibLevels() {
  const d = getSelected(); if (!d) return;
  d.levels = cloneFibLevels();
  renderFibLevelsRows();
  redrawDrawing(d);
}

function onDtbClone() {
  const d = getSelected(); if (!d) return;
  const clone = JSON.parse(JSON.stringify({ ...d, id: genId(), series:[], svgEls:[], label:null }));
  clone.p1.price += (d.p2?.price ?? d.p1.price) * 0.001;
  if (clone.p2) clone.p2.price += clone.p1.price * 0.001;
  drawings.push(clone);
  buildDrawingOnChart(clone);
  selectDrawing(clone.id);
}
function onDtbDelete() {
  const d = getSelected(); if (!d) return;
  removeDrawingById(d.id);
  deselectDrawing();
}

function getSelected() { return drawings.find(x => x.id === selectedDrawingId) || null; }

function applyStyleToSelected(patch) {
  const d = getSelected(); if (!d) return;
  Object.assign(d, patch);
  redrawDrawing(d);
}

function redrawDrawing(d) {
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.series = [];
  d.svgEls.forEach(el => el.remove());
  d.svgEls = [];
  buildDrawingOnChart(d);
  highlightSelectedSvg(d.id);
}

function removeDrawingById(id) {
  const idx = drawings.findIndex(x => x.id === id);
  if (idx === -1) return;
  const d = drawings[idx];
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.svgEls.forEach(el => el.remove());
  if (d.label) d.label.remove();
  if (d.vLineEl instanceof Element) d.vLineEl.remove();
  if (d.fillEl instanceof Element) d.fillEl.remove();
  drawings.splice(idx,1);
}

// Vuelve a ubicar la línea vertical de un dibujo (se llama cada frame y
// después de crearla/arrastrarla, porque no sigue el pan/zoom sola).
function syncVLine(d) {
  if (!(d.vLineEl instanceof Element)) return;
  const x = chart.timeScale().timeToCoordinate(d.p1.time);
  // Parar antes de la franja de horas de abajo, para no taparla.
  const h = document.getElementById('chart-container').clientHeight - chart.timeScale().height();
  if (x === null) { d.vLineEl.style.display = 'none'; return; }
  d.vLineEl.style.display = '';
  d.vLineEl.setAttribute('x1', x); d.vLineEl.setAttribute('y1', 0);
  d.vLineEl.setAttribute('x2', x); d.vLineEl.setAttribute('y2', h);
}

function syncRectFill(d) {
  if (!(d.fillEl instanceof Element)) return;
  const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
  const t1 = Math.min(d.p1.time, d.p2.time);
  const t2 = d.extRight ? chart.timeScale().getVisibleRange()?.to ?? d.p2.time : Math.max(d.p1.time, d.p2.time);
  const x1 = chart.timeScale().timeToCoordinate(t1), x2 = chart.timeScale().timeToCoordinate(t2);
  const y1 = candleSeries.priceToCoordinate(hi), y2 = candleSeries.priceToCoordinate(lo);
  if (x1===null||x2===null||y1===null||y2===null) { d.fillEl.style.display='none'; return; }
  d.fillEl.style.display='';
  d.fillEl.setAttribute('x', Math.min(x1,x2)); d.fillEl.setAttribute('y', y1);
  d.fillEl.setAttribute('width', Math.abs(x2-x1)); d.fillEl.setAttribute('height', Math.max(0,y2-y1));
}

function clearDrawings() {
  [...drawings].forEach(d => removeDrawingById(d.id));
  deselectDrawing();
}

function buildDrawingOnChart(d) {
  const candles = window._lastCandles || [];
  if (!candles.length) return;

  const C  = d.color;
  const lw = d.width;
  const ls = lwStyle(d.style);

  const barInterval = candles.length > 1 ? (candles[candles.length-1].time - candles[candles.length-2].time) : 3600;
  const FUTURE_BARS = 50;

  const tFirst  = candles[0].time;
  const tLast   = candles[candles.length-1].time;
  const tFuture = tLast + barInterval * FUTURE_BARS;
  const tPast   = Math.max(0, tFirst - barInterval * FUTURE_BARS);

  function mkLine(pts, opts={}) {
    const s = chart.addLineSeries({
      color: opts.color || C,
      lineWidth: opts.width || lw,
      lineStyle: opts.style !== undefined ? opts.style : ls,
      priceLineVisible: false,
      lastValueVisible: opts.lastValue !== undefined ? opts.lastValue : true,
      crosshairMarkerVisible: false,
    });
    s.setData(pts);
    d.series.push(s);
    return s;
  }

  if (d.type === 'hline') {
    // Rayo horizontal como en TV: nace en el punto donde se dibujó y crece
    // infinito solo hacia la derecha — no hacia atrás, no las dos puntas.
    mkLine([{time:d.p1.time, value:d.p1.price},{time:tFuture, value:d.p1.price}]);

  } else if (d.type === 'trendline') {
    const rawT1  = d.p1.time;
    const rawT2  = d.p2.time;
    const rawP1  = d.p1.price;
    const rawP2  = d.p2.price;
    const slope  = (rawT2 !== rawT1) ? (rawP2 - rawP1) / (rawT2 - rawT1) : 0;

    let t1 = rawT1, t2 = rawT2, p1 = rawP1, p2 = rawP2;

    if (d.extLeft)  { t1 = tPast;   p1 = rawP1 + slope * (tPast - rawT1);   }
    if (d.extRight) { t2 = tFuture; p2 = rawP2 + slope * (tFuture - rawT2); }

    mkLine([{time:t1,value:p1},{time:t2,value:p2}]);

  } else if (d.type === 'rect') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    const t1 = Math.min(d.p1.time, d.p2.time);
    const t2_raw = Math.max(d.p1.time, d.p2.time);
    const t2 = d.extRight ? tFuture : t2_raw;

    const mkR = (pts) => {
      const s = chart.addLineSeries({ color: C+'aa', lineWidth:lw, lineStyle:ls, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
      s.setData(pts); d.series.push(s); return s;
    };
    mkR([{time:t1,value:hi},{time:t2,value:hi}]);
    mkR([{time:t1,value:lo},{time:t2,value:lo}]);
    mkR([{time:t1,value:lo},{time:t1,value:hi}]);
    mkR([{time:t2,value:lo},{time:t2,value:hi}]);

    // Relleno (como TV): un <rect> en la capa SVG, no es parte del chart,
    // así que hay que reposicionarlo cada frame igual que la línea vertical.
    if (!(d.fillEl instanceof Element)) {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      window._drawingLayerSvg.insertBefore(r, window._drawingLayerSvg.firstChild);
      d.fillEl = r;
    }
    d.fillEl.setAttribute('fill', C);
    d.fillEl.setAttribute('fill-opacity', '0.12');
    syncRectFill(d);

  } else if (d.type === 'fib') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    if (!d.levels) d.levels = cloneFibLevels();
    const rawT1 = Math.min(d.p1.time, d.p2.time), rawT2 = Math.max(d.p1.time, d.p2.time);
    const t1 = d.extLeft  ? tPast   : rawT1;
    const t2 = d.extRight ? tFuture : rawT2;
    d.levels.filter(lv => lv.on).forEach(lv => {
      const val = hi - (hi - lo) * lv.value;
      const s = mkLine([{time:t1,value:val},{time:t2,value:val}], { color: lv.color+'cc', style: ls, lastValue: true });
      s.applyOptions({ title: `${(lv.value*100).toFixed(1)}%` });
    });

  } else if (d.type === 'vline') {
    // No es una serie del chart (una línea vertical no se puede expresar como
    // "tiempo -> valor" único) — se dibuja directo en la capa SVG y se
    // reposiciona en cada frame, igual que las etiquetas de texto.
    if (!(d.vLineEl instanceof Element)) {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      window._drawingLayerSvg.appendChild(line);
      d.vLineEl = line;
    }
    const dash = ls===1?'6,4':ls===2?'2,3':'none';
    d.vLineEl.setAttribute('stroke', C);
    d.vLineEl.setAttribute('stroke-width', lw);
    d.vLineEl.setAttribute('stroke-dasharray', dash);
    syncVLine(d);
  }

  d.series.forEach(s => { s._drawingId = d.id; });
}

function highlightSelectedSvg(id) {
  clearSvgHighlights();
  requestAnimationFrame(() => {
    const d = drawings.find(x => x.id === id);
    if (!d || !window._drawingLayerSvg) return;
    const svg = window._drawingLayerSvg;
    const container = document.getElementById('chart-container');

    function priceToY(price) { return candleSeries.priceToCoordinate(price); }
    function timeToX(time)  { return chart.timeScale().timeToCoordinate(time); }

    function addHandle(x, y, dId, role) {
      if (x === null || y === null) return;
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5);
      c.classList.add('drawing-handle');
      c.dataset.drawingId = dId;
      c.dataset.role = role;
      svg.appendChild(c);
      d.svgEls.push(c);
    }

    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      const w = container.clientWidth;
      addHandle(w * 0.2, y, id, 'price');
      addHandle(w * 0.5, y, id, 'price');
      addHandle(w * 0.8, y, id, 'price');
    } else if (d.type === 'trendline' || d.type === 'fib') {
      addHandle(timeToX(d.p1.time), priceToY(d.p1.price), id, 'p1');
      addHandle(timeToX(d.p2.time), priceToY(d.p2.price), id, 'p2');
    } else if (d.type === 'rect') {
      const hi = Math.max(d.p1.price, d.p2.price);
      const lo = Math.min(d.p1.price, d.p2.price);
      const t1 = Math.min(d.p1.time, d.p2.time);
      const t2 = Math.max(d.p1.time, d.p2.time);
      addHandle(timeToX(t1), priceToY(hi), id, 't1hi');
      addHandle(timeToX(t2), priceToY(lo), id, 't2lo');
      addHandle(timeToX(t1), priceToY(lo), id, 't1lo');
      addHandle(timeToX(t2), priceToY(hi), id, 't2hi');
      // Como en TV: también una manija en el medio de cada lado, para
      // estirar un solo borde sin mover el opuesto.
      const xMid = (timeToX(t1)+timeToX(t2))/2, yMid = (priceToY(hi)+priceToY(lo))/2;
      addHandle(xMid, priceToY(hi), id, 'top');
      addHandle(xMid, priceToY(lo), id, 'bottom');
      addHandle(timeToX(t1), yMid, id, 'left');
      addHandle(timeToX(t2), yMid, id, 'right');
    } else if (d.type === 'vline') {
      addHandle(timeToX(d.p1.time), container.clientHeight * 0.5, id, 'vtime');
    }
  });
}

// Aplica el arrastre de una "manija" (handle) según su rol — normaliza
// rect/fib a {t1,t2,hi,lo} en vez de arrastrar p1/p2 crudos, porque cuál
// punto es "p1" vs "p2" es ambiguo una vez que el usuario invirtió la forma.
function applyHandleDrag(d, role, price, time) {
  if (d.type === 'hline') {
    d.p1.price = price; d.p2.price = price;
  } else if (d.type === 'trendline') {
    if (role === 'p1') { d.p1.price = price; d.p1.time = time; }
    else { d.p2.price = price; d.p2.time = time; }
  } else if (d.type === 'fib') {
    if (role === 'p1') { d.p1.price = price; d.p1.time = time; }
    else { d.p2.price = price; d.p2.time = time; }
    const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    d.p1.price = hi; d.p2.price = lo;
  } else if (d.type === 'rect') {
    let hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    let t1 = Math.min(d.p1.time, d.p2.time), t2 = Math.max(d.p1.time, d.p2.time);
    if (role === 't1hi') { t1 = time; hi = price; }
    if (role === 't2lo') { t2 = time; lo = price; }
    if (role === 't1lo') { t1 = time; lo = price; }
    if (role === 't2hi') { t2 = time; hi = price; }
    if (role === 'top')    hi = price;
    if (role === 'bottom') lo = price;
    if (role === 'left')   t1 = time;
    if (role === 'right')  t2 = time;
    d.p1 = { time: Math.min(t1,t2), price: Math.max(hi,lo) };
    d.p2 = { time: Math.max(t1,t2), price: Math.min(hi,lo) };
  } else if (d.type === 'vline') {
    d.p1.time = time; d.p2.time = time;
  }
}

function clearSvgHighlights() {
  if (!window._drawingLayerSvg) return;
  window._drawingLayerSvg.querySelectorAll('.drawing-handle').forEach(el => el.remove());
}

// ══════════════════════════════════════════════════════════
//  CHART INIT
// ══════════════════════════════════════════════════════════
function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: { background:{ color:'#0a0a0c' }, textColor:'#8888a8', fontFamily:"'DM Mono', monospace", fontSize:11, attributionLogo:false },
    grid:   { vertLines:{color:'#18182a',style:1}, horzLines:{color:'#18182a',style:1} },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color:'#c9a84c55', labelBackgroundColor:'#1e1e2a' },
      horzLine: { color:'#c9a84c55', labelBackgroundColor:'#1e1e2a' },
    },
    rightPriceScale: { borderColor:'#222230', scaleMargins:{top:0.08,bottom:0.18} },
    timeScale: { borderColor:'#222230', timeVisible:true, secondsVisible:false, rightOffset:8, barSpacing:10 },
    watermark: { visible:true, fontSize:52, horzAlign:'center', vertAlign:'center', color:'rgba(201,168,76,0.03)', text:'ZENTINEL' },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#909090',
    borderUpColor:'#8a8a8a', borderDownColor:'#8a8a8a',
    wickUpColor:'#8a8a8a', wickDownColor:'#8a8a8a',
  });

  volumeSeries = chart.addHistogramSeries({
    color:'#c9a84c22', priceFormat:{type:'volume'}, priceScaleId:'vol',
  });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82,bottom:0} });

  chart.subscribeCrosshairMove(param => {
    const info = document.getElementById('crosshair-info');
    if (!param.time || !param.seriesData) { info.style.display='none'; return; }
    const d = param.seriesData.get(candleSeries);
    if (!d) { info.style.display='none'; return; }
    info.style.display='block';
    info.innerHTML = `O <span>${fmt(d.open)}</span>  H <span>${fmt(d.high)}</span>  L <span>${fmt(d.low)}</span>  C <span>${fmt(d.close)}</span>`;
    updateTopbarOHLCV(d);
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    clearSvgHighlights();
    if (selectedDrawingId) highlightSelectedSvg(selectedDrawingId);
  }).observe(container);

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range && range.from < 50) loadMoreHistory();
  });

  // El badge y las etiquetas de texto se re-posicionan en cada frame (en vez
  // de perseguir cada gesto posible: zoom, pan, arrastre del eje de precio).
  (function badgeRafLoop(){
    if (window._lastCandles){ const l=window._lastCandles[window._lastCandles.length-1]; positionCountdownBadge(l.close,l.open); }
    drawings.forEach(d=>{
      if (window._dragSession && window._dragSession.drawing===d) return;
      if (d.type==='text' && d.label) {
        const x=chart.timeScale().timeToCoordinate(d.p1.time), y=candleSeries.priceToCoordinate(d.p1.price);
        d.label.style.display = (x===null||y===null) ? 'none' : 'block';
        if (x!==null&&y!==null){ d.label.style.left=(x+6)+'px'; d.label.style.top=(y-10)+'px'; }
      } else if (d.type==='vline') {
        syncVLine(d);
      } else if (d.type==='rect') {
        syncRectFill(d);
      }
    });
    requestAnimationFrame(badgeRafLoop);
  })();
}

// ══════════════════════════════════════════════════════════
//  DRAWING LAYER
// ══════════════════════════════════════════════════════════
function initDrawingLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._drawingLayerSvg = svg;

  let previewEl = null;
  let drawStart = null;

  function syncSvgSize() {
    svg.setAttribute('width',  container.clientWidth);
    svg.setAttribute('height', container.clientHeight);
  }
  new ResizeObserver(syncSvgSize).observe(container);
  syncSvgSize();

  function clearPreview() { if (previewEl) { previewEl.remove(); previewEl=null; } }

  function getCoords(e) {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const price = candleSeries.coordinateToPrice(y);
    let time = chart.timeScale().coordinateToTime(x);
    const candles = window._lastCandles || [];
    if (time === null && candles.length) {
      const bi = candles.length>1 ? candles[candles.length-1].time - candles[candles.length-2].time : 3600;
      const lastX = chart.timeScale().timeToCoordinate(candles[candles.length-1].time);
      const firstX = chart.timeScale().timeToCoordinate(candles[0].time);
      if (lastX !== null && x > lastX) {
        const barsOut = Math.round((x - lastX) / (chart.timeScale().options().barSpacing || 10));
        time = candles[candles.length-1].time + bi * Math.max(1, barsOut);
      } else {
        time = (x <= (firstX||0)) ? candles[0].time : candles[candles.length-1].time;
      }
    }
    return { x, y, price, time };
  }

  // Shift mientras se dibuja una trend line: la fuerza a quedar perfectamente
  // horizontal o vertical (como en TV), según hacia qué lado se movió más.
  function shiftSnap(e, start, cur) {
    if (!e.shiftKey) return cur;
    const dx = Math.abs(cur.x - start.x), dy = Math.abs(cur.y - start.y);
    const snapHorizontal = dx > dy;
    const x = snapHorizontal ? cur.x : start.x;
    const y = snapHorizontal ? start.y : cur.y;
    let time = snapHorizontal ? cur.time : start.time;
    const price = snapHorizontal ? start.price : cur.price;
    return { x, y, price, time };
  }

  function updateSvgCapture() {
    const tool = STATE.activeTool;
    const isDrawTool = !['cursor','cross'].includes(tool);
    svg.style.pointerEvents = isDrawTool ? 'all' : 'none';
    svg.style.cursor = isDrawTool ? (tool==='text'?'text':'crosshair') : '';
  }

  const _origSetTool = window.setTool;
  window.setTool = function(btn, name) {
    _origSetTool(btn, name);
    updateSvgCapture();
  };

  function priceToY(p) { return candleSeries.priceToCoordinate(p); }
  function timeToX(t)  { return chart.timeScale().timeToCoordinate(t); }
  function distToSegment(x1,y1,x2,y2,px,py) {
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    if (len2===0) return Math.hypot(px-x1,py-y1);
    let t = ((px-x1)*dx+(py-y1)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  function isClickOnDrawing(d, mx, my) {
    const THRESH = 8;
    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      if (y===null) return false;
      return Math.abs(my-y) < THRESH;
    }
    if (d.type === 'trendline') {
      const x1=timeToX(d.p1.time), y1=priceToY(d.p1.price);
      const x2=timeToX(d.p2.time), y2=priceToY(d.p2.price);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return distToSegment(x1,y1,x2,y2,mx,my) < THRESH;
    }
    if (d.type === 'rect' || d.type === 'fib') {
      const hi=Math.max(d.p1.price,d.p2.price), lo=Math.min(d.p1.price,d.p2.price);
      const t1=Math.min(d.p1.time,d.p2.time),   t2=Math.max(d.p1.time,d.p2.time);
      const x1=timeToX(t1), x2=timeToX(t2);
      const y1=priceToY(hi), y2=priceToY(lo);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      if (d.type === 'rect') return (
        distToSegment(x1,y1,x2,y1,mx,my)<THRESH||
        distToSegment(x1,y2,x2,y2,mx,my)<THRESH||
        distToSegment(x1,y1,x1,y2,mx,my)<THRESH||
        distToSegment(x2,y1,x2,y2,mx,my)<THRESH
      );
      // fib: cualquiera de las líneas de nivel (las que están activas) cuenta como "cuerpo"
      return (d.levels||cloneFibLevels()).filter(lv=>lv.on).some(lv=>{
        const y = priceToY(hi-(hi-lo)*lv.value);
        return y!==null && Math.abs(my-y)<THRESH && mx>=Math.min(x1,x2)-2 && mx<=Math.max(x1,x2)+2;
      });
    }
    if (d.type === 'text' && d.label) {
      const r = d.label.getBoundingClientRect();
      const cr = container.getBoundingClientRect();
      return mx>=r.left-cr.left-4 && mx<=r.right-cr.left+4 && my>=r.top-cr.top-4 && my<=r.bottom-cr.top+4;
    }
    if (d.type === 'vline') {
      const x = timeToX(d.p1.time);
      return x!==null && Math.abs(mx-x) < THRESH;
    }
    return false;
  }

  // Manija bajo el mouse del dibujo seleccionado (si hay uno), o null.
  function hitTestHandle(mx, my) {
    const d = getSelected();
    if (!d || !d.svgEls) return null;
    for (const el of d.svgEls) {
      if (!el.dataset || !el.dataset.role) continue;
      const x = parseFloat(el.getAttribute('cx')), y = parseFloat(el.getAttribute('cy'));
      if (Math.hypot(mx-x, my-y) < 9) return { drawing: d, role: el.dataset.role };
    }
    return null;
  }

  // ── Selección + arrastre (mover cuerpo entero / estirar una punta) ──
  window._dragSession = null; // { kind:'handle'|'body', drawing, role, startPrice, startTime, origP1, origP2 }

  // capture:true + stopPropagation: si no, el canvas del chart (debajo de
  // esta capa) también recibe el mismo mousedown/mousemove y arranca su
  // propio pan/zoom al mismo tiempo que arrastramos el dibujo — por eso
  // "el gráfico se movía solo" al mover una línea.
  container.addEventListener('mousedown', e => {
    if (STATE.activeTool !== 'cursor') return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    const handleHit = hitTestHandle(mx, my);
    if (handleHit) {
      e.preventDefault(); e.stopPropagation();
      window._dragSession = { kind:'handle', drawing:handleHit.drawing, role:handleHit.role };
      return;
    }

    let hit = null;
    for (const d of drawings) {
      if (d.locked) continue;
      if (isClickOnDrawing(d, mx, my)) { hit = d; break; }
    }
    if (hit) {
      e.preventDefault(); e.stopPropagation();
      selectDrawing(hit.id);
      const { price, time } = getCoords(e);
      window._dragSession = {
        kind:'body', drawing:hit, startPrice:price, startTime:time,
        origP1:{...hit.p1}, origP2: hit.p2?{...hit.p2}:null,
        labelLeft: hit.label?parseFloat(hit.label.style.left):0,
        labelTop:  hit.label?parseFloat(hit.label.style.top):0,
      };
    } else {
      deselectDrawing();
    }
  }, { capture:true });

  container.addEventListener('mousemove', e => {
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    if (window._dragSession) {
      e.preventDefault(); e.stopPropagation();
      const d = window._dragSession.drawing;
      if (d.locked) return;
      const { price, time } = getCoords(e);

      if (window._dragSession.kind === 'handle') {
        applyHandleDrag(d, window._dragSession.role, price, time);
        redrawDrawing(d);
      } else if (d.type === 'text') {
        d.label.style.left = (mx - 6) + 'px';
        d.label.style.top  = (my - 10) + 'px';
      } else if (price!==null && time!==null) {
        const dPrice = price - window._dragSession.startPrice;
        const dTime  = time  - window._dragSession.startTime;
        d.p1.price = window._dragSession.origP1.price + dPrice;
        d.p1.time  = window._dragSession.origP1.time  + dTime;
        if (window._dragSession.origP2) {
          d.p2.price = window._dragSession.origP2.price + dPrice;
          d.p2.time  = window._dragSession.origP2.time  + dTime;
        }
        redrawDrawing(d);
      }
      return;
    }

    // Sin arrastre activo: feedback de cursor al pasar por encima
    if (STATE.activeTool === 'cursor') {
      if (hitTestHandle(mx, my)) { container.style.cursor = 'crosshair'; return; }
      const over = drawings.some(d => !d.locked && isClickOnDrawing(d, mx, my));
      container.style.cursor = over ? 'move' : '';
    }
  }, { capture:true });

  window.addEventListener('mouseup', e => {
    if (window._dragSession) { e.preventDefault(); e.stopPropagation(); }
    if (window._dragSession && window._dragSession.kind === 'body' && window._dragSession.drawing.type === 'text') {
      const d = window._dragSession.drawing;
      const x = parseFloat(d.label.style.left)-6, y = parseFloat(d.label.style.top)+10;
      d.p1.price = candleSeries.coordinateToPrice(y) ?? d.p1.price;
      d.p1.time  = chart.timeScale().coordinateToTime(x) ?? d.p1.time;
    }
    if (window._dragSession) highlightSelectedSvg(selectedDrawingId);
    window._dragSession = null;
  }, { capture:true });

  svg.addEventListener('mousedown', e => {
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x, y, price, time } = getCoords(e);
    if (price === null || time === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;

    if (tool === 'text') {
      // Como en TV: se escribe directo sobre el chart, no un prompt() nativo.
      const label = document.createElement('div');
      label.contentEditable = 'true';
      label.dataset.placeholder = 'Añadir texto';
      label.style.cssText = `position:absolute;left:${x+6}px;top:${y-10}px;color:${toolDefaults.color};font-family:var(--font-mono);font-size:${11+toolDefaults.width}px;pointer-events:auto;z-index:5;white-space:nowrap;background:rgba(10,10,12,.7);padding:1px 4px;border-radius:3px;outline:1px solid ${toolDefaults.color}88;min-width:10px;cursor:text;`;
      container.appendChild(label);

      const d = { id:genId(), type:'text', series:[], svgEls:[], label, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price,time}, p2:{price,time} };
      drawings.push(d);
      selectDrawing(d.id);
      backToCursor();

      label.focus();
      const commitText = () => {
        label.contentEditable = 'false';
        label.style.pointerEvents = 'none';
        label.style.outline = 'none';
        label.style.cursor = '';
        if (!label.textContent.trim()) { removeDrawingById(d.id); deselectDrawing(); }
      };
      label.addEventListener('blur', commitText, { once:true });
      label.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); label.blur(); } });
      return;
    }

    drawStart = { x, y, price, time };
  });

  svg.addEventListener('mousemove', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x: x2, y: y2 } = getCoords(e);
    clearPreview();

    const GOLDA = toolDefaults.color + '88';

    if (tool === 'hline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', 0); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', container.clientWidth); line.setAttribute('y2', drawStart.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, { x:x2, y:y2 });
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', snapped.x); line.setAttribute('y2', snapped.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'rect') {
      const rx=Math.min(drawStart.x,x2), ry=Math.min(drawStart.y,y2);
      const rw=Math.abs(x2-drawStart.x), rh=Math.abs(y2-drawStart.y);
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',rx); rect.setAttribute('y',ry); rect.setAttribute('width',rw); rect.setAttribute('height',rh);
      rect.setAttribute('stroke', GOLDA); rect.setAttribute('stroke-width', toolDefaults.width);
      rect.setAttribute('stroke-dasharray','4,3'); rect.setAttribute('fill','rgba(201,168,76,0.06)');
      svg.appendChild(rect); previewEl = rect;
    } else if (tool === 'fib') {
      const ry=Math.min(drawStart.y,y2), rh=Math.abs(y2-drawStart.y);
      const group = document.createElementNS('http://www.w3.org/2000/svg','g');
      const fibColors=['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
      [0,0.236,0.382,0.5,0.618,0.786,1].forEach((lvl,i) => {
        const ly = ry + rh * lvl;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',0); line.setAttribute('y1',ly); line.setAttribute('x2',container.clientWidth); line.setAttribute('y2',ly);
        line.setAttribute('stroke',fibColors[i]+'bb'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','3,3');
        group.appendChild(line);
      });
      svg.appendChild(group); previewEl = group;
    } else if (tool === 'vline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', 0);
      line.setAttribute('x2', drawStart.x); line.setAttribute('y2', container.clientHeight - chart.timeScale().height());
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    }
  });

  svg.addEventListener('mouseup', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    clearPreview();

    const coordsNow = getCoords(e);
    let { price: price2, time: time2 } = coordsNow;
    if (price2===null||time2===null) { drawStart=null; return; }
    const candles = window._lastCandles||[];
    if (!candles.length) { drawStart=null; return; }

    let d = null;

    if (tool === 'hline') {
      d = { id:genId(), type:'hline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawStart.price,time:drawStart.time} };
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, coordsNow);
      price2 = snapped.price; time2 = snapped.time;
      const t1 = Math.min(drawStart.time, time2);
      const t2 = Math.max(drawStart.time, time2);
      if (t1 === t2 && price2 === drawStart.price) { drawStart=null; return; } // clic sin arrastre real
      const p1 = drawStart.time <= time2 ? drawStart.price : price2;
      const p2 = drawStart.time <= time2 ? price2 : drawStart.price;
      d = { id:genId(), type:'trendline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:p1,time:t1}, p2:{price:p2,time:t2} };
    } else if (tool === 'rect') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      const t1=Math.min(drawStart.time,time2),   t2=Math.max(drawStart.time,time2);
      if (t1===t2||Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'rect', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:t1}, p2:{price:price2,time:t2} };
    } else if (tool === 'fib') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      if (Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'fib', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, levels:cloneFibLevels(), p1:{price:hi,time:drawStart.time}, p2:{price:lo,time:time2} };
    } else if (tool === 'vline') {
      d = { id:genId(), type:'vline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price:null,time:drawStart.time}, p2:{price:null,time:drawStart.time} };
    }

    if (d) {
      drawings.push(d);
      buildDrawingOnChart(d);
      selectDrawing(d.id);
      backToCursor();
    }

    drawStart = null;
  });

  window.addEventListener('mouseup', () => {
    if (drawStart) { clearPreview(); drawStart=null; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { deselectDrawing(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawingId) {
      if (document.activeElement.tagName === 'INPUT') return;
      onDtbDelete();
    }
  });
}

// ══════════════════════════════════════════════════════════
//  INDICATOR MATH
// ══════════════════════════════════════════════════════════
function ema(data,period){const k=2/(period+1);let prev=null;return data.map(d=>{if(prev===null){prev=d.close;return{time:d.time,value:d.close};}const val=d.close*k+prev*(1-k);prev=val;return{time:d.time,value:val};});}
function sma(data,period){return data.map((d,i)=>{if(i<period-1)return{time:d.time,value:null};const sum=data.slice(i-period+1,i+1).reduce((a,v)=>a+v.close,0);return{time:d.time,value:sum/period};}).filter(d=>d.value!==null);}
function vwap(data){let cumPV=0,cumV=0;return data.map(d=>{const tp=(d.high+d.low+d.close)/3;cumPV+=tp*(d.volume||1);cumV+=(d.volume||1);return{time:d.time,value:cumPV/cumV};});}

// ══════════════════════════════════════════════════════════
//  loadChart  (vía mt5_bridge/bridge_server.py -> MT5/Axi)
// ══════════════════════════════════════════════════════════
const BRIDGE_URL = 'http://localhost:8787';

// Redibuja toda la serie (velas reales + puntos fantasma a futuro para el
// eje de horas). series.update() no sirve acá: exige que cada actualización
// vaya hacia adelante en el tiempo, y los fantasmas quedan después de la
// vela en formación, así que "actualizar in place" la vela actual rompía
// silenciosamente. setData() no tiene ese problema y no mueve el zoom.
function renderSeries(timeframe){
  const candles=window._lastCandles;
  const last=candles[candles.length-1];
  candleSeries.setData(candles.concat(futureWhitespace(last.time, timeframe, 15)));
  volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:c.close>=c.open?'rgba(38,166,154,.25)':'rgba(239,83,80,.2)'})));
}

// Scroll infinito hacia atrás: cuando te acercás al borde izquierdo de lo
// ya cargado, pide más velas viejas al puente (que a su vez le pide a MT5
// el tramo anterior) y las pega adelante sin mover la vista de un salto.
let _loadingMoreHistory = false;
async function loadMoreHistory(){
  if (_loadingMoreHistory) return;
  const candles = window._lastCandles;
  if (!candles || !candles.length || candles.length > 8000) return;
  _loadingMoreHistory = true;
  try {
    const oldest = candles[0].time;
    const url = `${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(STATE.symbol)}&interval=${STATE.timeframe}&bars=300&before=${oldest}`;
    const res = await fetch(url);
    const json = await res.json();
    if (json.error || !Array.isArray(json.bars) || json.bars.length===0) return;
    const older = json.bars.filter(b => b.time < oldest);
    if (older.length===0) return;

    const addedCount = older.length;
    window._lastCandles = older.concat(candles);
    renderSeries(STATE.timeframe);

    // mismo bar en la misma posición de pantalla, aunque el array creció a la izquierda
    const range = chart.timeScale().getVisibleLogicalRange();
    if (range) chart.timeScale().setVisibleLogicalRange({ from: range.from+addedCount, to: range.to+addedCount });
  } catch(e) {
    // sin red/MT5 un instante: se reintenta solo la próxima vez que se scrollee
  } finally {
    _loadingMoreHistory = false;
  }
}

// Cierre de vela: pega solo la(s) vela(s) nueva(s) sin recargar todo el chart
// (sin overlay, sin refit de zoom — eso es lo que se "notaba").
async function appendNewBar(symbol, timeframe){
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=3`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)throw new Error(json.error||'sin datos');

    const prevLastTime=window._lastCandles[window._lastCandles.length-1].time;
    json.bars.forEach(bar=>{
      if(bar.time<prevLastTime)return; // vela vieja, ya la tenemos
      if(bar.time===window._lastCandles[window._lastCandles.length-1].time){
        window._lastCandles[window._lastCandles.length-1]=bar;
      } else {
        window._lastCandles.push(bar);
      }
    });
    renderSeries(timeframe);

    const last=window._lastCandles[window._lastCandles.length-1];
    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,window._lastCandles.length,window._lastCandles[0],last);
    updateWLPrice(symbol,last.close);

    startCountdown(timeframe, last.time, json.serverTime);
  } catch(err){
    // si falla, reintentamos en el próximo tick del countdown (recarga completa como respaldo)
    loadChart(symbol, timeframe);
  }
}

function refreshChart(){
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  loadChart(STATE.symbol, STATE.timeframe).finally(()=>btn.classList.remove('spinning'));
}

async function loadChart(symbol, timeframe) {
  setLoaderMsg(`Loading ${symbol} ${timeframe}…`);showOverlay(true);setStatus('loading','● loading…');

  const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=500`;

  try {
    const res=await fetch(url);
    const json=await res.json();
    if(json.error)throw new Error(json.error);
    const candles=json.bars;
    if(!Array.isArray(candles)||candles.length===0)throw new Error('sin datos para '+symbol);

    window._lastCandles=candles;
    renderSeries(timeframe);
    chart.timeScale().applyOptions({ rightOffset: 15, barSpacing: 8 });
    chart.timeScale().scrollToRealTime();

    Object.keys(overlays).forEach(name=>{chart.removeSeries(overlays[name]);delete overlays[name];});
    STATE.indicators.forEach(name=>addIndicatorSeries(name));

    drawings.forEach(d => {
      d.series.forEach(s=>{try{chart.removeSeries(s);}catch(e){}});
      d.series=[];
      buildDrawingOnChart(d);
    });
    if(selectedDrawingId)highlightSelectedSvg(selectedDrawingId);

    const last=candles[candles.length-1];
    const prev=candles[candles.length-2];
    updateTopbarPrice(last,prev);
    updateTopbarOHLCV(last);
    updateStatusBar(symbol,timeframe,candles.length,candles[0],last);
    updateWLPrice(symbol,last.close);

    document.getElementById('symbol-input').value=symbol;
    document.title=`${symbol} · Zentinel`;
    setStatus('ok','● live');
    showOverlay(false);

    startCountdown(timeframe, last.time, json.serverTime);

  } catch(err) {
    setLoaderMsg('⚠ '+err.message);
    setStatus('err','● error');
  }
}

// ══════════════════════════════════════════════════════════
//  COUNTDOWN — tiempo restante hasta el cierre de la vela actual
//  (usa json.serverTime, el reloj de MT5/broker, no el del navegador)
// ══════════════════════════════════════════════════════════
const TF_SECONDS = {
  '1min':60,'2min':120,'3min':180,'4min':240,'5min':300,'6min':360,'10min':600,'12min':720,'15min':900,'20min':1200,'30min':1800,
  '1h':3600,'2h':7200,'3h':10800,'4h':14400,'6h':21600,'8h':28800,'12h':43200,
};
let _countdownTimer=null;

// Puntos "fantasma" (sin OHLC) después de la última vela, solo para que el
// eje de tiempo sepa qué hora va en el margen vacío de la derecha y la dibuje.
function futureWhitespace(lastTime, timeframe, count){
  const pts=[]; let t=lastTime;
  for(let i=0;i<count;i++){
    const nt=nextCloseTime(timeframe, t);
    if(nt===null)break;
    pts.push({time:nt});
    t=nt;
  }
  return pts;
}

function nextCloseTime(timeframe, lastBarTime){
  if(TF_SECONDS[timeframe]) return lastBarTime + TF_SECONDS[timeframe];
  const d=new Date(lastBarTime*1000);
  if(timeframe==='1day'){ d.setUTCHours(24,0,0,0); return Math.floor(d.getTime()/1000); }
  if(timeframe==='1week'){
    d.setUTCHours(0,0,0,0);
    const addDays=((8-d.getUTCDay())%7)||7;
    d.setUTCDate(d.getUTCDate()+addDays);
    return Math.floor(d.getTime()/1000);
  }
  if(timeframe==='1month'){
    const nd=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1, 0,0,0));
    return Math.floor(nd.getTime()/1000);
  }
  return null;
}

function positionCountdownBadge(lastClose, lastOpen){
  const badge=document.getElementById('price-countdown-badge');
  if(!candleSeries||lastClose==null){ badge.style.display='none'; return; }
  const y=candleSeries.priceToCoordinate(lastClose);
  if(y==null){ badge.style.display='none'; return; }
  badge.style.display='block';
  badge.style.top=(y+9)+'px';
  badge.classList.toggle('up', lastClose>=lastOpen);
  badge.classList.toggle('dn', lastClose<lastOpen);
}

let _formingFetchInFlight=false;
async function refreshFormingCandle(symbol, timeframe){
  if(_formingFetchInFlight || !window._lastCandles) return;
  _formingFetchInFlight=true;
  try{
    const url=`${BRIDGE_URL}/ohlcv?symbol=${encodeURIComponent(symbol)}&interval=${timeframe}&bars=1`;
    const res=await fetch(url);
    const json=await res.json();
    if(json.error||!Array.isArray(json.bars)||json.bars.length===0)return;
    const bar=json.bars[0];
    const last=window._lastCandles[window._lastCandles.length-1];
    if(bar.time!==last.time)return; // ya cerró — eso lo maneja appendNewBar

    window._lastCandles[window._lastCandles.length-1]=bar;
    renderSeries(timeframe);

    const prev=window._lastCandles[window._lastCandles.length-2];
    updateTopbarPrice(bar,prev);
    updateTopbarOHLCV(bar);
    updateWLPrice(symbol,bar.close);
    positionCountdownBadge(bar.close,bar.open);
  } catch(e){
    // red caída un segundo: el próximo tick reintenta solo
  } finally {
    _formingFetchInFlight=false;
  }
}

function startCountdown(timeframe, lastBarTime, serverTimeAtLoad){
  clearInterval(_countdownTimer);
  const badge=document.getElementById('price-countdown-badge');
  const close=nextCloseTime(timeframe, lastBarTime);
  const loadedAtMs=performance.now();

  function tick(){
    const elapsed=(performance.now()-loadedAtMs)/1000;
    const nowServer=serverTimeAtLoad+elapsed;
    if(close!==null){
      let remain=Math.max(0, Math.round(close-nowServer));
      if(remain<=0){ clearInterval(_countdownTimer); appendNewBar(STATE.symbol, STATE.timeframe); return; }
      const h=Math.floor(remain/3600), m=Math.floor((remain%3600)/60), s=remain%60;
      badge.textContent = h>0
        ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
        : `${m}:${String(s).padStart(2,'0')}`;
      badge.classList.toggle('soon', remain<=10);
    }
    refreshFormingCandle(STATE.symbol, timeframe);
  }
  tick();
  _countdownTimer=setInterval(tick,1000);
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
(function boot(){
  initChart();
  initDrawingLayer();
  renderWatchlist();
  renderIndList();
  setActiveTF(STATE.timeframe);
  document.getElementById('symbol-input').value=STATE.symbol;

  const badge=document.getElementById('api-badge');
  fetch(`${BRIDGE_URL}/health`).then(r=>r.ok?r.json():Promise.reject()).then(()=>{
    badge.textContent='MT5 BRIDGE ✓';badge.classList.add('connected');
    loadChart(STATE.symbol,STATE.timeframe);
  }).catch(()=>{
    badge.textContent='BRIDGE OFF';badge.classList.remove('connected');
    showLoader('No conecta con el puente MT5 — corré bridge_server.py y abrí MT5 con el Service ZentinelBridge');
    setStatus('err','● sin puente');
  });
})();
