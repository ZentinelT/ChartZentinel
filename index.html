];
function cloneFibLevels() { return JSON.parse(JSON.stringify(DEFAULT_FIB_LEVELS)); }

function lwStyle(s) {
  return s == 0 ? 0 : s == 1 ? 1 : 2;
}

function selectDrawing(id) {
  selectedDrawingId = id;
  const d = drawings.find(x => x.id === id);
  if (!d) { hideDrawToolbar(); return; }
  const isPosition = (d.type === 'long' || d.type === 'short');
  document.getElementById('dtb-color-wrap').style.display = isPosition ? 'none' : '';
  document.getElementById('dtb-pos-colors').style.display = isPosition ? 'flex' : 'none';
  if (isPosition) {
    const entryC = d.entryColor||'#e8e8f0', tpC = d.profitColor||'#26a69a', slC = d.lossColor||'#ef5350';
    document.getElementById('dtb-pos-entry-color').value = entryC;
    document.getElementById('dtb-pos-entry-swatch').style.background = entryC;
    document.getElementById('dtb-pos-tp-color').value = tpC;
    document.getElementById('dtb-pos-tp-swatch').style.background = tpC;
    document.getElementById('dtb-pos-sl-color').value = slC;
    document.getElementById('dtb-pos-sl-swatch').style.background = slC;
  } else {
    document.getElementById('dtb-color').value = d.color;
    document.getElementById('dtb-color-swatch').style.background = d.color;
  }
  document.getElementById('dtb-width').value = d.width;
  document.getElementById('dtb-style').value = d.style;
  document.getElementById('dtb-levels').style.display = d.type==='fib' ? '' : 'none';
  const extendApplies = (d.type === 'trendline' || d.type === 'fib' || d.type === 'rect');
  document.getElementById('dtb-ext-left').style.display  = (extendApplies && d.type!=='rect') ? '' : 'none';
  document.getElementById('dtb-ext-right').style.display = extendApplies ? '' : 'none';
  document.getElementById('dtb-ext-left').classList.toggle('active', !!d.extLeft);
  document.getElementById('dtb-ext-right').classList.toggle('active', !!d.extRight);
  document.getElementById('dtb-rect-border').style.display = d.type==='rect' ? '' : 'none';
  document.getElementById('dtb-rect-fill').style.display   = d.type==='rect' ? '' : 'none';
  document.getElementById('dtb-rect-border').classList.toggle('active', d.showBorder !== false);
  document.getElementById('dtb-rect-fill').classList.toggle('active', d.showFill !== false);
  document.getElementById('dtb-lock').classList.toggle('active', !!d.locked);
  showDrawToolbar();
  highlightSelectedSvg(id);
}

function deselectDrawing() {
  selectedDrawingId = null;
  hideDrawToolbar();
  clearSvgHighlights();
}

function showDrawToolbar() { document.getElementById('draw-toolbar').classList.add('visible'); }
function hideDrawToolbar() { document.getElementById('draw-toolbar').classList.remove('visible'); }

function onDtbColorChange(val) {
  document.getElementById('dtb-color-swatch').style.background = val;
  toolDefaults.color = val;
  const d = getSelected();
  if (d && d.type === 'fib') {
    // El fibo no tiene "un" color — son los colores por nivel. Este control
    // pinta todos los niveles del mismo color de una (hay que destildar/
    // editar los que se quieran distintos desde "Levels").
    d.levels.forEach(lv => { lv.color = val; });
    redrawDrawing(d);
    if (document.getElementById('modal-fib-levels').classList.contains('open')) renderFibLevelsRows();
    return;
  }
  applyStyleToSelected({ color: val });
}
function onDtbWidthChange(val) {
  toolDefaults.width = parseInt(val);
  applyStyleToSelected({ width: parseInt(val) });
}
function onDtbStyleChange(val) {
  toolDefaults.style = parseInt(val);
  applyStyleToSelected({ style: parseInt(val) });
}
function onDtbExtend(dir) {
  const d = getSelected(); if (!d) return;
  if (dir === 'left')  { d.extLeft  = !d.extLeft;  document.getElementById('dtb-ext-left').classList.toggle('active',  d.extLeft); }
  if (dir === 'right') { d.extRight = !d.extRight; document.getElementById('dtb-ext-right').classList.toggle('active', d.extRight); }
  redrawDrawing(d);
}
function onDtbLock() {
  const d = getSelected(); if (!d) return;
  d.locked = !d.locked;
  document.getElementById('dtb-lock').classList.toggle('active', d.locked);
}
// La herramienta de posición no tiene un solo "color" como el resto de los
// dibujos — tiene 3 (entrada/TP/SL). `field` es cuál de los 3 tocar.
function onDtbPosColorChange(field, val, inputEl) {
  const d = getSelected(); if (!d || (d.type!=='long' && d.type!=='short')) return;
  inputEl.parentElement.style.background = val;
  d[field] = val;
  redrawDrawing(d);
}
// Solo para 'rect': apaga/prende el borde o el relleno sin tocar el otro.
function onDtbToggleRectPart(field) {
  const d = getSelected(); if (!d || d.type!=='rect') return;
  d[field] = (d[field] === false) ? true : false; // default true -> primer click apaga
  const btnId = field === 'showBorder' ? 'dtb-rect-border' : 'dtb-rect-fill';
  document.getElementById(btnId).classList.toggle('active', d[field] !== false);
  redrawDrawing(d);
}
// ══════════════════════════════════════════════════════════
//  NIVELES DE FIBONACCI (editable por dibujo: agregar/sacar/editar)
// ══════════════════════════════════════════════════════════
function renderFibLevelsRows() {
  const d = getSelected(); if (!d || d.type!=='fib') return;
  if (!d.levels) d.levels = cloneFibLevels();
  const list = document.getElementById('fib-levels-list');
  list.innerHTML = '';
  d.levels.forEach((lv, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--border);';
    row.innerHTML = `
      <input type="checkbox" ${lv.on?'checked':''} onchange="updateFibLevel(${i},'on',this.checked)">
      <input type="color" value="${lv.color}" style="width:28px;height:24px;border:none;background:none;padding:0;cursor:pointer;" onchange="updateFibLevel(${i},'color',this.value)">
      <input type="number" step="0.001" value="${lv.value}" style="flex:1;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:4px;color:var(--text-primary);padding:4px 6px;font-family:var(--font-mono);font-size:12px;" onchange="updateFibLevel(${i},'value',parseFloat(this.value))">
      <span style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;width:48px;text-align:right;">${(lv.value*100).toFixed(1)}%</span>
      <button onclick="removeFibLevel(${i})" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;" title="Remove">×</button>
    `;
    list.appendChild(row);
  });
}
function openFibLevelsModal() {
  const d = getSelected(); if (!d || d.type!=='fib') return;
  renderFibLevelsRows();
  openModal('modal-fib-levels');
}
function updateFibLevel(i, field, val) {
  const d = getSelected(); if (!d || !d.levels[i]) return;
  d.levels[i][field] = val;
  renderFibLevelsRows();
  redrawDrawing(d);
}
function addFibLevel() {
  const d = getSelected(); if (!d) return;
  d.levels.push({ value:0.5, color:'#c9a84c', on:true });
  renderFibLevelsRows();
  redrawDrawing(d);
}
function removeFibLevel(i) {
  const d = getSelected(); if (!d) return;
  d.levels.splice(i,1);
  renderFibLevelsRows();
  redrawDrawing(d);
}
function resetFibLevels() {
  const d = getSelected(); if (!d) return;
  d.levels = cloneFibLevels();
  renderFibLevelsRows();
  redrawDrawing(d);
}

function onDtbClone() {
  const d = getSelected(); if (!d) return;
  const clone = JSON.parse(JSON.stringify({ ...d, id: genId(), series:[], svgEls:[], label:null }));
  clone.p1.price += (d.p2?.price ?? d.p1.price) * 0.001;
  if (clone.p2) clone.p2.price += clone.p1.price * 0.001;
  drawings.push(clone);
  buildDrawingOnChart(clone);
  selectDrawing(clone.id);
}
function onDtbDelete() {
  const d = getSelected(); if (!d) return;
  removeDrawingById(d.id);
  deselectDrawing();
}

function getSelected() { return drawings.find(x => x.id === selectedDrawingId) || null; }

function applyStyleToSelected(patch) {
  const d = getSelected(); if (!d) return;
  Object.assign(d, patch);
  redrawDrawing(d);
}

function redrawDrawing(d) {
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.series = [];
  d.svgEls.forEach(el => el.remove());
  d.svgEls = [];
  buildDrawingOnChart(d);
  highlightSelectedSvg(d.id);
}

// Mientras se arrastra un dibujo (cuerpo o manija), NO lo reconstruimos
// desde cero en cada mousemove — eso implica sacar y volver a meter sus
// series del chart muchas veces por segundo, y ese ir-y-venir hace que el
// right price scale (compartido por TODOS los dibujos) recalcule su
// autoScale a cada rato, lo que se ve como si el resto de los dibujos
// "saltaran" mientras uno se mueve y recién se acomodaran bien al soltar.
// Reusar las mismas series y solo pisarles los datos (setData) evita ese
// parpadeo. Devuelve false (y no toca nada) si la cantidad/forma de series
// ya no coincide con lo que este tipo de dibujo necesita — ahí sí hace
// falta una reconstrucción completa vía redrawDrawing().
function updateDrawingGeometry(d) {
  const candles = window._lastCandles || [];
  if (!candles.length) return false;
  const barInterval = candles.length > 1 ? (candles[candles.length-1].time - candles[candles.length-2].time) : 3600;
  const tFirst = candles[0].time, tLast = candles[candles.length-1].time;
  const FUTURE_BARS = 50;
  const tFuture = tLast + barInterval * FUTURE_BARS;
  const tPast   = Math.max(0, tFirst - barInterval * FUTURE_BARS);
  let ok = false;

  if (d.type === 'hline' && d.series.length === 1) {
    d.series[0].setData([{time:d.p1.time, value:d.p1.price},{time:tFuture, value:d.p1.price}]);
    ok = true;

  } else if (d.type === 'trendline' && d.series.length === 1) {
    const rawT1=d.p1.time, rawT2=d.p2.time, rawP1=d.p1.price, rawP2=d.p2.price;
    const slope = (rawT2 !== rawT1) ? (rawP2 - rawP1) / (rawT2 - rawT1) : 0;
    let t1=rawT1, t2=rawT2, p1=rawP1, p2=rawP2;
    if (d.extLeft)  { t1 = tPast;   p1 = rawP1 + slope * (tPast - rawT1); }
    if (d.extRight) { t2 = tFuture; p2 = rawP2 + slope * (tFuture - rawT2); }
    d.series[0].setData([{time:t1,value:p1},{time:t2,value:p2}]);
    ok = true;

  } else if (d.type === 'rect' && d.series.length === 4) {
    const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    const t1 = Math.min(d.p1.time, d.p2.time);
    const t2 = d.extRight ? tFuture : Math.max(d.p1.time, d.p2.time);
    d.series[0].setData([{time:t1,value:hi},{time:t2,value:hi}]);
    d.series[1].setData([{time:t1,value:lo},{time:t2,value:lo}]);
    d.series[2].setData([{time:t1,value:lo},{time:t1,value:hi}]);
    d.series[3].setData([{time:t2,value:lo},{time:t2,value:hi}]);
    syncRectFill(d);
    ok = true;

  } else if (d.type === 'fib') {
    const levels = (d.levels || []).filter(lv => lv.on);
    if (d.series.length === levels.length) {
      const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
      const rawT1 = Math.min(d.p1.time, d.p2.time), rawT2 = Math.max(d.p1.time, d.p2.time);
      const t1 = d.extLeft  ? tPast   : rawT1;
      const t2 = d.extRight ? tFuture : rawT2;
      levels.forEach((lv,i) => {
        d.series[i].setData([{time:t1,value:hi-(hi-lo)*lv.value},{time:t2,value:hi-(hi-lo)*lv.value}]);
      });
      ok = true;
    }

  } else if (d.type === 'vline') {
    syncVLine(d);
    ok = true;

  } else if ((d.type === 'long' || d.type === 'short') && d.series.length === 3) {
    d.series[0].setData([{time:d.p1.time,value:d.p1.price},{time:d.p2.time,value:d.p1.price}]);
    d.series[1].setData([{time:d.p1.time,value:d.targetPrice},{time:d.p2.time,value:d.targetPrice}]);
    d.series[2].setData([{time:d.p1.time,value:d.p2.price},{time:d.p2.time,value:d.p2.price}]);
    syncPositionTool(d);
    ok = true;
  }

  if (ok) highlightSelectedSvg(d.id);
  return ok;
}

function removeDrawingById(id) {
  const idx = drawings.findIndex(x => x.id === id);
  if (idx === -1) return;
  const d = drawings[idx];
  d.series.forEach(s => { try { chart.removeSeries(s); } catch(e){} });
  d.svgEls.forEach(el => el.remove());
  if (d.label) d.label.remove();
  if (d.vLineEl instanceof Element) d.vLineEl.remove();
  if (d.fillEl instanceof Element) d.fillEl.remove();
  if (d.profitFillEl instanceof Element) d.profitFillEl.remove();
  if (d.lossFillEl instanceof Element) d.lossFillEl.remove();
  if (d.entryTextEl instanceof Element) d.entryTextEl.remove();
  if (d.tpTextEl instanceof Element) d.tpTextEl.remove();
  if (d.slTextEl instanceof Element) d.slTextEl.remove();
  drawings.splice(idx,1);
}

// Vuelve a ubicar la línea vertical de un dibujo (se llama cada frame y
// después de crearla/arrastrarla, porque no sigue el pan/zoom sola).
function syncVLine(d) {
  if (!(d.vLineEl instanceof Element)) return;
  const x = chart.timeScale().timeToCoordinate(d.p1.time);
  // Parar antes de la franja de horas de abajo, para no taparla.
  const h = document.getElementById('chart-container').clientHeight - chart.timeScale().height();
  if (x === null) { d.vLineEl.style.display = 'none'; return; }
  d.vLineEl.style.display = '';
  d.vLineEl.setAttribute('x1', x); d.vLineEl.setAttribute('y1', 0);
  d.vLineEl.setAttribute('x2', x); d.vLineEl.setAttribute('y2', h);
}

function syncRectFill(d) {
  if (!(d.fillEl instanceof Element)) return;
  const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
  const t1 = Math.min(d.p1.time, d.p2.time);
  const t2 = d.extRight ? chart.timeScale().getVisibleRange()?.to ?? d.p2.time : Math.max(d.p1.time, d.p2.time);
  const x1 = chart.timeScale().timeToCoordinate(t1), x2 = chart.timeScale().timeToCoordinate(t2);
  const y1 = candleSeries.priceToCoordinate(hi), y2 = candleSeries.priceToCoordinate(lo);
  if (x1===null||x2===null||y1===null||y2===null) { d.fillEl.style.display='none'; return; }
  d.fillEl.style.display='';
  d.fillEl.setAttribute('x', Math.min(x1,x2)); d.fillEl.setAttribute('y', y1);
  d.fillEl.setAttribute('width', Math.abs(x2-x1)); d.fillEl.setAttribute('height', Math.max(0,y2-y1));
}

// Reubica los 2 rellenos y las 3 etiquetas de una herramienta de posición
// (long/short) — igual que syncRectFill, se llama cada vez que cambia el
// pan/zoom o se arrastra el dibujo.
function syncPositionTool(d) {
  if (!(d.profitFillEl instanceof Element)) return;
  const entry = d.p1.price, stop = d.p2.price, target = d.targetPrice;
  const x1 = chart.timeScale().timeToCoordinate(d.p1.time), x2 = chart.timeScale().timeToCoordinate(d.p2.time);
  const yEntry = candleSeries.priceToCoordinate(entry);
  const yStop  = candleSeries.priceToCoordinate(stop);
  const yTarget= candleSeries.priceToCoordinate(target);
  const hidden = x1===null||x2===null||yEntry===null||yStop===null||yTarget===null;
  [d.profitFillEl, d.lossFillEl, d.entryTextEl, d.tpTextEl, d.slTextEl].forEach(el=>{ if(el) el.style.display = hidden?'none':''; });
  if (hidden) return;

  const xL = Math.min(x1,x2), xR = Math.max(x1,x2), w = xR-xL;
  d.profitFillEl.setAttribute('x', xL); d.profitFillEl.setAttribute('y', Math.min(yEntry,yTarget));
  d.profitFillEl.setAttribute('width', w); d.profitFillEl.setAttribute('height', Math.abs(yEntry-yTarget));
  d.lossFillEl.setAttribute('x', xL); d.lossFillEl.setAttribute('y', Math.min(yEntry,yStop));
  d.lossFillEl.setAttribute('width', w); d.lossFillEl.setAttribute('height', Math.abs(yEntry-yStop));

  const risk = Math.abs(entry-stop), reward = Math.abs(target-entry);
  const rr = risk>0 ? (reward/risk) : 0;
  d.entryTextEl.setAttribute('x', xR+6); d.entryTextEl.setAttribute('y', yEntry);
  d.entryTextEl.textContent = `Entry ${fmt(entry)}`;
  d.tpTextEl.setAttribute('x', xR+6); d.tpTextEl.setAttribute('y', yTarget);
  d.tpTextEl.textContent = `TP ${fmt(target)}  ·  R:R 1:${rr.toFixed(2)}`;
  d.slTextEl.setAttribute('x', xR+6); d.slTextEl.setAttribute('y', yStop);
  d.slTextEl.textContent = `SL ${fmt(stop)}`;
}

function clearDrawings() {
  [...drawings].forEach(d => removeDrawingById(d.id));
  deselectDrawing();
}

function buildDrawingOnChart(d) {
  const candles = window._lastCandles || [];
  if (!candles.length) return;

  const C  = d.color;
  const lw = d.width;
  const ls = lwStyle(d.style);

  const barInterval = candles.length > 1 ? (candles[candles.length-1].time - candles[candles.length-2].time) : 3600;
  const FUTURE_BARS = 50;

  const tFirst  = candles[0].time;
  const tLast   = candles[candles.length-1].time;
  const tFuture = tLast + barInterval * FUTURE_BARS;
  const tPast   = Math.max(0, tFirst - barInterval * FUTURE_BARS);

  function mkLine(pts, opts={}) {
    const s = chart.addLineSeries({
      color: opts.color || C,
      lineWidth: opts.width || lw,
      lineStyle: opts.style !== undefined ? opts.style : ls,
      priceLineVisible: false,
      lastValueVisible: opts.lastValue !== undefined ? opts.lastValue : true,
      crosshairMarkerVisible: false,
      // Un dibujo NO tiene que mover el eje de precio — si no, arrastrar
      // cualquier línea/rect/fib más allá del rango visible hacía que la
      // autoescala del precio se expandiera para "hacerle lugar", lo que
      // comprimía/corría TODAS las velas en vivo mientras arrastrás (y los
      // indicadores, que no se redibujan en cada frame, se quedaban atrás
      // hasta soltar). Esto le dice al chart "no cuentes esta serie para
      // la autoescala".
      autoscaleInfoProvider: () => null,
    });
    s.setData(pts);
    d.series.push(s);
    return s;
  }

  if (d.type === 'hline') {
    // Rayo horizontal como en TV: nace en el punto donde se dibujó y crece
    // infinito solo hacia la derecha — no hacia atrás, no las dos puntas.
    mkLine([{time:d.p1.time, value:d.p1.price},{time:tFuture, value:d.p1.price}]);

  } else if (d.type === 'trendline') {
    const rawT1  = d.p1.time;
    const rawT2  = d.p2.time;
    const rawP1  = d.p1.price;
    const rawP2  = d.p2.price;
    const slope  = (rawT2 !== rawT1) ? (rawP2 - rawP1) / (rawT2 - rawT1) : 0;

    let t1 = rawT1, t2 = rawT2, p1 = rawP1, p2 = rawP2;

    if (d.extLeft)  { t1 = tPast;   p1 = rawP1 + slope * (tPast - rawT1);   }
    if (d.extRight) { t2 = tFuture; p2 = rawP2 + slope * (tFuture - rawT2); }

    mkLine([{time:t1,value:p1},{time:t2,value:p2}]);

  } else if (d.type === 'rect') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    const t1 = Math.min(d.p1.time, d.p2.time);
    const t2_raw = Math.max(d.p1.time, d.p2.time);
    const t2 = d.extRight ? tFuture : t2_raw;

    // Borde y relleno se pueden apagar por separado (ver dtb-rect-border /
    // dtb-rect-fill) — las 4 series del borde se crean igual siempre
    // (así d.series.length se mantiene en 4 y el update en vivo durante un
    // arrastre sigue tomando el camino liviano de updateDrawingGeometry),
    // solo se las oculta con "visible:false" cuando el borde está apagado.
    const borderOn = d.showBorder !== false;
    const mkR = (pts) => {
      const s = chart.addLineSeries({ color: C+'aa', lineWidth:lw, lineStyle:ls, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, autoscaleInfoProvider: () => null, visible: borderOn });
      s.setData(pts); d.series.push(s); return s;
    };
    mkR([{time:t1,value:hi},{time:t2,value:hi}]);
    mkR([{time:t1,value:lo},{time:t2,value:lo}]);
    mkR([{time:t1,value:lo},{time:t1,value:hi}]);
    mkR([{time:t2,value:lo},{time:t2,value:hi}]);

    // Relleno (como TV): un <rect> en la capa SVG, no es parte del chart,
    // así que hay que reposicionarlo cada frame igual que la línea vertical.
    if (!(d.fillEl instanceof Element)) {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      window._drawingLayerSvg.insertBefore(r, window._drawingLayerSvg.firstChild);
      d.fillEl = r;
    }
    d.fillEl.setAttribute('fill', C);
    d.fillEl.setAttribute('fill-opacity', d.showFill === false ? '0' : '0.12');
    syncRectFill(d);

  } else if (d.type === 'fib') {
    const hi = Math.max(d.p1.price, d.p2.price);
    const lo = Math.min(d.p1.price, d.p2.price);
    if (!d.levels) d.levels = cloneFibLevels();
    const rawT1 = Math.min(d.p1.time, d.p2.time), rawT2 = Math.max(d.p1.time, d.p2.time);
    const t1 = d.extLeft  ? tPast   : rawT1;
    const t2 = d.extRight ? tFuture : rawT2;
    d.levels.filter(lv => lv.on).forEach(lv => {
      const val = hi - (hi - lo) * lv.value;
      const s = mkLine([{time:t1,value:val},{time:t2,value:val}], { color: lv.color+'cc', style: ls, lastValue: true });
      s.applyOptions({ title: `${(lv.value*100).toFixed(1)}%` });
    });

  } else if (d.type === 'vline') {
    // No es una serie del chart (una línea vertical no se puede expresar como
    // "tiempo -> valor" único) — se dibuja directo en la capa SVG y se
    // reposiciona en cada frame, igual que las etiquetas de texto.
    if (!(d.vLineEl instanceof Element)) {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      window._drawingLayerSvg.appendChild(line);
      d.vLineEl = line;
    }
    const dash = ls===1?'6,4':ls===2?'2,3':'none';
    d.vLineEl.setAttribute('stroke', C);
    d.vLineEl.setAttribute('stroke-width', lw);
    d.vLineEl.setAttribute('stroke-dasharray', dash);
    syncVLine(d);

  } else if (d.type === 'long' || d.type === 'short') {
    // 3 líneas horizontales (entrada/TP/SL, como en TV) + 2 rectángulos de
    // relleno (zona de ganancia/pérdida, en la capa SVG igual que el
    // relleno de 'rect') + 3 etiquetas de texto con los precios y el R:R.
    // Colores propios por zona (no el selector de color genérico, que acá
    // no tiene sentido — ver dtb-pos-colors), con default si todavía no
    // se personalizaron.
    const entryColor = d.entryColor || '#e8e8f0';
    const profitColor = d.profitColor || '#26a69a';
    const lossColor = d.lossColor || '#ef5350';
    const mkLvl = (price, color, dashed) => {
      const s = chart.addLineSeries({
        color, lineWidth:1, lineStyle: dashed?2:0,
        priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false,
        autoscaleInfoProvider: () => null,
      });
      s.setData([{time:d.p1.time,value:price},{time:d.p2.time,value:price}]);
      d.series.push(s);
    };
    mkLvl(d.p1.price,      entryColor, false); // entrada
    mkLvl(d.targetPrice,   profitColor, true);  // take profit
    mkLvl(d.p2.price,      lossColor, true);  // stop loss

    if (!(d.profitFillEl instanceof Element)) {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      window._drawingLayerSvg.insertBefore(r, window._drawingLayerSvg.firstChild);
      d.profitFillEl = r;
    }
    if (!(d.lossFillEl instanceof Element)) {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      window._drawingLayerSvg.insertBefore(r, window._drawingLayerSvg.firstChild);
      d.lossFillEl = r;
    }
    d.profitFillEl.setAttribute('fill', profitColor); d.profitFillEl.setAttribute('fill-opacity', '0.18');
    d.lossFillEl.setAttribute('fill', lossColor); d.lossFillEl.setAttribute('fill-opacity', '0.18');

    ['entryTextEl','tpTextEl','slTextEl'].forEach(key => {
      if (!(d[key] instanceof Element)) {
        const t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('font-family', "'DM Mono', monospace");
        t.setAttribute('font-size', '10');
        t.setAttribute('dominant-baseline', 'middle');
        window._drawingLayerSvg.appendChild(t);
        d[key] = t;
      }
    });
    d.entryTextEl.setAttribute('fill', entryColor);
    d.tpTextEl.setAttribute('fill', profitColor);
    d.slTextEl.setAttribute('fill', lossColor);
    syncPositionTool(d);
  }

  d.series.forEach(s => { s._drawingId = d.id; });
}

function highlightSelectedSvg(id) {
  clearSvgHighlights();
  requestAnimationFrame(() => {
    const d = drawings.find(x => x.id === id);
    if (!d || !window._drawingLayerSvg) return;
    const svg = window._drawingLayerSvg;
    const container = document.getElementById('chart-container');

    function priceToY(price) { return candleSeries.priceToCoordinate(price); }
    function timeToX(time)  { return chart.timeScale().timeToCoordinate(time); }

    function addHandle(x, y, dId, role) {
      if (x === null || y === null) return;
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5);
      c.classList.add('drawing-handle');
      c.dataset.drawingId = dId;
      c.dataset.role = role;
      svg.appendChild(c);
      d.svgEls.push(c);
    }

    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      const w = container.clientWidth;
      addHandle(w * 0.2, y, id, 'price');
      addHandle(w * 0.5, y, id, 'price');
      addHandle(w * 0.8, y, id, 'price');
    } else if (d.type === 'trendline' || d.type === 'fib') {
      addHandle(timeToX(d.p1.time), priceToY(d.p1.price), id, 'p1');
      addHandle(timeToX(d.p2.time), priceToY(d.p2.price), id, 'p2');
    } else if (d.type === 'rect') {
      const hi = Math.max(d.p1.price, d.p2.price);
      const lo = Math.min(d.p1.price, d.p2.price);
      const t1 = Math.min(d.p1.time, d.p2.time);
      const t2 = Math.max(d.p1.time, d.p2.time);
      addHandle(timeToX(t1), priceToY(hi), id, 't1hi');
      addHandle(timeToX(t2), priceToY(lo), id, 't2lo');
      addHandle(timeToX(t1), priceToY(lo), id, 't1lo');
      addHandle(timeToX(t2), priceToY(hi), id, 't2hi');
      // Como en TV: también una manija en el medio de cada lado, para
      // estirar un solo borde sin mover el opuesto.
      const xMid = (timeToX(t1)+timeToX(t2))/2, yMid = (priceToY(hi)+priceToY(lo))/2;
      addHandle(xMid, priceToY(hi), id, 'top');
      addHandle(xMid, priceToY(lo), id, 'bottom');
      addHandle(timeToX(t1), yMid, id, 'left');
      addHandle(timeToX(t2), yMid, id, 'right');
    } else if (d.type === 'vline') {
      addHandle(timeToX(d.p1.time), container.clientHeight * 0.5, id, 'vtime');
    } else if (d.type === 'long' || d.type === 'short') {
      const xMid = (timeToX(d.p1.time)+timeToX(d.p2.time))/2;
      addHandle(xMid, priceToY(d.p1.price), id, 'entry');
      addHandle(xMid, priceToY(d.targetPrice), id, 'target');
      addHandle(xMid, priceToY(d.p2.price), id, 'stop');
      addHandle(timeToX(d.p2.time), priceToY(d.p1.price), id, 'time2');
    }
  });
}

// El borde derecho (p2.time) de una herramienta de posición no puede pasarse
// de las velas "fantasma" (whitespace) cargadas en el eje de tiempo — ver
// futureWhitespace, 15 velas — o el time scale del chart termina
// "corriéndose" solo apenas ese punto se actualiza (ver creación de
// long/short, mismo límite). Se usa tanto ahí como al arrastrar la manija
// del borde derecho o el cuerpo entero, para que no se pueda recrear el
// problema editando el dibujo después de creado.
function clampPositionToolT2(t2){
  const candles = window._lastCandles || [];
  if (!candles.length) return t2;
  const barStep = candles.length>1 ? (candles[1].time-candles[0].time) : 3600;
  const maxT2 = candles[candles.length-1].time + 10*barStep;
  return Math.min(t2, maxT2);
}

// Aplica el arrastre de una "manija" (handle) según su rol — normaliza
// rect/fib a {t1,t2,hi,lo} en vez de arrastrar p1/p2 crudos, porque cuál
// punto es "p1" vs "p2" es ambiguo una vez que el usuario invirtió la forma.
function applyHandleDrag(d, role, price, time) {
  if (d.type === 'hline') {
    d.p1.price = price; d.p2.price = price;
  } else if (d.type === 'trendline') {
    if (role === 'p1') { d.p1.price = price; d.p1.time = time; }
    else { d.p2.price = price; d.p2.time = time; }
  } else if (d.type === 'fib') {
    if (role === 'p1') { d.p1.price = price; d.p1.time = time; }
    else { d.p2.price = price; d.p2.time = time; }
    const hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    d.p1.price = hi; d.p2.price = lo;
  } else if (d.type === 'rect') {
    let hi = Math.max(d.p1.price, d.p2.price), lo = Math.min(d.p1.price, d.p2.price);
    let t1 = Math.min(d.p1.time, d.p2.time), t2 = Math.max(d.p1.time, d.p2.time);
    if (role === 't1hi') { t1 = time; hi = price; }
    if (role === 't2lo') { t2 = time; lo = price; }
    if (role === 't1lo') { t1 = time; lo = price; }
    if (role === 't2hi') { t2 = time; hi = price; }
    if (role === 'top')    hi = price;
    if (role === 'bottom') lo = price;
    if (role === 'left')   t1 = time;
    if (role === 'right')  t2 = time;
    d.p1 = { time: Math.min(t1,t2), price: Math.max(hi,lo) };
    d.p2 = { time: Math.max(t1,t2), price: Math.min(hi,lo) };
  } else if (d.type === 'vline') {
    d.p1.time = time; d.p2.time = time;
  } else if (d.type === 'long' || d.type === 'short') {
    if (role === 'entry') {
      // Arrastrar la línea de entrada mueve TODO el bloque (entrada, SL,
      // TP) junto, conservando las distancias — como en TV.
      const delta = price - d.p1.price;
      d.p1.price += delta; d.p2.price += delta; d.targetPrice += delta;
    } else if (role === 'target') {
      d.targetPrice = price;
    } else if (role === 'stop') {
      d.p2.price = price;
    } else if (role === 'time2') {
      d.p2.time = clampPositionToolT2(time);
    }
  }
}

function clearSvgHighlights() {
  if (!window._drawingLayerSvg) return;
  window._drawingLayerSvg.querySelectorAll('.drawing-handle').forEach(el => el.remove());
}

// ══════════════════════════════════════════════════════════
//  CHART INIT
// ══════════════════════════════════════════════════════════
function initWatchtowerLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:15;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._watchtowerSvg = svg;
  function syncSize(){ svg.setAttribute('width',container.clientWidth); svg.setAttribute('height',container.clientHeight); }
  new ResizeObserver(syncSize).observe(container);
  syncSize();
}

// Doble click sobre CUALQUIER dibujo de un indicador custom abre su panel
// de settings — vale para Watchtower hoy y para cualquier indicador que se
// agregue después, sin tener que tocar ninguno de estos dos listeners.
// Dos mecanismos en paralelo (el que responda primero gana, con
// stopPropagation para no abrir el modal dos veces):
//   1) data-indicator-name en el elemento DOM (vía tagIndicatorEl) — sirve
//      para elementos HTML normales (ej. el badge de bias).
//   2) hitTestIndicatorRegions (vía registerIndicatorHit) — coordenadas
//      manuales contra #chart-container, el mismo patrón ya probado que
//      usa el sistema de dibujo para arrastrar líneas/handles. No depende
//      de pointer-events/stacking de SVG, que puede variar entre navegadores.
// El evento nativo 'dblclick' puede no llegar nunca acá: el canvas del
// chart (lightweight-charts) tiene su propio manejo de click/doble-click
// (reset de escala, etc.) que puede frenar la propagación antes de que
// burbujee hasta este listener — por eso "no reaccionaba" aunque el cursor
// ya mostrara pointer. En vez de depender de eso, detectamos el doble click
// a mano sobre 'mousedown' en fase CAPTURE — la misma técnica que ya usa el
// sistema de dibujo (ver más abajo, "capture:true + stopPropagation") y que
// sabemos que sí recibe el evento de forma confiable, porque arrastrar un
// dibujo ya depende de eso.
(function(){
  const cc = document.getElementById('chart-container');
  let lastHit = { time: 0, x: 0, y: 0, name: null };

  cc.addEventListener('mousedown', (e) => {
    const rect = cc.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    // Si el click cae sobre el eje de precios (derecha) o el eje de tiempo
    // (abajo), dejarlo pasar siempre: son zonas donde lightweight-charts
    // maneja su propio drag/doble-click (reescalar, auto-fit, etc.) y no
    // deben interpretarse como click sobre un dibujo, aunque la línea del
    // indicador se extienda visualmente hasta ahí.
    const plotW = cc.clientWidth - chart.priceScale('right').width();
    const plotH = cc.clientHeight - chart.timeScale().height();
    if (mx > plotW || my > plotH) { lastHit = { time:0, x:0, y:0, name:null }; return; }
    const name = hitTestIndicatorRegions(mx, my);
    if (!name) { lastHit = { time:0, x:0, y:0, name:null }; return; }

    const now = Date.now();
    const sameSpot = Math.hypot(mx - lastHit.x, my - lastHit.y) < 12;
    if (name === lastHit.name && sameSpot && (now - lastHit.time) < 500) {
      e.preventDefault();
      e.stopPropagation();
      openIndicatorSettings(name);
      lastHit = { time:0, x:0, y:0, name:null };
    } else {
      lastHit = { time: now, x: mx, y: my, name };
    }
  }, { capture: true });

  // Feedback visual: cursor "pointer" al pasar sobre cualquier dibujo de un
  // indicador, para que se note dónde hay que hacer doble click.
  // Solo SETEA el cursor cuando hay match — nunca lo limpia, así no pisa el
  // cursor que ya maneja el sistema de dibujo (move/crosshair) en el mismo
  // elemento.
  cc.addEventListener('mousemove', (e) => {
    if (window._dragSession) return;
    const rect = cc.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const plotW = cc.clientWidth - chart.priceScale('right').width();
    const plotH = cc.clientHeight - chart.timeScale().height();
    if (mx > plotW || my > plotH) return;
    if (hitTestIndicatorRegions(mx, my)) cc.style.cursor = 'pointer';
  });

  // Mecanismo 1 (el del comentario de arriba): elementos HTML normales
  // tageados con data-indicator-name (hoy solo el badge de bias de
  // Watchtower) — quedaban marcados como clickeables (pointer-events:auto,
  // cursor:pointer, dataset.indicatorName seteado) pero nada escuchaba el
  // doble click sobre ellos todavía, así que no reaccionaban. Este sí es un
  // elemento HTML normal (no el canvas del chart), así que el 'dblclick'
  // nativo llega sin el problema que describe el comentario de arriba.
  document.addEventListener('dblclick', (e) => {
    const target = e.target.closest('[data-indicator-name]');
    if (!target) return;
    e.preventDefault();
    e.stopPropagation();
    openIndicatorSettings(target.dataset.indicatorName);
  });
})();

function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: { background:{ color: STATE.chartSettings.bgColor }, textColor:'#8888a8', fontFamily:"'DM Mono', monospace", fontSize:11, attributionLogo:false },
    grid:   { vertLines:{color:'#18182a',style:1,visible:STATE.chartSettings.showGrid}, horzLines:{color:'#18182a',style:1,visible:STATE.chartSettings.showGrid} },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color:STATE.chartSettings.crosshairColor, style:STATE.chartSettings.crosshairStyle, labelBackgroundColor:'#1e1e2a' },
      horzLine: { color:STATE.chartSettings.crosshairColor, style:STATE.chartSettings.crosshairStyle, labelBackgroundColor:'#1e1e2a' },
    },
    rightPriceScale: { borderColor:'#222230', scaleMargins:{top:0.08,bottom:0.18} },
    timeScale: { borderColor:'#222230', timeVisible:true, secondsVisible:false, rightOffset:8, barSpacing:10 },
    watermark: { visible:STATE.chartSettings.showWatermark, fontSize:52, horzAlign:'center', vertAlign:'center', color:'rgba(201,168,76,0.03)', text:'ZENTINEL' },
  });

  candleSeries = chart.addCandlestickSeries({});
  applyChartSettings();

  volumeSeries = chart.addHistogramSeries({
    color:'#c9a84c22', priceFormat:{type:'volume'}, priceScaleId:'vol', visible:volumeVisible,
  });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82,bottom:0} });

  chart.subscribeCrosshairMove(param => {
    const info = document.getElementById('crosshair-info');
    if (!param.time || !param.seriesData) { info.style.display='none'; return; }
    const d = param.seriesData.get(candleSeries);
    if (!d) { info.style.display='none'; return; }
    info.style.display='block';
    info.innerHTML = `O <span>${fmt(d.open)}</span>  H <span>${fmt(d.high)}</span>  L <span>${fmt(d.low)}</span>  C <span>${fmt(d.close)}</span>`;
    updateTopbarOHLCV(d);
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    clearSvgHighlights();
    if (selectedDrawingId) highlightSelectedSvg(selectedDrawingId);
    renderWatchtower();
    renderSniper();
    syncOverlayPositions();
  }).observe(container);

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range && range.from < 50) loadMoreHistory();
    renderWatchtower();
    renderSniper();
    syncOverlayPositions();
  });

  // El zoom vertical (arrastrar el eje de precio) cambia el rango de
  // precios visible, no el de tiempo — subscribeVisibleLogicalRangeChange
  // no se entera, así que Watchtower se quedaba "congelado" hasta el
  // próximo evento que sí dispare un redibujo. Mientras el mouse esté
  // apretado en cualquier parte del chart (arrastrando precio, tiempo, o
  // lo que sea) lo seguimos en vivo; se corta apenas se suelta el click.
  //
  // La rueda del mouse/trackpad tiene el mismo problema pero al revés: no
  // hay mousedown, y encima dispara MUCHOS eventos 'wheel' seguidos (sobre
  // todo con scroll por inercia), cada uno disparando un redibujo completo
  // — eso hacía que las cajas se "amontonaran" y recién se acomodaran un
  // rato después de parar de scrollear. Por eso el loop también se prende
  // con 'wheel' y se apaga recién cuando no hubo más eventos en 150ms.
  let _wtDragRaf = null;
  function _wtDragLoop(){ renderWatchtower(); renderSniper(); syncOverlayPositions(); _wtDragRaf = requestAnimationFrame(_wtDragLoop); }
  function _wtStartLoop(){ if (!_wtDragRaf) _wtDragRaf = requestAnimationFrame(_wtDragLoop); }
  function _wtStopLoop(){ if (_wtDragRaf) { cancelAnimationFrame(_wtDragRaf); _wtDragRaf = null; renderWatchtower(); renderSniper(); syncOverlayPositions(); } }

  let _wtMouseDown = false;
  container.addEventListener('mousedown', () => { _wtMouseDown = true; _wtStartLoop(); });
  window.addEventListener('mouseup', () => { _wtMouseDown = false; if (!_wtWheelTimer) _wtStopLoop(); });

  let _wtWheelTimer = null;
  container.addEventListener('wheel', () => {
    _wtStartLoop();
    clearTimeout(_wtWheelTimer);
    _wtWheelTimer = setTimeout(() => { _wtWheelTimer = null; if (!_wtMouseDown) _wtStopLoop(); }, 150);
  }, { passive:true });

  initWatchtowerLayer();
  initSniperLayer();

  // El badge y las etiquetas de los dibujos se re-posicionan acá — ESTO
  // ANTES corría en un requestAnimationFrame que se reprogramaba a sí mismo
  // para siempre (60-120 veces por segundo, sin parar nunca, incluso con el
  // chart totalmente quieto), igual que le pasaba a Watchtower antes de que
  // se corrigiera (ver comentario de _wtDragLoop más arriba: "hacerlo 60
  // veces por segundo todo el tiempo es lo que hacía sentir lento"). Mismo
  // diagnóstico, mismo arreglo acá: solo hace falta reposicionar esto
  // cuando algo realmente cambia — pan/zoom, drag/wheel activo, resize —
  // no en un loop perpetuo de fondo todo el tiempo que el chart esté abierto.
  function syncOverlayPositions(){
    if (window._lastCandles){ const l=window._lastCandles[window._lastCandles.length-1]; positionCountdownBadge(l.close,l.open); }
    drawings.forEach(d=>{
      if (window._dragSession && window._dragSession.drawing===d) return;
      if (d.type==='text' && d.label) {
        const x=chart.timeScale().timeToCoordinate(d.p1.time), y=candleSeries.priceToCoordinate(d.p1.price);
        d.label.style.display = (x===null||y===null) ? 'none' : 'block';
        if (x!==null&&y!==null){ d.label.style.left=(x+6)+'px'; d.label.style.top=(y-10)+'px'; }
      } else if (d.type==='vline') {
        syncVLine(d);
      } else if (d.type==='rect') {
        syncRectFill(d);
      } else if (d.type==='long' || d.type==='short') {
        syncPositionTool(d);
      }
    });
  }
  window._syncOverlayPositions = syncOverlayPositions;
  syncOverlayPositions();
}

// ══════════════════════════════════════════════════════════
//  DRAWING LAYER
// ══════════════════════════════════════════════════════════
function initDrawingLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._drawingLayerSvg = svg;

  let previewEl = null;
  let drawStart = null;

  function syncSvgSize() {
    svg.setAttribute('width',  container.clientWidth);
    svg.setAttribute('height', container.clientHeight);
  }
  new ResizeObserver(syncSvgSize).observe(container);
  syncSvgSize();

  function clearPreview() { if (previewEl) { previewEl.remove(); previewEl=null; } }

  function getCoords(e) {
    const rect = container.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    let price = candleSeries.coordinateToPrice(y);
    let time = chart.timeScale().coordinateToTime(x);
    const candles = window._lastCandles || [];
    if (time === null && candles.length) {
      const bi = candles.length>1 ? candles[candles.length-1].time - candles[candles.length-2].time : 3600;
      const lastX = chart.timeScale().timeToCoordinate(candles[candles.length-1].time);
      const firstX = chart.timeScale().timeToCoordinate(candles[0].time);
      if (lastX !== null && x > lastX) {
        const barsOut = Math.round((x - lastX) / (chart.timeScale().options().barSpacing || 10));
        time = candles[candles.length-1].time + bi * Math.max(1, barsOut);
      } else {
        time = (x <= (firstX||0)) ? candles[0].time : candles[candles.length-1].time;
      }
    }
    if (STATE.magnet && price !== null && time !== null) {
      const snapped = magnetSnapPoint(candles, time, price);
      if (snapped) {
        price = snapped.price; time = snapped.time;
        const sx = timeToX(snapped.time), sy = priceToY(snapped.price);
        if (sx !== null) x = sx;
        if (sy !== null) y = sy;
      }
    }
    return { x, y, price, time };
  }

  // Shift mientras se dibuja una trend line: la fuerza a quedar perfectamente
  // horizontal o vertical (como en TV), según hacia qué lado se movió más.
  function shiftSnap(e, start, cur) {
    if (!e.shiftKey) return cur;
    const dx = Math.abs(cur.x - start.x), dy = Math.abs(cur.y - start.y);
    const snapHorizontal = dx > dy;
    const x = snapHorizontal ? cur.x : start.x;
    const y = snapHorizontal ? start.y : cur.y;
    let time = snapHorizontal ? cur.time : start.time;
    const price = snapHorizontal ? start.price : cur.price;
    return { x, y, price, time };
  }

  function updateSvgCapture() {
    const tool = STATE.activeTool;
    const isDrawTool = !['cursor','cross'].includes(tool);
    svg.style.pointerEvents = isDrawTool ? 'all' : 'none';
    svg.style.cursor = isDrawTool ? (tool==='text'?'text':'crosshair') : '';
  }

  const _origSetTool = window.setTool;
  window.setTool = function(btn, name) {
    _origSetTool(btn, name);
    updateSvgCapture();
  };

  function priceToY(p) { return candleSeries.priceToCoordinate(p); }
  function timeToX(t)  { return chart.timeScale().timeToCoordinate(t); }
  function distToSegment(x1,y1,x2,y2,px,py) {
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    if (len2===0) return Math.hypot(px-x1,py-y1);
    let t = ((px-x1)*dx+(py-y1)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  function isClickOnDrawing(d, mx, my) {
    const THRESH = 8;
    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      if (y===null) return false;
      return Math.abs(my-y) < THRESH;
    }
    if (d.type === 'trendline') {
      const x1=timeToX(d.p1.time), y1=priceToY(d.p1.price);
      const x2=timeToX(d.p2.time), y2=priceToY(d.p2.price);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return distToSegment(x1,y1,x2,y2,mx,my) < THRESH;
    }
    if (d.type === 'rect' || d.type === 'fib') {
      const hi=Math.max(d.p1.price,d.p2.price), lo=Math.min(d.p1.price,d.p2.price);
      const t1=Math.min(d.p1.time,d.p2.time),   t2=Math.max(d.p1.time,d.p2.time);
      const x1=timeToX(t1), x2=timeToX(t2);
      const y1=priceToY(hi), y2=priceToY(lo);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      if (d.type === 'rect') return (
        distToSegment(x1,y1,x2,y1,mx,my)<THRESH||
        distToSegment(x1,y2,x2,y2,mx,my)<THRESH||
        distToSegment(x1,y1,x1,y2,mx,my)<THRESH||
        distToSegment(x2,y1,x2,y2,mx,my)<THRESH
      );
      // fib: cualquiera de las líneas de nivel (las que están activas) cuenta como "cuerpo"
      return (d.levels||cloneFibLevels()).filter(lv=>lv.on).some(lv=>{
        const y = priceToY(hi-(hi-lo)*lv.value);
        return y!==null && Math.abs(my-y)<THRESH && mx>=Math.min(x1,x2)-2 && mx<=Math.max(x1,x2)+2;
      });
    }
    if (d.type === 'text' && d.label) {
      const r = d.label.getBoundingClientRect();
      const cr = container.getBoundingClientRect();
      return mx>=r.left-cr.left-4 && mx<=r.right-cr.left+4 && my>=r.top-cr.top-4 && my<=r.bottom-cr.top+4;
    }
    if (d.type === 'vline') {
      const x = timeToX(d.p1.time);
      return x!==null && Math.abs(mx-x) < THRESH;
    }
    if (d.type === 'long' || d.type === 'short') {
      // Caja completa (del SL al TP) clickeable en cualquier punto interno
      // — igual que un rect, no hace falta acertarle a un borde fino.
      const x1=timeToX(d.p1.time), x2=timeToX(d.p2.time);
      const prices=[d.p1.price,d.p2.price,d.targetPrice];
      const y1=priceToY(Math.max(...prices)), y2=priceToY(Math.min(...prices));
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return mx>=Math.min(x1,x2) && mx<=Math.max(x1,x2) && my>=y1 && my<=y2;
    }
    return false;
  }

  // Manija bajo el mouse del dibujo seleccionado (si hay uno), o null.
  function hitTestHandle(mx, my) {
    const d = getSelected();
    if (!d || !d.svgEls) return null;
    for (const el of d.svgEls) {
      if (!el.dataset || !el.dataset.role) continue;
      const x = parseFloat(el.getAttribute('cx')), y = parseFloat(el.getAttribute('cy'));
      if (Math.hypot(mx-x, my-y) < 9) return { drawing: d, role: el.dataset.role };
    }
    return null;
  }

  // ── Selección + arrastre (mover cuerpo entero / estirar una punta) ──
  window._dragSession = null; // { kind:'handle'|'body', drawing, role, startPrice, startTime, origP1, origP2 }

  // capture:true + stopPropagation: si no, el canvas del chart (debajo de
  // esta capa) también recibe el mismo mousedown/mousemove y arranca su
  // propio pan/zoom al mismo tiempo que arrastramos el dibujo — por eso
  // "el gráfico se movía solo" al mover una línea.
  container.addEventListener('mousedown', e => {
    if (STATE.activeTool !== 'cursor') return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    const handleHit = hitTestHandle(mx, my);
    if (handleHit) {
      e.preventDefault(); e.stopPropagation();
      window._dragSession = { kind:'handle', drawing:handleHit.drawing, role:handleHit.role };
      return;
    }

    let hit = null;
    for (const d of drawings) {
      if (d.locked) continue;
      if (isClickOnDrawing(d, mx, my)) { hit = d; break; }
    }
    if (hit) {
      e.preventDefault(); e.stopPropagation();
      selectDrawing(hit.id);
      const { price, time } = getCoords(e);
      window._dragSession = {
        kind:'body', drawing:hit, startPrice:price, startTime:time,
        origP1:{...hit.p1}, origP2: hit.p2?{...hit.p2}:null,
        origTargetPrice: hit.targetPrice,
        labelLeft: hit.label?parseFloat(hit.label.style.left):0,
        labelTop:  hit.label?parseFloat(hit.label.style.top):0,
      };
    } else {
      deselectDrawing();
    }
  }, { capture:true });

  container.addEventListener('mousemove', e => {
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    if (window._dragSession) {
      e.preventDefault(); e.stopPropagation();
      const d = window._dragSession.drawing;
      if (d.locked) return;
      const { price, time } = getCoords(e);

      if (window._dragSession.kind === 'handle') {
        // Shift mientras se arrastra una punta de una trend line: igual que
        // al dibujarla, la fuerza a quedar horizontal o vertical respecto a
        // la OTRA punta (la que no se está moviendo).
        let finalPrice = price, finalTime = time;
        if (e.shiftKey && d.type === 'trendline' && price!==null && time!==null) {
          const role = window._dragSession.role;
          const anchor = role === 'p1' ? d.p2 : d.p1;
          const anchorX = timeToX(anchor.time), anchorY = priceToY(anchor.price);
          const curX = timeToX(time), curY = priceToY(price);
          if (anchorX!==null && anchorY!==null && curX!==null && curY!==null) {
            const dx = Math.abs(curX-anchorX), dy = Math.abs(curY-anchorY);
            if (dx > dy) finalPrice = anchor.price; else finalTime = anchor.time;
          }
        }
        applyHandleDrag(d, window._dragSession.role, finalPrice, finalTime);
        if (!updateDrawingGeometry(d)) redrawDrawing(d);
      } else if (d.type === 'text') {
        d.label.style.left = (mx - 6) + 'px';
        d.label.style.top  = (my - 10) + 'px';
      } else if (price!==null && time!==null) {
        const dPrice = price - window._dragSession.startPrice;
        const dTime  = time  - window._dragSession.startTime;
        d.p1.price = window._dragSession.origP1.price + dPrice;
        d.p1.time  = window._dragSession.origP1.time  + dTime;
        if (window._dragSession.origP2) {
          d.p2.price = window._dragSession.origP2.price + dPrice;
          d.p2.time  = window._dragSession.origP2.time  + dTime;
        }
        if (window._dragSession.origTargetPrice != null) {
          d.targetPrice = window._dragSession.origTargetPrice + dPrice;
        }
        if ((d.type==='long' || d.type==='short')) {
          // Si arrastrar el cuerpo entero empujó el borde derecho más allá
          // del límite seguro (ver clampPositionToolT2), corremos TODA la
          // caja hacia atrás en vez de solo recortar p2 — así el ancho
          // (tiempo de riesgo) no queda distorsionado, solo deja de
          // avanzar más hacia la derecha.
          const clampedT2 = clampPositionToolT2(d.p2.time);
          if (clampedT2 !== d.p2.time) {
            const shift = d.p2.time - clampedT2;
            d.p1.time -= shift; d.p2.time -= shift;
          }
        }
        if (!updateDrawingGeometry(d)) redrawDrawing(d);
      }
      return;
    }

    // Sin arrastre activo: feedback de cursor al pasar por encima
    if (STATE.activeTool === 'cursor') {
      if (hitTestHandle(mx, my)) { container.style.cursor = 'crosshair'; return; }
      const over = drawings.some(d => !d.locked && isClickOnDrawing(d, mx, my));
      container.style.cursor = over ? 'move' : '';
    }
  }, { capture:true });

  window.addEventListener('mouseup', e => {
    if (window._dragSession) { e.preventDefault(); e.stopPropagation(); }
    if (window._dragSession && window._dragSession.kind === 'body' && window._dragSession.drawing.type === 'text') {
      const d = window._dragSession.drawing;
      const x = parseFloat(d.label.style.left)-6, y = parseFloat(d.label.style.top)+10;
      d.p1.price = candleSeries.coordinateToPrice(y) ?? d.p1.price;
      d.p1.time  = chart.timeScale().coordinateToTime(x) ?? d.p1.time;
    }
    if (window._dragSession) highlightSelectedSvg(selectedDrawingId);
    window._dragSession = null;
  }, { capture:true });

  svg.addEventListener('mousedown', e => {
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x, y, price, time } = getCoords(e);
    if (price === null || time === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;

    if (tool === 'text') {
      // Como en TV: se escribe directo sobre el chart, no un prompt() nativo.
      const label = document.createElement('div');
      label.contentEditable = 'true';
      label.dataset.placeholder = 'Añadir texto';
      label.style.cssText = `position:absolute;left:${x+6}px;top:${y-10}px;color:${toolDefaults.color};font-family:var(--font-mono);font-size:${11+toolDefaults.width}px;pointer-events:auto;z-index:5;white-space:nowrap;background:rgba(10,10,12,.7);padding:1px 4px;border-radius:3px;outline:1px solid ${toolDefaults.color}88;min-width:10px;cursor:text;`;
      container.appendChild(label);

      const d = { id:genId(), type:'text', series:[], svgEls:[], label, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price,time}, p2:{price,time} };
      drawings.push(d);
      selectDrawing(d.id);
      backToCursor();

      label.focus();
      const commitText = () => {
        label.contentEditable = 'false';
        label.style.pointerEvents = 'none';
        label.style.outline = 'none';
        label.style.cursor = '';
        if (!label.textContent.trim()) { removeDrawingById(d.id); deselectDrawing(); }
      };
      label.addEventListener('blur', commitText, { once:true });
      label.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); label.blur(); } });
      return;
    }

    drawStart = { x, y, price, time };
  });

  svg.addEventListener('mousemove', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x: x2, y: y2 } = getCoords(e);
    clearPreview();

    const GOLDA = toolDefaults.color + '88';

    if (tool === 'hline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', 0); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', container.clientWidth); line.setAttribute('y2', drawStart.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, { x:x2, y:y2 });
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', snapped.x); line.setAttribute('y2', snapped.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'rect' || tool === 'long' || tool === 'short') {
      const rx=Math.min(drawStart.x,x2), ry=Math.min(drawStart.y,y2);
      const rw=Math.abs(x2-drawStart.x), rh=Math.abs(y2-drawStart.y);
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',rx); rect.setAttribute('y',ry); rect.setAttribute('width',rw); rect.setAttribute('height',rh);
      const previewColor = tool==='long' ? '#26a69a88' : tool==='short' ? '#ef535088' : GOLDA;
      rect.setAttribute('stroke', previewColor); rect.setAttribute('stroke-width', toolDefaults.width);
      rect.setAttribute('stroke-dasharray','4,3');
      rect.setAttribute('fill', tool==='long' ? 'rgba(38,166,154,0.08)' : tool==='short' ? 'rgba(239,83,80,0.08)' : 'rgba(201,168,76,0.06)');
      svg.appendChild(rect); previewEl = rect;
    } else if (tool === 'fib') {
      const ry=Math.min(drawStart.y,y2), rh=Math.abs(y2-drawStart.y);
      const group = document.createElementNS('http://www.w3.org/2000/svg','g');
      const fibColors=['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
      [0,0.236,0.382,0.5,0.618,0.786,1].forEach((lvl,i) => {
        const ly = ry + rh * lvl;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',0); line.setAttribute('y1',ly); line.setAttribute('x2',container.clientWidth); line.setAttribute('y2',ly);
        line.setAttribute('stroke',fibColors[i]+'bb'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','3,3');
        group.appendChild(line);
      });
      svg.appendChild(group); previewEl = group;
    } else if (tool === 'vline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', 0);
      line.setAttribute('x2', drawStart.x); line.setAttribute('y2', container.clientHeight - chart.timeScale().height());
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    }
  });

  svg.addEventListener('mouseup', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    clearPreview();

    const coordsNow = getCoords(e);
    let { price: price2, time: time2 } = coordsNow;
    if (price2===null||time2===null) { drawStart=null; return; }
    const candles = window._lastCandles||[];
    if (!candles.length) { drawStart=null; return; }

    let d = null;

    if (tool === 'hline') {
      d = { id:genId(), type:'hline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawStart.price,time:drawStart.time} };
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, coordsNow);
      price2 = snapped.price; time2 = snapped.time;
      const t1 = Math.min(drawStart.time, time2);
      const t2 = Math.max(drawStart.time, time2);
      if (t1 === t2 && price2 === drawStart.price) { drawStart=null; return; } // clic sin arrastre real
      const p1 = drawStart.time <= time2 ? drawStart.price : price2;
      const p2 = drawStart.time <= time2 ? price2 : drawStart.price;
      d = { id:genId(), type:'trendline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:p1,time:t1}, p2:{price:p2,time:t2} };
    } else if (tool === 'rect') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      const t1=Math.min(drawStart.time,time2),   t2=Math.max(drawStart.time,time2);
      if (t1===t2||Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'rect', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:t1}, p2:{price:price2,time:t2} };
    } else if (tool === 'fib') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      if (Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'fib', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, levels:cloneFibLevels(), p1:{price:hi,time:drawStart.time}, p2:{price:lo,time:time2} };
    } else if (tool === 'vline') {
      d = { id:genId(), type:'vline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price:null,time:drawStart.time}, p2:{price:null,time:drawStart.time} };
    } else if (tool === 'long' || tool === 'short') {
      // p1 = entrada (el punto donde se apretó el mouse). El stop queda
      // SIEMPRE del lado correcto según el tipo de herramienta (abajo para
      // long, arriba para short) — no según hacia dónde arrastró el mouse.
      // Si tomáramos el precio del punto de arrastre tal cual, arrastrar
      // para el mismo lado en una Short que en una Long dejaba el take
      // profit invertido (ganancia hacia arriba en una posición corta, que
      // es al revés). Solo la MAGNITUD del arrastre define el riesgo; la
      // dirección la decide el tipo de herramienta. El take profit nace a
      // un ratio riesgo/beneficio fijo (1:2) y después se puede arrastrar
      // independiente con su manija.
      const entry = drawStart.price;
      const risk = Math.abs(entry - price2);
      if (risk < 0.0001) { drawStart=null; return; } // clic sin arrastre real
      const barStep = candles.length>1 ? (candles[1].time-candles[0].time) : 3600;
      // El borde derecho de la caja no puede pasarse de las velas "fantasma"
      // (whitespace) que tiene cargadas el eje de tiempo (ver futureWhitespace,
      // 15 velas) — si una de las 3 líneas de precio de este dibujo apunta a
      // un tiempo sin whitespace ahí, el chart no tiene con qué resolver esa
      // coordenada y (a diferencia de un simple desaparecer, como le pasaba a
      // las cajas de FVG) el time scale termina "corriéndose" solo apenas se
      // arrastra el dibujo y ese punto se actualiza. Por eso se acota a un
      // máximo seguro, bien adentro de esas 15 velas.
      let t2 = time2 > drawStart.time ? time2 : drawStart.time + barStep*10;
      t2 = clampPositionToolT2(t2);
      if (t2 <= drawStart.time) t2 = drawStart.time + barStep;
      const DEFAULT_RR = 2;
      const stop   = tool === 'long' ? entry - risk        : entry + risk;
      const target = tool === 'long' ? entry + risk*DEFAULT_RR : entry - risk*DEFAULT_RR;
      d = { id:genId(), type:tool, series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:0, extLeft:false, extRight:false, p1:{price:entry,time:drawStart.time}, p2:{price:stop,time:t2}, targetPrice:target };
    }

    if (d) {
      drawings.push(d);
      buildDrawingOnChart(d);
      selectDrawing(d.id);
      backToCursor();
    }

    drawStart = null;
  });

  window.addEventListener('mouseup', () => {
    if (drawStart) { clearPreview(); drawStart=null; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { deselectDrawing(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawingId) {
      if (document.activeElement.tagName === 'INPUT') return;
      onDtbDelete();
    }
  });
}

// Dado un precio/tiempo "crudo" del mouse, devuelve el punto {price,time}
// ajustado al OHLC más cercano del candle más cercano en el tiempo — o el
// mismo punto sin tocar si no hay candles, el magnet está apagado, o el
// punto cae más allá de la última vela (hay que poder seguir arrastrando
// la línea hacia la derecha más allá de los datos, no quedar pegado al
// último candle).
function magnetSnapPoint(candles, rawTime, rawPrice) {
  if (!candles || !candles.length || rawTime===null || rawPrice===null) return null;
  if (rawTime > candles[candles.length-1].time || rawTime < candles[0].time) return null;
  let lo = 0, hi = candles.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (candles[mid].time < rawTime) lo = mid + 1; else hi = mid;
  }
  let best = candles[lo];
  if (lo > 0 && Math.abs(candles[lo-1].time - rawTime) < Math.abs(best.time - rawTime)) best = candles[lo-1];
  let snapPrice = best.open, bestDist = Math.abs(rawPrice - best.open);
  [best.high, best.low, best.close].forEach(p => {
    const dist = Math.abs(rawPrice - p);
    if (dist < bestDist) { bestDist = dist; snapPrice = p; }
  });
  return { price: snapPrice, time: best.time };
}

function applyIndicators() {
  const selected=[...document.querySelectorAll('.ind-pick-row.selected')].map(r=>r.querySelector('.ind-pick-name').textContent);
  STATE.indicators.forEach(name=>{
    if(selected.includes(name)) return;

    if(def && def.custom){
      if(name==='Watchtower'){ STATE.watchtower.enabled=false; saveWatchtowerState(); }
      else if(name==='Sniper'){ STATE.sniper.enabled=false; saveSniperState(); }
    }
    else if(overlays[name]){ chart.removeSeries(overlays[name]); delete overlays[name]; }

function addIndicatorSeries(name) {
  const def=INDICATOR_DEFS.find(d=>d.name===name); if(!def)return;
  if(def.custom){
    if(name==='Watchtower'){ STATE.watchtower.enabled=true; saveWatchtowerState(); renderWatchtower(); }
    else if(name==='Sniper'){ STATE.sniper.enabled=true; saveSniperState(); renderSniper(); }
    return;
  }
  if(overlays[name])return;
  const rawData=window._lastCandles||[]; if(!rawData.length)return;
  const calcData=def.calc(rawData);
  const style=getIndicatorStyle(name, def);
  const series=chart.addLineSeries({color:style.color,lineWidth:style.lineWidth,priceLineVisible:false,lastValueVisible:true});
  series.setData(calcData); overlays[name]=series;
}
