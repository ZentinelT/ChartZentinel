<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentinel Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary:   #0a0a0c;
    --bg-secondary: #111116;
    --bg-panel:     #13131a;
    --bg-hover:     #1a1a24;
    --bg-active:    #1e1e2a;
    --border:       #222230;
    --border-light: #2a2a3a;
    --gold:         #c9a84c;
    --gold-bright:  #f0c060;
    --gold-dim:     #7a6030;
    --gold-glow:    rgba(201,168,76,0.15);
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-dim:     #55556a;
    --green:        #26a69a;
    --red:          #ef5350;
    --green-dim:    rgba(38,166,154,0.15);
    --red-dim:      rgba(239,83,80,0.15);
    --font-ui:      'DM Sans', sans-serif;
    --font-mono:    'DM Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --sidebar-w:    220px;
    --toolbar-h:    44px;
    --topbar-h:     52px;
    --tf-bar-h:     36px;
  }

  /* ─── MODO CLARO ──────────────────────────────────────────
     Redefine solo las variables de la interfaz (fondos, bordes, texto,
     acento dorado, verde/rojo semánticos) — el gráfico en sí (velas,
     fondo del chart, grillas) usa sus propios colores desde
     STATE.chartSettings, ajenos a estas variables, así que no se tocan
     acá a propósito. */
  html[data-theme="light"] {
    --bg-primary:   #f4f5f7;
    --bg-secondary: #ffffff;
    --bg-panel:     #ffffff;
    --bg-hover:     #eef0f4;
    --bg-active:    #e4e7ee;
    --border:       #dde1e8;
    --border-light: #c9ced8;
    --gold:         #a07508;
    --gold-bright:  #c4920f;
    --gold-dim:     #cbab6c;
    --gold-glow:    rgba(160,117,8,0.12);
    --text-primary: #16171d;
    --text-secondary:#54586b;
    --text-dim:     #8d90a0;
    --green:        #0e8a74;
    --red:          #d33232;
    --green-dim:    rgba(14,138,116,0.12);
    --red-dim:      rgba(211,50,50,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-h);
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0;
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .logo-sep { width: 1px; height: 24px; background: var(--border-light); margin: 0 4px; }

  #symbol-search-wrap { position: relative; display: flex; align-items: center; }
  /* Clase compartida: la usan tanto #symbol-input (modo 1 gráfico) como el
     buscador de símbolo global de renderLayoutGrid (modo 2×/4⊞), para que
     ambos se vean exactamente igual en vez de reimplementar el estilo. */
  .topbar-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    width: 130px;
    outline: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: border-color .2s, box-shadow .2s;
  }
  .topbar-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px var(--gold-glow); }

  #price-display { display: flex; align-items: baseline; gap: 8px; }
  #price-last { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text-primary); }
  #price-change { font-family: var(--font-mono); font-size: 12px; }
  #price-change.up { color: var(--green); }
  #price-change.dn { color: var(--red); }

  #ohlcv-bar { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  #ohlcv-bar span b { color: var(--text-dim); font-weight: 400; margin-right: 3px; }

  /* ─── COUNTDOWN BADGE (pegado al precio actual, como TV) ────
     Posición/ancho/alto se fijan por JS (positionCountdownBadge), medidos
     pixel a pixel contra el tag de precio nativo que dibuja el chart: ese
     tag NO ocupa todo el ancho de la escala de precio (deja ~6px de margen
     a la derecha) y mide 17px de alto — por eso acá se replica ese mismo
     tamaño en vez de adivinar. font-weight normal (no 500): en fuente
     monoespaciada, el trazo más grueso hacía que se viera más grande que
     el precio aunque el font-size nominal fuera menor. */
  #price-countdown-badge {
    position: absolute;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 400;
    color: #0a0a0c;
    border-radius: 0 0 3px 3px;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
  }
  #price-countdown-badge.up { background: var(--green); }
  #price-countdown-badge.dn { background: var(--red); }
  #price-countdown-badge.soon { background: var(--gold-bright); }

  /* ─── WATCHTOWER — daily bias table (vertical, como en TV) ──── */
  #watchtower-bias-badge {
    position: absolute;
    right: 8px;
    bottom: 22px;
    display: none;
    flex-direction: column;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: #cccccc;
    z-index: 16;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
  }
  #watchtower-bias-badge .wt-row {
    padding: 2px 7px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  #watchtower-bias-badge .wt-row:last-child { border-bottom: none; font-weight: 600; }

  /* ─── Chips de acceso directo a config de indicadores custom ──── */
  /* Fijos arriba a la izquierda del chart, visibles siempre que el
     indicador esté activo — no dependen de acertarle a un dibujo fino
     ni de tener el sidebar abierto. */
  #chart-indicator-chips {
    position: absolute;
    top: 34px;
    left: 8px;
    z-index: 17;
    display: flex;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
  }
  .ind-chip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(20,20,28,0.88);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 3px 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .ind-chip:hover { color: var(--gold); border-color: var(--gold); }
  .ind-chip svg { width: 11px; height: 11px; flex-shrink: 0; }

  /* ─── Indicator settings (gear) ──── */
  .ind-settings-btn {
    background:none; border:none; color:var(--text-secondary); cursor:pointer;
    padding:2px; display:flex; align-items:center; pointer-events:auto;
  }
  .ind-settings-btn:hover { color:var(--text); }
  .ind-settings-btn svg { width:12px; height:12px; }
  .wt-set-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 0; font-size:12px; color:var(--text);
    border-bottom:1px solid var(--border);
  }
  .wt-set-row:last-child { border-bottom:none; }
  .wt-set-row input[type="time"], .wt-set-row input[type="number"] {
    background: var(--bg-alt, #15151f); border:1px solid var(--border); border-radius:3px;
    color: var(--text); font-family: var(--font-mono); font-size:11px; padding:2px 4px;
    color-scheme: dark;
  }
  .wt-set-row input[type="color"] {
    width:28px; height:20px; padding:0; border:1px solid var(--border); border-radius:3px;
    background:none; cursor:pointer;
  }

  .topbar-spacer { flex: 1; }

  .topbar-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
  .topbar-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }
  .topbar-btn svg { width: 14px; height: 14px; }
  @keyframes zentinel-spin { to { transform: rotate(360deg); } }
  #btn-refresh.spinning svg { animation: zentinel-spin .6s linear infinite; }

  #layout-picker { display: flex; gap: 2px; margin-right: 4px; }
  .layout-btn {
    background: none; border: 1px solid var(--border-light); border-radius: 4px;
    color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px;
    padding: 4px 8px; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  }
  .layout-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .layout-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }

  /* ─── Modo embed (panel dentro de una grilla multi-chart) ──────
     Cada panel del grid 2×/4⊞ no necesita repetir el header completo
     (buscador de símbolo, O/H/L/C/V, refresh, settings, badge del
     puente) — eso vive una sola vez en la barra global de afuera.
     El watchlist (#sidebar) SÍ se deja: es el único lugar de donde elegir
     símbolo con un click (la barra global solo tiene un input de texto
     libre, sin lista ni autocompletado) — sin esto, cada panel quedaba sin
     ninguna forma de abrir/ver el watchlist. Arranca colapsado por panel
     (mismo mecanismo de siempre, persistido con el sufijo de cada pane) así
     no come espacio de entrada en una grilla de por sí chica. */
  html.embed-mode #topbar { display: none !important; }

  #api-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  #api-badge.connected { color: var(--green); border-color: rgba(38,166,154,.4); }
  #api-badge:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ─── TIMEFRAME BAR ───────────────────────────────────── */
  #tf-bar {
    height: var(--tf-bar-h);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 10px;
    flex-shrink: 0;
  }
  #tf-bar-symbol {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
  }
  #tf-bar-tfs {
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: thin;
    min-width: 0;
  }
  #tf-bar .topbar-btn { flex-shrink: 0; }

  .tf-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: background .15s, color .15s;
  }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tf-sep { width: 1px; height: 14px; background: var(--border); margin: 0 4px; }

  /* ─── MAIN AREA ───────────────────────────────────────── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ─── TOOLBAR (left) ─────────────────────────────────── */
  #toolbar {
    width: 38px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
    z-index: 50;
  }

  .tool-btn {
    width: 30px; height: 30px;
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tool-btn svg { width: 15px; height: 15px; }
  .tool-sep { width: 20px; height: 1px; background: var(--border); margin: 4px 0; }

  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-active);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 999;
  }
  .tool-btn:hover::after { opacity: 1; }

  /* ─── SIDEBAR ─────────────────────────────────────────── */
  /* ¿Por qué un wrapper interno de ancho fijo? Animar el "width" de
     #sidebar directamente (como estaba antes) hacía que TODO su contenido
     (texto, filas del watchlist) se reacomodara cuadro a cuadro durante la
     transición — el texto envolvía/desbordaba mientras el panel se
     angostaba, así que se veía brusco en vez de un deslizamiento prolijo.
     Ahora #sidebar es solo el "marco" que recorta (overflow:hidden) — el
     contenido real vive en .sidebar-inner con un ancho FIJO que nunca
     cambia, así que nunca se reacomoda: solo se ve "correr" hacia afuera
     de la vista a medida que el marco se achica, que es el efecto que se
     busca. */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    overflow: hidden;
    transition: width .22s cubic-bezier(.4,0,.2,1);
    will-change: width;
  }
  #sidebar.collapsed { width: 0; border-right: none; }
  .sidebar-inner {
    width: var(--sidebar-w);
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #btn-sidebar-toggle {
    width: 13px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border: none;
    border-right: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #btn-sidebar-toggle:hover { color: var(--gold); }
  #btn-sidebar-toggle svg { width: 10px; height: 10px; transition: transform .15s; }
  #btn-sidebar-toggle.collapsed svg { transform: rotate(180deg); }

  .sidebar-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-add-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    font-size: 16px;
    transition: color .15s;
    padding: 0 2px;
  }
  .sidebar-add-btn:hover { color: var(--gold); }

  #watchlist { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }

  .wl-item {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    gap: 8px;
    position: relative;
  }
  .wl-item:hover { background: var(--bg-hover); }
  .wl-item.active { background: var(--bg-active); border-left: 2px solid var(--gold); }
  .wl-item.active .wl-sym { color: var(--gold); }

  .wl-sym { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-primary); letter-spacing: .5px; flex: 1; }
  .wl-price { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .wl-chg { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; min-width: 46px; text-align: right; }
  .wl-chg.up { color: var(--green); background: var(--green-dim); }
  .wl-chg.dn { color: var(--red); background: var(--red-dim); }

  .wl-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 13px; line-height: 1; transition: color .15s; padding: 0 2px; }
  .wl-item:hover .wl-remove { color: var(--text-dim); }
  .wl-item:hover .wl-remove:hover { color: var(--red); }

  .sidebar-indicators { border-top: 1px solid var(--border); }
  .sidebar-indicators .sidebar-header { border-bottom: none; }
  #ind-list { padding: 4px 0; max-height: 140px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
  .ind-item { padding: 5px 12px; font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ind-item span { flex: 1; }
  .ind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 12px; line-height: 1; transition: color .15s; }
  .ind-item:hover .ind-remove { color: var(--red); }

  /* ─── CHART AREA ──────────────────────────────────────── */
  #chart-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chart-container { flex: 1; position: relative; }

  #loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 10; transition: opacity .4s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .loader-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; animation: loaderAnim 1.5s ease-in-out infinite; }
  @keyframes loaderAnim { 0%{width:0%;margin-left:0} 50%{width:70%;margin-left:15%} 100%{width:0%;margin-left:100%} }
  .loader-msg { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

  #crosshair-info {
    position: absolute; top: 10px; left: 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
    pointer-events: none; line-height: 1.7; z-index: 5; display: none;
  }
  #crosshair-info span { color: var(--text-primary); }

  /* ─── STATUS BAR ──────────────────────────────────────── */
  #statusbar {
    height: 22px; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 20px;
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); flex-shrink: 0;
  }
  #statusbar .sb-item { display: flex; gap: 5px; }
  #statusbar .sb-item b { color: var(--text-secondary); font-weight: 400; }
  #status-conn { margin-left: auto; }
  #status-conn.ok { color: var(--green); }
  #status-conn.err { color: var(--red); }
  #status-conn.loading { color: var(--gold); }

  /* ─── MODALS ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(8px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-family: var(--font-display); font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-bottom: 16px; text-transform: uppercase; }
  .modal label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .5px; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); font-size: 12px;
    padding: 8px 12px; outline: none; margin-bottom: 14px; transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .cs-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .cs-color-inp {
    width: 100%; height: 32px; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; cursor: pointer; padding: 2px; margin-bottom: 14px;
  }
  .cs-row .cs-color-inp { margin-bottom: 0; flex: 1; }
  .cs-tf-list {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 10px;
    margin-bottom: 14px; max-height: 140px; overflow-y: auto; scrollbar-width: thin;
  }
  .cs-tf-list label {
    display: flex; align-items: center; gap: 5px; margin-bottom: 0;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); cursor: pointer;
  }
  .cs-tf-list input[type=checkbox] { width: auto; margin: 0; }

  .btn-primary {
    background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold-bright);
    font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 7px 18px;
    border-radius: 5px; cursor: pointer; letter-spacing: .5px; transition: background .15s;
  }
  .btn-primary:hover { background: rgba(201,168,76,.3); }

  .btn-ghost {
    background: none; border: 1px solid var(--border-light); color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 12px; padding: 7px 14px; border-radius: 5px;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .ind-picker-list { max-height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; margin-bottom: 14px; }
  .ind-pick-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 5px; cursor: pointer; gap: 10px; transition: background .12s; }
  .ind-pick-row:hover { background: var(--bg-hover); }
  .ind-pick-row.selected { background: var(--gold-glow); }
  .ind-pick-name { font-size: 12px; color: var(--text-primary); flex: 1; }
  .ind-pick-desc { font-size: 10px; color: var(--text-dim); }
  .ind-pick-check { width: 14px; height: 14px; border: 1px solid var(--border-light); border-radius: 3px; background: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ind-pick-row.selected .ind-pick-check { background: var(--gold); border-color: var(--gold); color: #000; font-size: 10px; }

  #add-sym-form { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 6px; align-items: center; }
  #add-sym-form.open { display: flex; }
  #add-sym-inp { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; outline: none; text-transform: uppercase; letter-spacing: 1px; }
  #add-sym-inp:focus { border-color: var(--gold-dim); }
  #add-sym-ok { background: var(--gold-dim); border: none; border-radius: 4px; color: var(--gold-bright); font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer; }

  /* ══════════════════════════════════════════════════════
     DRAWING TOOLBAR (floating, contextual)
  ══════════════════════════════════════════════════════ */
  #draw-toolbar {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 6px 8px;
    display: none;
    align-items: center;
    gap: 4px;
    z-index: 300;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    user-select: none;
  }
  #draw-toolbar.visible { display: flex; }

  .dtb-sep { width: 1px; height: 20px; background: var(--border-light); margin: 0 2px; }

  .dtb-btn {
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .dtb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .dtb-btn.danger:hover { background: rgba(239,83,80,.15); color: var(--red); }
  .dtb-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .dtb-color-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dtb-color-swatch {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1px solid var(--border-light);
    cursor: pointer; overflow: hidden; position: relative;
  }
  .dtb-color-swatch input[type=color] {
    position: absolute; inset: -4px; width: 28px; height: 28px;
    opacity: 0; cursor: pointer;
  }

  .dtb-select {
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono);
    font-size: 11px; padding: 3px 6px; outline: none; cursor: pointer;
  }
  .dtb-select option { background: var(--bg-panel); }

  .dtb-btn.active { background: var(--gold-glow); color: var(--gold); }
  .dtb-label { font-size: 10px; color: var(--text-dim); padding: 0 4px; }

  .drawing-handle {
    fill: var(--gold);
    stroke: var(--bg-panel);
    stroke-width: 1.5;
    cursor: move;
    transition: r .1s;
  }
  .drawing-handle:hover { r: 7; }
  [contenteditable]:empty:before { content: attr(data-placeholder); opacity: .5; }
  .selected-drawing { filter: drop-shadow(0 0 4px rgba(201,168,76,.7)); }
</style>
</head>
<body>

<!-- ══ TOP BAR ══════════════════════════════════════════ -->
<div id="topbar">
  <div class="logo">ZENTINEL</div>
  <div class="logo-sep"></div>

  <div id="symbol-search-wrap">
    <input id="symbol-input" class="topbar-input" type="text" value="NAS100.fs" placeholder="Symbol" autocomplete="off" title="Enter symbol and press Enter">
  </div>

  <div id="price-display">
    <span id="price-last">—</span>
    <span id="price-change" class="">—</span>
  </div>

  <div id="ohlcv-bar">
    <span><b>O</b><span id="ohlc-o">—</span></span>
    <span><b>H</b><span id="ohlc-h">—</span></span>
    <span><b>L</b><span id="ohlc-l">—</span></span>
    <span><b>C</b><span id="ohlc-c">—</span></span>
    <span><b>V</b><span id="ohlc-v">—</span></span>
  </div>

  <div class="topbar-spacer"></div>

  <div id="layout-picker" title="Cantidad de gráficos">
    <button class="layout-btn active" data-layout="1">1</button>
    <button class="layout-btn" data-layout="2">2 ×</button>
    <button class="layout-btn" data-layout="4">4 ⊞</button>
  </div>

  <button class="topbar-btn theme-toggle-btn" title="Cambiar a modo claro" onclick="toggleTheme()"></button>

  <button class="topbar-btn" id="btn-refresh" title="Refresh chart" onclick="refreshChart()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>

  <button class="topbar-btn" id="btn-settings" onclick="openChartSettingsModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </button>

  <div id="api-badge" onclick="openChartSettingsModal()">BRIDGE…</div>
</div>

<!-- ══ TIMEFRAME BAR ═════════════════════════════════════ -->
<div id="tf-bar">
  <div id="tf-bar-symbol"></div>
  <div id="tf-bar-tfs"></div>
  <button class="topbar-btn" id="btn-indicators" onclick="openIndicatorModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Indicators
  </button>
</div>

<!-- ══ MAIN ══════════════════════════════════════════════ -->
<div id="main">

  <!-- ── TOOLBAR ───────────────────────────────────────── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tip="Cursor" onclick="setTool(this,'cursor')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z"/></svg>
    </button>
    <button class="tool-btn" data-tip="Crosshair" onclick="setTool(this,'cross')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Trend Line" onclick="setTool(this,'trendline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="20" x2="20" y2="4"/>
        <circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="4" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Horizontal Line" onclick="setTool(this,'hline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="2" y1="12" x2="22" y2="12"/><circle cx="2" cy="12" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Vertical Line" onclick="setTool(this,'vline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="2" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Rectangle" onclick="setTool(this,'rect')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1"/></svg>
    </button>
    <button class="tool-btn" data-tip="Fibonacci" onclick="setTool(this,'fib')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="2" y1="3.5" x2="22" y2="3.5"/>
        <line x1="2" y1="8.3" x2="15" y2="8.3"/>
        <line x1="2" y1="13" x2="20" y2="13"/>
        <line x1="2" y1="17.7" x2="11" y2="17.7"/>
        <line x1="2" y1="22.5" x2="22" y2="22.5"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Long Position" onclick="setTool(this,'long')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="7" rx="1" fill="currentColor" fill-opacity="0.25" stroke="none"/>
        <rect x="3" y="14" width="18" height="7" rx="1" fill="none"/>
        <line x1="2" y1="10.5" x2="22" y2="10.5"/>
        <polyline points="9 16 12 19 15 16"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Short Position" onclick="setTool(this,'short')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="14" width="18" height="7" rx="1" fill="currentColor" fill-opacity="0.25" stroke="none"/>
        <rect x="3" y="3" width="18" height="7" rx="1" fill="none"/>
        <line x1="2" y1="13.5" x2="22" y2="13.5"/>
        <polyline points="9 8 12 5 15 8"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Text Label" onclick="setTool(this,'text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="4 7 4 4 20 4 20 7"/>
        <line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="btn-magnet" data-tip="Magnet (ajustar a vela)" onclick="toggleMagnet()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 3h4v9a2 2 0 0 0 4 0V3h4v9a6 6 0 0 1-12 0V3z"/>
        <path d="M6 3v4H2V3h4zM18 3v4h4V3h-4z"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Clear All" onclick="clearDrawings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="btn-volume" data-tip="Toggle Volume" onclick="toggleVolume()" style="margin-top:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="14" width="4" height="7" rx="1"/>
        <rect x="9" y="9" width="4" height="12" rx="1"/>
        <rect x="16" y="4" width="4" height="17" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- ── SIDEBAR TOGGLE ─────────────────────────────────── -->
  <button id="btn-sidebar-toggle" title="Mostrar/ocultar watchlist" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <!-- ── SIDEBAR ───────────────────────────────────────── -->
  <div id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        Watchlist
        <button class="sidebar-add-btn" onclick="toggleAddSym()" title="Add symbol">+</button>
      </div>
      <div id="add-sym-form">
        <input id="add-sym-inp" type="text" placeholder="AAPL, BTC/USD…" maxlength="20">
        <button id="add-sym-ok" onclick="addSymbol()">→</button>
      </div>
      <div id="watchlist"></div>
      <div class="sidebar-indicators">
        <div class="sidebar-header">
          Active Indicators
          <button class="sidebar-add-btn" onclick="openIndicatorModal()" title="Add indicator">+</button>
        </div>
        <div id="ind-list"></div>
      </div>
    </div>
  </div>

  <!-- ── CHART ─────────────────────────────────────────── -->
  <div id="chart-wrap">
    <div id="chart-container">
      <div id="price-countdown-badge">—</div>
      <div id="watchtower-bias-badge"></div>
      <div id="chart-indicator-chips"></div>
      <div id="loading-overlay">
        <div class="loader-logo">ZENTINEL</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
        <div class="loader-msg" id="loader-msg">Initializing…</div>
      </div>
      <div id="crosshair-info"></div>
    </div>
  </div>
</div>

<!-- ── STATUS BAR ─────────────────────────────────────── -->
<div id="statusbar">
  <div class="sb-item"><b>Symbol:</b><span id="sb-sym">—</span></div>
  <div class="sb-item"><b>TF:</b><span id="sb-tf">—</span></div>
  <div class="sb-item"><b>Bars:</b><span id="sb-bars">—</span></div>
  <div class="sb-item"><b>Range:</b><span id="sb-range">—</span></div>
  <span id="status-conn" class="loading">● connecting…</span>
</div>

<!-- ══ FLOATING DRAWING TOOLBAR ══════════════════════════ -->
<div id="draw-toolbar">
  <div class="dtb-color-wrap" id="dtb-color-wrap">
    <span class="dtb-label">Color</span>
    <div class="dtb-color-swatch" id="dtb-color-swatch" style="background:#c9a84c">
      <input type="color" id="dtb-color" value="#c9a84c" oninput="onDtbColorChange(this.value)">
    </div>
  </div>
  <!-- La herramienta de posición (long/short) no tiene UN color — tiene 3
       (entrada/TP/SL), fijos en el código hasta ahora. El selector de
       arriba no hacía nada para ella (engañaba: parecía que cambiaba algo
       y no pasaba nada). Estos 3 swatches solo se muestran para long/short. -->
  <div class="dtb-color-wrap" id="dtb-pos-colors" style="display:none;gap:10px;">
    <div class="dtb-color-wrap" style="gap:4px;">
      <span class="dtb-label">Entry</span>
      <div class="dtb-color-swatch" id="dtb-pos-entry-swatch">
        <input type="color" id="dtb-pos-entry-color" oninput="onDtbPosColorChange('entryColor', this.value, this)">
      </div>
    </div>
    <div class="dtb-color-wrap" style="gap:4px;">
      <span class="dtb-label">TP</span>
      <div class="dtb-color-swatch" id="dtb-pos-tp-swatch">
        <input type="color" id="dtb-pos-tp-color" oninput="onDtbPosColorChange('profitColor', this.value, this)">
      </div>
    </div>
    <div class="dtb-color-wrap" style="gap:4px;">
      <span class="dtb-label">SL</span>
      <div class="dtb-color-swatch" id="dtb-pos-sl-swatch">
        <input type="color" id="dtb-pos-sl-color" oninput="onDtbPosColorChange('lossColor', this.value, this)">
      </div>
    </div>
  </div>
  <div class="dtb-sep"></div>
  <span class="dtb-label">Width</span>
  <select class="dtb-select" id="dtb-width" onchange="onDtbWidthChange(this.value)">
    <option value="1">1px</option>
    <option value="2">2px</option>
    <option value="3">3px</option>
    <option value="4">4px</option>
  </select>
  <div class="dtb-sep"></div>
  <span class="dtb-label">Style</span>
  <select class="dtb-select" id="dtb-style" onchange="onDtbStyleChange(this.value)">
    <option value="0">─── Solid</option>
    <option value="1">- - - Dashed</option>
    <option value="2">··· Dotted</option>
  </select>
  <div class="dtb-sep"></div>
  <button class="dtb-btn" id="dtb-levels" title="Fibonacci Levels" onclick="openFibLevelsModal()" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="7" x2="14" y2="7"/><line x1="2" y1="11" x2="14" y2="11"/><line x1="2" y1="13.5" x2="14" y2="13.5"/>
    </svg>
    Levels
  </button>
  <div class="dtb-sep"></div>
  <button class="dtb-btn" id="dtb-ext-left" title="Extend Left" onclick="onDtbExtend('left')">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="14" y1="8" x2="2" y2="8"/><polyline points="6,4 2,8 6,12"/>
    </svg>
    Left
  </button>
  <button class="dtb-btn" id="dtb-ext-right" title="Extend Right" onclick="onDtbExtend('right')">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="2" y1="8" x2="14" y2="8"/><polyline points="10,4 14,8 10,12"/>
    </svg>
    Right
  </button>
  <!-- Solo para 'rect': hoy borde y relleno comparten color y siempre están
       los dos prendidos — esto permite apagar uno sin el otro. -->
  <button class="dtb-btn active" id="dtb-rect-border" title="Mostrar/ocultar el borde" onclick="onDtbToggleRectPart('showBorder')" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg>
    Border
  </button>
  <button class="dtb-btn active" id="dtb-rect-fill" title="Mostrar/ocultar el relleno" onclick="onDtbToggleRectPart('showFill')" style="display:none">
    <svg viewBox="0 0 16 16" fill="currentColor" stroke="none"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/></svg>
    Fill
  </button>
  <div class="dtb-sep"></div>
  <button class="dtb-btn" id="dtb-lock" title="Lock drawing" onclick="onDtbLock()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="3" y="7" width="10" height="8" rx="1.5"/>
      <path d="M5 7V5a3 3 0 016 0v2"/>
    </svg>
    Lock
  </button>
  <div class="dtb-sep"></div>
  <button class="dtb-btn" title="Duplicate" onclick="onDtbClone()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">

<script>
// ══════════════════════════════════════════════════════════
//  MULTI-CHART LAYOUT
//  ?layout=2|4 renders a grid of iframes (each one this same page with
//  ?embed=1&pane=N) instead of the normal single-chart app. ?pane=N
//  namespaces every localStorage key so each pane in the grid keeps
//  its own symbol/timeframe/indicators/settings independently.
// ══════════════════════════════════════════════════════════
const _qs = new URLSearchParams(location.search);
const LAYOUT_N = Number(_qs.get('layout')) || 1;
const EMBED_MODE = _qs.get('embed') === '1';
const PANE_ID = _qs.get('pane') || '';
const LS_SUFFIX = PANE_ID ? ('_p' + PANE_ID) : '';
function lsKey(name){ return name + LS_SUFFIX; }
if (EMBED_MODE) document.documentElement.classList.add('embed-mode');

// Chrome a veces bloquea localStorage al abrir index.html como archivo
// local (file://) — tira SecurityError y, si no se controla, esto frena
// TODO el script apenas arranca (pantalla en blanco). Con este wrapper,
// si el storage no está disponible la app igual carga (sin recordar nada
// entre sesiones) en vez de romperse.
let _lsOK = true;
try { localStorage.setItem('__td_probe__','1'); localStorage.removeItem('__td_probe__'); } catch(e) { _lsOK = false; }
const _lsMem = {};
function lsGet(key){ if(!_lsOK) return _lsMem[key] ?? null; try { return localStorage.getItem(key); } catch(e){ return _lsMem[key] ?? null; } }
function lsSet(key, val){ if(!_lsOK){ _lsMem[key]=val; return; } try { localStorage.setItem(key, val); } catch(e){ _lsMem[key]=val; } }
if (!_lsOK) console.warn('Zentinel: localStorage no disponible (bloqueado por el navegador) — la configuración no va a persistir entre recargas.');

// ══════════════════════════════════════════════════════════
//  TEMA (claro/oscuro) — afecta toda la interfaz (toolbar, sidebar,
//  modales, barras) pero NO el gráfico en sí: los colores de velas/fondo
//  del chart ya se manejan aparte, desde Settings (STATE.chartSettings),
//  y no dependen de estas variables CSS.
//
//  Clave SIN sufijo de pane (lsGet/lsSet directo, no lsKey) a propósito:
//  es una preferencia de toda la app, no por panel — así en la grilla
//  multi-chart todos los paneles (y la barra global de afuera, que es una
//  página aparte) quedan siempre con el mismo tema. Se aplica ACÁ, antes
//  de cualquier render, para no mostrar un flash con el tema viejo.
// ══════════════════════════════════════════════════════════
function applyTheme(theme){
  if (theme === 'light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('.theme-toggle-btn').forEach(btn=>{
    btn.innerHTML = theme==='light' ? THEME_ICON_MOON : THEME_ICON_SUN;
    btn.title = theme==='light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
  });
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
  lsSet('td_theme', next);
  applyTheme(next);
}
const THEME_ICON_SUN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const THEME_ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
applyTheme(lsGet('td_theme') || 'dark');
// Si se cambia el tema desde OTRA pestaña/panel (grilla multi-chart: cada
// panel y la barra global son documentos separados), el evento 'storage'
// avisa acá para que este documento también se actualice al toque.
window.addEventListener('storage', e => { if (e.key === 'td_theme') applyTheme(e.newValue || 'dark'); });

// Diferido: deja que el resto del script (definiciones de funciones,
// listeners sobre elementos que está por reemplazar) termine de correr
// sin tirar errores antes de vaciar el <body>.
if (LAYOUT_N > 1 && !EMBED_MODE) setTimeout(() => renderLayoutGrid(LAYOUT_N), 0);
function renderLayoutGrid(n){
  document.body.innerHTML = '';
  document.body.style.cssText = 'margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg-primary);';

  // Panel "activo": el que tiene el borde dorado. Como cada panel es un
  // iframe aparte, un click adentro no genera un evento que el padre pueda
  // escuchar directamente — el truco estándar es mirar document.activeElement
  // en el 'blur' de la ventana principal (se dispara cuando el foco pasa a
  // un iframe hijo) y fijarse cuál de los iframes lo tiene.
  const iframeEls = [];
  let activePane = 1;
  let scope = 'active'; // 'active' | 'all' — a quién les llegan los controles globales
  function setActivePane(idx){
    activePane = idx;
    iframeEls.forEach((el,i) => { el.style.borderColor = (i+1===idx) ? 'var(--gold)' : 'transparent'; });
  }
  // Aviso explícito de cada panel al clickearlo — más confiable que el
  // 'blur' de abajo, que solo agarra bien el primer salto de foco.
  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (msg && msg.type === 'zentinel:paneFocused') {
      const idx = Number(msg.pane);
      if (idx >= 1 && idx <= iframeEls.length) setActivePane(idx);
    }
  });
  // Fallback por si el panel todavía no cargó el script que manda el aviso
  // de arriba (primer instante tras crear los iframes).
  window.addEventListener('blur', () => {
    setTimeout(() => {
      const idx = iframeEls.indexOf(document.activeElement);
      if (idx !== -1) setActivePane(idx+1);
    }, 0);
  });
  function targetFrames(){
    return scope === 'all' ? iframeEls : [iframeEls[activePane-1]];
  }
  function broadcast(msg){
    targetFrames().forEach(el => el.contentWindow.postMessage(msg, '*'));
  }

  // ─── Barra 1 y 2: MISMA estructura/orden que #topbar y #tf-bar en modo
  // 1 gráfico (no solo mismas clases/colores — el motivo de que antes "no
  // se vieran iguales" pese a compartir CSS es que el contenido estaba
  // repartido distinto). Acá se respeta slot por slot:
  //   Barra 1 (52px): logo · separador · [controles principales] · spacer
  //                   · layout-picker · refresh (solo ícono) · settings
  //   Barra 2 (36px): [identidad a la izquierda] · TFs rápidos
  // En modo grilla no hay un símbolo/precio único que mostrar (puede haber
  // uno distinto por panel), así que donde #topbar pone el symbol-input +
  // precio + OHLCV, acá va el selector "Aplicar a" + el símbolo GLOBAL; y
  // donde #tf-bar pone el nombre de símbolo, acá va el selector de preset.
  const bar = document.createElement('div');
  bar.id = 'topbar';
  bar.innerHTML = `
    <div class="logo">ZENTINEL</div>
    <div class="logo-sep"></div>
    <div id="gc-scope" style="display:flex;gap:2px;"></div>
    <input id="gc-symbol" class="topbar-input" type="text" placeholder="Símbolo…" autocomplete="off" title="Símbolo para el panel activo o todos — Enter para aplicar" style="width:120px;">
    <div class="topbar-spacer"></div>
    <div id="layout-picker" title="Cantidad de gráficos">
      ${[1,2,4].map(v=>`<button class="layout-btn${v===n?' active':''}" data-layout="${v}">${v===1?'1':v===2?'2 ×':'4 ⊞'}</button>`).join('')}
    </div>
    <button class="topbar-btn theme-toggle-btn" title="Cambiar tema" onclick="toggleTheme()"></button>
    <button class="topbar-btn" id="gc-refresh" title="Refrescar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button class="topbar-btn" id="gc-settings" title="Configuración del panel activo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
    </button>
    <div id="api-badge" style="pointer-events:none;">MULTI</div>
  `;
  bar.querySelectorAll('[data-layout]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = btn.dataset.layout;
      location.href = v==='1' ? 'index.html' : ('index.html?layout='+v);
    });
  });

  const gbar = document.createElement('div');
  gbar.id = 'tf-bar';
  gbar.innerHTML = `
    <div id="tf-bar-symbol" style="display:flex;align-items:center;gap:6px;">
      <span style="color:var(--text-dim);font-family:var(--font-mono);font-size:11px;font-weight:400;letter-spacing:0;text-transform:none;">Preset:</span>
      <select id="gc-preset" class="topbar-input" style="width:auto;padding:4px 8px;font-size:11px;text-transform:none;letter-spacing:normal;"></select>
      <button id="gc-preset-apply" class="topbar-btn">Aplicar</button>
    </div>
    <div id="tf-bar-tfs"></div>
  `;
  document.body.appendChild(bar);
  document.body.appendChild(gbar);
  applyTheme(lsGet('td_theme') || 'dark'); // repinta el ícono del botón de tema recién creado

  // Scope: Activo / Todos
  const scopeWrap = bar.querySelector('#gc-scope');
  function renderScopeBtns(){
    scopeWrap.innerHTML = ['active','all'].map(s =>
      `<button class="layout-btn${s===scope?' active':''}" data-scope="${s}" title="¿A qué panel(es) aplican el símbolo, los TFs rápidos y 'Aplicar preset' de esta barra?">${s==='active'?'Activo':'Todos'}</button>`
    ).join('');
    scopeWrap.querySelectorAll('[data-scope]').forEach(b=>{
      b.addEventListener('click', ()=>{ scope=b.dataset.scope; renderScopeBtns(); });
    });
  }
  renderScopeBtns();

  // Símbolo: Enter para aplicar
  const symbolInp = bar.querySelector('#gc-symbol');
  symbolInp.addEventListener('keydown', e=>{
    if (e.key !== 'Enter') return;
    const sym = symbolInp.value.trim();
    if (!sym) return;
    broadcast({ type:'zentinel:setSymbol', symbol:sym });
    symbolInp.value='';
  });

  // Timeframes más comunes (acceso rápido global — cada panel sigue
  // teniendo su propia barra completa de TF para ajustes finos).
  const QUICK_TFS = [ ['1min','1m'], ['5min','5m'], ['15min','15m'], ['1h','1H'], ['4h','4H'], ['1day','D'] ];
  const tfWrap = gbar.querySelector('#tf-bar-tfs');
  tfWrap.innerHTML = QUICK_TFS.map(([tf,label]) => `<button class="tf-btn" data-tf="${tf}">${label}</button>`).join('');
  tfWrap.querySelectorAll('[data-tf]').forEach(b=>{
    b.addEventListener('click', ()=>broadcast({ type:'zentinel:setTimeframe', tf:b.dataset.tf }));
  });

  // Presets ya guardados (mismo storage que usan los paneles — sin sufijo
  // de pane, por eso se puede leer directo acá afuera). Guardar uno nuevo
  // pasa DENTRO de un panel (iframe) — el 'storage' event es lo que avisa
  // acá afuera que cambió, así la lista no queda vieja sin recargar todo.
  const presetSel = gbar.querySelector('#gc-preset');
  function renderPresetOptions(){
    const current = presetSel.value;
    let presets = {};
    try { presets = JSON.parse(lsGet('td_presets') || '{}'); } catch(e){}
    const names = Object.keys(presets).sort();
    presetSel.innerHTML = names.length
      ? names.map(nm=>`<option value="${nm}">${nm}</option>`).join('')
      : `<option value="">(sin presets guardados)</option>`;
    if (names.includes(current)) presetSel.value = current;
  }
  renderPresetOptions();
  window.addEventListener('storage', (e) => {
    if (e.key === 'td_presets') renderPresetOptions();
  });
  // Por si el 'storage' event no llega a tiempo en algún navegador: la
  // releemos también justo antes de abrir el desplegable.
  presetSel.addEventListener('mousedown', renderPresetOptions);
  gbar.querySelector('#gc-preset-apply').addEventListener('click', ()=>{
    const name = presetSel.value;
    if (!name) return;
    broadcast({ type:'zentinel:applyPreset', name });
  });

  bar.querySelector('#gc-refresh').addEventListener('click', ()=>{
    broadcast({ type:'zentinel:refresh' });
  });
  // Settings abre un modal — no tiene sentido "a todos" (solo se puede
  // mirar uno a la vez), así que siempre apunta al panel activo sin
  // importar lo que diga el selector de alcance.
  bar.querySelector('#gc-settings').addEventListener('click', ()=>{
    iframeEls[activePane-1].contentWindow.postMessage({ type:'zentinel:openSettings' }, '*');
  });

  // ─── Grilla de paneles ─────────────────────────────────────
  const grid = document.createElement('div');
  const cols = n===4 ? 2 : n;
  const rows = n===4 ? 2 : 1;
  grid.style.cssText = `flex:1;display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:2px;background:var(--bg-primary);min-height:0;`;
  for (let i=1;i<=n;i++){
    const iframe = document.createElement('iframe');
    iframe.src = `index.html?embed=1&pane=${i}`;
    iframe.style.cssText = 'width:100%;height:100%;box-sizing:border-box;display:block;border:1px solid transparent;transition:border-color .15s;';
    grid.appendChild(iframe);
    iframeEls.push(iframe);
  }
  setActivePane(1);
  document.body.appendChild(grid);
}

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const WT_KZ_DEFAULTS = {
  asia:  { enabled:true, start:[19,0], end:[20,0], color:'#f7525f' },
  london:{ enabled:true, start:[2,0],  end:[5,0],  color:'#5b9cf6' },
  nyam:  { enabled:true, start:[9,0],  end:[10,0], color:'#e0e0e0' },
  nylu:  { enabled:true, start:[10,0], end:[11,0], color:'#ffa726' },
  nypm:  { enabled:true, start:[11,0], end:[12,0], color:'#e0e0e0' },
};
const _wtSaved = JSON.parse(lsGet(lsKey('td_watchtower')) || '{}');
const _wtKz = {};
Object.keys(WT_KZ_DEFAULTS).forEach(k => {
  _wtKz[k] = Object.assign({}, WT_KZ_DEFAULTS[k], (_wtSaved.kz && _wtSaved.kz[k]) || {});
});

const ALL_TIMEFRAMES = [
  { tf:'1min',  label:'1m',  group:'m' }, { tf:'2min',  label:'2m',  group:'m' },
  { tf:'3min',  label:'3m',  group:'m' }, { tf:'4min',  label:'4m',  group:'m' },
  { tf:'5min',  label:'5m',  group:'m' }, { tf:'6min',  label:'6m',  group:'m' },
  { tf:'10min', label:'10m', group:'m' }, { tf:'12min', label:'12m', group:'m' },
  { tf:'15min', label:'15m', group:'m' }, { tf:'20min', label:'20m', group:'m' },
  { tf:'30min', label:'30m', group:'m' },
  { tf:'1h',  label:'1H',  group:'h' }, { tf:'2h',  label:'2H',  group:'h' },
  { tf:'3h',  label:'3H',  group:'h' }, { tf:'4h',  label:'4H',  group:'h' },
  { tf:'6h',  label:'6H',  group:'h' }, { tf:'8h',  label:'8H',  group:'h' },
  { tf:'12h', label:'12H', group:'h' },
  { tf:'1day',   label:'D', group:'d' },
  { tf:'1week',  label:'W', group:'d' },
  { tf:'1month', label:'M', group:'d' },
];
const CHART_SETTINGS_DEFAULTS = {
  bgColor:'#0a0a0c',
  upColor:'#26a69a', downColor:'#909090',
  borderUpColor:'#26a69a', borderDownColor:'#909090',
  wickUpColor:'#8a8a8a', wickDownColor:'#8a8a8a',
  priceLineVisible:true, priceLineColor:'', priceLineStyle:2,
  showGrid:true, showWatermark:true,
  crosshairColor:'#c9a84c', crosshairStyle:2,
  visibleTFs: ALL_TIMEFRAMES.map(t=>t.tf),
};
// Paso 1 del port de "ICT Zentinel Sniper 2.0 SD FIX" — solo Sweep HTF +
// CISD. Los nombres de los inputs son los mismos que en el Pine original
// (grupos "HTF Sweep" / "CISD" / filtros sueltos) para los que SÍ se portan
// en este paso; el resto (Trading Boxes, SD Projections, FVG, intra-HTF)
// queda afuera hasta los pasos siguientes.
// Colores como rgba() listos para usar directo en el SVG (consistente con

function genId() { return 'drw_' + Math.random().toString(36).slice(2,9); }

// Niveles de Fibonacci por defecto para cada retroceso nuevo — editables
// por dibujo (se pueden agregar, sacar o cambiar) desde el botón "Levels".
const DEFAULT_FIB_LEVELS = [
  { value:0,     color:'#ef5350', on:true },
  { value:0.236, color:'#f0c060', on:true },
  { value:0.382, color:'#26a69a', on:true },
