function initWatchtowerLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:15;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._watchtowerSvg = svg;
  function syncSize(){ svg.setAttribute('width',container.clientWidth); svg.setAttribute('height',container.clientHeight); }
  new ResizeObserver(syncSize).observe(container);
  syncSize();
}

// Doble click sobre CUALQUIER dibujo de un indicador custom abre su panel
// de settings — vale para Watchtower hoy y para cualquier indicador que se
// agregue después, sin tener que tocar ninguno de estos dos listeners.
// Dos mecanismos en paralelo (el que responda primero gana, con
// stopPropagation para no abrir el modal dos veces):
//   1) data-indicator-name en el elemento DOM (vía tagIndicatorEl) — sirve
//      para elementos HTML normales (ej. el badge de bias).
//   2) hitTestIndicatorRegions (vía registerIndicatorHit) — coordenadas
//      manuales contra #chart-container, el mismo patrón ya probado que
//      usa el sistema de dibujo para arrastrar líneas/handles. No depende
//      de pointer-events/stacking de SVG, que puede variar entre navegadores.
// El evento nativo 'dblclick' puede no llegar nunca acá: el canvas del
// chart (lightweight-charts) tiene su propio manejo de click/doble-click
// (reset de escala, etc.) que puede frenar la propagación antes de que
// burbujee hasta este listener — por eso "no reaccionaba" aunque el cursor
// ya mostrara pointer. En vez de depender de eso, detectamos el doble click
// a mano sobre 'mousedown' en fase CAPTURE — la misma técnica que ya usa el
// sistema de dibujo (ver más abajo, "capture:true + stopPropagation") y que
// sabemos que sí recibe el evento de forma confiable, porque arrastrar un
// dibujo ya depende de eso.
(function(){
  const cc = document.getElementById('chart-container');
  let lastHit = { time: 0, x: 0, y: 0, name: null };

  cc.addEventListener('mousedown', (e) => {
    const rect = cc.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    // Si el click cae sobre el eje de precios (derecha) o el eje de tiempo
    // (abajo), dejarlo pasar siempre: son zonas donde lightweight-charts
    // maneja su propio drag/doble-click (reescalar, auto-fit, etc.) y no
    // deben interpretarse como click sobre un dibujo, aunque la línea del
    // indicador se extienda visualmente hasta ahí.
    const plotW = cc.clientWidth - chart.priceScale('right').width();
    const plotH = cc.clientHeight - chart.timeScale().height();
    if (mx > plotW || my > plotH) { lastHit = { time:0, x:0, y:0, name:null }; return; }
    const name = hitTestIndicatorRegions(mx, my);
    if (!name) { lastHit = { time:0, x:0, y:0, name:null }; return; }

    const now = Date.now();
    const sameSpot = Math.hypot(mx - lastHit.x, my - lastHit.y) < 12;
    if (name === lastHit.name && sameSpot && (now - lastHit.time) < 500) {
      e.preventDefault();
      e.stopPropagation();
      openIndicatorSettings(name);
      lastHit = { time:0, x:0, y:0, name:null };
    } else {
      lastHit = { time: now, x: mx, y: my, name };
    }
  }, { capture: true });

  // El feedback de cursor "pointer" sobre un dibujo de indicador se decide
  // en el handler de mousemove del sistema de dibujo (más abajo, buscar
  // "Sin arrastre activo") — antes vivía en un listener separado acá que
  // solo seteaba 'pointer' una vez por frame (vía requestAnimationFrame)
  // mientras el otro handler reseteaba a '' en CADA mousemove de forma
  // síncrona: los dos listeners peleaban por el mismo style.cursor del
  // mismo elemento y el resultado era que titilaba entre manito y flecha
  // sin quedarse fijo. Unificar la decisión en un solo lugar lo resuelve.

  // Mecanismo 1 (el del comentario de arriba): elementos HTML normales
  // tageados con data-indicator-name (hoy solo el badge de bias de
  // Watchtower) — quedaban marcados como clickeables (pointer-events:auto,
  // cursor:pointer, dataset.indicatorName seteado) pero nada escuchaba el
  // doble click sobre ellos todavía, así que no reaccionaban. Este sí es un
  // elemento HTML normal (no el canvas del chart), así que el 'dblclick'
  // nativo llega sin el problema que describe el comentario de arriba.
  document.addEventListener('dblclick', (e) => {
    const target = e.target.closest('[data-indicator-name]');
    if (!target) return;
    e.preventDefault();
    e.stopPropagation();
    openIndicatorSettings(target.dataset.indicatorName);
  });
})();

function initChart() {
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: { background: buildChartBackground(STATE.chartSettings), textColor:STATE.chartSettings.textColor, fontFamily:"'DM Mono', monospace", fontSize:11, attributionLogo:false },
    grid:   { vertLines:{visible:false}, horzLines:{visible:false} },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color:STATE.chartSettings.crosshairColor, style:STATE.chartSettings.crosshairStyle, labelBackgroundColor:'#1e1e2a' },
      horzLine: { color:STATE.chartSettings.crosshairColor, style:STATE.chartSettings.crosshairStyle, labelBackgroundColor:'#1e1e2a' },
    },
    rightPriceScale: { borderColor:'#222230', scaleMargins:{top:0.08,bottom:0.18} },
    timeScale: { borderColor:'#222230', timeVisible:true, secondsVisible:false, rightOffset:8, barSpacing:10 },
    watermark: { visible:false },
  });

  candleSeries = chart.addCandlestickSeries({});
  applyChartSettings();

  volumeSeries = chart.addHistogramSeries({
    color:'#c9a84c22', priceFormat:{type:'volume'}, priceScaleId:'vol', visible:volumeVisible,
  });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82,bottom:0} });

  let _suppressCrosshairBroadcast = false;
  let _lastExternalCandleTime = undefined;
  window.setExternalCrosshair = function(time){
    if (!STATE.chartSettings.syncCrosshair) return;
    try {
      if (time == null) {
        // Si ya estaba limpio, no hay nada que hacer — ver el comentario
        // de más abajo sobre por qué una llamada redundante es un problema.
        if (_lastExternalCandleTime === null) return;
        _lastExternalCandleTime = null;
        _suppressCrosshairBroadcast = true;
        chart.clearCrosshairPosition();
        // clearCrosshairPosition() no dispara subscribeCrosshairMove (solo
        // los "move" lo hacen), así que el cuadro de OHLC no se actualiza
        // solo — hay que ocultarlo a mano acá.
        const info = document.getElementById('crosshair-info');
        if (info) info.style.display = 'none';
        return;
      }
      // Búsqueda binaria (las velas vienen ordenadas) en vez de barrer todo
      // el array — con Watchtower activo puede haber miles cargadas, y esto
      // corre en cada movimiento del mouse del panel que SÍ se está
      // moviendo, para cada uno de los demás paneles.
      const candles = window._lastCandles || [];
      let candle = null;
      if (candles.length) {
        let lo = 0, hi = candles.length - 1;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (candles[mid].time < time) lo = mid + 1; else hi = mid;
        }
        candle = candles[lo];
        if (lo > 0 && Math.abs(candles[lo-1].time - time) < Math.abs(candle.time - time)) candle = candles[lo-1];
      }
      const resolvedTime = candle ? candle.time : null;
      // Dos tiempos "crudos" distintos (p.ej. de dos TF distintos) pueden
      // resolver a la MISMA vela acá — si ya está aplicada esa vela, salir
      // sin tocar nada. Reaplicar setCrosshairPosition aunque sea con el
      // mismo valor puede disparar otro subscribeCrosshairMove en ESTE
      // panel, que viaja de vuelta al de origen si el timing no da justo
      // con la bandera de supresión — eso es lo que se veía como el precio
      // prendiéndose y apagándose entre dos valores sin tocar el mouse.
      if (resolvedTime === _lastExternalCandleTime) return;
      _lastExternalCandleTime = resolvedTime;
      _suppressCrosshairBroadcast = true;
      if (candle) chart.setCrosshairPosition(candle.close, candle.time, candleSeries);
      else chart.clearCrosshairPosition();
    } finally {
      requestAnimationFrame(() => { _suppressCrosshairBroadcast = false; });
    }
  };

  // subscribeCrosshairMove dispara en CADA mousemove sobre el chart, sin
  // límite de frecuencia — con el mouse quieto sobre una vela real (donde
  // sí hay trabajo: formatear OHLC, pisar textContent del topbar, y en la
  // grilla multi-chart además transmitir a los demás paneles) eso puede
  // llegar a varias decenas de veces por segundo, muy por encima de los
  // ~60/seg que la pantalla puede pintar — se sentía como que el cursor
  // "se trababa" cuando pasaba por encima de las velas (y no en el espacio
  // vacío después de la última, donde no hay vela y este trabajo ni corre).
  // Igual que en el resize de los paneles y el scroll-fade del TF bar: se
  // guarda solo el ÚLTIMO param y se aplica una vez por frame.
  // Si el mouse REAL no está físicamente encima de ESTE chart, cualquier
  // 'crosshair move' que llegue es un eco — del refresco de precio en vivo
  // (cada 1s) reescribiendo la vela en formación bajo una posición de
  // crosshair que quedó puesta por sync externo, no por el usuario — y
  // jamás debe retransmitirse. Sin esto, un panel que SOLO está mirando
  // (no el que el usuario está moviendo) podía reenviar ese eco de vuelta
  // al panel activo, empujando SU crosshair a otro nivel sin que nadie lo
  // tocara — "como buscando un nivel cercano, se sale del puntero".
  let _realMouseOverChart = false;
  container.addEventListener('mousemove', () => { _realMouseOverChart = true; }, { passive:true, capture:true });
  container.addEventListener('mouseleave', () => { _realMouseOverChart = false; }, { passive:true, capture:true });
  let _chmPending = null, _chmRaf = null, _lastBroadcastTime = undefined;
  function _applyChmLocal(){
    _chmRaf = null;
    const param = _chmPending; _chmPending = null;
    if (!param) return;
    const info = document.getElementById('crosshair-info');
    if (!param.time || !param.seriesData) { info.style.display='none'; }
    else {
      const d = param.seriesData.get(candleSeries);
      if (!d) { info.style.display='none'; }
      else {
        info.style.display='block';
        info.innerHTML = `O <span>${fmt(d.open)}</span>  H <span>${fmt(d.high)}</span>  L <span>${fmt(d.low)}</span>  C <span>${fmt(d.close)}</span>`;
        updateTopbarOHLCV(d);
      }
    }
  }
  chart.subscribeCrosshairMove(param => {
    // Solo lo visual (texto OHLC/topbar) se acota a 1 vez por frame — eso
    // es puro DOM local, no le importa a nadie más el orden exacto.
    _chmPending = param;
    if (_chmRaf === null) _chmRaf = requestAnimationFrame(_applyChmLocal);
    // El broadcast a los demás paneles, en cambio, tiene que seguir
    // disparando SÍNCRONO, en el mismo tick que el evento nativo — de eso
    // depende que _suppressCrosshairBroadcast (que se resetea en SU PROPIO
    // rAF, adentro de setExternalCrosshair) vea el valor correcto cuando
    // haga falta frenar el eco de vuelta. Diferirlo acá un frame rompía
    // ese orden y era lo que hacía que el cursor se "pegara" en la línea
    // de precio al pasar por una vela con el sync prendido.
    if (_suppressCrosshairBroadcast || !EMBED_MODE || !STATE.chartSettings.syncCrosshair || !window.top.zentinelCrosshairBroadcast) return;
    const nextTime = param.point ? param.time : null;
    // El "se fue" (null) siempre se deja pasar — recién al dejar el chart
    // es cuando más importa que el eco llegue y limpie el synced de los
    // demás paneles. El bloqueo de abajo es solo para un nivel CONCRETO
    // (eco con tiempo real pero sin mouse físicamente acá).
    if (nextTime !== null && !_realMouseOverChart) return;
    // subscribeCrosshairMove puede refirear con el MISMO punto (mouse
    // quieto) cuando los datos de abajo cambian — p.ej. el refresco de
    // precio en vivo cada 1s pisa la vela en formación y la librería
    // vuelve a notificar el crosshair aunque nadie lo haya movido. Sin
    // este chequeo, eso reenviaba el mismo valor una y otra vez; si otro
    // panel estaba en un TF distinto y el "más cercano" le resolvía a una
    // vela vecina distinta a la que tenía antes por un pelo, el precio de
    // ESE panel terminaba prendiéndose/apagándose entre dos velas al
    // compás del refresco de 1s, sin que nadie tocara el mouse.
    if (nextTime === _lastBroadcastTime) return;
    _lastBroadcastTime = nextTime;
    window.top.zentinelCrosshairBroadcast(nextTime, PANE_ID);
  });

  new ResizeObserver(() => {
    chart.applyOptions({ width:container.clientWidth, height:container.clientHeight });
    clearSvgHighlights();
    if (selectedDrawingId) highlightSelectedSvg(selectedDrawingId);
    renderWatchtower();
    renderSniper();
    renderSweeps();
    syncOverlayPositions();
  }).observe(container);

  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range && range.from < 50) loadMoreHistory();
    renderWatchtower();
    renderSniper();
    renderSweeps();
    syncOverlayPositions();
  });

  // El zoom vertical (arrastrar el eje de precio) cambia el rango de
  // precios visible, no el de tiempo — subscribeVisibleLogicalRangeChange
  // no se entera, así que Watchtower se quedaba "congelado" hasta el
  // próximo evento que sí dispare un redibujo. Mientras el mouse esté
  // apretado en cualquier parte del chart (arrastrando precio, tiempo, o
  // lo que sea) lo seguimos en vivo; se corta apenas se suelta el click.
  //
  // La rueda del mouse/trackpad tiene el mismo problema pero al revés: no
  // hay mousedown, y encima dispara MUCHOS eventos 'wheel' seguidos (sobre
  // todo con scroll por inercia), cada uno disparando un redibujo completo
  // — eso hacía que las cajas se "amontonaran" y recién se acomodaran un
  // rato después de parar de scrollear. Por eso el loop también se prende
  // con 'wheel' y se apaga recién cuando no hubo más eventos en 150ms.
  let _wtDragRaf = null;
  function _wtDragLoop(){ renderWatchtower(); renderSniper(); renderSweeps(); syncOverlayPositions(); _wtDragRaf = requestAnimationFrame(_wtDragLoop); }
  function _wtStartLoop(){ if (!_wtDragRaf) _wtDragRaf = requestAnimationFrame(_wtDragLoop); }
  function _wtStopLoop(){ if (_wtDragRaf) { cancelAnimationFrame(_wtDragRaf); _wtDragRaf = null; renderWatchtower(); renderSniper(); renderSweeps(); syncOverlayPositions(); } }

  let _wtMouseDown = false;
  container.addEventListener('mousedown', () => { _wtMouseDown = true; _wtStartLoop(); });
  window.addEventListener('mouseup', () => { _wtMouseDown = false; if (!_wtWheelTimer) _wtStopLoop(); });

  let _wtWheelTimer = null;
  container.addEventListener('wheel', () => {
    _wtStartLoop();
    clearTimeout(_wtWheelTimer);
    _wtWheelTimer = setTimeout(() => { _wtWheelTimer = null; if (!_wtMouseDown) _wtStopLoop(); }, 150);
  }, { passive:true });

  initWatchtowerLayer();
  initSniperLayer();
  initSweepsLayer();

  // El badge y las etiquetas de los dibujos se re-posicionan acá — ESTO
  // ANTES corría en un requestAnimationFrame que se reprogramaba a sí mismo
  // para siempre (60-120 veces por segundo, sin parar nunca, incluso con el
  // chart totalmente quieto), igual que le pasaba a Watchtower antes de que
  // se corrigiera (ver comentario de _wtDragLoop más arriba: "hacerlo 60
  // veces por segundo todo el tiempo es lo que hacía sentir lento"). Mismo
  // diagnóstico, mismo arreglo acá: solo hace falta reposicionar esto
  // cuando algo realmente cambia — pan/zoom, drag/wheel activo, resize —
  // no en un loop perpetuo de fondo todo el tiempo que el chart esté abierto.
  function syncOverlayPositions(){
    if (window._lastCandles){ const l=window._lastCandles[window._lastCandles.length-1]; positionCountdownBadge(l.close,l.open); }
    drawings.forEach(d=>{
      if (window._dragSession && window._dragSession.drawing===d) return;
      if (d.type==='text' && d.label) {
        const x=chart.timeScale().timeToCoordinate(d.p1.time), y=candleSeries.priceToCoordinate(d.p1.price);
        d.label.style.display = (x===null||y===null) ? 'none' : 'block';
        if (x!==null&&y!==null){ d.label.style.left=(x+6)+'px'; d.label.style.top=(y-10)+'px'; }
      } else if (d.type==='vline') {
        syncVLine(d);
      } else if (d.type==='rect') {
        syncRectFill(d);
      } else if (d.type==='long' || d.type==='short') {
        syncPositionTool(d);
      }
    });
  }
  window._syncOverlayPositions = syncOverlayPositions;
  syncOverlayPositions();
}

// ══════════════════════════════════════════════════════════
//  DRAWING LAYER
// ══════════════════════════════════════════════════════════
function initDrawingLayer() {
  const container = document.getElementById('chart-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;overflow:hidden;';
  container.appendChild(svg);
  window._drawingLayerSvg = svg;

  let previewEl = null;
  let drawStart = null;

  function syncSvgSize() {
    svg.setAttribute('width',  container.clientWidth);
    svg.setAttribute('height', container.clientHeight);
  }
  new ResizeObserver(syncSvgSize).observe(container);
  syncSvgSize();

  function clearPreview() { if (previewEl) { previewEl.remove(); previewEl=null; } }

  function getCoords(e) {
    const rect = container.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    let price = candleSeries.coordinateToPrice(y);
    let time = chart.timeScale().coordinateToTime(x);
    const candles = window._lastCandles || [];
    if (time === null && candles.length) {
      const bi = candles.length>1 ? candles[candles.length-1].time - candles[candles.length-2].time : 3600;
      const lastX = chart.timeScale().timeToCoordinate(candles[candles.length-1].time);
      const firstX = chart.timeScale().timeToCoordinate(candles[0].time);
      if (lastX !== null && x > lastX) {
        const barsOut = Math.round((x - lastX) / (chart.timeScale().options().barSpacing || 10));
        time = candles[candles.length-1].time + bi * Math.max(1, barsOut);
      } else {
        time = (x <= (firstX||0)) ? candles[0].time : candles[candles.length-1].time;
      }
    }
    if (STATE.magnetMode !== 'off' && price !== null && time !== null) {
      const snapped = magnetSnapPoint(candles, time, price);
      if (snapped) {
        const sx = timeToX(snapped.time), sy = priceToY(snapped.price);
        // "weak": como en TV, solo ajusta si el mouse YA cayó cerca de un
        // punto real de la vela — si no, sigue al cursor sin forzar nada.
        // "strong" (el comportamiento de antes) ajusta siempre, sin importar
        // la distancia.
        const closeEnough = sx===null || sy===null ? false : Math.hypot(sx-x, sy-y) <= MAGNET_WEAK_PX;
        if (STATE.magnetMode === 'strong' || closeEnough) {
          price = snapped.price; time = snapped.time;
          if (sx !== null) x = sx;
          if (sy !== null) y = sy;
        }
      }
    }
    return { x, y, price, time };
  }

  // Shift mientras se dibuja una trend line: la fuerza a quedar perfectamente
  // horizontal o vertical (como en TV), según hacia qué lado se movió más.
  function shiftSnap(e, start, cur) {
    if (!e.shiftKey) return cur;
    const dx = Math.abs(cur.x - start.x), dy = Math.abs(cur.y - start.y);
    const snapHorizontal = dx > dy;
    const x = snapHorizontal ? cur.x : start.x;
    const y = snapHorizontal ? start.y : cur.y;
    let time = snapHorizontal ? cur.time : start.time;
    const price = snapHorizontal ? start.price : cur.price;
    return { x, y, price, time };
  }

  function updateSvgCapture() {
    const tool = STATE.activeTool;
    const isDrawTool = !['cursor','cross'].includes(tool);
    svg.style.pointerEvents = isDrawTool ? 'all' : 'none';
    svg.style.cursor = isDrawTool ? (tool==='text'?'text':'crosshair') : '';
  }

  const _origSetTool = window.setTool;
  window.setTool = function(btn, name) {
    _origSetTool(btn, name);
    updateSvgCapture();
    // Si la herramienta cambió SOLA (p.ej. backToCursor() después de
    // terminar un dibujo), la barra de herramientas compartida de la
    // grilla multi-chart no se entera por su cuenta — avisarle acá es lo
    // único que la mantiene sincronizada con el panel activo.
    if (EMBED_MODE && window.parent !== window && window.parent.zentinelToolSync) {
      try { window.parent.zentinelToolSync(PANE_ID, name); } catch(e){}
    }
  };

  function priceToY(p) { return candleSeries.priceToCoordinate(p); }
  function timeToX(t)  { return chart.timeScale().timeToCoordinate(t); }
  function distToSegment(x1,y1,x2,y2,px,py) {
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    if (len2===0) return Math.hypot(px-x1,py-y1);
    let t = ((px-x1)*dx+(py-y1)*dy)/len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  function isClickOnDrawing(d, mx, my) {
    const THRESH = 8;
    if (d.type === 'hline') {
      const y = priceToY(d.p1.price);
      if (y===null) return false;
      return Math.abs(my-y) < THRESH;
    }
    if (d.type === 'trendline') {
      const x1=timeToX(d.p1.time), y1=priceToY(d.p1.price);
      const x2=timeToX(d.p2.time), y2=priceToY(d.p2.price);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return distToSegment(x1,y1,x2,y2,mx,my) < THRESH;
    }
    if (d.type === 'rect' || d.type === 'fib') {
      const hi=Math.max(d.p1.price,d.p2.price), lo=Math.min(d.p1.price,d.p2.price);
      const t1=Math.min(d.p1.time,d.p2.time),   t2=Math.max(d.p1.time,d.p2.time);
      const x1=timeToX(t1), x2=timeToX(t2);
      const y1=priceToY(hi), y2=priceToY(lo);
      if (x1===null||x2===null||y1===null||y2===null) return false;
      if (d.type === 'rect') return (
        distToSegment(x1,y1,x2,y1,mx,my)<THRESH||
        distToSegment(x1,y2,x2,y2,mx,my)<THRESH||
        distToSegment(x1,y1,x1,y2,mx,my)<THRESH||
        distToSegment(x2,y1,x2,y2,mx,my)<THRESH
      );
      // fib: cualquiera de las líneas de nivel (las que están activas) cuenta como "cuerpo"
      return (d.levels||cloneFibLevels()).filter(lv=>lv.on).some(lv=>{
        const y = priceToY(hi-(hi-lo)*lv.value);
        return y!==null && Math.abs(my-y)<THRESH && mx>=Math.min(x1,x2)-2 && mx<=Math.max(x1,x2)+2;
      });
    }
    if (d.type === 'text' && d.label) {
      const r = d.label.getBoundingClientRect();
      const cr = container.getBoundingClientRect();
      return mx>=r.left-cr.left-4 && mx<=r.right-cr.left+4 && my>=r.top-cr.top-4 && my<=r.bottom-cr.top+4;
    }
    if (d.type === 'vline') {
      const x = timeToX(d.p1.time);
      return x!==null && Math.abs(mx-x) < THRESH;
    }
    if (d.type === 'long' || d.type === 'short') {
      // Caja completa (del SL al TP) clickeable en cualquier punto interno
      // — igual que un rect, no hace falta acertarle a un borde fino.
      const x1=timeToX(d.p1.time), x2=timeToX(d.p2.time);
      const prices=[d.p1.price,d.p2.price,d.targetPrice];
      const y1=priceToY(Math.max(...prices)), y2=priceToY(Math.min(...prices));
      if (x1===null||x2===null||y1===null||y2===null) return false;
      return mx>=Math.min(x1,x2) && mx<=Math.max(x1,x2) && my>=y1 && my<=y2;
    }
    return false;
  }

  // Manija bajo el mouse del dibujo seleccionado (si hay uno), o null.
  function hitTestHandle(mx, my) {
    const d = getSelected();
    if (!d || !d.svgEls) return null;
    for (const el of d.svgEls) {
      if (!el.dataset || !el.dataset.role) continue;
      const x = parseFloat(el.getAttribute('cx')), y = parseFloat(el.getAttribute('cy'));
      if (Math.hypot(mx-x, my-y) < 9) return { drawing: d, role: el.dataset.role };
    }
    return null;
  }

  // ── Selección + arrastre (mover cuerpo entero / estirar una punta) ──
  window._dragSession = null; // { kind:'handle'|'body', drawing, role, startPrice, startTime, origP1, origP2 }

  // capture:true + stopPropagation: si no, el canvas del chart (debajo de
  // esta capa) también recibe el mismo mousedown/mousemove y arranca su
  // propio pan/zoom al mismo tiempo que arrastramos el dibujo — por eso
  // "el gráfico se movía solo" al mover una línea.
  container.addEventListener('mousedown', e => {
    if (STATE.activeTool !== 'cursor') return;
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    const handleHit = hitTestHandle(mx, my);
    if (handleHit) {
      e.preventDefault(); e.stopPropagation();
      _pendingDragUndoSnapshot = serializeDrawings(); // ver _commitDragUndoSnapshot, al soltar
      window._dragSession = { kind:'handle', drawing:handleHit.drawing, role:handleHit.role };
      return;
    }

    let hit = null;
    for (const d of drawings) {
      if (d.locked) continue;
      if (isClickOnDrawing(d, mx, my)) { hit = d; break; }
    }
    if (hit) {
      e.preventDefault(); e.stopPropagation();
      selectDrawing(hit.id);
      _pendingDragUndoSnapshot = serializeDrawings(); // ídem
      const { price, time } = getCoords(e);
      window._dragSession = {
        kind:'body', drawing:hit, startPrice:price, startTime:time,
        origP1:{...hit.p1}, origP2: hit.p2?{...hit.p2}:null,
        origTargetPrice: hit.targetPrice,
        labelLeft: hit.label?parseFloat(hit.label.style.left):0,
        labelTop:  hit.label?parseFloat(hit.label.style.top):0,
      };
    } else {
      deselectDrawing();
    }
  }, { capture:true });

  container.addEventListener('mousemove', e => {
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    if (window._dragSession) {
      e.preventDefault(); e.stopPropagation();
      const d = window._dragSession.drawing;
      if (d.locked) return;
      const { price, time } = getCoords(e);

      if (window._dragSession.kind === 'handle') {
        // Shift mientras se arrastra una punta de una trend line: igual que
        // al dibujarla, la fuerza a quedar horizontal o vertical respecto a
        // la OTRA punta (la que no se está moviendo).
        let finalPrice = price, finalTime = time;
        if (e.shiftKey && d.type === 'trendline' && price!==null && time!==null) {
          const role = window._dragSession.role;
          const anchor = role === 'p1' ? d.p2 : d.p1;
          const anchorX = timeToX(anchor.time), anchorY = priceToY(anchor.price);
          const curX = timeToX(time), curY = priceToY(price);
          if (anchorX!==null && anchorY!==null && curX!==null && curY!==null) {
            const dx = Math.abs(curX-anchorX), dy = Math.abs(curY-anchorY);
            if (dx > dy) finalPrice = anchor.price; else finalTime = anchor.time;
          }
        }
        applyHandleDrag(d, window._dragSession.role, finalPrice, finalTime);
        if (!updateDrawingGeometry(d)) redrawDrawing(d);
      } else if (d.type === 'text') {
        d.label.style.left = (mx - 6) + 'px';
        d.label.style.top  = (my - 10) + 'px';
      } else if (price!==null && time!==null) {
        const dPrice = price - window._dragSession.startPrice;
        const dTime  = time  - window._dragSession.startTime;
        d.p1.price = window._dragSession.origP1.price + dPrice;
        d.p1.time  = window._dragSession.origP1.time  + dTime;
        if (window._dragSession.origP2) {
          d.p2.price = window._dragSession.origP2.price + dPrice;
          d.p2.time  = window._dragSession.origP2.time  + dTime;
        }
        if (window._dragSession.origTargetPrice != null) {
          d.targetPrice = window._dragSession.origTargetPrice + dPrice;
        }
        if ((d.type==='long' || d.type==='short')) {
          // Si arrastrar el cuerpo entero empujó el borde derecho más allá
          // del límite seguro (ver clampPositionToolT2), corremos TODA la
          // caja hacia atrás en vez de solo recortar p2 — así el ancho
          // (tiempo de riesgo) no queda distorsionado, solo deja de
          // avanzar más hacia la derecha.
          const clampedT2 = clampPositionToolT2(d.p2.time);
          if (clampedT2 !== d.p2.time) {
            const shift = d.p2.time - clampedT2;
            d.p1.time -= shift; d.p2.time -= shift;
          }
        }
        if (!updateDrawingGeometry(d)) redrawDrawing(d);
      }
      return;
    }

    // Sin arrastre activo: feedback de cursor al pasar por encima.
    // hitTestHandle/isClickOnDrawing son baratos (recorren solo los
    // dibujos propios del usuario) y se evalúan en cada mousemove sin
    // problema. hitTestIndicatorRegions puede tener cientos de líneas con
    // Watchtower+Sniper+Sweeps activos a la vez, así que esa parte sí se
    // acota a una vez por frame — pero la DECISIÓN final del cursor queda
    // toda en este único handler para que no compita con otro listener
    // por el mismo style.cursor (eso era lo que causaba el titileo).
    if (STATE.activeTool === 'cursor') {
      if (hitTestHandle(mx, my)) { container.style.cursor = 'crosshair'; return; }
      const over = drawings.some(d => !d.locked && isClickOnDrawing(d, mx, my));
      if (over) { container.style.cursor = 'move'; return; }
      _cursorHitTestPending = { mx, my };
      if (_cursorHitTestRaf === null) _cursorHitTestRaf = requestAnimationFrame(_applyIndicatorCursor);
    }
  }, { capture:true });

  let _cursorHitTestPending = null, _cursorHitTestRaf = null;
  function _applyIndicatorCursor(){
    _cursorHitTestRaf = null;
    const p = _cursorHitTestPending; _cursorHitTestPending = null;
    if (!p || window._dragSession || STATE.activeTool !== 'cursor') return;
    container.style.cursor = hitTestIndicatorRegions(p.mx, p.my) ? 'pointer' : '';
  }

  window.addEventListener('mouseup', e => {
    if (window._dragSession) { e.preventDefault(); e.stopPropagation(); }
    if (window._dragSession && window._dragSession.kind === 'body' && window._dragSession.drawing.type === 'text') {
      const d = window._dragSession.drawing;
      const x = parseFloat(d.label.style.left)-6, y = parseFloat(d.label.style.top)+10;
      d.p1.price = candleSeries.coordinateToPrice(y) ?? d.p1.price;
      d.p1.time  = chart.timeScale().coordinateToTime(x) ?? d.p1.time;
    }
    if (window._dragSession) { highlightSelectedSvg(selectedDrawingId); markDrawingsDirty(); }
    _commitDragUndoSnapshot();
    window._dragSession = null;
  }, { capture:true });

  // El snapshot "de antes" se toma al apretar (mousedown sobre una manija o
  // el cuerpo), pero recién se mete al historial de undo ACÁ, al soltar —
  // y solo si algo realmente cambió. Si no, un simple click para
  // seleccionar un dibujo (sin arrastrar nada) metería un paso de undo que
  // no deshace nada, y habría que apretar Ctrl+Z de más para llegar al
  // cambio real anterior.
  let _pendingDragUndoSnapshot = null;
  function _commitDragUndoSnapshot(){
    if (!_pendingDragUndoSnapshot) return;
    const before = _pendingDragUndoSnapshot;
    _pendingDragUndoSnapshot = null;
    if (JSON.stringify(before) === JSON.stringify(serializeDrawings())) return; // no cambió nada
    _undoStack.push(before);
    if (_undoStack.length > UNDO_LIMIT) _undoStack.shift();
    _redoStack = [];
  }

  svg.addEventListener('mousedown', e => {
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x, y, price, time } = getCoords(e);
    if (price === null || time === null) return;
    const candles = window._lastCandles || [];
    if (!candles.length) return;

    if (tool === 'text') {
      // Como en TV: se escribe directo sobre el chart, no un prompt() nativo.
      const label = document.createElement('div');
      label.contentEditable = 'true';
      label.dataset.placeholder = 'Añadir texto';
      label.style.cssText = `position:absolute;left:${x+6}px;top:${y-10}px;color:${toolDefaults.color};font-family:var(--font-mono);font-size:${11+toolDefaults.width}px;pointer-events:auto;z-index:5;white-space:nowrap;background:rgba(10,10,12,.7);padding:1px 4px;border-radius:3px;outline:1px solid ${toolDefaults.color}88;min-width:10px;cursor:text;`;
      container.appendChild(label);

      const d = { id:genId(), type:'text', series:[], svgEls:[], label, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price,time}, p2:{price,time} };
      captureUndoSnapshot();
      drawings.push(d);
      selectDrawing(d.id);
      backToCursor();

      label.focus();
      const commitText = () => {
        label.contentEditable = 'false';
        label.style.pointerEvents = 'none';
        label.style.outline = 'none';
        label.style.cursor = '';
        if (!label.textContent.trim()) { removeDrawingById(d.id); deselectDrawing(); }
        else markDrawingsDirty();
      };
      label.addEventListener('blur', commitText, { once:true });
      label.addEventListener('keydown', e => { if (e.key==='Enter') { e.preventDefault(); label.blur(); } });
      return;
    }

    drawStart = { x, y, price, time };
  });

  svg.addEventListener('mousemove', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    const { x: x2, y: y2 } = getCoords(e);
    clearPreview();

    const GOLDA = toolDefaults.color + '88';

    if (tool === 'hline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', 0); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', container.clientWidth); line.setAttribute('y2', drawStart.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, { x:x2, y:y2 });
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', drawStart.y);
      line.setAttribute('x2', snapped.x); line.setAttribute('y2', snapped.y);
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    } else if (tool === 'rect' || tool === 'long' || tool === 'short') {
      const rx=Math.min(drawStart.x,x2), ry=Math.min(drawStart.y,y2);
      const rw=Math.abs(x2-drawStart.x), rh=Math.abs(y2-drawStart.y);
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x',rx); rect.setAttribute('y',ry); rect.setAttribute('width',rw); rect.setAttribute('height',rh);
      const previewColor = tool==='long' ? '#26a69a88' : tool==='short' ? '#ef535088' : GOLDA;
      rect.setAttribute('stroke', previewColor); rect.setAttribute('stroke-width', toolDefaults.width);
      rect.setAttribute('stroke-dasharray','4,3');
      rect.setAttribute('fill', tool==='long' ? 'rgba(38,166,154,0.08)' : tool==='short' ? 'rgba(239,83,80,0.08)' : 'rgba(201,168,76,0.06)');
      svg.appendChild(rect); previewEl = rect;
    } else if (tool === 'fib') {
      const ry=Math.min(drawStart.y,y2), rh=Math.abs(y2-drawStart.y);
      const group = document.createElementNS('http://www.w3.org/2000/svg','g');
      const fibColors=['#ef5350','#f0c060','#26a69a','#60c0f0','#a060f0','#f06060','#60f0a0'];
      [0,0.236,0.382,0.5,0.618,0.786,1].forEach((lvl,i) => {
        const ly = ry + rh * lvl;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',0); line.setAttribute('y1',ly); line.setAttribute('x2',container.clientWidth); line.setAttribute('y2',ly);
        line.setAttribute('stroke',fibColors[i]+'bb'); line.setAttribute('stroke-width','1'); line.setAttribute('stroke-dasharray','3,3');
        group.appendChild(line);
      });
      svg.appendChild(group); previewEl = group;
    } else if (tool === 'vline') {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', drawStart.x); line.setAttribute('y1', 0);
      line.setAttribute('x2', drawStart.x); line.setAttribute('y2', container.clientHeight - chart.timeScale().height());
      line.setAttribute('stroke', GOLDA); line.setAttribute('stroke-width', toolDefaults.width);
      line.setAttribute('stroke-dasharray', '4,3');
      svg.appendChild(line); previewEl = line;
    }
  });

  svg.addEventListener('mouseup', e => {
    if (!drawStart) return;
    e.preventDefault();
    const tool = STATE.activeTool;
    clearPreview();

    const coordsNow = getCoords(e);
    let { price: price2, time: time2 } = coordsNow;
    if (price2===null||time2===null) { drawStart=null; return; }
    const candles = window._lastCandles||[];
    if (!candles.length) { drawStart=null; return; }

    let d = null;

    if (tool === 'hline') {
      d = { id:genId(), type:'hline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:drawStart.time}, p2:{price:drawStart.price,time:drawStart.time} };
    } else if (tool === 'trendline') {
      const snapped = shiftSnap(e, drawStart, coordsNow);
      price2 = snapped.price; time2 = snapped.time;
      const t1 = Math.min(drawStart.time, time2);
      const t2 = Math.max(drawStart.time, time2);
      if (t1 === t2 && price2 === drawStart.price) { drawStart=null; return; } // clic sin arrastre real
      const p1 = drawStart.time <= time2 ? drawStart.price : price2;
      const p2 = drawStart.time <= time2 ? price2 : drawStart.price;
      d = { id:genId(), type:'trendline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, p1:{price:p1,time:t1}, p2:{price:p2,time:t2} };
    } else if (tool === 'rect') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      const t1=Math.min(drawStart.time,time2),   t2=Math.max(drawStart.time,time2);
      if (t1===t2||Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'rect', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:toolDefaults.extRight, p1:{price:drawStart.price,time:t1}, p2:{price:price2,time:t2} };
    } else if (tool === 'fib') {
      const hi=Math.max(drawStart.price,price2), lo=Math.min(drawStart.price,price2);
      if (Math.abs(hi-lo)<0.0001) { drawStart=null; return; }
      d = { id:genId(), type:'fib', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:toolDefaults.extLeft, extRight:toolDefaults.extRight, levels:cloneFibLevels(), p1:{price:hi,time:drawStart.time}, p2:{price:lo,time:time2} };
    } else if (tool === 'vline') {
      d = { id:genId(), type:'vline', series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:toolDefaults.style, extLeft:false, extRight:false, p1:{price:null,time:drawStart.time}, p2:{price:null,time:drawStart.time} };
    } else if (tool === 'long' || tool === 'short') {
      // p1 = entrada (el punto donde se apretó el mouse). El stop queda
      // SIEMPRE del lado correcto según el tipo de herramienta (abajo para
      // long, arriba para short) — no según hacia dónde arrastró el mouse.
      // Si tomáramos el precio del punto de arrastre tal cual, arrastrar
      // para el mismo lado en una Short que en una Long dejaba el take
      // profit invertido (ganancia hacia arriba en una posición corta, que
      // es al revés). Solo la MAGNITUD del arrastre define el riesgo; la
      // dirección la decide el tipo de herramienta. El take profit nace a
      // un ratio riesgo/beneficio fijo (1:2) y después se puede arrastrar
      // independiente con su manija.
      const entry = drawStart.price;
      const risk = Math.abs(entry - price2);
      if (risk < 0.0001) { drawStart=null; return; } // clic sin arrastre real
      const barStep = candles.length>1 ? (candles[1].time-candles[0].time) : 3600;
      // El borde horizontal de la caja es simplemente el otro extremo del
      // arrastre — no importa para qué lado se arrastró (como en trendline/
      // rect, arriba): min/max de los dos puntos, nunca "si fue hacia
      // adelante uso eso, si no invento 10 velas" (eso era lo que hacía que
      // arrastrar hacia la izquierda, o apenas hacia la derecha, terminara
      // en una caja fija de 10 velas — mucho más larga que lo arrastrado).
      let t1 = Math.min(drawStart.time, time2);
      let t2 = Math.max(drawStart.time, time2);
      if (t2 - t1 < barStep) t2 = t1 + barStep; // clic casi sin arrastre horizontal: mínimo 1 vela
      // El borde derecho de la caja no puede pasarse de las velas "fantasma"
      // (whitespace) que tiene cargadas el eje de tiempo (ver futureWhitespace,
      // 15 velas) — si una de las 3 líneas de precio de este dibujo apunta a
      // un tiempo sin whitespace ahí, el chart no tiene con qué resolver esa
      // coordenada y (a diferencia de un simple desaparecer, como le pasaba a
      // las cajas de FVG) el time scale termina "corriéndose" solo apenas se
      // arrastra el dibujo y ese punto se actualiza. Por eso se acota a un
      // máximo seguro, bien adentro de esas 15 velas.
      t2 = clampPositionToolT2(t2);
      if (t2 <= t1) t2 = t1 + barStep;
      const DEFAULT_RR = 2;
      const stop   = tool === 'long' ? entry - risk        : entry + risk;
      const target = tool === 'long' ? entry + risk*DEFAULT_RR : entry - risk*DEFAULT_RR;
      d = { id:genId(), type:tool, series:[], svgEls:[], label:null, locked:false, color:toolDefaults.color, width:toolDefaults.width, style:0, extLeft:false, extRight:false, p1:{price:entry,time:t1}, p2:{price:stop,time:t2}, targetPrice:target };
    }

    if (d) {
      captureUndoSnapshot();
      drawings.push(d);
      buildDrawingOnChart(d);
      selectDrawing(d.id);
      backToCursor();
    }

    drawStart = null;
  });

  window.addEventListener('mouseup', () => {
    if (drawStart) { clearPreview(); drawStart=null; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { deselectDrawing(); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedDrawingId) {
      if (document.activeElement.tagName === 'INPUT') return;
      onDtbDelete();
    }
    // Ctrl/Cmd+Z deshace, Ctrl/Cmd+Shift+Z o Ctrl/Cmd+Y rehace — como en
    // cualquier editor. Se ignora con foco en un input, textarea o el
    // <div contenteditable> de la herramienta de texto: ahí Ctrl+Z tiene
    // que ser el undo nativo del navegador para ESE texto, no el nuestro.
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
      e.preventDefault();
      if (e.shiftKey) redoDrawing(); else undoDrawing();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
      e.preventDefault();
      redoDrawing();
    }
  });
}

function renderWatchlist() {
  const el = document.getElementById('watchlist');
  el.innerHTML = '';
  STATE.watchlist.forEach(sym => {
    const row = document.createElement('div');
    row.className = 'wl-item' + (sym===STATE.symbol?' active':'');
    row.dataset.sym = sym;
    row.innerHTML = `
      <div class="wl-sym">${sym}</div>
      <div class="wl-price" id="wlp-${sym.replace(/[^a-z0-9]/gi,'_')}">—</div>
      <div class="wl-chg" id="wlc-${sym.replace(/[^a-z0-9]/gi,'_')}">—</div>
      <button class="wl-remove" onclick="removeSymbol('${sym}',event)">×</button>`;
    row.addEventListener('click', () => selectSymbol(sym));
    el.appendChild(row);
  });
  saveState();
}

function selectSymbol(sym) { STATE.symbol=sym; document.getElementById('symbol-input').value=sym; renderWatchlist(); loadChart(sym,STATE.timeframe); }
function addSymbol() { const inp=document.getElementById('add-sym-inp'); const sym=inp.value.trim(); if(!sym||STATE.watchlist.includes(sym)){inp.value='';return;} STATE.watchlist.push(sym); inp.value=''; document.getElementById('add-sym-form').classList.remove('open'); renderWatchlist(); }
function removeSymbol(sym,e) { e.stopPropagation(); STATE.watchlist=STATE.watchlist.filter(s=>s!==sym); if(STATE.symbol===sym&&STATE.watchlist.length)selectSymbol(STATE.watchlist[0]); else renderWatchlist(); }
function toggleAddSym() { const f=document.getElementById('add-sym-form'); f.classList.toggle('open'); if(f.classList.contains('open'))document.getElementById('add-sym-inp').focus(); }
function updateWLPrice(sym,price) { const key=sym.replace(/[^a-z0-9]/gi,'_'); const el=document.getElementById('wlp-'+key); if(el)el.textContent=fmt(price); }
document.getElementById('add-sym-inp').addEventListener('keydown',e=>{if(e.key==='Enter')addSymbol();if(e.key==='Escape')document.getElementById('add-sym-form').classList.remove('open');});

function renderTfBar() {
  const bar = document.getElementById('tf-bar-tfs');
  const visible = new Set(getTfFavorites());
  let html = '';
  let lastGroup = null;
  ALL_TIMEFRAMES.forEach(t => {
    if (!visible.has(t.tf)) return;
    if (lastGroup !== null && lastGroup !== t.group) html += '<div class="tf-sep"></div>';
    html += `<button class="tf-btn" data-tf="${t.tf}">${t.label}</button>`;
    lastGroup = t.group;
  });
  bar.innerHTML = html;
}
function updateTfBarSymbol(symbol) {
  document.getElementById('tf-bar-symbol').textContent = symbol;
}
function initTfBarScrollFade(scroller, wrap) {
  const fadeL = wrap.querySelector('.tf-scroll-fade-l');
  const fadeR = wrap.querySelector('.tf-scroll-fade-r');
  if (!fadeL || !fadeR) return;
  function update() {
    const max = scroller.scrollWidth - scroller.clientWidth;
    fadeL.classList.toggle('visible', scroller.scrollLeft > 2);
    fadeR.classList.toggle('visible', scroller.scrollLeft < max - 2);
  }
  scroller.addEventListener('scroll', update, { passive: true });
  fadeL.addEventListener('click', () => scroller.scrollBy({ left: -80, behavior: 'smooth' }));
  fadeR.addEventListener('click', () => scroller.scrollBy({ left: 80, behavior: 'smooth' }));
  new ResizeObserver(update).observe(scroller);
  const mo = new MutationObserver(update);
  mo.observe(scroller, { childList: true });
  update();
}
initTfBarScrollFade(document.getElementById('tf-bar-tfs'), document.getElementById('tf-bar-tfs-wrap'));
document.getElementById('tf-bar-tfs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tf-btn');
  if (!btn) return;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  STATE.timeframe = btn.dataset.tf;
  saveState();
  loadChart(STATE.symbol,STATE.timeframe);
});
function setActiveTF(tf) { document.querySelectorAll('.tf-btn').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf)); }

// ─── Popup de favoritos de TF (como en TV: lista completa, estrella
// marca cuáles aparecen como accesos rápidos en la barra) ──────────
function renderTfFavPopup(){
  const popup = document.getElementById('tf-fav-popup');
  if (!popup) return;
  const visible = new Set(getTfFavorites());
  let html = '', lastGroup = null;
  ALL_TIMEFRAMES.forEach(t => {
    if (lastGroup !== null && lastGroup !== t.group) html += '<div class="tf-fav-sep"></div>';
    const on = visible.has(t.tf);
    html += `<div class="tf-fav-row${t.tf===STATE.timeframe?' active-tf':''}" data-tf="${t.tf}">
      <span class="tf-fav-star${on?' on':''}" data-star="${t.tf}" title="Favorito">
        <svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </span>
      <span class="tf-fav-label">${t.label}</span>
    </div>`;
    lastGroup = t.group;
  });
  popup.innerHTML = html;
}
function toggleTfFav(tf){
  let list = getTfFavorites().slice();
  if (list.includes(tf)) {
    if (list.length <= 1) return;
    list = list.filter(x=>x!==tf);
  } else {
    list.push(tf);
  }
  setTfFavorites(list);
  renderTfBar();
  setActiveTF(STATE.timeframe);
  renderTfFavPopup();
}
function openTfFavPopup(){
  renderTfFavPopup();
  document.getElementById('tf-fav-popup').classList.add('open');
  document.getElementById('tf-fav-trigger').classList.add('active');
}
function closeTfFavPopup(){
  const popup = document.getElementById('tf-fav-popup');
  if (popup) popup.classList.remove('open');
  const trigger = document.getElementById('tf-fav-trigger');
  if (trigger) trigger.classList.remove('active');
}
(function initTfFavPopup(){
  const trigger = document.getElementById('tf-fav-trigger');
  const popup = document.getElementById('tf-fav-popup');
  if (!trigger || !popup) return;
  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    popup.classList.contains('open') ? closeTfFavPopup() : openTfFavPopup();
  });
  popup.addEventListener('click', (e) => {
    const star = e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); toggleTfFav(star.dataset.star); return; }
    const row = e.target.closest('.tf-fav-row');
    if (row) {
      STATE.timeframe = row.dataset.tf;
      saveState();
      loadChart(STATE.symbol, STATE.timeframe);
      closeTfFavPopup();
    }
  });
  document.addEventListener('click', (e) => {
    if (!document.getElementById('tf-fav-wrap').contains(e.target)) closeTfFavPopup();
  });
})();

function toggleSidebar() {
  const collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
  document.getElementById('btn-sidebar-toggle').classList.toggle('collapsed', collapsed);
  lsSet(lsKey('td_sidebar_collapsed'), collapsed ? '1' : '0');
}
// Clickear el chart con el watchlist abierto lo cierra — no bloquea nada
// (sin preventDefault/stopPropagation), así el click sigue haciendo lo que
// ya hacía (seleccionar/dibujar) y además cierra la barra lateral.
document.getElementById('chart-container').addEventListener('mousedown', () => {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && !sidebar.classList.contains('collapsed')) toggleSidebar();
  // En la grilla multi-chart el watchlist real que se ve ya no es ESTE
  // (el de este panel está oculto) sino el compartido que vive en el shell
  // de afuera — avisarle para que también se cierre con el mismo gesto.
  if (EMBED_MODE && window.parent !== window && window.parent.zentinelChartClicked) {
    try { window.parent.zentinelChartClicked(); } catch(e){}
  }
});
// En un panel embebido (grilla 2×/4⊞) arranca colapsado la primera vez
// (sin preferencia guardada todavía) — un watchlist completo abierto por
// default en cada uno de 4 paneles chicos comería casi toda la grilla.
// Una vez que el usuario lo abre/cierra una vez, esa preferencia (ya
// persistida con el sufijo de ese pane) manda, igual que en modo 1 gráfico.
const _sidebarCollapsedSaved = lsGet(lsKey('td_sidebar_collapsed'));
if (_sidebarCollapsedSaved === '1' || (_sidebarCollapsedSaved === null && EMBED_MODE)) {
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('btn-sidebar-toggle').classList.add('collapsed');
}

// ══════════════════════════════════════════════════════════
//  LAYOUT PICKER (1 / 2 / 4 gráficos)
// ══════════════════════════════════════════════════════════
// El modo de 1 solo gráfico guarda su estado sin sufijo de pane (td_symbol,
// td_indicators, etc). Los paneles de la grilla usan claves con sufijo
// (_p1, _p2...) para no pisarse entre sí — pero eso significa que, visto
// desde cero, el panel 1 de una grilla nueva no tiene ninguna relación con
// lo que se estaba mirando en el modo de 1 gráfico. Al pasar de 1 a 2/4,
// clonamos el estado actual (sin sufijo) hacia las claves del panel 1,
// así ese panel arranca siendo una continuación de lo que ya tenías.

function setTool(btn, name) {
  // btn es opcional: cuando la grilla multi-chart maneja el panel activo
  // desde la barra de herramientas compartida de afuera, no hay ningún
  // botón DE ESTE panel que marcar (está oculto) — solo hace falta que
  // STATE.activeTool cambie.
  document.querySelectorAll('.tool-btn').forEach(b=>{ if(b.id!=='btn-volume'&&b.id!=='btn-magnet'&&b.id!=='btn-ind-legend')b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  STATE.activeTool = name;
  if (name !== 'cursor') deselectDrawing();
}

// Magnet: ciclo de 3 estados, como en TV — off, weak (solo ajusta si el
// mouse ya cayó cerca de un punto de la vela) y strong (ajusta siempre al
// punto más cercano, sin importar la distancia).
const MAGNET_CYCLE = ['off','weak','strong'];
const MAGNET_TIPS = { off:'Magnet: off', weak:'Magnet: weak (ajusta solo si el mouse está cerca)', strong:'Magnet: strong (ajusta siempre a la vela)' };
function renderMagnetBtn() {
  const btn = document.getElementById('btn-magnet');
  btn.classList.toggle('active', STATE.magnetMode === 'strong');
  btn.classList.toggle('weak-active', STATE.magnetMode === 'weak');
  btn.dataset.tip = MAGNET_TIPS[STATE.magnetMode];
}
function toggleMagnet() {
  STATE.magnetMode = MAGNET_CYCLE[(MAGNET_CYCLE.indexOf(STATE.magnetMode) + 1) % MAGNET_CYCLE.length];
  lsSet(lsKey('td_magnet'), STATE.magnetMode);
  renderMagnetBtn();
}
renderMagnetBtn();

// Radio (en px de pantalla) dentro del cual el magnet "weak" considera que
// el mouse ya está "cerca" de un punto como para ajustarlo.
const MAGNET_WEAK_PX = 15;

// Dado un precio/tiempo "crudo" del mouse, devuelve el punto {price,time}
// ajustado al OHLC más cercano del candle más cercano en el tiempo — o el
// mismo punto sin tocar si no hay candles, el magnet está apagado, o el
// punto cae más allá de la última vela (hay que poder seguir arrastrando
// la línea hacia la derecha más allá de los datos, no quedar pegado al
// último candle).
function magnetSnapPoint(candles, rawTime, rawPrice) {
  if (!candles || !candles.length || rawTime===null || rawPrice===null) return null;
  if (rawTime > candles[candles.length-1].time || rawTime < candles[0].time) return null;
  let lo = 0, hi = candles.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (candles[mid].time < rawTime) lo = mid + 1; else hi = mid;
  }
  let best = candles[lo];
  if (lo > 0 && Math.abs(candles[lo-1].time - rawTime) < Math.abs(best.time - rawTime)) best = candles[lo-1];
  let snapPrice = best.open, bestDist = Math.abs(rawPrice - best.open);
  [best.high, best.low, best.close].forEach(p => {
    const dist = Math.abs(rawPrice - p);
    if (dist < bestDist) { bestDist = dist; snapPrice = p; }
  });
  return { price: snapPrice, time: best.time };
}

// Como en TV: después de terminar un dibujo, la herramienta vuelve sola al
// cursor — si no, el próximo arrastre sobre el dibujo recién hecho se
// interpreta como "dibujar uno nuevo" en vez de moverlo/estirarlo.
function backToCursor() {
  const btn = document.querySelector('.tool-btn[data-tip="Cursor"]');
  if (btn) setTool(btn, 'cursor');
}

function openIndicatorModal() {
  const picker = document.getElementById('ind-picker');
  picker.innerHTML = '';
  INDICATOR_DEFS.forEach(def => {
    const row = document.createElement('div');
    const sel = STATE.indicators.includes(def.name);
    row.className = 'ind-pick-row'+(sel?' selected':'');
    row.innerHTML = `<div class="ind-dot" style="background:${def.color}"></div><div class="ind-pick-name">${def.name}</div><div class="ind-pick-desc">${def.desc}</div><div class="ind-pick-check">${sel?'✓':''}</div>`;
    row.addEventListener('click', ()=>{ row.classList.toggle('selected'); row.querySelector('.ind-pick-check').textContent=row.classList.contains('selected')?'✓':''; });
    picker.appendChild(row);
  });
  openModal('modal-indicators');
}

function applyIndicators() {
  const selected=[...document.querySelectorAll('.ind-pick-row.selected')].map(r=>r.querySelector('.ind-pick-name').textContent);
  STATE.indicators.forEach(name=>{
    if(selected.includes(name)) return;
    const def=INDICATOR_DEFS.find(d=>d.name===name);
    if(def && def.custom){
      if(name==='Watchtower'){ STATE.watchtower.enabled=false; saveWatchtowerState(); }
      else if(name==='Sniper'){ STATE.sniper.enabled=false; saveSniperState(); }
      else if(name==='Sweeps'){ STATE.sweeps.enabled=false; saveSweepsState(); }
    }
    else if(overlays[name]){ chart.removeSeries(overlays[name]); delete overlays[name]; }
  });
  STATE.indicators=selected; saveState();
  selected.forEach(name=>addIndicatorSeries(name));
  renderIndList(); closeModal('modal-indicators');
}

function addIndicatorSeries(name) {
  const def=INDICATOR_DEFS.find(d=>d.name===name); if(!def)return;
  if(def.custom){
    if(name==='Watchtower'){ STATE.watchtower.enabled=true; saveWatchtowerState(); renderWatchtower(); }
    else if(name==='Sniper'){ STATE.sniper.enabled=true; saveSniperState(); renderSniper(); }
    else if(name==='Sweeps'){ STATE.sweeps.enabled=true; saveSweepsState(); renderSweeps(); }
    return;
  }
  if(overlays[name])return;
  const rawData=window._lastCandles||[]; if(!rawData.length)return;
  const calcData=def.calc(rawData);
  const style=getIndicatorStyle(name, def);
  const series=chart.addLineSeries({color:style.color,lineWidth:style.lineWidth,priceLineVisible:false,lastValueVisible:true,visible:!isIndicatorHidden(name)});
  series.setData(calcData); overlays[name]=series;
}

// Chips fijos arriba-izq del chart: acceso directo a la config de cada
// indicador activo — siempre visibles, sin depender de acertarle a un
// dibujo fino en el chart ni de tener el sidebar/watchlist abierto.
// Cualquier indicador nuevo en INDICATOR_DEFS aparece acá solo.
function renderIndicatorChips() {
  const el = document.getElementById('chart-indicator-chips');
  if (!el) return;
  el.innerHTML = '';
  STATE.indicators.forEach(name => {
    const def = INDICATOR_DEFS.find(d => d.name === name);
    if (!def) return;
    const hidden = isIndicatorHidden(name);
    const chip = document.createElement('div');
    chip.className = 'ind-chip' + (hidden ? ' ind-chip-hidden' : '');
    chip.title = name + ' settings';
    chip.innerHTML = `<span>${name}</span><button class="ind-eye-btn" title="${hidden ? 'Mostrar' : 'Ocultar'} ${name}">${hidden ? IND_EYE_OFF_SVG : IND_EYE_SVG}</button>${IND_GEAR_SVG}`;
    chip.querySelector('.ind-eye-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleIndicatorVisibility(name); });
    chip.addEventListener('click', () => openIndicatorSettings(name));
    el.appendChild(chip);
  });
}

function renderIndList() {
  renderIndicatorChips();
  const el=document.getElementById('ind-list'); el.innerHTML='';
  if(!STATE.indicators.length){el.innerHTML='<div class="ind-item" style="color:var(--text-dim);font-size:10px">None active</div>';return;}
  STATE.indicators.forEach(name=>{
    const def=INDICATOR_DEFS.find(d=>d.name===name);
    const dotColor = def && !def.custom ? getIndicatorStyle(name, def).color : (def?.color||'#888');
    const item=document.createElement('div'); item.className='ind-item';
    item.innerHTML=`<div class="ind-dot" style="background:${dotColor}"></div><span>${name}</span><button class="ind-settings-btn" title="Settings" onclick="openIndicatorSettings('${name}')">${IND_GEAR_SVG}</button><button class="ind-remove" onclick="removeIndicator('${name}')">×</button>`;
    el.appendChild(item);
  });
}
