<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentinel Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary:   #0a0a0c;
    --bg-secondary: #111116;
    --bg-panel:     #13131a;
    --bg-hover:     #1a1a24;
    --bg-active:    #1e1e2a;
    --border:       #222230;
    --border-light: #2a2a3a;
    --gold:         #c9a84c;
    --gold-bright:  #f0c060;
    --gold-dim:     #7a6030;
    --gold-glow:    rgba(201,168,76,0.15);
    --text-primary: #e8e8f0;
    --text-secondary:#8888a8;
    --text-dim:     #55556a;
    --green:        #26a69a;
    --red:          #ef5350;
    --green-dim:    rgba(38,166,154,0.15);
    --red-dim:      rgba(239,83,80,0.15);
    --font-ui:      'DM Sans', sans-serif;
    --font-mono:    'DM Mono', monospace;
    --font-display: 'Orbitron', sans-serif;
    --sidebar-w:    220px;
    --toolbar-h:    44px;
    --topbar-h:     44px;
    --tf-bar-h:     44px;
  }

  /* Ver applyTheme(): corta en seco cualquier transition justo alrededor
     del cambio de tema, para que no se vea como un fundido de ~150ms (eso
     es lo que hacía notar el desfasaje de unos ms entre la barra global y
     cada panel en modo grilla, aunque el cambio de estado en sí ya esté
     sincronizado). */
  html.theme-switching, html.theme-switching * { transition: none !important; }

  /* ─── MODO CLARO ──────────────────────────────────────────
     Redefine solo las variables de la interfaz (fondos, bordes, texto,
     acento dorado, verde/rojo semánticos) — el gráfico en sí (velas,
     fondo del chart, grillas) usa sus propios colores desde
     STATE.chartSettings, ajenos a estas variables, así que no se tocan
     acá a propósito. */
  html[data-theme="light"] {
    --bg-primary:   #f4f5f7;
    --bg-secondary: #ffffff;
    --bg-panel:     #ffffff;
    --bg-hover:     #eef0f4;
    --bg-active:    #e4e7ee;
    --border:       #dde1e8;
    --border-light: #c9ced8;
    --gold:         #a07508;
    --gold-bright:  #c4920f;
    --gold-dim:     #cbab6c;
    --gold-glow:    rgba(160,117,8,0.12);
    --text-primary: #16171d;
    --text-secondary:#54586b;
    --text-dim:     #8d90a0;
    --green:        #0e8a74;
    --red:          #d33232;
    --green-dim:    rgba(14,138,116,0.12);
    --red-dim:      rgba(211,50,50,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-ui);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ─── TOP BAR ─────────────────────────────────────────── */
  /* topbar + tf-bar van lado a lado DENTRO de esta fila — una sola barra
     arriba del chart, como TV, en vez de dos apiladas. El ancho de topbar
     queda fijo a su contenido (flex-shrink:0) y tf-bar ocupa el resto. */
  #header-row {
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
  }
  #topbar {
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0;
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .logo-sep { width: 1px; height: 24px; background: var(--border-light); margin: 0 4px; }

  #symbol-search-wrap { position: relative; display: flex; align-items: center; }
  /* Clase compartida: la usan tanto #symbol-input (modo 1 gráfico) como el
     buscador de símbolo global de renderLayoutGrid (modo 2×/4⊞), para que
     ambos se vean exactamente igual en vez de reimplementar el estilo. */
  .topbar-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    width: 130px;
    outline: none;
    letter-spacing: 0;
    transition: border-color .2s, box-shadow .2s;
  }
  .topbar-input:focus { border-color: var(--gold-dim); box-shadow: 0 0 0 2px var(--gold-glow); }

  #price-display { display: flex; align-items: baseline; gap: 8px; }
  #price-last { font-family: var(--font-mono); font-size: 18px; font-weight: 500; color: var(--text-primary); }
  #price-change { font-family: var(--font-mono); font-size: 12px; }
  #price-change.up { color: var(--green); }
  #price-change.dn { color: var(--red); }

  /* ─── COUNTDOWN BADGE (pegado al precio actual, como TV) ────
     Posición/ancho/alto se fijan por JS (positionCountdownBadge), medidos
     pixel a pixel contra el tag de precio nativo que dibuja el chart: ese
     tag NO ocupa todo el ancho de la escala de precio (deja ~6px de margen
     a la derecha) y mide 17px de alto — por eso acá se replica ese mismo
     tamaño en vez de adivinar. font-weight normal (no 500): en fuente
     monoespaciada, el trazo más grueso hacía que se viera más grande que
     el precio aunque el font-size nominal fuera menor. */
  #price-countdown-badge {
    position: absolute;
    display: none;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 400;
    color: #0a0a0c;
    border-radius: 0 0 3px 3px;
    white-space: nowrap;
    z-index: 5;
    pointer-events: none;
  }
  #price-countdown-badge.up { background: var(--green); }
  #price-countdown-badge.dn { background: var(--red); }
  #price-countdown-badge.soon { background: var(--gold-bright); }

  /* ─── WATCHTOWER — daily bias table (vertical, como en TV) ──── */
  #watchtower-bias-badge {
    position: absolute;
    right: 8px;
    bottom: 22px;
    display: none;
    flex-direction: column;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: #cccccc;
    z-index: 16;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
  }
  #watchtower-bias-badge .wt-row {
    padding: 2px 7px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  #watchtower-bias-badge .wt-row:last-child { border-bottom: none; font-weight: 600; }

  /* ─── Chips de acceso directo a config de indicadores custom ──── */
  /* Fijos arriba a la izquierda del chart, visibles siempre que el
     indicador esté activo — no dependen de acertarle a un dibujo fino
     ni de tener el sidebar abierto. */
  #chart-indicator-chips {
    position: absolute;
    top: 40px;
    left: 8px;
    z-index: 17;
    display: flex;
    flex-direction: column;
    gap: 4px;
    pointer-events: none;
    color: var(--text-dim); /* default hasta que applyChartSettings() lo pise con cs.textColor */
  }
  .ind-chip {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    /* Sin recuadro/fondo detrás — como en TV: el texto y los íconos flotan
       solos sobre el chart. La sombra de texto (en vez de un fondo sólido)
       es lo que mantiene el nombre legible sin importar qué haya dibujado
       atrás (velas claras, zonas de color de Watchtower, etc). */
    padding: 3px 2px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: inherit; /* lo pone #chart-indicator-chips, desde cs.textColor — ver applyChartSettings */
    cursor: pointer;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.6);
  }
  .ind-chip:hover { color: var(--gold); }
  .ind-chip svg { width: 11px; height: 11px; flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.9)); }
  .ind-chip-hidden { opacity: .45; }
  .ind-eye-btn {
    background: none; border: none; padding: 0; margin: 0; display: flex;
    color: inherit; cursor: pointer; flex-shrink: 0;
  }
  .ind-eye-btn:hover { color: var(--gold); }

  /* ─── Replay mode ──── */
  #replay-pick-hint {
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,28,0.92);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    border-radius: 3px;
    padding: 4px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    z-index: 21;
    pointer-events: none;
    white-space: nowrap;
  }
  #replay-bar {
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    background: rgba(20,20,28,0.92);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
    z-index: 21;
  }
  #replay-bar button {
    background: none; border: 1px solid var(--border); border-radius: 3px;
    color: var(--text-secondary); cursor: pointer;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  }
  #replay-bar button:hover { color: var(--gold); border-color: var(--gold-dim); }
  #replay-bar button svg { width: 13px; height: 13px; }
  #replay-bar select {
    background: var(--bg-alt, #15151f); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); font-family: var(--font-mono); font-size: 10px; padding: 2px 4px;
    color-scheme: dark;
  }
  #replay-bar #replay-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    white-space: nowrap; min-width: 90px; text-align: center;
  }
  #replay-bar #replay-exit-btn { color: var(--red); font-size: 12px; }
  #replay-pick-hint.hidden, #replay-bar.hidden { display: none; }

  /* ─── Indicator settings (gear) ──── */
  .ind-settings-btn {
    background:none; border:none; color:var(--text-secondary); cursor:pointer;
    padding:2px; display:flex; align-items:center; pointer-events:auto;
  }
  .ind-settings-btn:hover { color:var(--text); }
  .ind-settings-btn svg { width:12px; height:12px; }
  .wt-set-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 0; font-size:12px; color:var(--text);
    border-bottom:1px solid var(--border);
  }
  .wt-set-row:last-child { border-bottom:none; }
  .wt-set-row input[type="time"], .wt-set-row input[type="number"] {
    background: var(--bg-alt, #15151f); border:1px solid var(--border); border-radius:3px;
    color: var(--text); font-family: var(--font-mono); font-size:11px; padding:2px 4px;
    color-scheme: dark;
  }
  .wt-set-row input[type="color"] {
    width:28px; height:20px; padding:0; border:1px solid var(--border); border-radius:3px;
    background:none; cursor:pointer;
  }

  .topbar-spacer { flex: 1; }

  .topbar-btn {
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 10px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s;
  }
  /* Como en TV: el hover es solo un relleno redondeado, sin borde — el
     borde quedaba viéndose "a cuadros" al lado de los demás íconos que
     no lo tienen. */
  .topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .topbar-btn.active { background: var(--gold-glow); color: var(--gold); border-color: var(--gold-dim); }
  .topbar-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* Flechita de "esto abre un menú/panel" — mismo lenguaje visual que el
     caret de los botones de TF/Indicadores/etc. en TV. */
  .topbar-btn .tb-caret { width: 9px; height: 9px; margin-left: -1px; opacity: .6; flex-shrink: 0; }
  @keyframes zentinel-spin { to { transform: rotate(360deg); } }
  #btn-refresh.spinning svg { animation: zentinel-spin .6s linear infinite; }

  /* Grupo segmentado sin bordes individuales — mismo lenguaje que el
     selector de TF de TV, no una fila de botones sueltos. */
  #layout-picker {
    display: flex; gap: 1px; margin-right: 4px;
    background: var(--bg-secondary); border-radius: 7px; padding: 2px;
  }
  .layout-btn {
    background: none; border: none; border-radius: 5px;
    color: var(--text-secondary); font-family: var(--font-ui); font-size: 11px; font-weight: 500;
    padding: 4px 8px; cursor: pointer; transition: background .15s, color .15s;
  }
  .layout-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .layout-btn.active { background: var(--gold-glow); color: var(--gold); font-weight: 600; }

  /* ─── Modo embed (panel dentro de una grilla multi-chart) ──────
     Cada panel del grid 2×/4⊞ no necesita repetir el header completo
     (buscador de símbolo, O/H/L/C/V, refresh, settings, badge del
     puente) — eso vive una sola vez en la barra global de afuera.
     El watchlist (#sidebar) SÍ se deja: es el único lugar de donde elegir
     símbolo con un click (la barra global solo tiene un input de texto
     libre, sin lista ni autocompletado) — sin esto, cada panel quedaba sin
     ninguna forma de abrir/ver el watchlist. Arranca colapsado por panel
     (mismo mecanismo de siempre, persistido con el sufijo de cada pane) así
     no come espacio de entrada en una grilla de por sí chica. */
  html.embed-mode #topbar { display: none !important; }
  /* La barra de herramientas y el watchlist ahora viven UNA sola vez en la
     grilla de afuera (ver renderLayoutGrid) y controlan el panel activo —
     igual que en TV — así que cada panel individual ya no muestra la suya. */
  html.embed-mode #toolbar,
  html.embed-mode #btn-sidebar-toggle,
  html.embed-mode #sidebar { display: none !important; }
  /* Mismo criterio para los TF: un solo selector arriba de toda la
     grilla (ver gbar en renderLayoutGrid), no uno recortado por panel. */
  html.embed-mode #tf-bar-tfs-wrap,
  html.embed-mode #tf-bar .tf-sep,
  html.embed-mode #tf-fav-wrap { display: none !important; }
  /* Picker de layout + tema/refresh/settings/badge: ya tienen su propio
     equivalente una sola vez en la barra del shell (ver renderLayoutGrid)
     — cada panel individual no los repite. */
  html.embed-mode #tf-bar > .topbar-spacer,
  html.embed-mode #tf-bar-tools { display: none !important; }
  #tf-bar-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  #api-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  #api-badge.connected { color: var(--green); border-color: rgba(38,166,154,.4); }
  #api-badge:hover { color: var(--gold); border-color: var(--gold-dim); }

  /* ─── TIMEFRAME BAR ───────────────────────────────────── */
  #tf-bar {
    height: var(--tf-bar-h);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 10px;
    flex: 1 1 auto;
    min-width: 0;
  }
  /* Solo hace falta mostrar el símbolo acá cuando ESTE es el único
     renglón visible (panel embebido, con el topbar propio oculto) — en
     modo 1 gráfico o en el shell multi-chart, el símbolo ya se ve en el
     buscador de al lado, repetirlo acá sería redundante. */
  #tf-bar-symbol {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
    display: none;
  }
  html.embed-mode #tf-bar-symbol { display: block; }
  #tf-bar-tfs-wrap {
    position: relative;
    display: flex;
    /* NO crece (eso lo hace el spacer de más allá, para empujar los
       íconos de utilidad al borde derecho) — solo se achica y scrollea
       con las flechitas si no entran todos los TF. El piso de ancho evita
       que en una ventana angosta termine colapsando a 0 (invisible) antes
       de que el spacer ceda el espacio — siempre se ve al menos un puñado
       de TF, con las flechitas para desplazar el resto. */
    flex: 0 1 auto;
    min-width: 90px;
  }
  #tf-bar-tfs {
    display: flex;
    align-items: center;
    gap: 2px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    flex: 1 1 auto;
    min-width: 0;
  }
  #tf-bar-tfs::-webkit-scrollbar { display: none; height: 0; }
  .tf-scroll-fade {
    position: absolute; top: 0; bottom: 0; width: 20px;
    display: flex; align-items: center;
    pointer-events: none; opacity: 0;
    transition: opacity .15s;
    color: var(--text-dim);
  }
  .tf-scroll-fade.visible { opacity: 1; pointer-events: auto; cursor: pointer; }
  .tf-scroll-fade:hover { color: var(--gold); }
  .tf-scroll-fade svg { width: 11px; height: 11px; flex-shrink: 0; }
  .tf-scroll-fade-l { left: 0; justify-content: flex-start; background: linear-gradient(to right, var(--bg-secondary) 35%, transparent); }
  .tf-scroll-fade-r { right: 0; justify-content: flex-end; background: linear-gradient(to left, var(--bg-secondary) 35%, transparent); }
  #tf-bar .topbar-btn { flex-shrink: 0; }

  .tf-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 7px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0;
    transition: background .15s, color .15s;
  }
  .tf-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-btn.active { background: var(--gold-glow); color: var(--gold); font-weight: 600; }
  .tf-sep { width: 1px; height: 16px; background: var(--border); margin: 0 6px; flex-shrink: 0; }

  /* ─── Favoritos de TF (popup tipo TV, lista completa + estrella) ─ */
  #tf-fav-wrap { position: relative; flex-shrink: 0; }
  #tf-fav-trigger {
    background: none; border: none; color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  #tf-fav-trigger:hover, #tf-fav-trigger.active { background: var(--bg-hover); color: var(--gold); }
  #tf-fav-trigger svg { width: 13px; height: 13px; }
  .tf-fav-popup {
    position: absolute; top: calc(100% + 6px); left: 0;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    padding: 6px; z-index: 200; display: none;
    max-height: 340px; overflow-y: auto; min-width: 150px;
  }
  .tf-fav-popup.open { display: block; }
  .tf-fav-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px; cursor: pointer;
    color: var(--text-secondary);
  }
  .tf-fav-row:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tf-fav-row.active-tf { color: var(--gold); font-weight: 600; }
  .tf-fav-star {
    flex-shrink: 0; width: 15px; height: 15px; display: flex;
    align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer;
  }
  .tf-fav-star:hover { color: var(--gold); }
  .tf-fav-star.on { color: var(--gold); }
  .tf-fav-star svg { width: 14px; height: 14px; }
  .tf-fav-label { font-family: var(--font-ui); font-size: 12.5px; flex: 1; white-space: nowrap; }
  .tf-fav-sep { height: 1px; background: var(--border); margin: 4px 2px; }

  /* ─── MAIN AREA ───────────────────────────────────────── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ─── TOOLBAR (left) ─────────────────────────────────── */
  #toolbar {
    width: 38px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 2px;
    flex-shrink: 0;
    z-index: 50;
  }

  .tool-btn {
    width: 30px; height: 30px;
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
    position: relative;
  }
  .tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .tool-btn.active { background: var(--gold-glow); color: var(--gold); }
  .tool-btn.weak-active { background: var(--gold-glow); color: var(--gold); opacity: .55; }
  .tool-btn svg { width: 15px; height: 15px; }
  .tool-sep { width: 20px; height: 1px; background: var(--border); margin: 4px 0; }

  .tool-btn::after {
    content: attr(data-tip);
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-active);
    color: var(--text-primary);
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 999;
  }
  .tool-btn:hover::after { opacity: 1; }

  /* ─── SIDEBAR ─────────────────────────────────────────── */
  /* ¿Por qué un wrapper interno de ancho fijo? Animar el "width" de
     #sidebar directamente (como estaba antes) hacía que TODO su contenido
     (texto, filas del watchlist) se reacomodara cuadro a cuadro durante la
     transición — el texto envolvía/desbordaba mientras el panel se
     angostaba, así que se veía brusco en vez de un deslizamiento prolijo.
     Ahora #sidebar es solo el "marco" que recorta (overflow:hidden) — el
     contenido real vive en .sidebar-inner con un ancho FIJO que nunca
     cambia, así que nunca se reacomoda: solo se ve "correr" hacia afuera
     de la vista a medida que el marco se achica, que es el efecto que se
     busca. */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    overflow: hidden;
    transition: width .22s cubic-bezier(.4,0,.2,1);
    will-change: width;
  }
  #sidebar.collapsed { width: 0; border-right: none; }
  .sidebar-inner {
    width: var(--sidebar-w);
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #btn-sidebar-toggle {
    width: 13px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border: none;
    border-right: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #btn-sidebar-toggle:hover { color: var(--gold); }
  #btn-sidebar-toggle svg { width: 10px; height: 10px; transition: transform .15s; }
  #btn-sidebar-toggle.collapsed svg { transform: rotate(180deg); }

  .sidebar-header {
    padding: 10px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-add-btn {
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1;
    font-size: 16px;
    transition: color .15s;
    padding: 0 2px;
  }
  .sidebar-add-btn:hover { color: var(--gold); }

  #watchlist { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }

  .wl-item {
    display: flex;
    align-items: center;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    gap: 8px;
    position: relative;
  }
  .wl-item:hover { background: var(--bg-hover); }
  .wl-item.active { background: var(--bg-active); border-left: 2px solid var(--gold); }
  .wl-item.active .wl-sym { color: var(--gold); }

  .wl-sym { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-primary); letter-spacing: .5px; flex: 1; }
  .wl-price { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .wl-chg { font-family: var(--font-mono); font-size: 10px; padding: 1px 5px; border-radius: 3px; min-width: 46px; text-align: right; }
  .wl-chg.up { color: var(--green); background: var(--green-dim); }
  .wl-chg.dn { color: var(--red); background: var(--red-dim); }

  .wl-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 13px; line-height: 1; transition: color .15s; padding: 0 2px; }
  .wl-item:hover .wl-remove { color: var(--text-dim); }
  .wl-item:hover .wl-remove:hover { color: var(--red); }

  .sidebar-indicators { border-top: 1px solid var(--border); }
  .sidebar-indicators .sidebar-header { border-bottom: none; }
  #ind-list { padding: 4px 0; max-height: 140px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; }
  .ind-item { padding: 5px 12px; font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ind-item span { flex: 1; }
  .ind-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-remove { background: none; border: none; color: transparent; cursor: pointer; font-size: 12px; line-height: 1; transition: color .15s; }
  .ind-item:hover .ind-remove { color: var(--red); }

  /* ─── CHART AREA ──────────────────────────────────────── */
  #chart-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chart-container { flex: 1; position: relative; }

  #loading-overlay {
    position: absolute; inset: 0;
    background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 10; transition: opacity .4s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }

  .loader-logo {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 5px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(201,168,76,0.35), 0 1px 0 rgba(201,168,76,0.15);
  }
  .loader-bar { width: 120px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loader-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 2px; animation: loaderAnim 1.5s ease-in-out infinite; }
  @keyframes loaderAnim { 0%{width:0%;margin-left:0} 50%{width:70%;margin-left:15%} 100%{width:0%;margin-left:100%} }
  .loader-msg { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; }

  /* Reemplazado por #ohlcv-bar (siempre visible arriba a la izq. del
     chart, no solo al pasar el mouse) — el JS lo sigue actualizando
     (inofensivo, no se ve) así no hace falta tocar esas rutas. */
  #crosshair-info { display: none !important; }

  /* ─── OHLCV (encima del chart, no en la barra — libera espacio para
     que topbar+tf-bar entren en una sola fila, como TV) ──────────── */
  #ohlcv-bar {
    position: absolute; top: 8px; left: 8px;
    display: flex; gap: 10px;
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
    background: rgba(10,10,12,.55);
    padding: 3px 8px; border-radius: 4px;
    pointer-events: none; z-index: 6;
  }
  #ohlcv-bar span b { color: var(--text-dim); font-weight: 400; margin-right: 3px; }

  /* ─── STATUS BAR ──────────────────────────────────────── */
  #statusbar {
    height: 22px; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 12px; gap: 20px;
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); flex-shrink: 0;
    overflow: hidden; white-space: nowrap;
  }
  #statusbar .sb-item { display: flex; gap: 5px; min-width: 0; overflow: hidden; }
  #statusbar .sb-item b { color: var(--text-secondary); font-weight: 400; flex-shrink: 0; }
  #statusbar .sb-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status-conn { margin-left: auto; flex-shrink: 0; }
  #status-conn.ok { color: var(--green); }
  #status-conn.err { color: var(--red); }
  #status-conn.loading { color: var(--gold); }

  /* ─── MODALS ──────────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 24px;
    min-width: 320px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    transform: translateY(8px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 { font-family: var(--font-display); font-size: 11px; letter-spacing: 3px; color: var(--gold); margin-bottom: 16px; text-transform: uppercase; }
  .modal label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: .5px; }
  .modal input[type=text], .modal input[type=password] {
    width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); font-size: 12px;
    padding: 8px 12px; outline: none; margin-bottom: 14px; transition: border-color .2s;
  }
  .modal input:focus { border-color: var(--gold-dim); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .cs-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .cs-color-inp {
    width: 100%; height: 32px; background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 6px; cursor: pointer; padding: 2px; margin-bottom: 14px;
  }
  .cs-row .cs-color-inp { margin-bottom: 0; flex: 1; }

  .btn-primary {
    background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold-bright);
    font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 7px 18px;
    border-radius: 5px; cursor: pointer; letter-spacing: .5px; transition: background .15s;
  }
  .btn-primary:hover { background: rgba(201,168,76,.3); }

  .btn-ghost {
    background: none; border: 1px solid var(--border-light); color: var(--text-secondary);
    font-family: var(--font-ui); font-size: 12px; padding: 7px 14px; border-radius: 5px;
    cursor: pointer; transition: all .15s;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }

  .ind-picker-list { max-height: 260px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-light) transparent; margin-bottom: 14px; }
  .ind-pick-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 5px; cursor: pointer; gap: 10px; transition: background .12s; }
  .ind-pick-row:hover { background: var(--bg-hover); }
  .ind-pick-row.selected { background: var(--gold-glow); }
  .ind-pick-name { font-size: 12px; color: var(--text-primary); flex: 1; }
  .ind-pick-desc { font-size: 10px; color: var(--text-dim); }
  .ind-pick-check { width: 14px; height: 14px; border: 1px solid var(--border-light); border-radius: 3px; background: none; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ind-pick-row.selected .ind-pick-check { background: var(--gold); border-color: var(--gold); color: #000; font-size: 10px; }

  #add-sym-form { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); gap: 6px; align-items: center; }
  #add-sym-form.open { display: flex; }
  #add-sym-inp { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; outline: none; text-transform: uppercase; letter-spacing: 1px; }
  #add-sym-inp:focus { border-color: var(--gold-dim); }
  #add-sym-ok { background: var(--gold-dim); border: none; border-radius: 4px; color: var(--gold-bright); font-size: 12px; font-weight: 700; padding: 3px 10px; cursor: pointer; }

  /* ══════════════════════════════════════════════════════
     DRAWING TOOLBAR (floating, contextual)
  ══════════════════════════════════════════════════════ */
  #draw-toolbar {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 6px 8px;
    display: none;
    align-items: center;
    gap: 4px;
    z-index: 300;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
    user-select: none;
    /* "fixed" se centra contra el viewport de CADA panel (en la grilla
       multi-chart cada panel es su propio iframe, con su propio viewport
       angosto) — sin este tope, en un panel achicado por el usuario el
       contenido (varios selectores/colores en una sola fila) se salía del
       ancho del iframe y quedaba recortado/invisible más allá del borde. */
    max-width: calc(100vw - 16px);
    flex-wrap: wrap;
    justify-content: center;
  }
  #draw-toolbar.visible { display: flex; }

  .dtb-sep { width: 1px; height: 20px; background: var(--border-light); margin: 0 2px; }

  .dtb-btn {
    background: none;
    border: none;
    border-radius: 5px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .dtb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
  .dtb-btn.danger:hover { background: rgba(239,83,80,.15); color: var(--red); }
  .dtb-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .dtb-color-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dtb-color-swatch {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1px solid var(--border-light);
    cursor: pointer; overflow: hidden; position: relative;
  }
  .dtb-color-swatch input[type=color] {
    position: absolute; inset: -4px; width: 28px; height: 28px;
    opacity: 0; cursor: pointer;
  }

  .dtb-select {
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    border-radius: 4px; color: var(--text-primary); font-family: var(--font-mono);
    font-size: 11px; padding: 3px 6px; outline: none; cursor: pointer;
  }
  .dtb-select option { background: var(--bg-panel); }

  .dtb-btn.active { background: var(--gold-glow); color: var(--gold); }
  .dtb-label { font-size: 10px; color: var(--text-dim); padding: 0 4px; }

  .drawing-handle {
    fill: var(--gold);
    stroke: var(--bg-panel);
    stroke-width: 1.5;
    cursor: move;
    transition: r .1s;
  }
  .drawing-handle:hover { r: 7; }
  [contenteditable]:empty:before { content: attr(data-placeholder); opacity: .5; }
  .selected-drawing { filter: drop-shadow(0 0 4px rgba(201,168,76,.7)); }

  /* ─── Divisores arrastrables entre paneles (modo 2×/4⊞) ──── */
  .grid-divider { background: var(--bg-primary); position: relative; }
  .grid-divider::after {
    content: ''; position: absolute; background: var(--border);
    transition: background .1s;
  }
  .grid-divider-col::after { top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); }
  .grid-divider-row::after { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
  .grid-divider-col { cursor: col-resize; }
  .grid-divider-row { cursor: row-resize; }
  .grid-divider:hover::after, .grid-divider.dragging::after { background: var(--gold); }
</style>
</head>
<body>

<!-- ══ HEADER (topbar + tf-bar en UNA sola fila, como TV) ═ -->
<div id="header-row">
<div id="topbar">
  <div class="logo">ZENTINEL</div>
  <div class="logo-sep"></div>

  <div id="symbol-search-wrap">
    <input id="symbol-input" class="topbar-input" type="text" value="NAS100.fs" placeholder="Symbol" autocomplete="off" title="Enter symbol and press Enter">
  </div>

  <div id="price-display">
    <span id="price-last">—</span>
    <span id="price-change" class="">—</span>
  </div>
</div>

<!-- ══ TIMEFRAME BAR (+ utilidades, misma fila que topbar) ═ -->
<div id="tf-bar">
  <div id="tf-bar-symbol"></div>
  <div id="tf-bar-tfs-wrap">
    <div id="tf-bar-tfs"></div>
    <div class="tf-scroll-fade tf-scroll-fade-l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></div>
    <div class="tf-scroll-fade tf-scroll-fade-r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
  <div id="tf-fav-wrap">
    <button id="tf-fav-trigger" title="Más timeframes / favoritos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div id="tf-fav-popup" class="tf-fav-popup"></div>
  </div>
  <div class="tf-sep"></div>
  <button class="topbar-btn" id="btn-indicators" onclick="openIndicatorModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Indicators
    <svg class="tb-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <button class="topbar-btn" id="btn-replay" title="Replay: click a candle to start" onclick="toggleReplayPicker()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Replay
  </button>

  <!-- Picker de layout + utilidades: solo tienen sentido en modo 1
       gráfico (en la grilla multi-chart ya existen sus propios
       equivalentes en la barra del shell), por eso se ocultan en
       html.embed-mode con #tf-bar-tools de abajo. -->
  <div class="topbar-spacer"></div>
  <div id="tf-bar-tools">
    <div id="layout-picker" title="Cantidad de gráficos">
      <button class="layout-btn active" data-layout="1">1</button>
      <button class="layout-btn" data-layout="2">2 ×</button>
      <button class="layout-btn" data-layout="3">3 ×</button>
      <button class="layout-btn" data-layout="4">4 ⊞</button>
    </div>

    <button class="topbar-btn theme-toggle-btn" title="Cambiar a modo claro" onclick="toggleTheme()"></button>

    <button class="topbar-btn" id="btn-refresh" title="Refresh chart" onclick="refreshChart()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>

    <button class="topbar-btn" id="btn-settings" title="Settings" onclick="openChartSettingsModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <div id="api-badge" onclick="openChartSettingsModal()">BRIDGE…</div>
  </div>
</div>
</div><!-- /header-row -->

<!-- ══ MAIN ══════════════════════════════════════════════ -->
<div id="main">

  <!-- ── TOOLBAR ───────────────────────────────────────── -->
  <div id="toolbar">
    <button class="tool-btn active" data-tip="Cursor" onclick="setTool(this,'cursor')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-7 1-3 7z"/></svg>
    </button>
    <button class="tool-btn" data-tip="Crosshair" onclick="setTool(this,'cross')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tip="Trend Line" onclick="setTool(this,'trendline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="20" x2="20" y2="4"/>
        <circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="4" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Horizontal Line" onclick="setTool(this,'hline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="2" y1="12" x2="22" y2="12"/><circle cx="2" cy="12" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Vertical Line" onclick="setTool(this,'vline')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="2" r="2" fill="currentColor"/>
      </svg>
    </button>
    <button class="tool-btn" data-tip="Rectangle" onclick="setTool(this,'rect')">

<script>
// ══════════════════════════════════════════════════════════
//  MULTI-CHART LAYOUT
//  ?layout=2|4 renders a grid of iframes (each one this same page with
//  ?embed=1&pane=N) instead of the normal single-chart app. ?pane=N
//  namespaces every localStorage key so each pane in the grid keeps
//  its own symbol/timeframe/indicators/settings independently.
// ══════════════════════════════════════════════════════════
const _qs = new URLSearchParams(location.search);
const LAYOUT_N = Number(_qs.get('layout')) || 1;
const EMBED_MODE = _qs.get('embed') === '1';
const PANE_ID = _qs.get('pane') || '';
const LS_SUFFIX = PANE_ID ? ('_p' + PANE_ID) : '';
function lsKey(name){ return name + LS_SUFFIX; }
if (EMBED_MODE) document.documentElement.classList.add('embed-mode');

// Chrome a veces bloquea localStorage al abrir index.html como archivo
// local (file://) — tira SecurityError y, si no se controla, esto frena
// TODO el script apenas arranca (pantalla en blanco). Con este wrapper,
// si el storage no está disponible la app igual carga (sin recordar nada
// entre sesiones) en vez de romperse.
let _lsOK = true;
try { localStorage.setItem('__td_probe__','1'); localStorage.removeItem('__td_probe__'); } catch(e) { _lsOK = false; }
const _lsMem = {};
function lsGet(key){ if(!_lsOK) return _lsMem[key] ?? null; try { return localStorage.getItem(key); } catch(e){ return _lsMem[key] ?? null; } }
function lsSet(key, val){ if(!_lsOK){ _lsMem[key]=val; return; } try { localStorage.setItem(key, val); } catch(e){ _lsMem[key]=val; } }
if (!_lsOK) console.warn('Zentinel: localStorage no disponible (bloqueado por el navegador) — la configuración no va a persistir entre recargas.');

// ══════════════════════════════════════════════════════════
//  TEMA (claro/oscuro) — afecta toda la interfaz (toolbar, sidebar,
//  modales, barras) pero NO el gráfico en sí: los colores de velas/fondo
//  del chart ya se manejan aparte, desde Settings (STATE.chartSettings),
//  y no dependen de estas variables CSS.
//
//  Clave SIN sufijo de pane (lsGet/lsSet directo, no lsKey) a propósito:
//  es una preferencia de toda la app, no por panel — así en la grilla
//  multi-chart todos los paneles (y la barra global de afuera, que es una
//  página aparte) quedan siempre con el mismo tema. Se aplica ACÁ, antes
//  de cualquier render, para no mostrar un flash con el tema viejo.
// ══════════════════════════════════════════════════════════
let _lastAppliedTheme = null;
function applyTheme(theme){
  // changed=false pasa en dos casos normales (no son bugs): el 'storage'
  // event de respaldo reaplicando lo mismo que ya llegó por postMessage
  // un rato antes, y el redibujo explícito del ícono de un botón de tema
  // recién creado (grilla multi-chart) sin que el tema haya cambiado.
  // En ambos casos igual hace falta repintar el ícono (por eso ese bloque
  // queda afuera del if), pero no hace falta tocar el atributo/transición.
  const changed = theme !== _lastAppliedTheme;
  _lastAppliedTheme = theme;
  const root = document.documentElement;
  if (changed) {
    // El cambio de color en sí (fondo/texto/bordes, vía las variables CSS)
    // tiene transition en un montón de elementos para las interacciones
    // normales (hover, etc.) — pero eso mismo hacía que el cambio de tema
    // se viera como un fundido de ~150ms en vez de un corte limpio. En
    // modo grilla, la barra de afuera (este doc) y cada panel (otro doc,
    // avisado por postMessage con unos ms de diferencia) ya no quedan
    // perfectamente sincronizados a nivel de evento — pero si cada uno
    // corta en seco en vez de desvanecer, esa pequeña diferencia de
    // tiempo deja de notarse como "primero uno, después el otro". Se
    // apaga toda transición un frame nomás, justo alrededor del cambio.
    root.classList.add('theme-switching');
    if (theme === 'light') root.setAttribute('data-theme','light');
    else root.removeAttribute('data-theme');
  }
  document.querySelectorAll('.theme-toggle-btn').forEach(btn=>{
    btn.innerHTML = theme==='light' ? THEME_ICON_MOON : THEME_ICON_SUN;

  const SHELL_SIDEBAR_KEY = 'td_shell_sidebar_collapsed';
  if (lsGet(SHELL_SIDEBAR_KEY) === '1') {
    shellSidebar.classList.add('collapsed');
    shellSidebarToggle.classList.add('collapsed');
  }
  function shellToggleSidebarPanel(){
    const collapsed = shellSidebar.classList.toggle('collapsed');
    shellSidebarToggle.classList.toggle('collapsed', collapsed);
    lsSet(SHELL_SIDEBAR_KEY, collapsed ? '1' : '0');
  }

  // Watchlist global (STATE acá en el shell no tiene pane, así que su
  // storage ya es compartido sin sufijo — mismo mecanismo que td_theme).
  if (!Array.isArray(STATE.watchlist) || !STATE.watchlist.length) {
    STATE.watchlist = ['NAS100.fs','US500','US30','XAUUSD','EURUSD'];
  }
  // STATE y volumeVisible de cada panel son `const`/`let` de nivel
  // superior — a diferencia de las funciones (que sí cuelgan de su propio
  // window), esas NO quedan como propiedad de contentWindow, así que leerlas
  // como `f.contentWindow.STATE` da undefined. eval() sí las resuelve,
  // porque corre en el scope real de ese documento (mismo motivo por el que
  // ya se usó así para depurar el sync de tema en esta misma sesión).
  function paneEval(f, expr){
    try { return f.contentWindow.eval(expr); } catch(e){ return undefined; }
  }
  function renderShellWatchlist(){
    const el = shellSidebar.querySelector('#watchlist');
    if (!el) return;
    const f = iframeEls[activePane-1];
    const activeSym = f ? paneEval(f, 'STATE.symbol') : null;
    el.innerHTML = '';
    STATE.watchlist.forEach(sym => {
      const rowEl = document.createElement('div');
      rowEl.className = 'wl-item' + (sym===activeSym ? ' active' : '');
      rowEl.innerHTML = `
        <div class="wl-sym">${sym}</div>
        <div class="wl-price">—</div>
        <div class="wl-chg">—</div>
        <button class="wl-remove" onclick="shellRemoveSymbol('${sym}',event)">×</button>`;
      rowEl.addEventListener('click', () => shellSelectSymbol(sym));
      el.appendChild(rowEl);
    });
    lsSet('td_watchlist', JSON.stringify(STATE.watchlist));
  }
  window.shellSelectSymbol = function(sym){
    const f = iframeEls[activePane-1];
    if (f) { try { f.contentWindow.selectSymbol(sym); } catch(e){} }
    renderShellWatchlist();
  };
  window.shellAddSymbol = function(){
    const inp = shellSidebar.querySelector('#add-sym-inp');
    const sym = inp.value.trim();
    inp.value = '';
    shellSidebar.querySelector('#add-sym-form').classList.remove('open');
    if (!sym || STATE.watchlist.includes(sym)) return;
    STATE.watchlist.push(sym);
    renderShellWatchlist();
  };
  window.shellRemoveSymbol = function(sym, e){
    e.stopPropagation();
    STATE.watchlist = STATE.watchlist.filter(s=>s!==sym);
    renderShellWatchlist();
  };
  window.shellToggleAddSym = function(){
    const f = shellSidebar.querySelector('#add-sym-form');
    f.classList.toggle('open');
    if (f.classList.contains('open')) shellSidebar.querySelector('#add-sym-inp').focus();
  };

  // Herramientas de dibujo: todas actúan SIEMPRE sobre el panel activo
  // (no sobre "Activo/Todos" — un dibujo o una herramienta no tiene sentido
  // replicada en varios paneles a la vez, a diferencia del símbolo/TF).
  window.shellSetTool = function(btn, name){
    shellToolbar.querySelectorAll('.tool-btn').forEach(b=>{ if(b.id!=='btn-volume'&&b.id!=='btn-magnet'&&b.id!=='btn-ind-legend') b.classList.remove('active'); });
    btn.classList.add('active');
    const f = iframeEls[activePane-1];
    if (f) { try { f.contentWindow.setTool(null, name); } catch(e){} }
  };
  window.shellToggleMagnet = function(){
    const f = iframeEls[activePane-1];
    if (!f) return;
    try { f.contentWindow.toggleMagnet(); syncMagnetBtn(f); } catch(e){}
  };
  window.shellClearDrawings = function(){
    const f = iframeEls[activePane-1];
    if (f) { try { f.contentWindow.clearDrawings(); } catch(e){} }
  };
  // Undo/redo es por panel (cada uno tiene su propio historial, ver
  // captureUndoSnapshot) — esto solo reenvía el Ctrl+Z/botón al panel
  // activo, igual que Clear All de arriba.
  window.shellUndoDrawing = function(){
    const f = iframeEls[activePane-1];
    if (f) { try { f.contentWindow.undoDrawing(); } catch(e){} }
  };
  window.shellRedoDrawing = function(){
    const f = iframeEls[activePane-1];
    if (f) { try { f.contentWindow.redoDrawing(); } catch(e){} }
  };
  // Delete/Escape/Ctrl+Z/Ctrl+Y de dibujos viven en cada panel (ahí está
  // selectedDrawingId y el historial de undo) — pero clickear CUALQUIER
  // botón de esta barra compartida (TF, Indicators, el ícono Cursor...)
  // deja el foco de TECLADO en este documento (el shell), no en el panel,
  // aunque después se haya clickeado adentro del gráfico para seleccionar
  // un dibujo — un click de mouse ahí no necesariamente mueve el foco de
  // teclado de un iframe a otro. Sin este reenvío, esas teclas no hacían
  // nada: el shell no tiene su propio dibujo que borrar/deshacer. Un
  // keydown que SÍ ocurre adentro de un iframe nunca llega hasta acá (los
  // iframes no burbujean eventos al padre), así que esto no puede
  // duplicar lo que ya hace el listener propio de cada panel.
  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable)) return;
    const f = iframeEls[activePane-1];
    if (!f) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      try { f.contentWindow.onDtbDelete(); } catch(err){}
    } else if (e.key === 'Escape') {
      try { f.contentWindow.deselectDrawing(); } catch(err){}
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      try { e.shiftKey ? f.contentWindow.redoDrawing() : f.contentWindow.undoDrawing(); } catch(err){}
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      try { f.contentWindow.redoDrawing(); } catch(err){}
    }
  });
  window.shellToggleVolume = function(){
    const f = iframeEls[activePane-1];
    if (!f) return;
    try {
      f.contentWindow.toggleVolume();
      shellToolbar.querySelector('#btn-volume').classList.toggle('active', !!paneEval(f, 'volumeVisible'));
    } catch(e){}
  };
  // Global de toda la app (no por panel) — el shell corre en el mismo
  // script que cada panel, así que llama DIRECTO a la misma función
  // (nada de contentWindow/paneEval): cambia la única preferencia
  // compartida y cada panel se entera solo por el 'storage' que ya
  // escuchan (ver toggleIndicatorLegend, cerca de td_theme).
  window.shellToggleIndicatorLegend = toggleIndicatorLegend;
  function syncMagnetBtn(f){
    const btn = shellToolbar.querySelector('#btn-magnet');
    const mode = paneEval(f, 'STATE.magnetMode') || 'off';
    const TIPS = { off:'Magnet: off', weak:'Magnet: weak (ajusta solo si el mouse está cerca)', strong:'Magnet: strong (ajusta siempre a la vela)' };
    btn.classList.toggle('active', mode==='strong');
    btn.classList.toggle('weak-active', mode==='weak');
    btn.dataset.tip = TIPS[mode] || TIPS.off;
  }
  // Notificado por cada panel cuando SU PROPIA herramienta cambia sola
  // (p.ej. vuelve a "cursor" automáticamente después de terminar un
  // dibujo) — sin esto, la barra de afuera se quedaba mostrando la
  // herramienta vieja marcada aunque el panel ya hubiese vuelto al cursor.
  window.zentinelToolSync = function(paneId, name){
    if (Number(paneId) !== activePane) return;
    shellToolbar.querySelectorAll('.tool-btn').forEach(b=>{ if(b.id!=='btn-volume'&&b.id!=='btn-magnet'&&b.id!=='btn-ind-legend') b.classList.remove('active'); });
    const btn = shellToolbar.querySelector(`[data-tool="${name}"]`);
    if (btn) btn.classList.add('active');
  };
  // Clickear el chart de un panel con el watchlist compartido abierto lo
  // cierra — igual que pasaba (por panel) antes de compartir uno solo acá.
  window.zentinelChartClicked = function(){
    if (!shellSidebar.classList.contains('collapsed')) shellToggleSidebarPanel();
  };
  // Al cambiar de panel activo, la barra de herramientas y el watchlist
  // tienen que reflejar lo que YA tenía ese panel (pudo haber quedado en
  // otra herramienta, con el magnet prendido, volumen visible, etc.).
  function syncShellControls(){
    const f = iframeEls[activePane-1];
    if (!f) return;
    renderShellWatchlist();
    const tool = paneEval(f, 'STATE.activeTool');
    shellToolbar.querySelectorAll('.tool-btn').forEach(b=>{ if(b.id!=='btn-volume'&&b.id!=='btn-magnet'&&b.id!=='btn-ind-legend') b.classList.remove('active'); });
    const btn = tool ? shellToolbar.querySelector(`[data-tool="${tool}"]`) : null;
    if (btn) btn.classList.add('active');
    syncMagnetBtn(f);
    shellToolbar.querySelector('#btn-volume').classList.toggle('active', !!paneEval(f, 'volumeVisible'));
    // btn-ind-legend NO se resincroniza acá: es una preferencia global
    // (ver toggleIndicatorLegend), no cambia según qué panel esté activo.
    renderShellTfQuick();
    closeTfFavPopupShell();
  }

  row.appendChild(shellToolbar);
  row.appendChild(shellSidebarToggle);
  row.appendChild(shellSidebar);
  document.body.appendChild(row);
  applyIndicatorLegendVisibility(); // repinta el botón recién creado con el estado global actual

  // El cambio de tema desde ACÁ (la barra global) se veía en dos tiempos
  // si cada panel se enteraba solo por el 'storage' event (asíncrono,
  // tarda unos cientos de ms) o incluso por postMessage (sigue siendo
  // asíncrono — medido ~35-75ms de por medio entre esta barra y cada
  // panel, suficiente para notarse). Shell y paneles son incluso mismo
  // origin (todo sirve desde http://localhost:8787), así que no hace
  // falta mensajería para esto: se llama applyTheme() DIRECTO sobre el
  // contentWindow de cada iframe, síncrono, en el mismo tick que acá.
  gbar.querySelector('#gc-theme-toggle').addEventListener('click', () => {
    toggleTheme();
    const theme = document.documentElement.getAttribute('data-theme') || 'dark';
    iframeEls.forEach(el => { try { el.contentWindow.applyTheme(theme); } catch(e){} });
  });

  // Scope: Activo / Todos
  const scopeWrap = bar.querySelector('#gc-scope');
  function renderScopeBtns(){
    scopeWrap.innerHTML = ['active','all'].map(s =>
      `<button class="layout-btn${s===scope?' active':''}" data-scope="${s}" title="¿A qué panel(es) aplican el símbolo, los TFs rápidos y 'Aplicar preset' de esta barra?">${s==='active'?'Activo':'Todos'}</button>`
    ).join('');
    scopeWrap.querySelectorAll('[data-scope]').forEach(b=>{
      b.addEventListener('click', ()=>{ scope=b.dataset.scope; renderScopeBtns(); });
    });
  }
  renderScopeBtns();

  // Símbolo: Enter para aplicar
  const symbolInp = bar.querySelector('#gc-symbol');
  symbolInp.addEventListener('keydown', e=>{
    if (e.key !== 'Enter') return;
    const sym = symbolInp.value.trim();
    if (!sym) return;
    broadcast({ type:'zentinel:setSymbol', symbol:sym });
    symbolInp.value='';
  });

  // Un solo selector de TF para toda la grilla — muestra la lista de
  // favoritos GLOBAL (getTfFavorites/setTfFavorites, misma que usa cada
  // panel individual: una sola lista compartida en toda la app, no una
  // por panel/pestaña), resaltando el TF del panel ACTIVO. Al clickear
  // un TF rápido se aplica al panel activo (o a todos, según el selector
  // Activo/Todos de esta misma barra). Delegado en el padre para no
  // tener que re-atar listeners cada vez que se re-renderiza.
  const tfWrap = gbar.querySelector('#tf-bar-tfs');
  function renderShellTfQuick(){
    const f = iframeEls[activePane-1];
    const tf = f ? paneEval(f, 'STATE.timeframe') : null;
    const visible = new Set(getTfFavorites());
    let html = '', lastGroup = null;
    ALL_TIMEFRAMES.forEach(t => {
      if (!visible.has(t.tf)) return;
      if (lastGroup !== null && lastGroup !== t.group) html += '<div class="tf-sep"></div>';
      html += `<button class="tf-btn${t.tf===tf?' active':''}" data-tf="${t.tf}">${t.label}</button>`;
      lastGroup = t.group;
    });
    tfWrap.innerHTML = html;
  }
  tfWrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.tf-btn');
    if (!btn) return;
    tfWrap.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    broadcast({ type:'zentinel:setTimeframe', tf:btn.dataset.tf });
  });
  renderShellTfQuick();
  initTfBarScrollFade(tfWrap, gbar.querySelector('#tf-bar-tfs-wrap'));
  window.addEventListener('storage', e => { if (e.key === 'td_tf_favorites') { renderShellTfQuick(); if (tfFavPopup.classList.contains('open')) renderTfFavPopupShell(); } });

  // Popup de favoritos (estrella) de la barra de TF — misma lista GLOBAL
  // de arriba; solo el resaltado del TF activo depende del panel activo.
  const tfFavPopup = gbar.querySelector('#tf-fav-popup');
  const tfFavTrigger = gbar.querySelector('#tf-fav-trigger');
  function renderTfFavPopupShell(){
    const f = iframeEls[activePane-1];
    const tf = f ? paneEval(f, 'STATE.timeframe') : null;
    const visible = new Set(getTfFavorites());
    let html = '', lastGroup = null;
    ALL_TIMEFRAMES.forEach(t => {
      if (lastGroup !== null && lastGroup !== t.group) html += '<div class="tf-fav-sep"></div>';
      const on = visible.has(t.tf);
      html += `<div class="tf-fav-row${t.tf===tf?' active-tf':''}" data-tf="${t.tf}">
        <span class="tf-fav-star${on?' on':''}" data-star="${t.tf}" title="Favorito">
          <svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </span>
        <span class="tf-fav-label">${t.label}</span>
      </div>`;
      lastGroup = t.group;
    });
    tfFavPopup.innerHTML = html;
  }
  function toggleTfFavShell(tf){
    let list = getTfFavorites().slice();
    if (list.includes(tf)) {
      if (list.length <= 1) return;
      list = list.filter(x=>x!==tf);
    } else {
      list.push(tf);
    }
    setTfFavorites(list);
    renderShellTfQuick();
    renderTfFavPopupShell();
  }
  function closeTfFavPopupShell(){
    tfFavPopup.classList.remove('open');
    tfFavTrigger.classList.remove('active');
  }
  tfFavTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    if (tfFavPopup.classList.contains('open')) { closeTfFavPopupShell(); return; }
    renderTfFavPopupShell();
    tfFavPopup.classList.add('open');
    tfFavTrigger.classList.add('active');
  });
  tfFavPopup.addEventListener('click', (e) => {
    const star = e.target.closest('[data-star]');
    if (star) { e.stopPropagation(); toggleTfFavShell(star.dataset.star); return; }
    const row = e.target.closest('.tf-fav-row');
    if (row) {
      broadcast({ type:'zentinel:setTimeframe', tf:row.dataset.tf });
      tfWrap.querySelectorAll('.tf-btn').forEach(x=>x.classList.toggle('active', x.dataset.tf===row.dataset.tf));
      closeTfFavPopupShell();
    }
  });
  document.addEventListener('click', (e) => {
    if (!gbar.querySelector('#tf-fav-wrap').contains(e.target)) closeTfFavPopupShell();
  });

  // Presets ya guardados (mismo storage que usan los paneles — sin sufijo
  // de pane, por eso se puede leer directo acá afuera). Guardar uno nuevo
  // pasa DENTRO de un panel (iframe) — el 'storage' event es lo que avisa
  // acá afuera que cambió, así la lista no queda vieja sin recargar todo.
  const presetSel = gbar.querySelector('#gc-preset');
  function renderPresetOptions(){
    const current = presetSel.value;
    let presets = {};
    try { presets = JSON.parse(lsGet('td_presets') || '{}'); } catch(e){}
    const names = Object.keys(presets).sort();
    presetSel.innerHTML = names.length
      ? names.map(nm=>`<option value="${nm}">${nm}</option>`).join('')
      : `<option value="">(sin presets guardados)</option>`;
    if (names.includes(current)) presetSel.value = current;
  }
  renderPresetOptions();
  window.addEventListener('storage', (e) => {
    if (e.key === 'td_presets') renderPresetOptions();
  });
  // Por si el 'storage' event no llega a tiempo en algún navegador: la
  // releemos también justo antes de abrir el desplegable.
  presetSel.addEventListener('mousedown', renderPresetOptions);
  gbar.querySelector('#gc-preset-apply').addEventListener('click', ()=>{
    const name = presetSel.value;
    if (!name) return;
    broadcast({ type:'zentinel:applyPreset', name });
  });

  gbar.querySelector('#gc-refresh').addEventListener('click', ()=>{
    broadcast({ type:'zentinel:refresh' });
  });
  // Settings abre un modal — no tiene sentido "a todos" (solo se puede
  // mirar uno a la vez), así que siempre apunta al panel activo sin
  // importar lo que diga el selector de alcance.
  gbar.querySelector('#gc-settings').addEventListener('click', ()=>{
    iframeEls[activePane-1].contentWindow.postMessage({ type:'zentinel:openSettings' }, '*');
  });

  // Replay — como Settings, siempre apunta a un panel puntual (el activo
  // para arrancar, el maestro una vez arrancado) sin importar el selector
  // Activo/Todos: no tiene sentido "a todos", solo puede haber un replay
  // sincronizado corriendo a la vez.
  gbar.querySelector('#gc-replay-btn').addEventListener('click', ()=>{
    if (replayMasterPane) {
      iframeEls[replayMasterPane-1].contentWindow.postMessage({ type:'zentinel:replayControl', action:'exit' }, '*');
      return;
    }
    const f = iframeEls[activePane-1];
    if (f) f.contentWindow.postMessage({ type:'zentinel:startReplayPick' }, '*');
  });
  gbar.querySelector('#gc-replay-play').addEventListener('click', ()=>{
    if (!replayMasterPane) return;
    iframeEls[replayMasterPane-1].contentWindow.postMessage({ type:'zentinel:replayControl', action: replayPlaying?'pause':'play' }, '*');
  });
  gbar.querySelector('#gc-replay-step').addEventListener('click', ()=>{
    if (!replayMasterPane) return;
    iframeEls[replayMasterPane-1].contentWindow.postMessage({ type:'zentinel:replayControl', action:'step' }, '*');
  });
  gbar.querySelector('#gc-replay-speed').addEventListener('change', (e)=>{
    if (!replayMasterPane) return;
    iframeEls[replayMasterPane-1].contentWindow.postMessage({ type:'zentinel:replayControl', action:'speed', speedMs:Number(e.target.value) }, '*');
  });
  gbar.querySelector('#gc-replay-exit').addEventListener('click', ()=>{
    if (!replayMasterPane) return;
    iframeEls[replayMasterPane-1].contentWindow.postMessage({ type:'zentinel:replayControl', action:'exit' }, '*');
  });

  // ─── Grilla de paneles ─────────────────────────────────────
  // Cada panel y cada divisor es un grid-item posicionado por línea
  // explícita (no `repeat(n,1fr)` automático): así los divisores tienen su
  // propio track angosto entre paneles, arrastrable para cambiar el tamaño
  // relativo (en `fr`) del par de paneles a cada lado. El split elegido se
  // guarda en localStorage (sin sufijo de pane: es del layout, no de un
  // panel individual) para que sobreviva a un refresh.
  const grid = document.createElement('div');
  const cols = n===4 ? 2 : n;
  const rows = n===4 ? 2 : 1;
  const DIVIDER_PX = 6;
  const MIN_PANE_PX = 150;

  const savedSplit = (() => { try { return JSON.parse(lsGet('td_grid_split_'+n) || '{}'); } catch(e){ return {}; } })();
  const colFr = (Array.isArray(savedSplit.cols) && savedSplit.cols.length===cols) ? savedSplit.cols.slice() : Array(cols).fill(1);
  const rowFr = (Array.isArray(savedSplit.rows) && savedSplit.rows.length===rows) ? savedSplit.rows.slice() : Array(rows).fill(1);
  function saveSplit(){ lsSet('td_grid_split_'+n, JSON.stringify({cols:colFr, rows:rowFr})); }
  function colTemplate(){ return colFr.map(f=>`${f}fr`).join(` ${DIVIDER_PX}px `); }
  function rowTemplate(){ return rowFr.map(f=>`${f}fr`).join(` ${DIVIDER_PX}px `); }
  function applyTemplate(){
    grid.style.gridTemplateColumns = colTemplate();
    grid.style.gridTemplateRows = rowTemplate();
  }

  grid.style.cssText = `flex:1;display:grid;background:var(--bg-primary);min-height:0;position:relative;`;
  applyTemplate();

  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      const i = r*cols + c + 1;
      const iframe = document.createElement('iframe');
      iframe.src = `index.html?embed=1&pane=${i}`;
      iframe.style.cssText = 'width:100%;height:100%;box-sizing:border-box;display:block;border:1px solid transparent;transition:border-color .15s;';
      iframe.style.gridColumn = String(2*c+1);
      iframe.style.gridRow = String(2*r+1);
      // Al terminar de cargar, si ya es (o llega a ser) el panel activo, la
      // barra de herramientas/watchlist de afuera todavía no tenía de dónde
      // leer su estado real (el iframe recién estaba cargando) — reintentar
      // acá una vez que el script de adentro ya corrió deja todo sincronizado
      // desde el primer momento, no recién al cambiar de panel.
      iframe.addEventListener('load', () => { if (i === activePane) syncShellControls(); });
      grid.appendChild(iframe);
      iframeEls.push(iframe);
    }
  }

  // Crosshair sincronizado entre paneles: cada panel (iframe) avisa acá
  // afuera cuando el usuario mueve el mouse sobre SU chart, y esto lo
  // replica en los demás vía llamada directa (mismo origin, sin
  // postMessage — mismo motivo que el sync de tema: instantáneo, sin
  // el delay de un mensaje async).
  // Identifica el panel de origen por PANE_ID (string), no por referencia
  // de window — iframeEls[i].contentWindow === sourceWindow DEBERÍA ser
  // sólido, pero si por lo que sea no lo es (recarga del iframe, timing),
  // el panel termina recibiendo su PROPIO broadcast de vuelta como si
  // viniera de otro: el precio se le resetea al valor recién sincronizado
  // (level snap a la vela más cercana) mientras el mouse real lo sigue
  // moviendo a upa, y el resultado visual es el precio saltando entre dos
  // valores todo el tiempo. Comparar por ID es inequívoco.
  window.zentinelCrosshairBroadcast = function(time, sourcePaneId){
    iframeEls.forEach((el, i) => {
      if (String(i+1) === String(sourcePaneId)) return;
      try { el.contentWindow.setExternalCrosshair(time); } catch(e){}
    });
  };

  // Dibujos sincronizados entre paneles con el MISMO símbolo (cualquier
  // TF — un nivel marcado en 1H tiene sentido seguir viéndolo en 15m del
  // mismo instrumento). sourcePaneId como string: así lo manda cada panel
  // (PANE_ID), sin forzar conversión de tipos en ningún lado.
  window.zentinelDrawingsSync = function(sourcePaneId, symbol, list){
    iframeEls.forEach((el, i) => {
      if (String(i+1) === String(sourcePaneId)) return;
      const otherSymbol = paneEval(el, 'STATE.symbol');
      if (otherSymbol !== symbol) return;
      try { el.contentWindow.applyExternalDrawings(JSON.parse(JSON.stringify(list))); } catch(e){}
    });
  };

  // Cada panel es un iframe = un browsing context aparte. Un mousemove del
  // usuario, apenas el cursor entra en el área de un iframe durante el
  // drag, deja de burbujear al document del padre (son documentos
  // distintos) — sin esto, el arrastre se cortaba en seco en cuanto la
  // caía arriba de cualquiera de los dos paneles. La solución estándar:
  // mientras se arrastra, tapar todo con una capa transparente por encima
  // de los iframes que capture ella sola el mousemove/mouseup, y sacarla
  // al soltar.
  function startDrag(e, div, axis, idx){
    e.preventDefault();
    const isCol = axis==='col';
    const fr = isCol ? colFr : rowFr;
    const count = isCol ? cols : rows;
    const rect = grid.getBoundingClientRect();
    const sizePx = isCol ? rect.width : rect.height;
    const totalFr = fr.reduce((a,b)=>a+b,0);
    const pxPerFr = (sizePx - DIVIDER_PX*(count-1)) / totalFr;
    const minFr = MIN_PANE_PX / pxPerFr;
    const startPos = isCol ? e.clientX : e.clientY;
    const startA = fr[idx], startB = fr[idx+1];
    const pairFr = startA + startB;
    div.classList.add('dragging');

    const overlay = document.createElement('div');
    overlay.style.cssText = `position:fixed;inset:0;z-index:9999;cursor:${isCol?'col-resize':'row-resize'};`;
    document.body.appendChild(overlay);

    // mousemove puede disparar muchas más veces por segundo de las que el
    // navegador llega a pintar — aplicar el grid-template en cada uno
    // encolaba layouts de sobra (cada uno cascadea a los iframes, que a su
    // vez redimensionan el chart de lightweight-charts adentro). Guardar
    // solo la ÚLTIMA posición y aplicar una vez por frame (rAF) le saca
    // ese trabajo redundante sin perder la sensación de "en vivo".
    let pendingPos = null, rafId = null;
    function applyPending(){
      rafId = null;
      let a = startA + (pendingPos - startPos) / pxPerFr;
      a = Math.max(minFr, Math.min(pairFr - minFr, a));
      fr[idx] = a; fr[idx+1] = pairFr - a;
      applyTemplate();
    }
    function onMove(ev){
      pendingPos = isCol ? ev.clientX : ev.clientY;
      if (rafId === null) rafId = requestAnimationFrame(applyPending);
    }
    function onUp(){
      overlay.removeEventListener('mousemove', onMove);
      overlay.removeEventListener('mouseup', onUp);
      overlay.remove();
      div.classList.remove('dragging');
      if (rafId !== null) { cancelAnimationFrame(rafId); applyPending(); }
      saveSplit();
    }
    overlay.addEventListener('mousemove', onMove);
    overlay.addEventListener('mouseup', onUp);
  }

  for (let c=0;c<cols-1;c++){
    const div = document.createElement('div');
    div.className = 'grid-divider grid-divider-col';
    div.style.gridColumn = String(2*c+2);
    div.style.gridRow = `1 / ${2*rows}`;
    div.addEventListener('mousedown', e => startDrag(e, div, 'col', c));
    grid.appendChild(div);
  }
  for (let r=0;r<rows-1;r++){
    const div = document.createElement('div');
    div.className = 'grid-divider grid-divider-row';
    div.style.gridRow = String(2*r+2);
    div.style.gridColumn = `1 / ${2*cols}`;
    div.addEventListener('mousedown', e => startDrag(e, div, 'row', r));
    grid.appendChild(div);
  }

  setActivePane(1);
  row.appendChild(grid);
}

// Duración nominal en segundos de un TF — usada por el replay sincronizado
// multi-panel (ver "REPLAY — SYNC MULTI-PANEL" más abajo) para ubicar en
// qué vela propia de un panel "sigue" cae el instante simulado del panel
// maestro. Nominal porque un día calendario real puede no ser exactamente
// 86400s en el borde de un fin de semana/feriado — no importa para el uso
// que le damos (encontrar en qué vela cae un timestamp), solo importa que
// sea aproximadamente correcta para no quedar mirando la vela de al lado.
function tfToSeconds(tf){
  const m = /^(\d+)(min|h|day|week|month)$/.exec(tf);
  if (!m) return 300;
  const n = Number(m[1]);
  switch(m[2]){
    case 'min': return n*60;
    case 'h': return n*3600;
    case 'day': return n*86400;
    case 'week': return n*7*86400;
    case 'month': return n*30*86400;
  }
  return 300;
}
// Formatea un timestamp de vela para mostrar en la barra de replay — en
// UTC, NO en la hora local del navegador. El resto del gráfico (ORG,
// killzones, PDH/PDL/PWH/PWL...) ya trata la hora cruda del dato como si
// fuera la hora de la sesión (NY) usando getUTCHours()/getUTCDate() — es
// el bróker el que entrega los timestamps corridos para que eso dé bien.
// Si acá se usa toLocaleDateString/toLocaleTimeString SIN forzar UTC, el
// navegador los pasa a la zona horaria de la máquina del usuario y el
// reloj del replay deja de coincidir con la hora que se ve en el resto
// del gráfico (ORG, ejes, killzones).
function fmtReplayTime(epochSeconds){
  const d = new Date(epochSeconds * 1000);
  const date = d.toLocaleDateString([], { timeZone:'UTC' });
  const time = d.toLocaleTimeString([], { timeZone:'UTC', hour:'2-digit', minute:'2-digit' });
  return `${date} ${time}`;
}
